# These configuration settings are utilized by data.yml.erb to generate configuration of the AWS Database Migration
# Service (DMS) Tasks. Merging changes to this file does NOT update the `DATA-production` Stack that provisions
# our AWS Redshift Cluster and the DMS Replication Tasks that export data into the analytics system. Before merging
# a Pull Request that changes this file, an Infrastructure Engineer must execute the following steps on their workstation
# utilizing their admin AWS credentials to validate and then deploy these changes:
#
#    VALIDATE:
#
#    The output of `stack:data:validate` (below) should only specify AWS::DMS::ReplicationTask Resources that will change
#    and only the specific Tasks that are being modified in this feature branch. If there are any other changes, do not
#    deploy, and instead determine the source of the differences between template configuration in the current commit and
#    the state of the `DATA-production` Stack.
#
#        code-dot-org $ export AWS_PROFILE=codeorg-admin
#        code-dot-org $ bin/aws_access
#          AWS access: GoogleSignInAdmin/suresh@code.org
#        code-dot-org $ bundle exec rake stack:data:validate RAILS_ENV=production ADMIN=true
#          Finished stack:data:environment (less than a minute)
#          Parameters:
#          Pending update for stack `DATA-production`:
#          Modify DMSCronPii [AWS::DMS::ReplicationTask] Properties Replacement: Conditional (TableMappings)
#          Modify DMSCron [AWS::DMS::ReplicationTask] Properties Replacement: Conditional (TableMappings)
#          Finished stack:data:validate (1 minute)
#
#    EXECUTE:
#
#        code-dot-org $ bundle exec rake stack:data:start RAILS_ENV=production ADMIN=true
#
# DMS is being retired in favor of the Zero ETL Integration, which replicates MySQL into Redshift
# continuously and exposes it through the materialized views in `dev.learning_platform_production`
# and `dev.learning_platform_production_pii`. A table belongs here only while a dbt model in the
# `analytics` repository still reads the DMS copy of it
#
# Removing a table does not drop it from Redshift; replication simply stops and the existing copy
# goes stale, so a reader keeps working while silently serving old data.

# All tables in this section are exported to the Redshift `dashboard_production_pii` schema. Sensitive data may be
# exported to this schema, but should be limited to only columns that have an identified analytics purpose.
cron-pii:
- dashboard.course_offerings_pd_workshops
