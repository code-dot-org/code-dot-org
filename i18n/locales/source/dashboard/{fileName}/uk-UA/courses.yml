          description_student: |-
            Computer Science Discoveries (CS Discoveries) - це вступний курс з комп'ютерних наук, який дає можливість студентам створювати автентичні артефакти та взаємодіяти з комп'ютерними науками як середовищем для творчості, спілкування, вирішення проблем та розваг.
            
            **Зацікавлені у викладанні курсу "Знахідки CS"? Професійний розвиток допоможе вам розпочати викладання курсу "Знахідки CS". [Натисніть тут][0], щоб дізнатися більше про можливості професійного навчання у вашому регіоні, або [натисніть тут][1], щоб дізнатися більше про самостійне навчання онлайн.
          description_teacher: |-
            Computer Science Discoveries (CS Discoveries) - це вступний курс з комп'ютерних наук, який дає можливість студентам створювати автентичні артефакти та взаємодіяти з комп'ютерними науками як середовищем для творчості, спілкування, вирішення проблем та розваг.
            
            **Ти знав?
            
            - Професійний розвиток допоможе вам розпочати викладання курсу CS Discoveries. [Натисніть тут][0], щоб дізнатися більше про можливості професійного навчання у вашому регіоні, або [натисніть тут][1], щоб дізнатися більше про самостійний онлайн-курс.
            
            - Цей курс є модульним і може викладатися в різних конфігураціях залежно від потреб кожного класу. Ознайомтеся з Посібником з впровадження ЦУР у меню "Ресурси для вчителів" нижче, щоб дізнатися про різні варіанти.
            
            - Ви можете знайти _Посібник з навчальної програми_, _Посібник для початківців_, _Посібник з оцінювання_ та багато інших ресурсів, які допоможуть вам у впровадженні цієї навчальної програми, у меню Ресурси для вчителів нижче
