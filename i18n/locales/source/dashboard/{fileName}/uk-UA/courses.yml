        self-paced-pl-physical-computing-2023:
          title: " Навчання створенню додатків за допомогою пристроїв (ігровий майданчик)"
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчання ви будете готові розпочати викладання курсу Code.org \"Створення додатків за допомогою пристроїв\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та розділом \"Створення додатків за допомогою пристроїв\". Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання створення додатків за допомогою пристроїв\". "
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчання ви будете готові розпочати викладання курсу Code.org \"Створення додатків за допомогою пристроїв\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та розділом \"Створення додатків за допомогою пристроїв\". Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання створення додатків за допомогою пристроїв\". "
          version_title: "'23 - '24"
        self-paced-pl-csd-2023:
          title: Викладання CS Discoveries
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          version_title: "'23-'24"
        self-paced-pl-microbit-2023:
          title: "Навчання створенню додатків за допомогою пристроїв (micro:bit)"
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчання ви будете готові розпочати викладання курсу Code.org \"Створення додатків з пристроями\" зі своїми учнями, використовуючи micro:bits.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та розділом \"Створення додатків за допомогою пристроїв\". Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання створення додатків за допомогою пристроїв\". "
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчання ви будете готові розпочати викладання курсу Code.org \"Створення додатків з пристроями\" зі своїми учнями, використовуючи micro:bits.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та розділом \"Створення додатків за допомогою пристроїв\". Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання створення додатків за допомогою пристроїв\". "
