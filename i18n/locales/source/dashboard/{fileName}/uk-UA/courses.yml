          description_short: "Колекція уроків Computer Science Discovery, що фокусується на навичках кодування та програмування"
          description_student: |-
            Focus on Coding - це збірка розділів курсу Computer Science Discoveries (CS Discoveries), які допомагають учням розвивати свої навички кодування у веб-розробці, іграх та анімації, а також у створенні додатків для мобільних пристроїв. Учні створюють автентичні артефакти та використовують комп'ютерні науки як середовище для творчості, спілкування, вирішення проблем та розваг.
            
            **Зацікавлені у викладанні курсу "Знахідки CS"? Професійний розвиток допоможе вам розпочати викладання курсу "Знахідки CS". [Натисніть тут][0], щоб дізнатися більше про можливості професійного навчання у вашому регіоні, або [натисніть тут][1], щоб дізнатися більше про самостійне навчання онлайн.
          description_teacher: |-
            Focus on Coding - це збірка розділів курсу Computer Science Discoveries (CS Discoveries), які допомагають учням розвивати свої навички кодування у веб-розробці, іграх та анімації, а також у створенні додатків для мобільних пристроїв. Учні створюють автентичні артефакти та використовують комп'ютерні науки як середовище для творчості, спілкування, вирішення проблем та розваг.
            
