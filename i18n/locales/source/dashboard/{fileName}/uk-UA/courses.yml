        self-paced-foundations-cs-2024:
          title: Основи викладання інформатики
          description_short: ''
          description_student: "## Ласкаво просимо!\n\n##### Ласкаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Основи інформатики**</a>! Після проходження цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org **Основи комп'ютерних наук** зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- ##### **Почніть з Вступу до викладання основ інформатики:** Цей розділ познайомить вас з цим курсом і допоможе вам налаштувати свій навчальний план.\n- ##### **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власне навчання. Рекомендований час подано для кожного модуля та уроку. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n- ##### **Оберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та основами інформатики. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам. Ми рекомендуємо всім викладачам почати з короткого вступного розділу, щоб дізнатися більше про цей професійний навчальний курс перед початком роботи."
          description_teacher: "## Ласкаво просимо!\n\n##### Ласкаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Основи інформатики**</a>! Після проходження цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org **Основи комп'ютерних наук** зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- ##### **Почніть з Вступу до викладання основ інформатики:** Цей розділ познайомить вас з цим курсом і допоможе вам налаштувати свій навчальний план.\n- ##### **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власне навчання. Рекомендований час подано для кожного модуля та уроку. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n- ##### **Оберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та основами інформатики. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам. Ми рекомендуємо всім викладачам почати з короткого вступного розділу, щоб дізнатися більше про цей професійний навчальний курс перед початком роботи."
          version_title: "'24-'25"
