        self-paced-pl-coding-with-ai-2024:
          title: Навчання кодуванню за допомогою штучного інтелекту
          description_short: ''
          description_student: "## Ласкаво просимо.\n\n#### Ласкаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати за допомогою Code.org! Після завершення цього професійного досвіду ви будете готові розпочати викладання курсу Code.org \"Кодування з ШІ\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- #### **Вивчайте у власному темпі:** Цей навчальний курс розроблений таким чином, щоб дати вам можливість контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- #### **Виберіть свій контент:** Вміст організовано за запропонованою послідовністю для вчителів, які вперше знайомляться з Code.org та Coding with AI. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і відразу перейти до розділу \"Підготовка до викладання кодування зі штучним інтелектом\"."
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного досвіду ви будете готові розпочати викладання курсу Code.org \"Кодування з ШІ\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано за запропонованою послідовністю для вчителів, які вперше знайомляться з Code.org та Coding with AI. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і відразу перейти до розділу \"Підготовка до викладання кодування зі штучним інтелектом\"."
