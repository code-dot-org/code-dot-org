        k5-maker-pilot-2024:
          title: K-5 Maker Самостійне професійне навчання
          description_short: "Професійний навчальний модуль для CSF Maker з курсом micro:bit."
          description_student: "#### Курс micro:bit долає розрив між цифровим та фізичним світом і дає можливість студентам перенести свої комп'ютерні програми в реальний світ.\n\n#### **У цьому модулі ви:** - дізнаєтесь\n\n- #### Підготуйтеся до викладання основних концепцій кодування, таких як події, цикли, умови, змінні та функції.\n- #### Отримайте практичний досвід спільної роботи апаратного та програмного забезпечення.\n- #### Практикуйте ключові поняття, включені до розділу.\n- #### Підготуйтеся до викладання будь-якого з курсів CS Fundamentals Maker за допомогою micro:bit.\n\n#### **Орієнтовний загальний час:** 150 хвилин\n\n#### **Додатковий крок:** Оскільки ми наразі пілотуємо цей блок, вам спочатку потрібно зареєструватися в пілоті, щоб побачити блоки навчальної програми. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Клікніть тут, щоб зареєструватися в пілоті</a> </strong>"
          description_teacher: "#### Курс micro:bit долає розрив між цифровим та фізичним світом і дає можливість студентам перенести свої комп'ютерні програми в реальний світ.\n\n#### **У цьому модулі ви:** - дізнаєтесь\n\n- #### Підготуйтеся до викладання основних концепцій кодування, таких як події, цикли, умови, змінні та функції.\n- #### Отримайте практичний досвід спільної роботи апаратного та програмного забезпечення.\n- #### Практикуйте ключові поняття, включені до розділу.\n- #### Підготуйтеся до викладання будь-якого з курсів CS Fundamentals Maker за допомогою micro:bit.\n\n#### **Орієнтовний загальний час:** 150 хвилин\n\n#### **Додатковий крок:** Оскільки ми наразі пілотуємо цей блок, вам спочатку потрібно зареєструватися в пілоті, щоб побачити блоки навчальної програми. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Клікніть тут, щоб зареєструватися в пілоті</a> </strong>"
          version_title: ''
        foundations-of-cs-beta-2024:
          title: Основи інформатики BETA
          description_short: ''
          description_student: |-
            Ласкаво просимо до курсу "Основи комп'ютерних наук"! Цей захоплюючий курс - ваш шлях до потужного світу комп'ютерних наук. Якщо вам цікаво, як працюють додатки, або ви хочете дізнатися більше про вплив технологій на суспільство, цей курс знайде для вас щось цікаве. Протягом семестру ви вивчите основи програмування, зануритеся в те, як функціонує інтернет, і навіть створите власні проекти, які можуть вирішити реальні проблеми.
            
            ⚠️ **Примітка:** Це бета-версія навчальної програми "Основи інформатики", яка складається переважно зі змісту наших існуючих навчальних програм "Комп'ютерні відкриття" та "Основи інформатики". Таким чином, ви побачите позначки CSD і CSP на посібниках, ресурсах і слайдах. В остаточній версії навчальної програми цього не буде!
          description_teacher: "Курс \"Основи комп'ютерних наук\" (ОНК) - це всебічний вступ до широкої галузі комп'ютерних наук. Розроблений для старшокласників, цей курс поєднує фундаментальні концепції з практичним досвідом, щоб сприяти глибокому розумінню комп'ютерних технологій, їхніх можливостей та впливу. Навчальна програма побудована відповідно до державних вимог та стандартів CSTA, пропонуючи міцну основу в галузі інформатики, яка готує студентів до подальшого навчання та майбутньої кар'єри в галузі технологій."
          version_title: "'24-'25"
        self-paced-pl-csd-2024:
          title: Викладання CS Discoveries
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          version_title: "'24 - '25"
