          description_short: 'Вивчіть основи генеративного ШІ: як працює ШІ та як використовувати генеративний ШІ. '
          description_student: "Дізнайтеся, як працює штучний інтелект і як використовувати генеративний ШІ"
          description_teacher: "Exploring Generative AI - це навчальний курс, що складається з двох блоків: \"Як працює штучний інтелект\" та \"Як використовувати штучний інтелект\". Студенти беруть участь у практичних заняттях, які розпаковують чорну скриньку генеративного ШІ за допомогою вправ, орієнтованих на студентів, та дискусій у класі, підкріплених серією відеороликів, які демістифікують генеративний ШІ для широкої аудиторії. Маючи міцний фундамент, студенти вчаться налаштовувати мовні моделі за допомогою нової лабораторії AI Chat, яка надає студентам інструменти для вибору мовних моделей, застосування системних підказок і керування пошуковою інформацією для налаштування свого чат-бота. Студенти створюють чат-ботів для вирішення різноманітних проблем, а також досліджують достовірність відповідей та доцільність використання чат-ботів у суспільстві."
