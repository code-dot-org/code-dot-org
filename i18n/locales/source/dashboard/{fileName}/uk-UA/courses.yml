        self-paced-pl-aiml-2024:
          title: Викладання штучного інтелекту та машинного навчання
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після проходження цього професійного навчального курсу ви будете готові розпочати викладання Розділу 7 CSD Code.org - Штучний інтелект та машинне навчання** своїм студентам.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано за запропонованою послідовністю для вчителів, які вперше знайомляться з Code.org та CSD Розділ 7 - Штучний інтелект і машинне навчання. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання розв'язування задач та обчислень\". "
