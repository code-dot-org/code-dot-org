        self-paced-pl-aiml-2023:
          title: 'Підготовка до викладання штучного інтелекту та машинного навчання '
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після проходження цього професійного навчального курсу ви будете готові розпочати викладання курсу Code.org \"Створення штучного інтелекту та машинне навчання\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано за запропонованою послідовністю для вчителів, які не знайомі з Code.org та розділом \"Штучний інтелект і машинне навчання\". Однак ви можете **працювати з матеріалами в тому порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і відразу перейти до розділу \"Підготовка до штучного інтелекту та машинного навчання\". "
