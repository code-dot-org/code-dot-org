          title: "Навчання розв'язуванню задач та обчисленням"
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного досвіду ви будете готові розпочати викладання Розділу 1 CSD Code.org - \"Розв'язування задач та обчислення\" зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CSD Розділ 1 - Розв'язування задач та обчислення. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання розв'язування задач та обчислень\". "
