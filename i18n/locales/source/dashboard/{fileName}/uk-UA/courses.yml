        self-paced-pl-ai-101-2024:
          title: AI 101 Самостійне професійне навчання для освітян
          description_short: ''
          description_student: "## Ласкаво просимо!\n\nЛаскаво просимо на самостійний онлайн-курс Code.org для викладачів, щоб почати працювати зі штучним інтелектом.\n\nЦе безкоштовна фундаментальна серія онлайн-навчання для будь-якого вчителя чи викладача, який цікавиться новаторським світом штучного інтелекту (ШІ) та його трансформаційним потенціалом в освіті.\n\nУ цій серії з п'яти частин ми розкриємо таємниці штучного інтелекту, розглянемо відповідальне впровадження, боротьбу з упередженнями та покажемо, як навчання з використанням штучного інтелекту може революціонізувати результати учнів.\n\nПриєднуйтесь до нас у цій подорожі дослідження та розширення можливостей і відкрийте майбутнє викладання за допомогою штучного інтелекту та про нього.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій зміст:** Зміст цього професійного навчального курсу організовано в запропонованій послідовності для вчителів, які тільки починають працювати зі штучним інтелектом. Однак ви можете **взаємодіяти з контентом у порядку, який найкраще відповідає вашим потребам**."
          description_teacher: "## Ласкаво просимо!\n\nЛаскаво просимо на самостійний онлайн-курс Code.org для викладачів, щоб почати працювати зі штучним інтелектом.\n\nЦе безкоштовна фундаментальна серія онлайн-навчання для будь-якого вчителя чи викладача, який цікавиться новаторським світом штучного інтелекту (ШІ) та його трансформаційним потенціалом в освіті.\n\nУ цій серії з п'яти частин ми розкриємо таємниці штучного інтелекту, розглянемо відповідальне впровадження, боротьбу з упередженнями та покажемо, як навчання з використанням штучного інтелекту може революціонізувати результати учнів.\n\nПриєднуйтесь до нас у цій подорожі дослідження та розширення можливостей і відкрийте майбутнє викладання за допомогою штучного інтелекту та про нього.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій зміст:** Зміст цього професійного навчального курсу організовано в запропонованій послідовності для вчителів, які тільки починають працювати зі штучним інтелектом. Однак ви можете **взаємодіяти з контентом у порядку, який найкраще відповідає вашим потребам**."
