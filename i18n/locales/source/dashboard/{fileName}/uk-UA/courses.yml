        csp-2022:
          title: "Принципи інформатики ('22-'23)"
          description_short: Вивчіть основні поняття інформатики.
          description_student: "CSP знайомить учнів з основними поняттями інформатики та спонукає їх дослідити, як комп'ютери та технології можуть впливати на світ. Програма AP розробила Принципи комп'ютерних наук AP з метою створення лідерів у галузі комп'ютерних наук та залучення тих, хто традиційно недостатньо представлений, до основних комп'ютерних інструментів та міждисциплінарних можливостей."
          description_teacher: |-
            CSP знайомить учнів з основними поняттями інформатики та спонукає їх дослідити, як комп'ютери та технології можуть впливати на світ. Програма AP розробила Принципи комп'ютерних наук AP з метою створення лідерів у галузі комп'ютерних наук та залучення тих, хто традиційно недостатньо представлений, до основних комп'ютерних інструментів та міждисциплінарних можливостей.
            
            **Ти знав?
            
            - Професійний розвиток допоможе вам розпочати викладання Принципів громадянського суспільства. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Клікніть тут</a>, щоб дізнатися більше про можливості професійного навчання у вашому регіоні або <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">клацніть тут</a>, щоб дізнатись більше про можливість самостійного навчання онлайн.
            
            - Ви можете знайти _Посібник з навчальної програми_, _Словник курсу_ та інші ресурси, які допоможуть вам у впровадженні цієї навчальної програми, в меню Ресурси для вчителів нижче
          version_title: "'22-'23"
        csa-2022:
          title: "Комп'ютерні науки A ('22-'23)"
          description_short: Вивчіть навички програмування на Java та програмної інженерії.
          description_student: "Комп'ютерні науки A (CSA) знайомлять студентів з програмною інженерією та об'єктно-орієнтованим програмуванням і дизайном за допомогою мови програмування Java. Ця навчальна програма охоплює широке коло тем, включаючи проектування рішень проблем, використання структур даних для організації великих масивів даних, розробку та впровадження алгоритмів для обробки даних і відкриття нової інформації, аналіз потенційних рішень, а також етичні та соціальні наслідки використання обчислювальних систем."
          description_teacher: |-
            Комп'ютерні науки A (CSA) знайомлять студентів з програмною інженерією та об'єктно-орієнтованим програмуванням і дизайном за допомогою мови програмування Java. Ця навчальна програма охоплює широке коло тем, включаючи проектування рішень проблем, використання структур даних для організації великих масивів даних, розробку та впровадження алгоритмів для обробки даних і відкриття нової інформації, аналіз потенційних рішень, а також етичні та соціальні наслідки використання обчислювальних систем.
            
            **Ти знав?
            
            - Професійний розвиток допоможе вам почати викладати CSA. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Клікніть тут</a>, щоб дізнатися більше про можливості професійного навчання у вашому регіоні.
            
            - Ви можете знайти _Посібник з навчальної програми_, _Словник курсу_ та інші ресурси, які допоможуть вам у впровадженні цієї навчальної програми, в меню Ресурси для вчителів нижче.
