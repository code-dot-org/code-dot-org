          description_short: "## Ласкаво просимо! \n##### Цей професійний навчальний модуль розроблений, щоб допомогти вам підготуватися до викладання курсу Code.org \"Вивчаємо генеративний ШІ\".\n\n##### Курс \"Дослідження генеративного ШІ\" розроблений як самостійна курсова робота для учнів 8-12 класів, яка може бути легко інтегрована в будь-яку існуючу навчальну програму, пропонуючи вчителям гнучкість у впровадженні курсу відповідно до їхнього розкладу та освітніх потреб. \n\n### Знайдіть навчання, яке підходить саме вам\n* **Йдіть у власному темпі:** Цей досвід самостійного навчання призначений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n* **Виберіть свій матеріал:** Матеріал організовано в запропонованій послідовності для вчителів, які не знайомі як з Code.org, так і з підрозділом Генеративного ШІ. Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і одразу перейти до розділу \"Вивчення генеративного ШІ\". "
          description_student: "## Ласкаво просимо!\n\n##### Цей професійний навчальний модуль розроблений, щоб допомогти вам підготуватися до викладання курсу Code.org \"Вивчаємо генеративний ШІ\".\n\n##### Курс \"Дослідження генеративного ШІ\" розроблений як самостійна курсова робота для учнів 8-12 класів, яка може бути легко інтегрована в будь-яку існуючу навчальну програму, пропонуючи вчителям гнучкість у впровадженні курсу відповідно до їхнього розкладу та освітніх потреб.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано в запропонованій послідовності для вчителів, які не знайомі з Code.org та підрозділом Генеративного ШІ. Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і одразу перейти до розділу \"Вивчення генеративного ШІ\". "
          description_teacher: "## Ласкаво просимо!\n\n##### Цей професійний навчальний модуль розроблений, щоб допомогти вам підготуватися до викладання курсу Code.org \"Вивчаємо генеративний ШІ\".\n\n##### Курс \"Вивчення генеративного ШІ\" розроблений як самостійна курсова робота для учнів 8-12 класів, яка може бути легко інтегрована в будь-яку існуючу навчальну програму, пропонуючи вчителям гнучкість у впровадженні курсу відповідно до їхнього розкладу та освітніх потреб.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано в запропонованій послідовності для вчителів, які не знайомі з Code.org та підрозділом Генеративного ШІ. Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і одразу перейти до розділу \"Вивчення генеративного ШІ\". "
