          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного досвіду ви будете готові розпочати викладання Розділу 5 CSD Code.org \"Дані та суспільство\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано за запропонованою послідовністю для вчителів, які вперше знайомляться з Code.org та Розділом 5 CSD - Дані та суспільство. Однак ви можете **працювати з матеріалами в тому порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання інформатики і суспільства\". "
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного досвіду ви будете готові розпочати викладання Розділу 5 CSD Code.org \"Дані та суспільство\" зі своїми студентами.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій матеріал:** Матеріал організовано за запропонованою послідовністю для вчителів, які вперше знайомляться з Code.org та Розділом 5 CSD - Дані та суспільство. Однак ви можете **працювати з матеріалами в тому порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і перейти одразу до розділу \"Підготовка до викладання інформатики і суспільства\". "
