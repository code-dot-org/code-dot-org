        pl-csd-summer-2023:
          title: Очний семінар-практикум CSD з ПЛ
          description_short: ''
          description_student: "**Ви дізнаєтесь: **Ви дізнаєтесь\n\n- Підготуйтеся до викладання CS Discoveries.\n- Практикуйте ключові поняття з навчальної програми CS Discoveries.\n- Поглибити своє розуміння справедливої освіти у сфері громадянського суспільства. \n- Розвивайте емпатію до студентського досвіду. \n- Станьте частиною мережі вчителів, які роблять подібну роботу."
          description_teacher: "**Учасники будуть:** *Учасники будуть\n\n- Підготуйтеся до викладання CS Discoveries.\n- Практикуйте ключові поняття з навчальної програми CS Discoveries.\n- Поглибити своє розуміння справедливої освіти у сфері громадянського суспільства. \n- Розвивайте емпатію до студентського досвіду. \n- Станьте частиною мережі вчителів, які роблять подібну роботу."
