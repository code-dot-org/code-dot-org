          description_short: "Вступний курс інформатики, який дає можливість студентам створювати автентичні артефакти"
          description_student: "Computer Science Discoveries (CS Discoveries) - це вступний курс з комп'ютерних наук, який навчить вас створювати автентичні артефакти та використовувати комп'ютерні науки як середовище для творчості, спілкування, розв'язання проблем та розваг."
          description_teacher: |-
            Computer Science Discoveries (CS Discoveries) - це вступний курс з комп'ютерних наук, який дає можливість студентам створювати автентичні артефакти та взаємодіяти з комп'ютерними науками як середовищем для творчості, спілкування, вирішення проблем та розваг.
            
            **Ти знав?
            
            - Професійний розвиток допоможе вам розпочати викладання курсу CS Discoveries. [Натисніть тут][0], щоб дізнатися більше про можливості професійного навчання у вашому регіоні, або [натисніть тут][1], щоб дізнатися більше про самостійний онлайн-курс.
            
            - Цей курс має гнучку реалізацію і може викладатися в різних конфігураціях залежно від потреб кожного класу. Ознайомтеся з [Посібником з впровадження CSD][2] для отримання додаткової інформації
            
            - Ви можете ознайомитися з [Програмою курсу][3] та [Посібником для початківців][4], щоб дізнатися більше про курс і розпочати навчання.
