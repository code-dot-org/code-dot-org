        self-paced-pl-computer-vision-2024:
          title: "Навчання комп'ютерному зору"
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчального курсу ви будете готові розпочати викладання курсу Code.org з комп'ютерного зору** своїм студентам.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- **Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які не знайомі з Code.org та комп'ютерним зором. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і відразу перейти до розділу \"Підготовка до викладання комп'ютерного зору\"."
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного самостійного онлайн-навчання для викладачів, щоб почати викладати з Code.org! Після завершення цього професійного навчального курсу ви будете готові розпочати викладання курсу Code.org з комп'ютерного зору** своїм студентам.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- **Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які не знайомі з Code.org та комп'ютерним зором. Однак ви можете **працювати з матеріалами в порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити розділ \"Початок роботи з Code.org\" і відразу перейти до розділу \"Підготовка до викладання комп'ютерного зору\". "
