        self-paced-pl-csd-2021:
          title: Викладання CS Discoveries
          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для викладачів, щоб почати викладати CS Discoveries! Після завершення цього онлайн-курсу ви будете готові розпочати викладання курсу Code.org \"Відкриваємо інформатику \"** зі своїми учнями.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати власний навчальний процес. Рекомендований час подано для кожного модуля та уроку.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- Виберіть свій контент:** Зміст цього професійного навчального курсу організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та CS Discoveries. Однак ви можете **працювати з матеріалом у порядку, який найкраще відповідає вашим потребам.** Ми рекомендуємо всім викладачам **почати з короткого вступного розділу**, щоб дізнатися більше про цей професійний навчальний курс, перш ніж розпочати роботу."
          version_title: "'21 - '22"
        self-paced-pl-csp-2021:
          title: Викладання принципів громадянського суспільства
          description_short: ''
          description_student: "## Ласкаво просимо.\n\n##### Ласкаво просимо до безкоштовних онлайн-модулів Code.org, які допоможуть викладачам розпочати викладання принципів громадянського суспільства! Пройшовши ці онлайн-модулі, ви будете готові розпочати викладання курсу \"Основи комп'ютерних наук\" від Code.org своїм учням.\n\n### Знайдіть навчання, яке підходить саме вам\n\n##### **Ідіть у своєму власному темпі**: Ці самостійні модулі розроблені таким чином, щоб поставити вас за кермо і дати вам можливість контролювати власне навчання. Рекомендований час подано для кожного модуля та уроку. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n\n### Обирайте контент\n\n##### Зміст цих модулів професійного навчання організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та Принципами громадянського суспільства. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам. Ми рекомендуємо всім викладачам почати з короткого вступного блоку, щоб дізнатися більше про ці професійні навчальні модулі перед початком роботи."
          description_teacher: "## Ласкаво просимо.\n\n##### Ласкаво просимо до безкоштовних онлайн-модулів Code.org, які допоможуть викладачам розпочати викладання принципів громадянського суспільства! Пройшовши ці онлайн-модулі, ви будете готові розпочати викладання курсу \"Основи комп'ютерних наук\" від Code.org своїм учням.\n\n### Знайдіть навчання, яке підходить саме вам\n\n##### **Ідіть у своєму власному темпі**: Ці самостійні модулі розроблені таким чином, щоб поставити вас за кермо і дати вам можливість контролювати власне навчання. Рекомендований час подано для кожного модуля та уроку. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n\n### Обирайте контент\n\n##### Зміст цих модулів професійного навчання організовано у запропонованій послідовності для вчителів, які вперше знайомляться з Code.org та Принципами громадянського суспільства. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам. Ми рекомендуємо всім викладачам почати з короткого вступного блоку, щоб дізнатися більше про ці професійні навчальні модулі перед початком роботи."
