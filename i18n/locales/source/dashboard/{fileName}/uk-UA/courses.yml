          description_short: ''
          description_student: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для освітян, щоб ознайомитися зі штучним інтелектом (ШІ) та машинним навчанням! Після завершення цього професійного навчання **ви будете вільно володіти основними концепціями штучного інтелекту та машинного навчання**.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- **Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які тільки починають викладати інформатику та Code.org. Однак ви можете **працювати з контентом у порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити огляд. "
          description_teacher: "## Ласкаво просимо.\n\nЛаскаво просимо до безкоштовного онлайн-курсу Code.org для освітян, щоб ознайомитися зі штучним інтелектом (ШІ) та машинним навчанням! Після завершення цього професійного навчання **ви будете вільно володіти основними концепціями штучного інтелекту та машинного навчання**.\n\n### Знайдіть навчання, яке підходить саме вам\n\n- **Вивчайте у власному темпі:** Цей досвід самостійного навчання розроблений для того, щоб ви могли контролювати власне навчання. Для кожного уроку вказано рекомендований час.  Однак ми заохочуємо вас **працювати з контентом у власному темпі**.\n\n- **Виберіть свій матеріал:** Матеріал організовано у запропонованій послідовності для вчителів, які тільки починають викладати інформатику та Code.org. Однак ви можете **працювати з контентом у порядку, який найкраще відповідає вашим потребам.** Якщо ви вже знайомі з платформою Code.org, ви можете пропустити огляд. "
