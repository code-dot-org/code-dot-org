        data-science-2024:
          title: "[ПІЛОТ] Наука про дані"
          description_short: "Досліджуйте світ науки про дані, використовуючи інструменти візуалізації даних для аналізу та інтерпретації реальних явищ."
          description_student: "Ця навчальна програма з науки про дані знайомить студентів з основними принципами та навичками науки про дані. Студенти дізнаються, як ставити ефективні запитання щодо даних, збирати та очищати набори даних, а також створювати переконливі візуалізації за допомогою таких інструментів, як CODAP (Блок 1) та Python (Блок 2). Під час навчання студенти застосовують свої навички програмування та аналізу до реальних наборів даних, набуваючи досвіду з основними методами аналізу даних, такими як групування, фільтрація та статистичні розрахунки. Кульмінацією навчальної програми є проекти, які підкреслюють важливість етичних практик роботи з даними, сторітелінгу даних та створення дієвих висновків на основі складних наборів даних."
          description_teacher: "Data Science закладає міцну основу для аналізу та візуалізації даних, використовуючи такі інструменти програмування, як CODAP у першому розділі та Python у другому, щоб поглибити аналітичні навички студентів. Завдяки структурованим урокам та проектам студенти дізнаються, як використовувати інструменти науки про дані для перетворення необроблених даних на змістовні візуалізації. Підрозділи наголошують на етичних міркуваннях, проводячи студентів через дискусії та вправи, зосереджені на конфіденційності даних, упередженості та суспільних наслідках рішень, що ґрунтуються на даних. Наприкінці кожного розділу студенти будуть готові досліджувати та вирішувати реальні проблеми, використовуючи комплексний підхід на основі даних, що завершиться проектом, який продемонструє їхню здатність створювати переконливі історії на основі даних."
          version_title: "'24-'25"
