        self-paced-pl-equitymodule-2024:
          title: "Справедливість у комп'ютерних науках від Code.org"
          description_short: ''
          description_student: "##### Ласкаво просимо! Цей загальний навчально-діагностичний курс для К-12 зосереджується на фундаментальних поняттях і конкретних застосуваннях справедливості в інформатиці. Для участі в цьому курсі вам не потрібні знання з інформатики чи капіталу. Ми запрошуємо дорослих учнів з усіх класів і навчальних контекстів приєднатися до нашої спільноти освітян, налаштованих на рівність і справедливість.\n\n* * *\n\n##### **Знайдіть навчання, яке підходить саме вам:**.\n\n- ##### **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати свій навчальний процес. Для кожного модуля та уроку наведено рекомендований час. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n\n- ##### **Оберіть свій контент:** Зміст цього професійного навчального курсу організовано в запропонованій послідовності для вчителів, які тільки починають працювати над питаннями рівності в інформатиці. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам."
          description_teacher: "##### Ласкаво просимо! Цей загальний навчально-діагностичний курс для К-12 зосереджується на фундаментальних поняттях і конкретних застосуваннях справедливості в інформатиці. Для участі в цьому курсі вам не потрібні знання з інформатики чи капіталу. Ми запрошуємо дорослих учнів з усіх класів і навчальних контекстів приєднатися до нашої спільноти освітян, налаштованих на рівність і справедливість.\n\n* * *\n\n##### **Знайдіть навчання, яке підходить саме вам:**.\n\n- ##### **Вивчайте у власному темпі:** Цей самостійний курс розроблений таким чином, щоб ви були за кермом і могли контролювати свій навчальний процес. Для кожного модуля та уроку наведено рекомендований час. Однак ми заохочуємо вас працювати з контентом у власному темпі.\n\n- ##### **Оберіть свій контент:** Зміст цього професійного навчального курсу організовано в запропонованій послідовності для вчителів, які тільки починають працювати над питаннями рівності в інформатиці. Однак ви можете взаємодіяти з контентом у тому порядку, який найкраще відповідає вашим потребам."
