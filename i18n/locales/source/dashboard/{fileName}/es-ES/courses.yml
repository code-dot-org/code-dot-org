        csa-2024:
          title: "Ciencias de la Computación A ('24-'25)"
          description_short: Aprenda habilidades de ingeniería de software y programación Java.
          description_student: "Ciencias de la Computación A (CSA) introduce a los estudiantes a la ingeniería de software y a la programación y diseño orientado a objetos utilizando el lenguaje de programación Java. Este plan de estudios cubre una amplia gama de temas, incluido el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de posibles soluciones y las implicaciones éticas y sociales de los sistemas informáticos."
          description_teacher: |-
            Ciencias de la Computación A (CSA) introduce a los estudiantes a la ingeniería de software y a la programación y diseño orientado a objetos utilizando el lenguaje de programación Java. Este plan de estudios cubre una amplia gama de temas, incluido el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de posibles soluciones y las implicaciones éticas y sociales de los sistemas informáticos.
            
            **¿Sabías?**
            
            - Hay desarrollo profesional disponible para ayudarlo a comenzar a enseñar CSA. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Haga clic aquí</a> para obtener más información sobre las oportunidades de aprendizaje profesional en su región.
            
            - Puede encontrar el _Programa de estudios_, el _Vocabulario del curso_ y otros recursos para ayudarle a implementar este currículo en el menú Recursos para docentes a continuación.
          version_title: "'24-'25"
        focus-on-coding-2024:
          title: "Centrados en la codificación '24-'25 (Descubrimientos de CS)"
          description_short: Una colección de unidades de descubrimiento de ciencias de la computación que se centra en las habilidades de codificación y programación.
          description_student: |-
            Focus on Coding es una colección de unidades de cursos de Computer Science Discoveries (CS Discoveries) que permiten a los estudiantes desarrollar sus habilidades de codificación en desarrollo web, juegos y animación, y creación de aplicaciones para dispositivos. Los estudiantes crean artefactos auténticos y utilizan la informática como medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
            **¿Está interesado en enseñar CS Discoveries?** Hay desarrollo profesional disponible para ayudarlo a comenzar a enseñar CS Discoveries. [Haga clic aquí][0] para obtener más información sobre las oportunidades de aprendizaje profesional en su región o [haga clic aquí][1] para obtener más información sobre una opción en línea a su propio ritmo.
          description_teacher: |-
            Focus on Coding es una colección de unidades de cursos de Computer Science Discoveries (CS Discoveries) que permiten a los estudiantes desarrollar sus habilidades de codificación en desarrollo web, juegos y animación, y creación de aplicaciones para dispositivos. Los estudiantes crean artefactos auténticos y utilizan la informática como medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
            **¿Sabías?**
            
            - Hay desarrollo profesional disponible para ayudarte a comenzar a enseñar CS Discoveries. [Haz clic aquí][0] para obtener más información sobre las oportunidades de aprendizaje profesional en tu región o [haz clic aquí][1] para obtener más información sobre una opción en línea a tu propio ritmo.
            
            - Puede acceder a la [Guía de inicio][2] para obtener más información sobre cómo comenzar.
          version_title: "'24-'25"
        focus-on-creativity-2024:
          title: "Centrados en la creatividad '24-'25 (Descubrimientos de la informática) ('24-'25)"
          description_short: Una colección de unidades de descubrimiento de ciencias de la computación que se centra en ser creativo y crear con la informática.
