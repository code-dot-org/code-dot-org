        self-paced-pl-csd-2021:
          title: Enseñando descubrimientos de informática
          description_short: ''
          description_student: "## Bienvenido\n\n¡Bienvenido al curso en línea gratuito y a su propio ritmo de Code.org para que los educadores comiencen a enseñar CS Discoveries! Después de completar este curso en línea, **estarás listo para comenzar a enseñar el curso Descubrimientos en Ciencias de la Computación de Code.org** con tus estudiantes.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y brindarle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para profesores nuevos en Code.org y CS Discoveries. Sin embargo, puede **interactuar con el contenido en el orden que mejor se adapte a sus necesidades**. Recomendamos a todos los profesores **comenzar con la breve unidad de bienvenida** para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
          description_teacher: "## Bienvenido\n\n¡Bienvenido al curso en línea gratuito y a su propio ritmo de Code.org para que los educadores comiencen a enseñar CS Discoveries! Después de completar este curso en línea, **estarás listo para comenzar a enseñar el curso Descubrimientos en Ciencias de la Computación de Code.org** con tus estudiantes.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y brindarle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para profesores nuevos en Code.org y CS Discoveries. Sin embargo, puede **interactuar con el contenido en el orden que mejor se adapte a sus necesidades**. Recomendamos a todos los profesores **comenzar con la breve unidad de bienvenida** para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
          version_title: "'21 - '22"
