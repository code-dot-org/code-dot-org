            Focus on Impact in Society es una colección de unidades de curso de Computer Science Discoveries (CS Discoveries) que permite a los estudiantes pensar en la informática como una herramienta para resolver problemas mientras consideran los impactos sociales más amplios de varios aspectos de la informática. Los estudiantes crean artefactos auténticos y utilizan la informática como medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
            **¿Sabías?**
            
            - Hay desarrollo profesional disponible para ayudarte a comenzar a enseñar CS Discoveries. [Haz clic aquí][0] para obtener más información sobre las oportunidades de aprendizaje profesional en tu región o [haz clic aquí][1] para obtener más información sobre una opción en línea a tu propio ritmo.
            
            - Puede acceder a la [Guía de inicio][2] para obtener más información sobre cómo comenzar.
