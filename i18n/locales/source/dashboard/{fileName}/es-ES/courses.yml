        csd-2024:
          title: Descubrimientos informáticos (2024-2025)
          description_short: Un curso introductorio de informática que permite a los estudiantes crear artefactos auténticos.
          description_student: "Computer Science Discoveries (CS Discoveries) es un curso introductorio de informática que le permite crear artefactos auténticos y utilizar la informática como medio para la creatividad, la comunicación, la resolución de problemas y la diversión."
          description_teacher: |-
            Computer Science Discoveries (CS Discoveries) es un curso introductorio de informática que permite a los estudiantes crear artefactos auténticos y utilizar la informática como medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
            **¿Sabías?**
            
            - Hay desarrollo profesional disponible para ayudarte a comenzar a enseñar CS Discoveries. [Haz clic aquí][0] para obtener más información sobre las oportunidades de aprendizaje profesional en tu región o [haz clic aquí][1] para obtener más información sobre una opción en línea a tu propio ritmo.
            
            - Este curso tiene una implementación flexible y puede ser impartido en diferentes configuraciones en función de las necesidades de cada aula. Consulte la [Guía de implementación de CSD][2] para obtener más información
            
            - Puede acceder al [Programa del curso][3] y a la [Guía de inicio][4] para obtener más información sobre el curso y comenzar.
          version_title: "'24-'25"
