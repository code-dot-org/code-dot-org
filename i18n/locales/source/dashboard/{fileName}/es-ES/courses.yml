        self-paced-pl-ai-101-2024:
          title: Aprendizaje profesional a su propio ritmo de IA 101 para educadores
          description_short: ''
          description_student: "## ¡Bienvenido!\n\nBienvenido al curso en línea a su propio ritmo de Code.org para que los educadores comiencen con la IA.\n\nEsta es una serie de aprendizaje en línea gratuita y fundamental para cualquier docente o educador interesado en el innovador mundo de la inteligencia artificial (IA) y su potencial transformador en la educación.\n\nEn esta serie de cinco partes, desmitificaremos la IA, exploraremos la implementación responsable, abordaremos los sesgos y mostraremos cómo el aprendizaje impulsado por IA puede revolucionar los resultados de los estudiantes.\n\nÚnase a nosotros en este viaje de exploración y empoderamiento, y descubra el futuro de la enseñanza con y sobre IA.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y brindarle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para profesores nuevos en IA. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades."
          description_teacher: "## ¡Bienvenido!\n\nBienvenido al curso en línea a su propio ritmo de Code.org para que los educadores comiencen con la IA.\n\nEsta es una serie de aprendizaje en línea gratuita y fundamental para cualquier docente o educador interesado en el innovador mundo de la inteligencia artificial (IA) y su potencial transformador en la educación.\n\nEn esta serie de cinco partes, desmitificaremos la IA, exploraremos la implementación responsable, abordaremos los sesgos y mostraremos cómo el aprendizaje impulsado por IA puede revolucionar los resultados de los estudiantes.\n\nÚnase a nosotros en este viaje de exploración y empoderamiento, y descubra el futuro de la enseñanza con y sobre IA.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y brindarle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para profesores nuevos en IA. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades."
