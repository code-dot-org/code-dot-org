          description_short: ''
          description_student: "## Bienvenido\n\n##### ¡Bienvenido a los módulos en línea gratuitos y a su propio ritmo de Code.org para que los educadores comiencen a enseñar los principios de CS! Después de completar estos módulos en línea, estará listo para comenzar a enseñar el curso Principios de Ciencias de la Computación de Code.org con sus estudiantes.\n\n### Encuentra el aprendizaje que funcione para ti\n\n##### **Ve a tu propio ritmo**: Estos módulos a su propio ritmo están diseñados para ponerlo al volante y brindarle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección. Sin embargo, le animamos a que interactúe con el contenido a su propio ritmo.\n\n### Elige tu contenido\n\n##### El contenido de estos módulos de aprendizaje profesional está organizado en la progresión sugerida para docentes nuevos en Code.org y CS Principles. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades. Recomendamos a todos los profesores que comiencen con la breve unidad de bienvenida para aprender más sobre estos módulos de aprendizaje profesional antes de comenzar."
