        csp-2024:
          title: "Principios de informática '24-'25"
          description_short: Aprenda conceptos fundamentales de la informática.
          description_student: CSP presenta a los estudiantes los conceptos fundamentales de la informática y los desafía a explorar cómo la computación y la tecnología pueden impactar el mundo. El Programa AP diseñó los Principios de Ciencias de la Computación de AP con el objetivo de crear líderes en los campos de la ciencia de la computación y atraer e involucrar a aquellos que tradicionalmente están subrepresentados con herramientas informáticas esenciales y oportunidades multidisciplinarias.
          description_teacher: |-
            CSP presenta a los estudiantes los conceptos fundamentales de la informática y los desafía a explorar cómo la computación y la tecnología pueden impactar el mundo. El Programa AP diseñó los Principios de Ciencias de la Computación de AP con el objetivo de crear líderes en los campos de la ciencia de la computación y atraer e involucrar a aquellos que tradicionalmente están subrepresentados con herramientas informáticas esenciales y oportunidades multidisciplinarias.
            
            **¿Sabías?**
            
            - Hay desarrollo profesional disponible para ayudarte a comenzar a enseñar los principios de CS. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Haz clic aquí</a> para obtener más información sobre las oportunidades de aprendizaje profesional en tu región o <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">Haz clic aquí</a> para obtener más información sobre una opción en línea a tu propio ritmo.
            
            - Puede encontrar el _Programa de estudios_, el _Vocabulario del curso_ y otros recursos para ayudarlo a implementar este plan de estudios en el menú de Recursos para docentes a continuación.
          version_title: "'24-'25"
