        csa-validation-pilot-2022:
          title: Piloto de validación de informática (22-23)
          description_short: Aprenda habilidades de ingeniería de software y programación Java.
          description_student: "Ciencias de la Computación A (CSA) introduce a los estudiantes a la ingeniería de software y a la programación y diseño orientado a objetos utilizando el lenguaje de programación Java. Este plan de estudios cubre una amplia gama de temas, incluido el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de posibles soluciones y las implicaciones éticas y sociales de los sistemas informáticos."
