        self-paced-exploring-gen-ai-2024:
          title: "Explorando la IA generativa: aprendizaje profesional a su propio ritmo"
          description_short: "## ¡Bienvenido! \n##### Este módulo de aprendizaje profesional está diseñado para ayudarlo a prepararse para enseñar el curso Explorando IA Generativa de Code.org.\n\n##### Exploring Generative AI está diseñado como un curso independiente para estudiantes de 8.º a 12.º grado que se puede integrar sin problemas en cualquier plan de estudios existente, ofreciendo a los docentes la flexibilidad de introducirlo de acuerdo con su horario y necesidades educativas. \n\n### Encuentra el aprendizaje que funcione para ti\n* **Vaya a su propio ritmo:** esta experiencia de aprendizaje a su propio ritmo está diseñada para brindarle control sobre su propio aprendizaje. Se dan horarios sugeridos para cada lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n* **Elige tu contenido:** El contenido está organizado en la progresión sugerida para profesores nuevos tanto en Code.org como en la unidad de IA generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, puedes optar por omitir la sección Primeros pasos con Code.org y pasar directamente a la Unidad Explorando la IA Generativa. "
          description_student: "## ¡Bienvenido!\n\n##### Este módulo de aprendizaje profesional está diseñado para ayudarlo a prepararse para enseñar el curso Explorando IA Generativa de Code.org.\n\n##### Exploring Generative AI está diseñado como un curso independiente para estudiantes de 8.º a 12.º grado que se puede integrar sin problemas en cualquier plan de estudios existente, ofreciendo a los docentes la flexibilidad de introducirlo de acuerdo con su horario y necesidades educativas.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** esta experiencia de aprendizaje a su propio ritmo está diseñada para brindarle control sobre su propio aprendizaje. Se dan horarios sugeridos para cada lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido está organizado en la progresión sugerida para profesores nuevos tanto en Code.org como en la unidad de IA generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, puedes optar por omitir la sección Primeros pasos con Code.org y pasar directamente a la Unidad Explorando la IA Generativa. "
          description_teacher: "## ¡Bienvenido!\n\n##### Este módulo de aprendizaje profesional está diseñado para ayudarlo a prepararse para enseñar el curso Explorando IA Generativa de Code.org.\n\n##### Exploring Generative AI está diseñado como un curso independiente para 8 a 12 estudiantes que se puede integrar sin problemas en cualquier plan de estudios existente, ofreciendo a los docentes la flexibilidad de introducirlo según su horario y necesidades educativas.\n\n### Encuentra el aprendizaje que funcione para ti\n\n- **Vaya a su propio ritmo:** esta experiencia de aprendizaje a su propio ritmo está diseñada para brindarle control sobre su propio aprendizaje. Se dan horarios sugeridos para cada lección.  Sin embargo, le recomendamos que interactúe con el contenido a su propio ritmo.\n\n- **Elige tu contenido:** El contenido está organizado en la progresión sugerida para profesores nuevos tanto en Code.org como en la unidad de IA generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, puedes optar por omitir la sección Primeros pasos con Code.org y pasar directamente a la Unidad Explorando la IA Generativa. "
          version_title: ''
        self-paced-pl-equitymodule-2024:
          title: La equidad de Code.org en la informática
          description_short: ''
          description_student: "##### ¡Bienvenido! Este curso general K-12, independiente del currículo, se centra en los conceptos fundamentales y las aplicaciones concretas de la equidad en la informática. No es necesario tener conocimientos previos de equidad o informática para participar en este curso. Damos la bienvenida a estudiantes adultos de todos los grados y contextos de enseñanza para que se unan a nuestra comunidad de educadores con mentalidad de equidad.\n\n* * *\n\n##### **Encuentra el aprendizaje que funcione para ti:**\n\n- ##### **Vaya a su propio ritmo:** Este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y brindarle control sobre su aprendizaje. Se proporcionan horarios sugeridos para cada módulo y lección. Sin embargo, le animamos a que interactúe con el contenido a su propio ritmo.\n\n- ##### **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para docentes nuevos en equidad en informática. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades."
