        k5-maker-pilot-2024:
          title: Aprendizaje profesional a su propio ritmo para K-5 Maker
          description_short: "Módulo de aprendizaje profesional para CSF Maker con curso micro:bit."
          description_student: "#### El curso micro:bit cierra la brecha entre el mundo digital y el físico, y permite a los estudiantes transferir sus programas informáticos a aplicaciones del mundo real.\n\n#### **En este módulo, usted:**\n\n- #### Prepárese para enseñar conceptos básicos de codificación como eventos, bucles, condicionales, variables y funciones.\n- #### Obtenga experiencia práctica sobre cómo el hardware y el software pueden funcionar juntos.\n- #### Practique los conceptos clave incluidos en la unidad.\n- #### Prepárese para enseñar cualquiera de los cursos de CS Fundamentals Maker con micro:bit.\n\n#### **Tiempo total sugerido:** 150 minutos\n\n#### **Paso adicional:** Debido a que actualmente estamos probando esta unidad, primero debe inscribirse en la prueba piloto para poder ver las unidades curriculares. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Haga clic aquí para inscribirse en la prueba piloto</a></strong>"
          description_teacher: "#### El curso micro:bit cierra la brecha entre el mundo digital y el físico, y permite a los estudiantes transferir sus programas informáticos a aplicaciones del mundo real.\n\n#### **En este módulo, usted:**\n\n- #### Prepárese para enseñar conceptos básicos de codificación como eventos, bucles, condicionales, variables y funciones.\n- #### Obtenga experiencia práctica sobre cómo el hardware y el software pueden funcionar juntos.\n- #### Practique los conceptos clave incluidos en la unidad.\n- #### Prepárese para enseñar cualquiera de los cursos de CS Fundamentals Maker con micro:bit.\n\n#### **Tiempo total sugerido:** 150 minutos\n\n#### **Paso adicional:** Debido a que actualmente estamos probando esta unidad, primero debe inscribirse en la prueba piloto para poder ver las unidades curriculares. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Haga clic aquí para inscribirse en la prueba piloto</a></strong>"
          version_title: ''
        foundations-of-cs-beta-2024:
          title: Fundamentos de la informática BETA
          description_short: ''
          description_student: |-
            ¡Bienvenido a Fundamentos de la informática! Este apasionante curso es tu puerta de entrada al poderoso mundo de la informática. Ya sea que tengas curiosidad sobre cómo funcionan las aplicaciones o quieras saber más sobre el impacto de la tecnología en la sociedad, este curso tiene algo para ti. A lo largo del semestre, aprenderá los conceptos básicos de programación, profundizará en cómo funciona Internet e incluso creará sus propios proyectos que podrían resolver problemas del mundo real.
            
            ⚠️ **Nota:** Esta es una versión beta del plan de estudios Fundamentos de CS que consta principalmente de contenido de nuestros planes de estudio existentes Descubrimientos en Ciencias de la Computación y Principios en Ciencias de la Computación. Como tal, verá las etiquetas CSD y CSP en guías de actividades, recursos y presentaciones de diapositivas. ¡Este no será el caso en la versión final del plan de estudios!
          description_teacher: "El curso Fundamentos de la informática (FCS) es una introducción integral al amplio campo de la informática. Diseñado para estudiantes de secundaria, este curso integra conceptos fundamentales con experiencia práctica para fomentar una comprensión profunda de la informática, sus capacidades y sus impactos. El plan de estudios está estructurado para alinearse con los requisitos estatales y los estándares CSTA, ofreciendo una base sólida en informática que prepara a los estudiantes para estudios posteriores y futuras carreras en tecnología."
          version_title: "'24-'25"
