        exploring-gen-ai-2024:
          title: Explorando la IA generativa
          description_short: 'Aprenda los conceptos básicos de la IA generativa: cómo funciona la IA y cómo utilizarla. '
          description_student: Aprenda cómo funciona la IA y cómo utilizar la IA generativa
          description_teacher: "Explorando la IA generativa es un plan de estudios de dos unidades que explora cómo funciona la IA y cómo utilizar la IA generativa. Los estudiantes participan en actividades prácticas que desentrañan la caja negra de la IA generativa a través de actividades centradas en los estudiantes y debates en clase, respaldados por una serie de videos que desmitifican la IA generativa para una amplia audiencia. Con una base sólida, los estudiantes aprenden a personalizar modelos de lenguaje utilizando el nuevo laboratorio AI Chat, que les proporciona las herramientas para seleccionar modelos de lenguaje, aplicar indicaciones del sistema y seleccionar información de recuperación para personalizar su chatbot. Los estudiantes crean chatbots para resolver una variedad de problemas e interrogan la validez de las respuestas y el uso apropiado de los chatbots en la sociedad."
          version_title: "'24-'25"
