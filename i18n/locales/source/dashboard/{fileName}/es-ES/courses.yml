        self-paced-foundations-cs-2024:
          title: Fundamentos de la enseñanza de la informática
          description_short: ''
          description_student: "## ¡Bienvenido!\n\n##### ¡Bienvenido al curso en línea gratuito y a su propio ritmo de Code.org para que los educadores comiencen a enseñar <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Fundamentos de la informática**</a>! Después de completar este curso en línea, estará listo para comenzar a enseñar el curso **Fundamentos de la informática** de Code.org con sus estudiantes.\n\n### **Encuentra el aprendizaje que funcione para ti**\n\n- ##### **Comience con Introducción a la enseñanza de los fundamentos de la informática:** Esta sección le presentará este curso y le ayudará a personalizar su ruta de aprendizaje.\n- ##### **Vaya a su propio ritmo:** Este curso a su propio ritmo está diseñado para ponerlo en el asiento del conductor y darle control sobre su propio aprendizaje. Se dan tiempos sugeridos para cada módulo y lección. Sin embargo, le animamos a que interactúe con el contenido a su propio ritmo.\n- ##### **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para profesores nuevos tanto en Code.org como en Fundamentos de Ciencias de la Computación. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades. Recomendamos a todos los profesores que comiencen con la breve unidad de bienvenida para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
