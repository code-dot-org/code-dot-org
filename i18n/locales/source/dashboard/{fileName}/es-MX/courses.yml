        self-paced-foundations-cs-2024:
          title: Fundamentos de la Ciencia de la Computación
          description_short: ''
          description_student: "¡Bienvenido!\n\n¡Bienvenido al curso en línea gratuito y autoguiado de Code.org para educadores para comenzar a enseñar <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Fundamentos de la Ciencia de la Computación**</a>! Después de completar este curso en línea, estarás listo para comenzar a enseñar el curso **Fundamentos de la Ciencia de la Computación** de Code.org a tus estudiantes.\n\nEncuentra el aprendizaje que funciona para ti\n\n##### **Comience con la Introducción a los Fundamentos de la Enseñanza de la Ciencia de la Computación:** Esta sección le presentará este curso y le ayudará a personalizar su camino de aprendizaje.\n##### **Ve a tu propio ritmo:** Este curso autodidacta está diseñado para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección. Sin embargo, te animamos a que interactúes con el contenido a tu propio ritmo.\n##### **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes que son nuevos tanto en Code.org como en Fundamentos de la Ciencia de la Computación. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades. Recomendamos a todos los maestros que comiencen con la breve unidad de bienvenida para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
