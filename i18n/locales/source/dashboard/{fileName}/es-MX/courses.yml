        csp-2024:
          title: "Principios de Ciencias de la Computación '24-'25"
          description_short: Aprender conceptos fundamentales de ciencias de la computación.
          description_student: CSP introduce a los estudiantes a los conceptos fundamentales de la informática y los desafía a explorar cómo la computación y la tecnología pueden impactar el mundo. El Programa AP diseñó los Principios de Ciencias de la Computación AP con el objetivo de crear líderes en los campos de la informática y atraer y comprometer a aquellos que tradicionalmente están subrepresentados con herramientas informáticas esenciales y oportunidades multidisciplinarias.
          description_teacher: |-
            CSP introduce a los estudiantes a los conceptos fundamentales de la informática y los desafía a explorar cómo la computación y la tecnología pueden impactar el mundo. El Programa AP diseñó los Principios de Ciencias de la Computación AP con el objetivo de crear líderes en los campos de la informática y atraer y comprometer a aquellos que tradicionalmente están subrepresentados con herramientas informáticas esenciales y oportunidades multidisciplinarias.
            
