        self-paced-pl-equitymodule-2024:
          title: Equidad en Ciencias de la Computación de Code.org
          description_short: ''
          description_student: "¡Bienvenido! Este curso general K-12, independiente del currículo, se centra en los conceptos fundamentales y las aplicaciones concretas de la equidad en la informática. No necesitas conocimientos previos de equidad o informática para participar en este curso. Damos la bienvenida a los estudiantes adultos de todos los niveles de grado y contextos de enseñanza para que se unan a nuestra comunidad de educadores con mentalidad de equidad.\n\n* * *\n\nEncuentra el aprendizaje que funciona para ti:\n\n##### **Ve a tu propio ritmo:** Este curso autodidacta está diseñado para ponerte al volante y darte control sobre tu aprendizaje. Se proporcionan tiempos sugeridos para cada módulo y lección. Sin embargo, te animamos a que interactúes con el contenido a tu propio ritmo.\n\n##### **Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes nuevos en equidad en la ciencia de la computación. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades."
