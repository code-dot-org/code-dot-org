        csa-2024:
          title: "Ciencias de la Computación A ('24-'25)"
          description_short: Aprende habilidades de programación en Java y ingeniería de software.
          description_student: "La Ciencia de la Computación A (CSA) introduce a los estudiantes en la ingeniería de software y la programación y diseño orientados a objetos utilizando el lenguaje de programación Java. Este plan de estudios abarca una amplia gama de temas, incluyendo el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de soluciones potenciales y las implicaciones éticas y sociales de los sistemas informáticos."
          description_teacher: |-
            La Ciencia de la Computación A (CSA) introduce a los estudiantes en la ingeniería de software y la programación y diseño orientados a objetos utilizando el lenguaje de programación Java. Este plan de estudios abarca una amplia gama de temas, incluyendo el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de soluciones potenciales y las implicaciones éticas y sociales de los sistemas informáticos.
            
            ¿Sabías que?
            
            El desarrollo profesional está disponible para ayudarte a comenzar a enseñar CSA. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Haz clic aquí</a> para aprender más sobre las oportunidades de aprendizaje profesional en tu región.
            
            Puedes encontrar el _Syllabus_, _Course Vocab_ y otros recursos para ayudarte a implementar este currículo en el menú de Recursos para Maestros a continuación.
          version_title: "'24-'25"
        focus-on-coding-2024:
          title: "Enfócate en la programación '24-'25 (Descubrimientos de CS)"
          description_short: Una colección de unidades de Descubrimiento en Ciencias de la Computación que se centra en habilidades de codificación y programación.
          description_student: |-
            Focus on Coding es una colección de unidades del curso de Descubrimientos en Ciencias de la Computación (CS Discoveries) que empodera a los estudiantes para desarrollar sus habilidades de codificación en desarrollo web, juegos y animación, y crear aplicaciones para dispositivos. Los estudiantes crean artefactos auténticos y se involucran con la informática como un medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
