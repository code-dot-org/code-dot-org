        exploring-gen-ai-2024:
          title: Explorando la IA Generativa
          description_short: 'Aprende los conceptos básicos de la IA generativa: cómo funciona la IA y cómo usar la IA generativa. '
          description_student: Aprende cómo funciona la IA y cómo usar la IA generativa
          description_teacher: "Explorando la IA Generativa es un currículo de dos unidades que explora cómo funciona la IA y cómo utilizar la IA Generativa. Los estudiantes participan en actividades prácticas que descomponen la caja negra de la IA generativa a través de actividades centradas en el estudiante y discusiones en clase, ancladas por una serie de videos que desmitifican la IA generativa para una amplia audiencia. Con una base sólida, los estudiantes aprenden a personalizar modelos de lenguaje utilizando el nuevo laboratorio de IA Chat, que proporciona a los estudiantes las herramientas para seleccionar modelos de lenguaje, aplicar indicaciones del sistema y curar información de recuperación para personalizar su chatbot. Los estudiantes crean chatbots para resolver una variedad de problemas e interrogan la validez de las respuestas y el uso apropiado de los chatbots en la sociedad."
          version_title: "'24-'25"
