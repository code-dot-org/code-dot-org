        csd-2024:
          title: "Descubrimientos en Ciencias de la Computación ('24-'25)"
          description_short: Un curso introductorio de ciencias de la computación que empodera a los estudiantes para crear artefactos auténticos.
          description_student: "Los Descubrimientos en Ciencias de la Computación (CS Discoveries) es un curso introductorio de ciencias de la computación que te permite crear artefactos auténticos y participar en la ciencia de la computación como un medio para la creatividad, la comunicación, la resolución de problemas y la diversión."
          description_teacher: |-
            Los Descubrimientos en Ciencias de la Computación (CS Discoveries) es un curso introductorio de ciencias de la computación que capacita a los estudiantes para crear artefactos auténticos y participar en la ciencia de la computación como un medio para la creatividad, la comunicación, la resolución de problemas y la diversión.
            
            ¿Sabías que?
            
            El desarrollo profesional está disponible para ayudarte a comenzar a enseñar CS Discoveries. [Haz clic aquí][0] para aprender más sobre las oportunidades de aprendizaje profesional en tu región o [haz clic aquí][1] para aprender más sobre una opción en línea a tu propio ritmo.
            
            Este curso tiene una implementación flexible y se puede enseñar en diferentes configuraciones según las necesidades de cada aula. Consulta la [Guía de Implementación de CSD][2] para más información
            
            Puedes acceder al [Sílabo del Curso][3] y a la [Guía de Inicio][4] para aprender más sobre el curso y comenzar.
          version_title: "'24-'25"
