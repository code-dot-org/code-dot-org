        k5-maker-pilot-2024:
          title: Aprendizaje Profesional Autodirigido para K-5 Maker
          description_short: "Módulo de aprendizaje profesional para el curso CSF Maker con micro:bit."
          description_student: "El curso micro:bit cierra la brecha entre los mundos digital y físico, y permite a los estudiantes transferir sus programas de computadora a aplicaciones del mundo real.\n\n#### **En este módulo, usted:**\n\n#### Prepárate para enseñar conceptos fundamentales de codificación como eventos, bucles, condicionales, variables y funciones.\nGana experiencia práctica en cómo el hardware y el software pueden trabajar juntos.\nPractica los conceptos clave incluidos en la unidad.\n#### Prepárate para enseñar cualquiera de los cursos de Fundamentos de CS Maker con micro:bit.\n\n#### **Tiempo total sugerido:** 150 minutos\n\n#### **Paso Extra:** Debido a que actualmente estamos pilotando esta unidad, primero necesitas inscribirte en el piloto para poder ver las unidades del currículo. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Haz clic aquí para inscribirte en el piloto</a> </strong>"
          description_teacher: "El curso micro:bit cierra la brecha entre los mundos digital y físico, y permite a los estudiantes transferir sus programas de computadora a aplicaciones del mundo real.\n\n#### **En este módulo, usted:**\n\n#### Prepárate para enseñar conceptos fundamentales de codificación como eventos, bucles, condicionales, variables y funciones.\nGana experiencia práctica en cómo el hardware y el software pueden trabajar juntos.\nPractica los conceptos clave incluidos en la unidad.\n#### Prepárate para enseñar cualquiera de los cursos de Fundamentos de CS Maker con micro:bit.\n\n#### **Tiempo total sugerido:**  150 minutos\n\n#### **Paso Extra:** Debido a que actualmente estamos pilotando esta unidad, primero necesitas inscribirte en el piloto para poder ver las unidades del currículo. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Haz clic aquí para inscribirte en el piloto</a> </strong>"
          version_title: ''
        foundations-of-cs-beta-2024:
          title: Fundamentos de la Ciencia de la Computación BETA
          description_short: ''
          description_student: |-
            ¡Bienvenido a Fundamentos de Ciencias de la Computación! Este emocionante curso es tu puerta de entrada al poderoso mundo de la informática. Ya sea que tengas curiosidad sobre cómo funcionan las aplicaciones o quieras saber más sobre el impacto de la tecnología en la sociedad, este curso tiene algo para ti. A lo largo del semestre, aprenderás los conceptos básicos de programación, te sumergirás en cómo funciona Internet y incluso crearás tus propios proyectos que podrían resolver problemas del mundo real.
            
            ⚠️ **Nota:** Esta es una versión beta del currículo de Fundamentos de CS que consiste principalmente en contenido de nuestros currículos existentes de Descubrimientos en Ciencias de la Computación y Principios de Ciencias de la Computación. Como tal, verás etiquetas CSD y CSP en guías de actividades, recursos y presentaciones. ¡Este no será el caso en la versión final del currículo!
          description_teacher: "El curso de Fundamentos de la Ciencia de la Computación (FCS) es una introducción completa al vasto campo de la ciencia de la computación. Diseñado para estudiantes de secundaria, este curso integra conceptos fundamentales con experiencia práctica para fomentar una comprensión profunda de la computación, sus capacidades y sus impactos. El plan de estudios está estructurado para alinearse con los requisitos estatales y los estándares de CSTA, ofreciendo una base sólida en ciencias de la computación que prepara a los estudiantes para estudios posteriores y futuras carreras en tecnología."
          version_title: "'24-'25"
