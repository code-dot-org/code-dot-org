          description_short: Explora el mundo de la ciencia de datos utilizando herramientas de visualización de datos para analizar e interpretar fenómenos del mundo real.
          description_student: "Este plan de estudios de Ciencia de Datos introduce a los estudiantes a los principios y habilidades fundamentales de la ciencia de datos. Los estudiantes aprenderán a hacer preguntas efectivas sobre datos, recopilar y limpiar conjuntos de datos, y crear visualizaciones atractivas utilizando herramientas como CODAP (Unidad 1) y Python (Unidad 2). A medida que los estudiantes avanzan, aplican sus habilidades de programación y análisis a conjuntos de datos del mundo real, ganando experiencia con técnicas esenciales de análisis de datos como agrupación, filtrado y cálculos estadísticos. El plan de estudios culmina en proyectos que destacan la importancia de las prácticas éticas de datos, la narración de datos y la creación de información procesable a partir de conjuntos de datos complejos."
          description_teacher: "La Ciencia de Datos construye una base sólida en análisis y visualización de datos para los estudiantes, utilizando herramientas de programación como CODAP en la Unidad 1 y Python en la Unidad 2 para profundizar sus habilidades analíticas. A través de lecciones y proyectos estructurados, los estudiantes aprenderán a utilizar herramientas de ciencia de datos para transformar datos en bruto en visualizaciones significativas. Las unidades enfatizan consideraciones éticas, guiando a los estudiantes a través de discusiones y actividades centradas en la privacidad de los datos, el sesgo y los impactos sociales de las decisiones basadas en datos. Al final de cada unidad, los estudiantes estarán preparados para investigar y resolver problemas del mundo real utilizando un enfoque integral basado en datos, culminando en un proyecto que muestre su capacidad para crear historias de datos atractivas."
          version_title: "'24-'25"
