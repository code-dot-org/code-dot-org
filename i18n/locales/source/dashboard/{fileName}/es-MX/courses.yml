        self-paced-pl-csd-2021:
          title: Enseñando CS Discoveries
          description_short: ''
          description_student: "## Bienvenido\n\n¡Bienvenido al curso en línea gratuito y autoguiado de Code.org para educadores que quieren comenzar a enseñar CS Discoveries! Después de completar este curso en línea, **estarás listo para comenzar a enseñar el curso de Descubrimientos en Ciencias de la Computación de Code.org** con tus estudiantes.\n\nEncuentra el aprendizaje que funciona para ti\n\n-   **Ve a tu propio ritmo:** Este curso autodirigido está diseñado para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes que son nuevos tanto en Code.org como en CS Discoveries. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Recomendamos a todos los maestros **comenzar con la breve unidad de bienvenida** para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
          description_teacher: "## Bienvenido\n\n¡Bienvenido al curso en línea gratuito y autoguiado de Code.org para educadores que quieren comenzar a enseñar CS Discoveries! Después de completar este curso en línea, **estarás listo para comenzar a enseñar el curso de Descubrimientos en Ciencias de la Computación de Code.org** con tus estudiantes.\n\nEncuentra el aprendizaje que funciona para ti\n\n-   **Ve a tu propio ritmo:** Este curso autodirigido está diseñado para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes que son nuevos tanto en Code.org como en CS Discoveries. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Recomendamos a todos los maestros **comenzar con la breve unidad de bienvenida** para aprender más sobre este curso de aprendizaje profesional antes de comenzar."
          version_title: "'21 - '22"
