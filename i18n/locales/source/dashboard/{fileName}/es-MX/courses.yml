          version_title: "'17-'18"
          description_student: "En otoño de 2016, el College Board lanzó su nuevo curso de AP®, AP Principios de Ciencias de la Computación. El curso introduce a los estudiantes a los conceptos fundamentales de la informática y los desafía a explorar cómo la computación y la tecnología pueden impactar el mundo. El Programa AP diseñó los Principios de Ciencias de la Computación AP con el objetivo de crear líderes en los campos de la informática y atraer y comprometer a aquellos que tradicionalmente están subrepresentados con herramientas informáticas esenciales y oportunidades multidisciplinarias."
