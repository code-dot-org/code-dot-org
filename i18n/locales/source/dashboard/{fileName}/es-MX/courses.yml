        self-paced-pl-ai-101-2024:
          title: AI 101 Aprendizaje Profesional Autodidacta para Educadores
          description_short: ''
          description_student: "¡Bienvenido!\n\nBienvenido al curso en línea a su propio ritmo de Code.org para educadores que quieren comenzar con la IA.\n\nEsta es una serie de aprendizaje en línea gratuita y fundamental para cualquier maestro o educador interesado en el mundo innovador de la inteligencia artificial (IA) y su potencial transformador en la educación.\n\nEn esta serie de cinco partes, desmitificaremos la IA, exploraremos la implementación responsable, abordaremos el sesgo y mostraremos cómo el aprendizaje potenciado por IA puede revolucionar los resultados de los estudiantes.\n\nÚnete a nosotros en este viaje de exploración y empoderamiento, y desbloquea el futuro de la enseñanza con y sobre la IA.\n\nEncuentra el aprendizaje que funciona para ti\n\n-   **Ve a tu propio ritmo:** Este curso autodirigido está diseñado para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes nuevos en IA. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.**"
          description_teacher: "¡Bienvenido!\n\nBienvenido al curso en línea a su propio ritmo de Code.org para educadores que quieren comenzar con la IA.\n\nEsta es una serie de aprendizaje en línea gratuita y fundamental para cualquier maestro o educador interesado en el mundo innovador de la inteligencia artificial (IA) y su potencial transformador en la educación.\n\nEn esta serie de cinco partes, desmitificaremos la IA, exploraremos la implementación responsable, abordaremos el sesgo y mostraremos cómo el aprendizaje potenciado por IA puede revolucionar los resultados de los estudiantes.\n\nÚnete a nosotros en este viaje de exploración y empoderamiento, y desbloquea el futuro de la enseñanza con y sobre la IA.\n\nEncuentra el aprendizaje que funciona para ti\n\n-   **Ve a tu propio ritmo:** Este curso autodirigido está diseñado para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido de este curso de aprendizaje profesional está organizado en la progresión sugerida para los docentes nuevos en IA. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.**"
