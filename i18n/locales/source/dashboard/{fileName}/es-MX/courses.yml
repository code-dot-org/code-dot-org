          description_short: ''
          description_student: "## Bienvenido\n\n¡Bienvenido a los módulos en línea gratuitos y autoguiados de Code.org para que los educadores comiencen a enseñar los Principios de CS! Después de completar estos módulos en línea, estarás listo para comenzar a enseñar el curso de Principios de Ciencias de la Computación de Code.org a tus estudiantes.\n\nEncuentra el aprendizaje que funciona para ti\n\nVe a tu propio ritmo Estos módulos autoguiados están diseñados para ponerte al volante y darte control sobre tu propio aprendizaje. Se sugieren tiempos para cada módulo y lección. Sin embargo, te animamos a que interactúes con el contenido a tu propio ritmo.\n\nElige tu contenido\n\nEl contenido de estos módulos de aprendizaje profesional está organizado en la progresión sugerida para los maestros nuevos tanto en Code.org como en CS Principles. Sin embargo, puedes interactuar con el contenido en el orden que mejor se adapte a tus necesidades. Recomendamos a todos los maestros comenzar con la breve unidad de bienvenida para aprender más sobre estos módulos de aprendizaje profesional antes de comenzar."
