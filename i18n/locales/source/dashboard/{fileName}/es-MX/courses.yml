        self-paced-exploring-gen-ai-2024:
          title: Explorando el aprendizaje profesional autodirigido en IA generativa
          description_short: "¡Bienvenido! \nEste módulo de aprendizaje profesional está diseñado para ayudarte a prepararte para enseñar el curso de Exploración de IA Generativa de Code.org.\n\n##### Explorar la IA Generativa está diseñado como un curso independiente para estudiantes de 8° a 12° grado que se puede integrar sin problemas en cualquier currículo existente, ofreciendo a los maestros la flexibilidad de introducirlo de acuerdo con su horario y necesidades educativas. \n\nEncuentra el aprendizaje que funciona para ti\n* **Ve a tu propio ritmo:** Esta experiencia de aprendizaje a tu propio ritmo está diseñada para darte control sobre tu propio aprendizaje. Se sugieren horarios para cada lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n* **Elige tu contenido:** El contenido está organizado en la progresión sugerida para maestros nuevos tanto en Code.org como en la unidad de IA Generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, podrías optar por omitir Comenzando con Code.org y pasar directamente a la Unidad de Exploración de IA Generativa. "
          description_student: "¡Bienvenido!\n\nEste módulo de aprendizaje profesional está diseñado para ayudarte a prepararte para enseñar el curso de Exploración de IA Generativa de Code.org.\n\n##### Explorar la IA Generativa está diseñado como un curso independiente para estudiantes de 8° a 12° grado que se puede integrar sin problemas en cualquier currículo existente, ofreciendo a los maestros la flexibilidad de introducirlo de acuerdo con su horario y necesidades educativas.\n\nEncuentra el aprendizaje que funciona para ti\n\nVe a tu propio ritmo: Esta experiencia de aprendizaje a tu propio ritmo está diseñada para darte control sobre tu propio aprendizaje. Se sugieren horarios para cada lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido está organizado en la progresión sugerida para maestros nuevos tanto en Code.org como en la unidad de IA Generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, podrías optar por omitir Comenzando con Code.org y pasar directamente a la Unidad de Exploración de IA Generativa. "
          description_teacher: "¡Bienvenido!\n\nEste módulo de aprendizaje profesional está diseñado para ayudarte a prepararte para enseñar el curso de Exploración de IA Generativa de Code.org.\n\n##### Explorar la IA Generativa está diseñado como un curso independiente para estudiantes de 8 a 12 años que se puede integrar sin problemas en cualquier currículo existente, ofreciendo a los maestros la flexibilidad de introducirlo de acuerdo con su horario y necesidades educativas.\n\nEncuentra el aprendizaje que funciona para ti\n\nVe a tu propio ritmo: Esta experiencia de aprendizaje a tu propio ritmo está diseñada para darte control sobre tu propio aprendizaje. Se sugieren horarios para cada lección.  Sin embargo, te animamos a **interactuar con el contenido a tu propio ritmo.**\n\n**Elige tu contenido:** El contenido está organizado en la progresión sugerida para maestros nuevos tanto en Code.org como en la unidad de IA Generativa. Sin embargo, puedes **interactuar con el contenido en el orden que mejor se adapte a tus necesidades.** Si ya estás familiarizado con la plataforma Code.org, podrías optar por omitir Comenzando con Code.org y pasar directamente a la Unidad de Exploración de IA Generativa. "
