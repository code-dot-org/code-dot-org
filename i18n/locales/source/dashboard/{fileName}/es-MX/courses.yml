        csa-validation-pilot-2022:
          title: "Ciencias de la Computación Un Piloto de Validación ('22-'23)"
          description_short: Aprende habilidades de programación en Java y ingeniería de software.
          description_student: "La Ciencia de la Computación A (CSA) introduce a los estudiantes en la ingeniería de software y la programación y diseño orientados a objetos utilizando el lenguaje de programación Java. Este plan de estudios abarca una amplia gama de temas, incluyendo el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de soluciones potenciales y las implicaciones éticas y sociales de los sistemas informáticos."
          description_teacher: "La Ciencia de la Computación A (CSA) introduce a los estudiantes en la ingeniería de software y la programación y diseño orientados a objetos utilizando el lenguaje de programación Java. Este plan de estudios abarca una amplia gama de temas, incluyendo el diseño de soluciones a problemas, el uso de estructuras de datos para organizar grandes conjuntos de datos, el desarrollo e implementación de algoritmos para procesar datos y descubrir nueva información, el análisis de soluciones potenciales y las implicaciones éticas y sociales de los sistemas informáticos."
