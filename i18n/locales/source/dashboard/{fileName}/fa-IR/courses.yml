        k5-maker-pilot-2024:
          title: K-5 Maker یادگیری حرفه ای خودگام
          description_short: "ماژول یادگیری حرفه ای برای CSF Maker با دوره micro:bit"
          description_student: "#### دوره میکروبیتی شکاف بین دنیای دیجیتال و فیزیکی را پر می کند و دانش آموزان را قادر می سازد تا برنامه های کامپیوتری خود را به برنامه های کاربردی در دنیای واقعی منتقل کنند.\n\n#### **در این ماژول، شما:**\n\n- #### برای آموزش مفاهیم کدنویسی بنیادی مانند رویدادها، حلقه ها، شرطی ها، متغیرها و توابع آماده شوید.\n- #### تجربه عملی در مورد نحوه کار سخت افزار و نرم افزار با هم کسب کنید.\n- #### مفاهیم کلیدی موجود در واحد را تمرین کنید.\n- #### برای آموزش هر یک از اصول CS Builder با دوره های micro:bit آماده شوید.\n\n#### **زمان کل پیشنهادی:** 150 دقیقه\n\n#### **مرحله اضافی:** از آنجایی که ما در حال حاضر این واحد را به صورت آزمایشی انجام می دهیم، ابتدا باید در پایلوت ثبت نام کنید تا واحدهای برنامه درسی را ببینید. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">برای ثبت نام در پایلوت اینجا را کلیک</a> کنید </strong>"
