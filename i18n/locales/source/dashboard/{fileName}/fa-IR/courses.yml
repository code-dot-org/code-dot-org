        data-science-2024:
          title: "[خلبان] علم داده"
          description_short: دنیای علم داده را با استفاده از ابزارهای مصورسازی داده برای تجزیه و تحلیل و تفسیر پدیده های دنیای واقعی کاوش کنید.
          description_student: این برنامه درسی علم داده، دانش آموزان را با اصول و مهارت های بنیادی علم داده آشنا می کند. دانشجویان یاد خواهند گرفت که چگونه سوالات داده موثر بپرسند، مجموعه داده ها را جمع آوری و تمیز کنند و با استفاده از ابزارهایی مانند CODAP (واحد 1) و پایتون (واحد 2) مصورسازی های قانع کننده ای ایجاد کنند. با پیشرفت دانش آموزان، مهارت های برنامه نویسی و تحلیلی خود را در مجموعه داده های دنیای واقعی به کار می گیرند و با تکنیک های ضروری تجزیه و تحلیل داده ها مانند گروه بندی، فیلتر کردن و محاسبات آماری تجربه کسب می کنند. برنامه درسی در پروژه هایی به اوج خود می رسد که اهمیت شیوه های داده های اخلاقی، داستان سرایی داده ها و ایجاد بینش های عملی از مجموعه داده های پیچیده را برجسته می کند.
          description_teacher: علم داده با استفاده از ابزارهای برنامه نویسی مانند CODAP در واحد 1 و پایتون در واحد 2 برای تعمیق مهارت های تحلیلی آنها، پایه ای قوی در تجزیه و تحلیل و تجسم داده ها برای دانش آموزان ایجاد می کند. از طریق درس ها و پروژه های ساختاریافته، دانش آموزان یاد خواهند گرفت که چگونه از ابزارهای علم داده برای تبدیل داده های خام به تجسم های معنادار استفاده کنند. این واحدها بر ملاحظات اخلاقی تأکید می کنند و دانش آموزان را از طریق بحث ها و فعالیت های متمرکز بر حریم خصوصی داده ها، سوگیری و تأثیرات اجتماعی تصمیمات مبتنی بر داده ها راهنمایی می کنند. در پایان هر واحد، دانش آموزان برای بررسی و حل مشکلات دنیای واقعی با استفاده از یک رویکرد جامع مبتنی بر داده آماده می شوند که در پروژه ای به اوج خود می رسد که توانایی آنها را در ایجاد داستان های داده قانع کننده نشان می دهد.
          version_title: "'24-'25"
