        self-paced-pl-csp-2024:
          title: آموزش اصول CS
          description_short: ''
          description_student: "## خوش آمدید\n\n##### به ماژول های آنلاین رایگان Code.org برای مربیان خوش آمدید تا آموزش اصول CS را شروع کنند! پس از تکمیل این ماژول های آنلاین، آماده خواهید بود تا دوره اصول علوم کامپیوتر Code.org را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n##### **با سرعت خود بروید**: این ماژول های خودگام به گونه ای طراحی شده اند که شما را در صندلی راننده قرار دهند و به شما کنترل یادگیری خود را بدهند. زمان های پیشنهادی برای هر ماژول و درس داده شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n\n### محتوای خود را انتخاب کنید\n\n##### محتوای این ماژول های یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در Code.org و اصول CS سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید. ما به همه معلمان توصیه می کنیم قبل از شروع، با واحد خوش آمدگویی کوتاه شروع کنند تا در مورد این ماژول های یادگیری حرفه ای بیشتر بدانند."
          description_teacher: "## خوش آمدید\n\n##### به ماژول های آنلاین رایگان Code.org برای مربیان خوش آمدید تا آموزش اصول CS را شروع کنند! پس از تکمیل این ماژول های آنلاین، آماده خواهید بود تا دوره اصول علوم کامپیوتر Code.org را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n##### **با سرعت خود بروید**: این ماژول های خودگام به گونه ای طراحی شده اند که شما را در صندلی راننده قرار دهند و به شما کنترل یادگیری خود را بدهند. زمان های پیشنهادی برای هر ماژول و درس داده شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n\n### محتوای خود را انتخاب کنید\n\n##### محتوای این ماژول های یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در Code.org و اصول CS سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید. ما به همه معلمان توصیه می کنیم قبل از شروع، با واحد خوش آمدگویی کوتاه شروع کنند تا در مورد این ماژول های یادگیری حرفه ای بیشتر بدانند."
