        self-paced-foundations-cs-2024:
          title: مبانی آموزشی علوم کامپیوتر
          description_short: ''
          description_student: "## خوش آمدید!\n\n##### به دوره آنلاین رایگان Code.org برای مربیان خوش آمدید تا شروع به تدریس <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**مبانی علوم کامپیوتر**</a>! پس از اتمام این دوره آنلاین، آماده خواهید بود تا دوره **مبانی علوم کامپیوتر** Code.org را با دانش آموزان خود شروع کنید.\n\n### **یادگیری را پیدا کنید که برای شما مناسب است**\n\n- ##### **با مقدمه ای بر مبانی آموزش علوم کامپیوتر شروع کنید:** این بخش شما را با این دوره آشنا می کند و به شما کمک می کند مسیر یادگیری خود را سفارشی کنید.\n- ##### **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر ماژول و درس داده شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n- ##### **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و مبانی علوم کامپیوتر سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید. ما به همه معلمان توصیه می کنیم قبل از شروع، با واحد خوش آمدگویی کوتاه شروع کنند تا در مورد این دوره یادگیری حرفه ای بیشتر بدانند."
          description_teacher: "## خوش آمدید!\n\n##### به دوره آنلاین رایگان Code.org برای مربیان خوش آمدید تا شروع به تدریس <a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**مبانی علوم کامپیوتر**</a>! پس از اتمام این دوره آنلاین، آماده خواهید بود تا دوره **مبانی علوم کامپیوتر** Code.org را با دانش آموزان خود شروع کنید.\n\n### **یادگیری را پیدا کنید که برای شما مناسب است**\n\n- ##### **با مقدمه ای بر مبانی آموزش علوم کامپیوتر شروع کنید:** این بخش شما را با این دوره آشنا می کند و به شما کمک می کند مسیر یادگیری خود را سفارشی کنید.\n- ##### **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر ماژول و درس داده شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n- ##### **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و مبانی علوم کامپیوتر سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید. ما به همه معلمان توصیه می کنیم قبل از شروع، با واحد خوش آمدگویی کوتاه شروع کنند تا در مورد این دوره یادگیری حرفه ای بیشتر بدانند."
