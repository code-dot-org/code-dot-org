          assignment_family_title: اصول علوم کامپیوتر
          title: "اصول علوم کامپیوتر ('17-'18)"
          version_title: "'17-'18"
          description_student: در پاییز 2016، هیئت کالج جدیدترین دوره AP® خود را با نام AP Computer Science Principles راه اندازی کرد. این دوره دانش آموزان را با مفاهیم اساسی علوم کامپیوتر آشنا می کند و آنها را به چالش می کشد تا کشف کنند که چگونه محاسبات و فناوری می توانند بر جهان تأثیر بگذارند. برنامه AP اصول علوم کامپیوتر AP را با هدف ایجاد رهبران در زمینه های علوم کامپیوتر و جذب و درگیر کردن کسانی که به طور سنتی با ابزارهای محاسباتی ضروری و فرصت های چند رشته ای کمتر نمایندگی می شوند، طراحی کرد.
