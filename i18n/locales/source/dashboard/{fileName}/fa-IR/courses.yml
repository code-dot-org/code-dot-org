        exploring-gen-ai-2024:
          title: بررسی هوش مصنوعی مولد
          description_short: 'مبانی هوش مصنوعی مولد را بیاموزید: هوش مصنوعی چگونه کار می کند و چگونه از هوش مصنوعی مولد استفاده کنید. '
          description_student: یادگیری نحوه عملکرد هوش مصنوعی و نحوه استفاده از هوش مصنوعی مولد
          description_teacher: کاوش در هوش مصنوعی مولد یک برنامه درسی دو واحدی است که نحوه عملکرد هوش مصنوعی و نحوه استفاده از هوش مصنوعی مولد را بررسی می کند. دانش آموزان در فعالیت های عملی شرکت می کنند که جعبه سیاه هوش مصنوعی مولد را از طریق فعالیت های دانش آموز محور و بحث های کلاسی، که توسط یک مجموعه ویدیویی که هوش مصنوعی مولد را برای مخاطبان گسترده ابهام زدایی می کند، باز می کند. با یک پایه محکم، دانش آموزان یاد می گیرند که مدل های زبان را با استفاده از آزمایشگاه جدید چت هوش مصنوعی سفارشی کنند که ابزارهایی را برای انتخاب مدل های زبان، اعمال درخواست های سیستم و مدیریت اطلاعات بازیابی برای سفارشی کردن ربات چت خود در اختیار دانش آموزان قرار می دهد. دانش آموزان چت بات هایی را برای حل مشکلات مختلف ایجاد می کنند و اعتبار پاسخ ها و استفاده مناسب از چت بات ها را در جامعه مورد بازجویی قرار می دهند.
          version_title: "'24-'25"
