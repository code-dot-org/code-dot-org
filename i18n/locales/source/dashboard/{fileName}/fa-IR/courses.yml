        csp-2022:
          title: "اصول علوم کامپیوتر ('22-'23)"
          description_short: مفاهیم اساسی علوم کامپیوتر را بیاموزید.
          description_student: CSP دانش آموزان را با مفاهیم اساسی علوم کامپیوتر آشنا می کند و آنها را به چالش می کشد تا کشف کنند که چگونه محاسبات و فناوری می توانند بر جهان تأثیر بگذارند. برنامه AP اصول علوم کامپیوتر AP را با هدف ایجاد رهبران در زمینه های علوم کامپیوتر و جذب و درگیر کردن کسانی که به طور سنتی با ابزارهای محاسباتی ضروری و فرصت های چند رشته ای کمتر نمایندگی می شوند، طراحی کرد.
          description_teacher: |-
            CSP دانش آموزان را با مفاهیم اساسی علوم کامپیوتر آشنا می کند و آنها را به چالش می کشد تا کشف کنند که چگونه محاسبات و فناوری می توانند بر جهان تأثیر بگذارند. برنامه AP اصول علوم کامپیوتر AP را با هدف ایجاد رهبران در زمینه های علوم کامپیوتر و جذب و درگیر کردن کسانی که به طور سنتی با ابزارهای محاسباتی ضروری و فرصت های چند رشته ای کمتر نمایندگی می شوند، طراحی کرد.
            
            **آیا می دانستید؟**
            
            - توسعه حرفه ای برای کمک به شما در شروع آموزش اصول CS در دسترس است. برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">خود اینجا را</a> کلیک کنید یا برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">اینجا را کلیک</a> کنید.
            
            - می توانید منابع _Curriculum Guide_، _Course Vocab_ و سایر منابع را برای کمک به اجرای این برنامه درسی در منوی منابع معلم زیر بیابید
          version_title: "'22-'23"
        csa-2022:
          title: "علوم کامپیوتر A ('22-'23)"
          description_short: مهارت های برنامه نویسی جاوا و مهندسی نرم افزار را بیاموزید.
          description_student: علوم کامپیوتر A (CSA) دانش آموزان را با مهندسی نرم افزار و برنامه نویسی شی گرا و طراحی با استفاده از زبان برنامه نویسی جاوا آشنا می کند. این برنامه درسی طیف گسترده ای از موضوعات از جمله طراحی راه حل برای مشکلات، استفاده از ساختارهای داده برای سازماندهی مجموعه های بزرگی از داده ها، توسعه و پیاده سازی الگوریتم ها برای پردازش داده ها و کشف اطلاعات جدید، تجزیه و تحلیل راه حل های بالقوه و پیامدهای اخلاقی و اجتماعی سیستم های محاسباتی را پوشش می دهد.
          description_teacher: |-
            علوم کامپیوتر A (CSA) دانش آموزان را با مهندسی نرم افزار و برنامه نویسی شی گرا و طراحی با استفاده از زبان برنامه نویسی جاوا آشنا می کند. این برنامه درسی طیف گسترده ای از موضوعات از جمله طراحی راه حل برای مشکلات، استفاده از ساختارهای داده برای سازماندهی مجموعه های بزرگی از داده ها، توسعه و پیاده سازی الگوریتم ها برای پردازش داده ها و کشف اطلاعات جدید، تجزیه و تحلیل راه حل های بالقوه و پیامدهای اخلاقی و اجتماعی سیستم های محاسباتی را پوشش می دهد.
            
            **آیا می دانستید؟**
            
            - توسعه حرفه ای برای کمک به شما در شروع آموزش CSA در دسترس است. برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">خود اینجا را کلیک</a> کنید.
            
            - می توانید _Curriculum Guide_، _Course Vocab_ و سایر منابعی را که به شما در اجرای این برنامه درسی کمک می کند در منوی منابع معلم زیر بیابید.
          version_title: "'22-'23"
