          description_teacher: علوم کامپیوتر A (CSA) دانش آموزان را با مهندسی نرم افزار و برنامه نویسی شی گرا و طراحی با استفاده از زبان برنامه نویسی جاوا آشنا می کند. این برنامه درسی طیف گسترده ای از موضوعات از جمله طراحی راه حل برای مشکلات، استفاده از ساختارهای داده برای سازماندهی مجموعه های بزرگی از داده ها، توسعه و پیاده سازی الگوریتم ها برای پردازش داده ها و کشف اطلاعات جدید، تجزیه و تحلیل راه حل های بالقوه و پیامدهای اخلاقی و اجتماعی سیستم های محاسباتی را پوشش می دهد.
