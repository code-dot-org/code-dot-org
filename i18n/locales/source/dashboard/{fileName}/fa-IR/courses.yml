        foundations-of-cs-beta-2024:
          title: مبانی علوم کامپیوتر BETA
          description_short: ''
          description_student: |-
            به مبانی علوم کامپیوتر خوش آمدید! این دوره هیجان انگیز دروازه شما به دنیای قدرتمند علوم کامپیوتر است. چه در مورد نحوه عملکرد اپلیکیشن ها کنجکاو باشید و چه بخواهید در مورد تأثیر فناوری بر جامعه بیشتر بدانید، این دوره چیزی برای شما دارد. در طول ترم، اصول برنامه نویسی را یاد خواهید گرفت، به نحوه عملکرد اینترنت می پردازید و حتی پروژه های خود را ایجاد می کنید که می تواند مشکلات دنیای واقعی را حل کند.
            
            ⚠️ **توجه:** این یک نسخه بتا از برنامه درسی مبانی علوم کامپیوتر است که عمدتا از محتوایی از برنامه های درسی اکتشافات علوم کامپیوتر و اصول علوم کامپیوتر موجود ما تشکیل شده است. به این ترتیب، برچسب های CSD و CSP را در راهنماهای فعالیت، منابع و عرشه های اسلاید مشاهده خواهید کرد. این مورد در نسخه نهایی برنامه درسی صدق نخواهد کرد!
          description_teacher: دوره مبانی علوم کامپیوتر (FCS) مقدمه ای جامع بر حوزه گسترده علوم کامپیوتر است. این دوره که برای دانش آموزان دبیرستانی طراحی شده است، مفاهیم اساسی را با تجربه عملی عملی ادغام می کند تا درک عمیقی از محاسبات، قابلیت ها و تأثیرات آن را تقویت کند. برنامه درسی به گونه ای طراحی شده است که با الزامات ایالتی و استانداردهای CSTA هماهنگ باشد و پایه محکمی در علوم کامپیوتر ارائه می دهد که دانش آموزان را برای تحصیل بیشتر و مشاغل آینده در فناوری آماده می کند.
          version_title: "'24-'25"
        self-paced-pl-csd-2024:
          title: آموزش اکتشافات CS
          description_short: ''
          description_student: "## خوش آمدید\n\nبه دوره آنلاین رایگان Code.org خوش آمدید برای مربیان برای شروع آموزش اکتشافات CS! پس از اتمام این دوره آنلاین، **شما آماده خواهید بود تا دوره اکتشافات علوم کامپیوتر Code.org را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر ماژول و درس داده شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در Code.org و CS Discoveries سازماندهی شده است. با این حال، می توانید **به ترتیبی که نیازهای شما را برآورده می کند، با محتوا درگیر شوید.** ما به همه معلمان توصیه می کنیم **با واحد خوش آمدگویی کوتاه** شروع کنند تا قبل از شروع، در مورد این دوره یادگیری حرفه ای بیشتر بدانید."
          description_teacher: "## خوش آمدید\n\nبه دوره آنلاین رایگان Code.org خوش آمدید برای مربیان برای شروع آموزش اکتشافات CS! پس از اتمام این دوره آنلاین، **شما آماده خواهید بود تا دوره اکتشافات علوم کامپیوتر Code.org را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر ماژول و درس داده شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در Code.org و CS Discoveries سازماندهی شده است. با این حال، می توانید **به ترتیبی که نیازهای شما را برآورده می کند، با محتوا درگیر شوید.** ما به همه معلمان توصیه می کنیم **با واحد خوش آمدگویی کوتاه** شروع کنند تا قبل از شروع، در مورد این دوره یادگیری حرفه ای بیشتر بدانید."
          version_title: "'24 - '25"
        self-paced-pl-csd-unit1-2024:
          title: آموزش حل مسئله و محاسبات
          description_short: ''
          description_student: "## خوش آمدید\n\nبه آموزش آنلاین رایگان Code.org برای مربیان خوش آمدید تا تدریس را با Code.org شروع کنند! پس از تکمیل این تجربه یادگیری حرفه ای، **شما آماده خواهید بود تا آموزش CSD واحد 1 Code.org - حل مسئله و محاسبات** را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و CSD واحد 1 - حل مسئله و محاسبات سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به سراغ آماده شدن برای آموزش حل مسئله و محاسبات بروید. "
          description_teacher: "## خوش آمدید\n\nبه آموزش آنلاین رایگان Code.org برای مربیان خوش آمدید تا تدریس را با Code.org شروع کنند! پس از تکمیل این تجربه یادگیری حرفه ای، **شما آماده خواهید بود تا آموزش CSD واحد 1 Code.org - حل مسئله و محاسبات** را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و CSD واحد 1 - حل مسئله و محاسبات سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به سراغ آماده شدن برای آموزش حل مسئله و محاسبات بروید. "
          version_title: "'24-'25"
