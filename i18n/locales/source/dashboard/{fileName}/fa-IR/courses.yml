        csd-2024:
          title: "اکتشافات علوم کامپیوتر ('24-'25)"
          description_short: یک دوره مقدماتی علوم کامپیوتر که دانش آموزان را قادر می سازد تا مصنوعات معتبر ایجاد کنند
          description_student: اکتشافات علوم کامپیوتر (CS Discoveries) یک دوره مقدماتی علوم کامپیوتر است که به شما این امکان را می دهد تا مصنوعات معتبر ایجاد کنید و با علوم کامپیوتر به عنوان رسانه ای برای خلاقیت، ارتباطات، حل مسئله و سرگرمی درگیر شوید.
          description_teacher: |-
            اکتشافات علوم کامپیوتر (CS Discoveries) یک دوره مقدماتی علوم کامپیوتر است که دانش آموزان را قادر می سازد تا مصنوعات معتبر ایجاد کنند و با علوم کامپیوتر به عنوان رسانه ای برای خلاقیت، ارتباطات، حل مسئله و سرگرمی درگیر شوند.
            
            **آیا می دانستید؟**
            
            - توسعه حرفه ای برای کمک به شما در شروع آموزش CS Discoveries در دسترس است. [اینجا کلیک کنید][0] برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه خود یا [اینجا را کلیک کنید][1] برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام.
            
            - این دوره دارای اجرای انعطاف پذیری است و می تواند در پیکربندی های مختلف بر اساس نیاز هر کلاس درس تدریس شود. برای اطلاعات بیشتر [راهنمای پیاده سازی CSD] [2] را بررسی کنید
            
            - برای کسب اطلاعات بیشتر در مورد دوره و شروع می توانید به [برنامه درسی دوره][3] و [راهنمای شروع به کار] دسترسی داشته باشید.
          version_title: "'24-'25"
