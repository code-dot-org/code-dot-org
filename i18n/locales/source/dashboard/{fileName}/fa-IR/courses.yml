        self-paced-exploring-gen-ai-2024:
          title: بررسی یادگیری حرفه ای خودگام هوش مصنوعی مولد
          description_short: "## خوش آمدید! \n##### این ماژول یادگیری حرفه ای برای کمک به شما در آماده شدن برای آموزش دوره کاوش هوش مصنوعی مولد Code.org طراحی شده است.\n\n##### Exploration Generative AI به عنوان دوره های آموزشی مستقل برای دانش آموزان کلاس 8 تا 12 طراحی شده است که می تواند به طور یکپارچه در هر برنامه درسی موجود ادغام شود و به معلمان این امکان را می دهد که آن را با توجه به برنامه و نیازهای آموزشی خود معرفی کنند. \n\n### یادگیری را پیدا کنید که برای شما مفید است\n* **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n* **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و واحد هوش مصنوعی مولد سازماندهی شده است. با این حال، می توانید **با محتوا به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به واحد کاوش هوش مصنوعی مولد بروید. "
          description_student: "## خوش آمدید!\n\n##### این ماژول یادگیری حرفه ای برای کمک به شما در آماده شدن برای آموزش دوره کاوش هوش مصنوعی مولد Code.org طراحی شده است.\n\n##### Exploration Generative AI به عنوان دوره های آموزشی مستقل برای دانش آموزان کلاس 8 تا 12 طراحی شده است که می تواند به طور یکپارچه در هر برنامه درسی موجود ادغام شود و به معلمان این امکان را می دهد که آن را با توجه به برنامه و نیازهای آموزشی خود معرفی کنند.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و واحد هوش مصنوعی مولد سازماندهی شده است. با این حال، می توانید **با محتوا به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به واحد کاوش هوش مصنوعی مولد بروید. "
          description_teacher: "## خوش آمدید!\n\n##### این ماژول یادگیری حرفه ای برای کمک به شما در آماده شدن برای آموزش دوره کاوش هوش مصنوعی مولد Code.org طراحی شده است.\n\n##### Exploration Generative AI به عنوان دوره آموزشی مستقل برای 8 تا 12 دانش آموز طراحی شده است که می تواند به طور یکپارچه در هر برنامه درسی موجود ادغام شود و به معلمان این امکان را می دهد که آن را با توجه به برنامه و نیازهای آموزشی خود معرفی کنند.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و واحد هوش مصنوعی مولد سازماندهی شده است. با این حال، می توانید **با محتوا به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به واحد کاوش هوش مصنوعی مولد بروید. "
          version_title: ''
        self-paced-pl-equitymodule-2024:
          title: عدالت Code.org در علوم کامپیوتر
          description_short: ''
          description_student: "##### خوش آمدید! این دوره عمومی K-12 و برنامه درسی آگنوستیک بر مفاهیم اساسی و کاربردهای عینی عدالت در علوم کامپیوتر تمرکز دارد. برای درگیر شدن در این دوره نیازی به حقوق صاحبان سهام یا دانش علوم کامپیوتر ندارید. ما از زبان آموزان بزرگسال از تمام سطوح پایه و زمینه های آموزشی استقبال می کنیم تا به جامعه مربیان عدالت خواه ما بپیوندند.\n\n* * *\n\n##### **یادگیری را پیدا کنید که برای شما مفید است:**\n\n##### **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری را بدهد. زمان های پیشنهادی برای هر ماژول و درس ارائه شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n\n- ##### **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در علوم کامپیوتر سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید."
          description_teacher: "##### خوش آمدید! این دوره عمومی K-12 و برنامه درسی آگنوستیک بر مفاهیم اساسی و کاربردهای عینی عدالت در علوم کامپیوتر تمرکز دارد. برای درگیر شدن در این دوره نیازی به حقوق صاحبان سهام یا دانش علوم کامپیوتر ندارید. ما از زبان آموزان بزرگسال از تمام سطوح پایه و زمینه های آموزشی استقبال می کنیم تا به جامعه مربیان عدالت خواه ما بپیوندند.\n\n* * *\n\n##### **یادگیری را پیدا کنید که برای شما مفید است:**\n\n##### **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری را بدهد. زمان های پیشنهادی برای هر ماژول و درس ارائه شده است. با این حال، ما شما را تشویق می کنیم که با سرعت دلخواه خود با محتوا درگیر شوید.\n\n- ##### **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد در علوم کامپیوتر سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید."
