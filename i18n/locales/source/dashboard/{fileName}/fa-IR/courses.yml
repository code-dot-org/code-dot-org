        csp-2021:
          title: "اصول علوم کامپیوتر ('21-'22)"
          description_short: مفاهیم اساسی علوم کامپیوتر را بیاموزید.
          description_student: CSP دانش آموزان را با مفاهیم اساسی علوم کامپیوتر آشنا می کند و آنها را به چالش می کشد تا کشف کنند که چگونه محاسبات و فناوری می توانند بر جهان تأثیر بگذارند. برنامه AP اصول علوم کامپیوتر AP را با هدف ایجاد رهبران در زمینه های علوم کامپیوتر و جذب و درگیر کردن کسانی که به طور سنتی با ابزارهای محاسباتی ضروری و فرصت های چند رشته ای کمتر نمایندگی می شوند، طراحی کرد.
          description_teacher: |-
            CSP دانش آموزان را با مفاهیم اساسی علوم کامپیوتر آشنا می کند و آنها را به چالش می کشد تا کشف کنند که چگونه محاسبات و فناوری می توانند بر جهان تأثیر بگذارند. برنامه AP اصول علوم کامپیوتر AP را با هدف ایجاد رهبران در زمینه های علوم کامپیوتر و جذب و درگیر کردن کسانی که به طور سنتی با ابزارهای محاسباتی ضروری و فرصت های چند رشته ای کمتر نمایندگی می شوند، طراحی کرد.
            
            **آیا می دانستید؟**
            
            - توسعه حرفه ای برای کمک به شما در شروع آموزش اصول CS در دسترس است. برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">خود اینجا را</a> کلیک کنید یا برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">اینجا را کلیک</a> کنید.
            
            - می توانید منابع _Curriculum Guide_، _Course Vocab_ و سایر منابع را برای کمک به اجرای این برنامه درسی در منوی منابع معلم زیر بیابید
          version_title: "'21-'22"
        csd-2021:
          title: "اکتشافات علوم کامپیوتر ('21-'22)"
          description_short: یک دوره مقدماتی علوم کامپیوتر که دانش آموزان را قادر می سازد تا مصنوعات معتبر ایجاد کنند
          description_student: |-
            اکتشافات علوم کامپیوتر (CS Discoveries) یک دوره مقدماتی علوم کامپیوتر است که دانش آموزان را قادر می سازد تا مصنوعات معتبر ایجاد کنند و با علوم کامپیوتر به عنوان رسانه ای برای خلاقیت، ارتباطات، حل مسئله و سرگرمی درگیر شوند.
            
            **علاقه مند به آموزش اکتشافات CS هستید؟** توسعه حرفه ای برای کمک به شما در شروع آموزش اکتشافات CS در دسترس است. [اینجا کلیک کنید][0] برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه خود یا [اینجا را کلیک کنید][1] برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام.
          description_teacher: |-
            اکتشافات علوم کامپیوتر (CS Discoveries) یک دوره مقدماتی علوم کامپیوتر است که دانش آموزان را قادر می سازد تا مصنوعات معتبر ایجاد کنند و با علوم کامپیوتر به عنوان رسانه ای برای خلاقیت، ارتباطات، حل مسئله و سرگرمی درگیر شوند.
            
            **آیا می دانستید؟**
            
            - توسعه حرفه ای برای کمک به شما در شروع آموزش CS Discoveries در دسترس است. [اینجا کلیک کنید][0] برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه خود یا [اینجا را کلیک کنید][1] برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام.
            
            - این دوره ماژولار است و می تواند در پیکربندی های مختلف بر اساس نیاز هر کلاس درس تدریس شود. برای آشنایی با گزینه های مختلف، Guide_ پیاده سازی _CSD را در منوی منابع معلم زیر بررسی کنید
            
            - می توانید منابع _Curriculum Guide_، _Getting Guide_ شروع شده، _Guide به Assessment_ و بسیاری از منابع دیگر را برای کمک به اجرای این برنامه درسی در منوی منابع معلم زیر بیابید
