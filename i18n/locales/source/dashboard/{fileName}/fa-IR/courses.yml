            تمرکز بر طراحی با هدف مجموعه ای از واحدهای اکتشافات علوم کامپیوتر (CS Discoveries) است که به دانش آموزان این امکان را می دهد تا در حین طراحی وب سایت ها و برنامه ها برای دستگاه ها در مورد نیازهای کاربران فکر کنند. دانش آموزان مصنوعات معتبری ایجاد می کنند و با علوم کامپیوتر به عنوان رسانه ای برای خلاقیت، ارتباطات، حل مسئله و سرگرمی درگیر می شوند.
            
            **علاقه مند به آموزش اکتشافات CS هستید؟** توسعه حرفه ای برای کمک به شما در شروع آموزش اکتشافات CS در دسترس است. [اینجا کلیک کنید][0] برای کسب اطلاعات بیشتر در مورد فرصت های یادگیری حرفه ای در منطقه خود یا [اینجا را کلیک کنید][1] برای کسب اطلاعات بیشتر در مورد یک گزینه آنلاین خودگام.
