          description_short: ''
          description_student: "## خوش آمدید\n\nبه یادگیری آنلاین رایگان Code.org برای مربیان خوش آمدید تا با هوش مصنوعی (AI) و یادگیری ماشین آشنا شوند! پس از تکمیل این تجربه یادگیری حرفه ای، **با مفاهیم اولیه هوش مصنوعی و یادگیری ماشینی راحت خواهید بود**.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمانی که تازه وارد آموزش علوم کامپیوتر و Code.org شده اند سازماندهی شده است. با این حال، می توانید با محتوا به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از نمای کلی صرف نظر کنید. "
