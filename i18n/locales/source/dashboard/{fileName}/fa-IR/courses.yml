          description_student: "## خوش آمدید\n\nبه آموزش آنلاین رایگان Code.org برای مربیان خوش آمدید تا تدریس را با Code.org شروع کنند! پس از تکمیل این تجربه یادگیری حرفه ای، **شما آماده خواهید بود تا آموزش CSD واحد 4 Code.org - فرآیند طراحی** را با دانش آموزان خود شروع کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این تجربه یادگیری خودگام به گونه ای طراحی شده است که به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر درس در نظر گرفته شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوا در پیشرفت پیشنهادی برای معلمان تازه وارد Code.org و CSD واحد 4 - فرآیند طراحی سازماندهی شده است. با این حال، می توانید به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، با محتوا درگیر شوید.** اگر قبلا با پلتفرم Code.org آشنا هستید، ممکن است از شروع کار با Code.org صرف نظر کنید و مستقیما به سراغ آماده شدن برای آموزش حل مسئله و محاسبات بروید. "
