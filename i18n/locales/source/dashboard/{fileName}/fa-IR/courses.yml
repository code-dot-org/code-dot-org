        self-paced-pl-ai-101-2024:
          title: AI 101 یادگیری حرفه ای خودگام برای مربیان
          description_short: ''
          description_student: "## خوش آمدید!\n\nبه دوره آنلاین خودگام Code.org برای مربیان خوش آمدید تا با هوش مصنوعی شروع کنند.\n\nاین یک مجموعه یادگیری آنلاین رایگان و اساسی برای هر معلم یا مربی علاقه مند به دنیای پیشگامانه هوش مصنوعی (AI) و پتانسیل تحول آفرین آن در آموزش است.\n\nدر این مجموعه پنج قسمتی، هوش مصنوعی را ابهام زدایی می کنیم، پیاده سازی مسئولانه را بررسی می کنیم، به سوگیری می پردازیم و نشان می دهیم که چگونه یادگیری مبتنی بر هوش مصنوعی می تواند نتایج دانش آموزان را متحول کند.\n\nدر این سفر اکتشاف و توانمندسازی به ما بپیوندید و آینده آموزش با هوش مصنوعی و در مورد آن را باز کنید.\n\n### یادگیری را پیدا کنید که برای شما مفید است\n\n- **با سرعت خود پیش بروید:** این دوره خودگام به گونه ای طراحی شده است که شما را در صندلی راننده قرار دهد و به شما کنترل یادگیری خود را بدهد. زمان های پیشنهادی برای هر ماژول و درس داده شده است.  با این حال، ما شما را تشویق می کنیم که **با سرعت خود با محتوا درگیر شوید.**\n\n- **محتوای خود را انتخاب کنید:** محتوای این دوره یادگیری حرفه ای در پیشرفت پیشنهادی برای معلمان تازه وارد هوش مصنوعی سازماندهی شده است. با این حال، شما می توانید **با محتوا به ترتیبی که به بهترین وجه نیازهای شما را برآورده می کند، درگیر شوید.**"
