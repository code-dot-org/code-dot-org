          description_student: "## 환영합니다\n\nCode.org의 교육자들을 위한 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 **당신은 학생들과 함께 Code.org의 Computer Vision Unit**을 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: ** 컨텐츠는 Code.org 및 Computer Vision 모두에 새로운 교사들에게 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 **자신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 컴퓨터 비전을 가르치는 준비로 바로 이동할 수 있습니다."
