        exploring-gen-ai-2024:
          title: 생성 AI 탐색
          description_short: '생성 AI의 기본 사항: AI가 작동하는 방법과 생성 AI를 사용하는 방법. '
          description_student: AI가 어떻게 작동하는지 및 어떻게 사용되는지 알아보기 Generative AI
          description_teacher: "Generative AI 를 탐구하는 것은 AI가 작동하는 방법과 Generative AI를 사용하는 방법을 탐구하는 2 단위 교육 과정입니다. 학생들은 학생 중심의 활동과 수업 토론을 통해 생성 인공지능의 블랙박스를 풀어내는 실용적인 활동에 참여하며, 광범위한 관객을 위해 생성 인공지능을 해독하는 비디오 시리즈에 의해 조정됩니다. 견고한 기초를 갖춘 학생들은 새로운 AI 채팅 실험실을 사용하여 언어 모델을 사용자 정의하는 방법을 배웁니다. 이 실험실은 학생들에게 언어 모델을 선택하고, 시스템 메모를 적용하고, 채팅 봇을 사용자 정의하기 위해 검색 정보를 조정할 수 있는 도구를 제공합니다. 학생들은 다양한 문제를 해결하기 위해 채팅봇을 만들고 대답의 유효성과 사회에서 채팅봇의 적절한 사용을 조사합니다."
          version_title: "'24-'25"
