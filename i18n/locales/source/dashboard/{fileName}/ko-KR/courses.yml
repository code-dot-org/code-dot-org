        data-science-2024:
          title: "[PILOT] 데이터 과학"
          description_short: 데이터 시각화 도구를 사용하여 데이터 과학의 세계를 탐험하여 실제 현상을 분석하고 해석하십시오.
          description_student: "이 데이터 과학 교육 과정은 학생들에게 기본적인 데이터 과학 원칙과 기술을 소개합니다. 학생들은 효과적인 데이터 질문을하고, 데이터 세트를 수집하고 청소하고, CODAP (Unit 1) 및 Python (Unit 2)와 같은 도구를 사용하여 매력적인 시각화를 만드는 방법을 배우게됩니다. 학생들은 프로그래밍과 분석 기술을 실제 데이터 세트에 적용하여 그룹화, 필터링 및 통계적 계산과 같은 필수 데이터 분석 기술에 대한 경험을 얻습니다. 이 커리큘럼은 윤리적 데이터 관행, 데이터 스토리텔링, 복잡한 데이터 세트에서 실행 가능한 통찰력을 창출하는 중요성을 강조하는 프로젝트로 끝납니다."
          description_teacher: "데이터 과학은 학생들의 데이터 분석 및 시각화에 대한 강력한 기초를 구축하여 Unit 1에서 CODAP 및 Unit 2에서 Python와 같은 프로그래밍 도구를 사용하여 분석 기술을 심화시킵니다. 구조화된 수업과 프로젝트를 통해 학생들은 데이터 과학 도구를 사용하여 원시 데이터를 의미있는 시각화로 변환하는 방법을 배웁니다. 이 단위는 윤리적 고려 사항을 강조하며, 데이터 기반 의사 결정의 데이터 개인정보 보호, 편견 및 사회적 영향에 초점을 맞춘 토론과 활동을 통해 학생들을 안내합니다. 각 단위가 끝나면 학생들은 포괄적인 데이터 기반 접근 방식을 사용하여 실제 문제를 조사하고 해결할 준비가되어 있으며, 설득력있는 데이터 스토리를 만드는 능력을 보여주는 프로젝트로 끝납니다."
          version_title: "'24-'25"
