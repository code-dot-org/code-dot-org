        csd-2024:
          title: "컴퓨터 과학 발견 ('24-'25)"
          description_short: 학생들이 진짜 유물을 만들 수 있도록 돕는 소개 컴퓨터 과학 과정
          description_student: "Computer Science Discoveries(CS Discoveries)는 초보적인 컴퓨터 과학 과정으로, 컴퓨터 과학을 창조하고 창의성, 커뮤니케이션, 문제 해결 및 재미를 위한 매체로 참여할 수 있도록 지원합니다."
          description_teacher: |-
            Computer Science Discoveries(CS Discoveries)는 학생들이 창의력, 커뮤니케이션, 문제 해결 및 재미를위한 매체로서 컴퓨터 과학을 사용하여 진정한 유물을 만들 수 있도록 지원하는 소개 컴퓨터 과학 과정입니다.
            
            **당신은 알고 있나요?**
            
            - CS Discoveries를 가르치는 데 도움이 될 수있는 전문 개발. [여기를 클릭][0] 귀하의 지역에서 전문 학습 기회에 대한 자세한 내용을 배우거나 [여기를 클릭] [1] 자발적인 온라인 옵션에 대한 자세한 내용을 알아보십시오.
            
            - 이 과정은 유연한 구현을 가지고 있으며 각 교실의 필요에 따라 다른 구성으로 가르칠 수 있습니다. 자세한 내용은 [CSD Implementation Guide][2] 을 참조하십시오.
            
            - [Course Syllabus][3] 및 [Getting Started Guide][4]에 액세스하여 코스에 대해 자세히 알아보고 시작하십시오.
          version_title: "'24-'25"
