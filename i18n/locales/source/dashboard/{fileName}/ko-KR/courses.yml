          title: K-5 교사용 컴퓨터 과학 기초
          description_short: ''
          description_student: ''
          description_teacher: "## 환영합니다\n\n교육자들을 위한 Code.org의 무료 자발적인 온라인 학습 프로그램에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후, **당신은 기본적인 K-5 등급 코딩 개념을 편안하게 사용할 수 있습니다**.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: ** 컨텐츠는 컴퓨터 과학 및 Code.org을 가르치는 새로운 교사들에게 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 개요를 건너 선택할 수 있습니다. "
          version_title: ''
        csp-2024:
          title: "컴퓨터 과학 원칙 '24-'25"
          description_short: 기본적인 컴퓨터 과학 개념을 배우십시오.
          description_student: CSP는 학생들에게 컴퓨터 과학의 기본 개념을 소개하고 컴퓨터와 기술이 어떻게 세계에 영향을 미칠 수 있는지 탐구하도록 도전합니다. AP 프로그램은 AP 컴퓨터 과학 원칙을 설계하여 컴퓨터 과학 분야의 리더를 창출하고 전통적으로 필수적인 컴퓨팅 도구와 다중 분야의 기회로 대표가 부족한 사람들을 끌어들이고 참여하는 것을 목표로합니다.
          description_teacher: |-
            CSP는 학생들에게 컴퓨터 과학의 기본 개념을 소개하고 컴퓨터와 기술이 어떻게 세계에 영향을 미칠 수 있는지 탐구하도록 도전합니다. AP 프로그램은 AP 컴퓨터 과학 원칙을 설계하여 컴퓨터 과학 분야의 리더를 창출하고 전통적으로 필수적인 컴퓨팅 도구와 다중 분야의 기회로 대표가 부족한 사람들을 끌어들이고 참여하는 것을 목표로합니다.
            
            **당신은 알고 있나요?**
            
            - 전문 개발은 CS 원칙을 가르치는 데 도움이됩니다. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">여기를 클릭하십시오</a> 귀하의 지역에서 전문 학습 기회에 대한 자세한 내용을 확인하십시오. 또는 <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">여기를 클릭하십시오</a> 자발적인 온라인 옵션에 대한 자세한 내용을 확인하십시오.
            
            - _Syllabus_, _Course Vocab_ 및 기타 리소스를 아래의 교사 리소스 메뉴에서 구현하는 데 도움이됩니다.
          version_title: "'24-'25"
        self-paced-pl-microbit-2024:
          title: "디바이스로 앱 만들기 가르침 (micro:bit)"
          description_short: ''
          description_student: "## 환영합니다\n\nCode.org의 교육자들을 위한 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 **당신은 Code.org의 CSD Unit 6 - Devices Creating Apps (micro:bit)**을 학생들과 함께 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: ** 코드.오르크 및 Unit 6 - 디바이스로 앱 만들기 (micro:비트)에 새로운 교사에 대한 내용은 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 당신의 필요에 가장 적합한 순서로 콘텐츠를 ** 참여할 수 있습니다. ** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 문제 해결 및 컴퓨팅을 가르치는 준비에 직접 이동할 수 있습니다. "
          description_teacher: "## 환영합니다\n\nCode.org의 교육자들을 위한 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 **당신은 Code.org의 CSD Unit 6 - Devices Creating Apps (micro:bit)**을 학생들과 함께 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: ** 코드.오르크 및 Unit 6 - 디바이스로 앱 만들기 (micro:비트)에 새로운 교사에 대한 내용은 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 당신의 필요에 가장 적합한 순서로 콘텐츠를 ** 참여할 수 있습니다. ** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 문제 해결 및 컴퓨팅을 가르치는 준비에 직접 이동할 수 있습니다. "
