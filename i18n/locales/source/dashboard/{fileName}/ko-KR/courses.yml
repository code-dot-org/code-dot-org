        k5-maker-pilot-2024:
          title: K-5 Maker 자발적인 전문 학습
          description_short: "micro:bit 코스와 CSF Maker에 대한 전문 학습 모듈."
          description_student: "#### 마이크로 비트 과정은 디지털 세계와 물리적 세계 사이의 격차를 덮고 학생들이 컴퓨터 프로그램을 실제 응용 프로그램으로 전송 할 수 있습니다.\n\n#### **이 모듈에서, 당신은:**\n\n- #### 이벤트, 루프, 조건, 변수 및 함수와 같은 기본 코딩 개념을 가르치기 위해 준비하십시오.\n- ##### 하드웨어와 소프트웨어가 어떻게 함께 작동하는지에 대한 실용적인 경험을 얻을 수 있습니다.\n- #### 단위에 포함된 핵심 개념을 연습합니다.\n- #### micro:bit 코스를 사용하여 모든 CS 기본 메이커를 가르치기 위해 준비하십시오.\n\n* 제안된 총 시간: ** 150분\n\n#### **Extra 단계:** 현재 이 유닛을 파일럿으로 실행 중이므로 먼저 파일럿에 등록하여 교육 과정 유닛을 볼 수 있어야 합니다. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\"> 여기서 파일럿에 등록하십시오</a> </strong>"
          description_teacher: "#### 마이크로 비트 과정은 디지털 세계와 물리적 세계 사이의 격차를 덮고 학생들이 컴퓨터 프로그램을 실제 응용 프로그램으로 전송 할 수 있습니다.\n\n#### **이 모듈에서, 당신은:**\n\n- #### 이벤트, 루프, 조건, 변수 및 함수와 같은 기본 코딩 개념을 가르치기 위해 준비하십시오.\n- ##### 하드웨어와 소프트웨어가 어떻게 함께 작동하는지에 대한 실용적인 경험을 얻을 수 있습니다.\n- #### 단위에 포함된 핵심 개념을 연습합니다.\n- #### micro:bit 코스를 사용하여 모든 CS 기본 메이커를 가르치기 위해 준비하십시오.\n\n* 제안된 총 시간: ** 150분\n\n#### **Extra 단계:** 현재 이 유닛을 파일럿으로 실행 중이므로 먼저 파일럿에 등록하여 교육 과정 유닛을 볼 수 있어야 합니다. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\"> 여기서 파일럿에 등록하십시오</a> </strong>"
          version_title: ''
        foundations-of-cs-beta-2024:
          title: 컴퓨터 과학의 기초 BETA
          description_short: ''
          description_student: |-
            컴퓨터 과학의 기초에 오신 것을 환영합니다! 이 흥미로운 과정은 컴퓨터 과학의 강력한 세계로 당신의 게이트웨이입니다. 앱이 어떻게 작동하는지 궁금하거나 기술이 사회에 미치는 영향에 대해 더 많이 알고 싶다면이 과정은 당신을 위해 뭔가가 있습니다. 학기 동안 프로그래밍의 기초를 배우고 인터넷이 어떻게 작동하는지, 심지어 실제 문제를 해결할 수있는 자신의 프로젝트를 만들 수 있습니다.
            
            ⚡️ ** 참고:** 이것은 기본 CS 교육 과정의 베타 버전이며, 기본적으로 기존 컴퓨터 과학 발견 및 컴퓨터 과학 원칙 교육 과정의 내용으로 구성됩니다. 따라서 활동 가이드, 리소스 및 슬라이드 데크에 CSD 및 CSP 레이블이 표시됩니다. 이것은 교육 과정의 최종 버전에서 발생하지 않을 것입니다!
          description_teacher: "컴퓨터 과학의 기초 (FCS) 과정은 컴퓨터 과학의 광범위한 분야에 대한 포괄적인 소개입니다. 고등학생을 위해 설계된 이 과정은 기본 개념과 실용적인 경험을 통합하여 컴퓨팅, 기능 및 영향에 대한 깊은 이해를 촉진합니다. 이 교육 과정은 국가 요구 사항과 CSTA 표준과 일치하여 컴퓨터 과학에 대한 견고한 기초를 제공하여 학생들이 기술 분야에서 계속 공부하고 미래의 경력을 쌓을 수 있도록 구성되어 있습니다."
          version_title: "'24-'25"
        self-paced-pl-csd-2024:
          title: CS Discoveries 교육
          description_short: ''
          description_student: "## 환영합니다\n\n교육자들을 위한 Code.org의 무료 자발적인 온라인 코스에 오신 것을 환영합니다! 이 온라인 코스를 마친 후 **당신은 Code.org의 컴퓨터 과학 발견 과정**을 학생들과 함께 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동하십시오: **이 자체 속도 과정은 운전자의 자리에 당신을 넣을 수 있도록 설계되었으며, 자신의 학습을 통제 할 수 있습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하세요: ** 이 전문 학습 과정의 컨텐츠는 Code.org 및 CS Discoveries에 새로운 교사들에게 제안된 진행 과정으로 구성되어 있습니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠를 참여할 수 있습니다.** 우리는 모든 교사 **가장 짧은 환영 단위 **로 시작하는 것을 권장합니다."
