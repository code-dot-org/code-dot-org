        pl-csd-summer-2023:
          title: CSD In-Person PL 워크샵
          description_short: ''
          description_student: "**당신은:**\n\n- CS Discoveries를 가르치기 위해 준비하십시오.\n- CS Discoveries 교육 과정에서 핵심 개념을 연습하십시오.\n- 공정한 CS 교육에 대한 이해를 성장. \n- 학생 경험에 대한 공감력을 개발합니다. \n- 비슷한 작업을 수행하는 교사의 네트워크의 일부가됩니다."
