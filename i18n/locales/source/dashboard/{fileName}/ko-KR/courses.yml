        self-paced-pl-csp-2023:
          title: CS 원칙 가르침
          description_short: ''
          description_student: "## 환영합니다\n\n##### 교육자가 CS 원칙을 가르치기 시작할 수 있도록 Code.org의 무료 자발적인 온라인 모듈에 오신 것을 환영합니다! 이 온라인 모듈을 완료하면 Code.org의 컴퓨터 과학 원칙 과정을 학생들과 함께 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n##### **자신의 속도로 가라**: 이 자체 속도 모듈은 운전자의 좌석에 당신을 넣고 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n\n### 당신의 콘텐츠를 선택\n\n##### 이러한 전문 학습 모듈의 내용은 Code.org 및 CS 원칙 모두에 새로운 교사에 대한 제안 진행으로 구성됩니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다. 우리는 모든 교사가 시작하기 전에 이러한 전문 학습 모듈에 대한 자세한 내용을 배우기 위해 짧은 환영 단위로 시작하는 것을 권장합니다."
          description_teacher: "## 환영합니다\n\n##### 교육자가 CS 원칙을 가르치기 시작할 수 있도록 Code.org의 무료 자발적인 온라인 모듈에 오신 것을 환영합니다! 이 온라인 모듈을 완료하면 Code.org의 컴퓨터 과학 원칙 과정을 학생들과 함께 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n##### **자신의 속도로 가라**: 이 자체 속도 모듈은 운전자의 좌석에 당신을 넣고 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n\n### 당신의 콘텐츠를 선택\n\n##### 이러한 전문 학습 모듈의 내용은 Code.org 및 CS 원칙 모두에 새로운 교사에 대한 제안 진행으로 구성됩니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다. 우리는 모든 교사가 시작하기 전에 이러한 전문 학습 모듈에 대한 자세한 내용을 배우기 위해 짧은 환영 단위로 시작하는 것을 권장합니다."
          version_title: 22-23
