        csp-2022:
          title: "컴퓨터 과학 원칙 ('22-'23)"
          description_short: 기본적인 컴퓨터 과학 개념을 배우십시오.
          description_student: CSP는 학생들에게 컴퓨터 과학의 기본 개념을 소개하고 컴퓨터와 기술이 어떻게 세계에 영향을 미칠 수 있는지 탐구하도록 도전합니다. AP 프로그램은 AP 컴퓨터 과학 원칙을 설계하여 컴퓨터 과학 분야의 리더를 창출하고 전통적으로 필수적인 컴퓨팅 도구와 다중 분야의 기회로 대표가 부족한 사람들을 끌어들이고 참여하는 것을 목표로합니다.
          description_teacher: |-
            CSP는 학생들에게 컴퓨터 과학의 기본 개념을 소개하고 컴퓨터와 기술이 어떻게 세계에 영향을 미칠 수 있는지 탐구하도록 도전합니다. AP 프로그램은 AP 컴퓨터 과학 원칙을 설계하여 컴퓨터 과학 분야의 리더를 창출하고 전통적으로 필수적인 컴퓨팅 도구와 다중 분야의 기회로 대표가 부족한 사람들을 끌어들이고 참여하는 것을 목표로합니다.
            
            **당신은 알고 있나요?**
            
            - 전문 개발은 CS 원칙을 가르치는 데 도움이됩니다. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">여기를 클릭하십시오</a> 귀하의 지역에서 전문 학습 기회에 대한 자세한 내용을 확인하십시오. 또는 <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">여기를 클릭하십시오</a> 자발적인 온라인 옵션에 대한 자세한 내용을 확인하십시오.
            
            - _Curriculum Guide_, _Course Vocab_ 및 기타 리소스를 아래의 교사 리소스 메뉴에서 구현하는 데 도움이됩니다.
          version_title: "'22-'23"
        csa-2022:
          title: "컴퓨터 과학 A ('22-'23)"
          description_short: Java 프로그래밍 및 소프트웨어 엔지니어링 기술을 배우십시오.
          description_student: "컴퓨터 과학 A(CSA)는 학생들에게 Java 프로그래밍 언어를 사용하여 소프트웨어 엔지니어링과 객체 지향 프로그래밍과 디자인을 소개합니다. 이 커리큘럼은 문제에 대한 해결책의 설계, 데이터 구조를 사용하여 큰 데이터 세트를 조직하는, 데이터를 처리하고 새로운 정보를 발견하기위한 알고리즘의 개발 및 구현, 잠재적 인 해결책의 분석, 컴퓨터 시스템의 윤리적 및 사회적 영향을 포함하여 다양한 주제를 다룹니다."
          description_teacher: |-
            컴퓨터 과학 A(CSA)는 학생들에게 Java 프로그래밍 언어를 사용하여 소프트웨어 엔지니어링과 객체 지향 프로그래밍과 디자인을 소개합니다. 이 커리큘럼은 문제에 대한 해결책의 설계, 데이터 구조를 사용하여 큰 데이터 세트를 조직하는, 데이터를 처리하고 새로운 정보를 발견하기위한 알고리즘의 개발 및 구현, 잠재적 인 해결책의 분석, 컴퓨터 시스템의 윤리적 및 사회적 영향을 포함하여 다양한 주제를 다룹니다.
            
            **당신은 알고 있나요?**
            
            - 전문 개발은 CSA 가르침을 시작하는 데 도움이됩니다. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">여기를 클릭하십시오</a> 귀하의 지역에서 전문 학습 기회에 대한 자세한 내용을 알아보십시오.
            
