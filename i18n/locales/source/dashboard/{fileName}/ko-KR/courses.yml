          title: AI 101 교육자를 위한 자발적인 전문 학습
          description_short: ''
          description_student: "## 환영합니다!\n\n교육자들을 위한 Code.org의 자발적인 온라인 코스에 오신 것을 환영합니다.\n\n이 무료, 기본 온라인 학습 시리즈는 인공 지능 (AI)의 획기적인 세계와 교육의 변혁 잠재력에 관심이있는 모든 교사 또는 교육자를위한 것입니다.\n\n이 다섯 부분의 시리즈에서는 AI를 비밀화하고, 책임감 있는 구현을 탐구하고, 편견을 해결하며, AI 기반의 학습이 학생들의 결과를 어떻게 혁신시킬 수 있는지 보여줍니다.\n\n이 탐험과 권한 부여의 여정에 참여하고 AI와 관련된 교육의 미래를 열어보세요.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동하십시오: **이 자체 속도 과정은 운전자의 자리에 당신을 넣을 수 있도록 설계되었으며, 자신의 학습을 통제 할 수 있습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: **이 전문 학습 과정의 내용은 AI에 새로운 교사에게 제안된 진행 방식으로 구성됩니다. 그러나 **자신의 요구에 가장 적합한 순서로 콘텐츠를 참여할 수 있습니다.**"
          description_teacher: "## 환영합니다!\n\n교육자들을 위한 Code.org의 자발적인 온라인 코스에 오신 것을 환영합니다.\n\n이 무료, 기본 온라인 학습 시리즈는 인공 지능 (AI)의 획기적인 세계와 교육의 변혁 잠재력에 관심이있는 모든 교사 또는 교육자를위한 것입니다.\n\n이 다섯 부분의 시리즈에서는 AI를 비밀화하고, 책임감 있는 구현을 탐구하고, 편견을 해결하며, AI 기반의 학습이 학생들의 결과를 어떻게 혁신시킬 수 있는지 보여줍니다.\n\n이 탐험과 권한 부여의 여정에 참여하고 AI와 관련된 교육의 미래를 열어보세요.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동하십시오: **이 자체 속도 과정은 운전자의 자리에 당신을 넣을 수 있도록 설계되었으며, 자신의 학습을 통제 할 수 있습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: **이 전문 학습 과정의 내용은 AI에 새로운 교사에게 제안된 진행 방식으로 구성됩니다. 그러나 **자신의 요구에 가장 적합한 순서로 콘텐츠를 참여할 수 있습니다.**"
