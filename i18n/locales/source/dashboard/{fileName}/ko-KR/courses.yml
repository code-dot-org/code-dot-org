        self-paced-pl-equitymodule-2024:
          title: Code.org 의 컴퓨터 과학 공정
          description_short: ''
          description_student: "##### 안녕하세요! 이 K-12 일반적인 교육 과정은 컴퓨터 과학에서 공정의 기본 개념과 구체적인 적용에 초점을 맞추고 있습니다. 당신은 이 과정에 참여하기 위해 사전 조건의 자산이나 컴퓨터 과학 지식을 필요로하지 않습니다. 우리는 모든 수업 수준과 교육 환경에서 성인 학습자를 환영하여 평등을 지향하는 교육자들의 커뮤니티에 참여합니다.\n\n* * *\n\n##### ** 당신을 위해 일하는 학습을 찾으십시오:**\n\n- ##### **자신의 속도로 이동: **이 자체 속도 과정은 운전자의 좌석에 당신을 넣어, 당신이 당신의 학습을 통제 할 수 있도록 설계되었습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n\n- ##### **당신의 내용을 선택하십시오: **이 전문 학습 과정의 내용은 컴퓨터 과학에서 공정에 새로운 교사에 대한 제안 된 진행으로 구성됩니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다."
          description_teacher: "##### 안녕하세요! 이 K-12 일반적인 교육 과정은 컴퓨터 과학에서 공정의 기본 개념과 구체적인 적용에 초점을 맞추고 있습니다. 당신은 이 과정에 참여하기 위해 사전 조건의 자산이나 컴퓨터 과학 지식을 필요로하지 않습니다. 우리는 모든 수업 수준과 교육 환경에서 성인 학습자를 환영하여 평등을 지향하는 교육자들의 커뮤니티에 참여합니다.\n\n* * *\n\n##### ** 당신을 위해 일하는 학습을 찾으십시오:**\n\n- ##### **자신의 속도로 이동: **이 자체 속도 과정은 운전자의 좌석에 당신을 넣어, 당신이 당신의 학습을 통제 할 수 있도록 설계되었습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n\n- ##### **당신의 내용을 선택하십시오: **이 전문 학습 과정의 내용은 컴퓨터 과학에서 공정에 새로운 교사에 대한 제안 된 진행으로 구성됩니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다."
