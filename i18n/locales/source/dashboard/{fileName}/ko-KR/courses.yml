        self-paced-pl-physical-computing-2022:
          title: 디바이스로 애플리케이션 제작을 가르치기 (Circuit Playground)
          description_short: ''
          description_student: "## 환영합니다\n\nCode.org의 교육자들을 위한 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 **당신은 학생들과 함께 Code.org의 Devices Creating Apps Unit**을 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠 선택: ** 컨텐츠는 Code.org 및 Creating Apps with Devices 단위에 새로운 교사들에게 제안된 진행 과정으로 구성됩니다. 그러나, 당신은 당신의 필요에 가장 적합한 순서로 콘텐츠를 ** 참여할 수 있습니다. ** 당신은 이미 Code.org 플랫폼에 익숙한 경우, 당신은 Code.org의 시작을 벗어나 디바이스로 앱을 만드는 교육을 준비 바로 이동할 수 있습니다. "
          description_teacher: "## 환영합니다\n\nCode.org의 교육자들을 위한 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 **당신은 학생들과 함께 Code.org의 Devices Creating Apps Unit**을 가르치기 시작할 준비가 되어 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠 선택: ** 컨텐츠는 Code.org 및 Creating Apps with Devices 단위에 새로운 교사들에게 제안된 진행 과정으로 구성됩니다. 그러나, 당신은 당신의 필요에 가장 적합한 순서로 콘텐츠를 ** 참여할 수 있습니다. ** 당신은 이미 Code.org 플랫폼에 익숙한 경우, 당신은 Code.org의 시작을 벗어나 디바이스로 앱을 만드는 교육을 준비 바로 이동할 수 있습니다. "
          version_title: "'22 - '23"
        csp-2023:
          title: "컴퓨터 과학 원칙 '23-'24"
          description_short: 기본적인 컴퓨터 과학 개념을 배우십시오.
          description_student: CSP는 학생들에게 컴퓨터 과학의 기본 개념을 소개하고 컴퓨터와 기술이 어떻게 세계에 영향을 미칠 수 있는지 탐구하도록 도전합니다. AP 프로그램은 AP 컴퓨터 과학 원칙을 설계하여 컴퓨터 과학 분야의 리더를 창출하고 전통적으로 필수적인 컴퓨팅 도구와 다중 분야의 기회로 대표가 부족한 사람들을 끌어들이고 참여하는 것을 목표로합니다.
          description_teacher: |-
