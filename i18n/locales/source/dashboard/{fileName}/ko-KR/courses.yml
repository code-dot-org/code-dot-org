        self-paced-foundations-cs-2024:
          title: 컴퓨터 과학의 가르침 기초
          description_short: ''
          description_student: "## 환영합니다!\n\n<a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Foundations of Computer Science**</a>! 이 온라인 코스를 마친 후, 학생들과 함께 Code.org의 **컴퓨터 과학의 기초 ** 코스를 가르치기 시작할 준비가 되었습니다.\n\n### ** 당신을 위해 일하는 학습을 찾으십시오**\n\n- ##### **컴퓨터 과학의 가르침 기초 소개로 시작하십시오: **이 섹션은이 코스를 소개하고 학습 경로를 사용자 정의하는 데 도움이됩니다.\n- ##### **당신의 자신의 속도로 이동: **이 자체 속도 과정은 운전자의 자리에 당신을 넣을 수 있도록 설계되었으며, 당신이 자신의 학습을 통제 할 수 있습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n- ##### ** 컨텐츠를 선택하십시오: **이 전문 학습 과정의 내용은 Code.org 및 컴퓨터 과학의 기초를 모두 새로운 교사에 대한 제안 진행으로 구성되어 있습니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다. 우리는 모든 교사가 시작하기 전에이 전문 학습 과정에 대한 자세한 내용을 배우기 위해 짧은 환영 단위로 시작하는 것을 권장합니다."
          description_teacher: "## 환영합니다!\n\n<a href=\"https://studio.code.org/courses/foundations-of-cs-beta-2024\" target=\"blank\" rel=\"noopener noreferrer\">**Foundations of Computer Science**</a>! 이 온라인 코스를 마친 후, 학생들과 함께 Code.org의 **컴퓨터 과학의 기초 ** 코스를 가르치기 시작할 준비가 되었습니다.\n\n### ** 당신을 위해 일하는 학습을 찾으십시오**\n\n- ##### **컴퓨터 과학의 가르침 기초 소개로 시작하십시오: **이 섹션은이 코스를 소개하고 학습 경로를 사용자 정의하는 데 도움이됩니다.\n- ##### **당신의 자신의 속도로 이동: **이 자체 속도 과정은 운전자의 자리에 당신을 넣을 수 있도록 설계되었으며, 당신이 자신의 학습을 통제 할 수 있습니다. 각 모듈과 수업에 대해 제안된 시간을 제공합니다. 그러나, 우리는 당신이 자신의 속도로 콘텐츠에 참여하도록 권장합니다.\n- ##### ** 컨텐츠를 선택하십시오: **이 전문 학습 과정의 내용은 Code.org 및 컴퓨터 과학의 기초를 모두 새로운 교사에 대한 제안 진행으로 구성되어 있습니다. 그러나, 당신은 당신의 필요를 가장 잘 충족하는 순서로 콘텐츠에 참여할 수 있습니다. 우리는 모든 교사가 시작하기 전에이 전문 학습 과정에 대한 자세한 내용을 배우기 위해 짧은 환영 단위로 시작하는 것을 권장합니다."
