        csd-2023:
          title: "컴퓨터 과학 발견 ('23-'24)"
          description_short: 학생들이 진짜 유물을 만들 수 있도록 돕는 소개 컴퓨터 과학 과정
          description_student: |-
            Computer Science Discoveries(CS Discoveries)는 학생들이 창의력, 커뮤니케이션, 문제 해결 및 재미를위한 매체로서 컴퓨터 과학을 사용하여 진정한 유물을 만들 수 있도록 지원하는 소개 컴퓨터 과학 과정입니다.
            
