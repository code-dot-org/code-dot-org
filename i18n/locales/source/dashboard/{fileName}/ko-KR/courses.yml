          description_short: "## 환영합니다! \n##### 이 전문 학습 모듈은 Code.org의 Exploring Generative AI 코스를 가르치기 위해 준비하도록 설계되었습니다.\n\nGenerative AI 는 8-12 학년 학생들을 위한 독립적인 과목으로 설계되었으며, 기존의 모든 교육 과정에 원활하게 통합되며, 교사들에게 스케줄과 교육 요구에 따라 유연하게 소개할 수 있습니다. \n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n* **자신의 속도로 이동하십시오: **이 자체 속도 학습 경험은 자신의 학습을 통제 할 수 있도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n* ** 컨텐츠 선택: ** 컨텐츠는 Code.org 및 Generative AI 부서에 새로운 교사들에게 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 Exploring Generative AI Unit로 바로 이동할 수 있습니다. "
          description_student: "## 환영합니다!\n\n##### 이 전문 학습 모듈은 Code.org의 Exploring Generative AI 코스를 가르치기 위해 준비하도록 설계되었습니다.\n\nGenerative AI 는 8-12 학년 학생들을 위한 독립적인 과목으로 설계되었으며, 기존의 모든 교육 과정에 원활하게 통합되며, 교사들에게 스케줄과 교육 요구에 따라 유연하게 소개할 수 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하세요: ** 컨텐츠는 Code.org 및 Generative AI 부서에 새로운 교사들에게 제안된 진행 과정으로 구성됩니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 Exploring Generative AI Unit로 바로 이동할 수 있습니다. "
          description_teacher: "## 환영합니다!\n\n##### 이 전문 학습 모듈은 Code.org의 Exploring Generative AI 코스를 가르치기 위해 준비하도록 설계되었습니다.\n\n#### Generative AI 는 8-12 명의 학생들을 위한 독립적 인 과목으로 설계되었으며, 기존의 모든 교육 과정에 원활하게 통합되며 교사들에게 스케줄과 교육 요구에 따라 유연하게 소개할 수 있습니다.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하세요: ** 컨텐츠는 Code.org 및 Generative AI 부서에 새로운 교사들에게 제안된 진행 과정으로 구성됩니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 Code.org의 시작을 벗어나 Exploring Generative AI Unit로 바로 이동할 수 있습니다. "
