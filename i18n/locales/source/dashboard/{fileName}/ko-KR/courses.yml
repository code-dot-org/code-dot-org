        elementaryai-2024:
          title: AI가 결정을 하는 방법을 가르치는 준비
          description_short: ''
          description_student: "## 환영합니다\n\n인공 지능(AI)과 기계 학습을 익히기 위해 교육자들을 위한 Code.org의 무료 자발적인 온라인 학습에 오신 것을 환영합니다! 이 전문적인 학습 경험을 완료한 후 ** 기본 AI 및 기계 학습 개념에 익숙해질 것입니다**.\n\n#### 당신을 위해 작동하는 학습을 찾으십시오\n\n- **당신의 자신의 속도로 이동: **이 자체 속도 학습 경험은 당신이 자신의 학습에 대한 통제를 제공하도록 설계되었습니다. 각 수업에 대한 제안된 시간을 제공합니다.  그러나 우리는 **자신의 속도로 콘텐츠에 참여하도록 권장합니다.**\n\n- ** 컨텐츠를 선택하십시오: ** 컨텐츠는 컴퓨터 과학 및 Code.org을 가르치는 새로운 교사들에게 제안된 진행 방식으로 구성됩니다. 그러나, 당신은 **자신의 요구에 가장 적합한 순서로 콘텐츠에 참여할 수 있습니다.** 당신은 이미 Code.org 플랫폼에 익숙하다면, 당신은 개요를 건너 선택할 수 있습니다. "
