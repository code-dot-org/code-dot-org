        self-paced-pl-equitymodule-2024:
          title: Rovnosť v informatike na Code.org
          description_short: ''
          description_student: "Vitajte! Tento kurz K-12, ktorý nie je viazaný na žiadny konkrétny učebný plán, sa zameriava na základné koncepty a konkrétne aplikácie spravodlivosti v informatike. Na absolvovanie tohto kurzu nepotrebujete predchádzajúce znalosti z ekonómie alebo informatiky. Vítame dospelých študentov zo všetkých ročníkov a vyučovacích kontextov, aby sa pripojili k našej komunite učiteľov zameraných na rovnosť.\n\n* * *\n\nNájdite učenie, ktoré vám vyhovuje:\n\n-   ##### **Choďte vlastným tempom:** Tento kurz s vlastným tempom je navrhnutý tak, aby vás postavil do pozície vodiča a dal vám kontrolu nad vaším učením. Navrhnuté časy sú poskytnuté pre každý modul a lekciu. Odporúčame vám, aby ste sa zapojili do obsahu vlastným tempom.\n\n##### **Vyberte si svoj obsah:** Obsah tohto profesionálneho vzdelávacieho kurzu je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v oblasti rovnosti v informatike. Môžete sa však zapojiť do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám."
