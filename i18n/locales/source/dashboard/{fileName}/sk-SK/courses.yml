        self-paced-pl-csp-2021:
          title: Učenie základov informatiky
          description_short: ''
          description_student: "## Vitajte\n\n##### Vitajte na bezplatných online moduloch Code.org, ktoré si môžete študovať vlastným tempom, aby ste začali učiť zásady počítačovej vedy! Po dokončení týchto online modulov budete pripravení začať učiť kurz Princípy počítačovej vedy od Code.org so svojimi študentmi.\n\nNájdite učenie, ktoré vám vyhovuje\n\nChoďte vlastným tempom Tieto samostatne riadené moduly sú navrhnuté tak, aby vás postavili do pozície vodiča a dali vám kontrolu nad vlastným učením. Navrhnuté časy sú uvedené pre každý modul a lekciu. Odporúčame vám, aby ste sa zapojili do obsahu vlastným tempom.\n\nVyberte si svoj obsah\n\nObsah týchto profesionálnych vzdelávacích modulov je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a CS Principles. Môžete sa však zapojiť do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám. Odporúčame všetkým učiteľom, aby začali s krátkou úvodnou jednotkou, aby sa dozvedeli viac o týchto profesionálnych vzdelávacích moduloch predtým, ako začnú."
