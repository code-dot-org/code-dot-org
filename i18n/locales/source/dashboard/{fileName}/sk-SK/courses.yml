          title: "Objavy v informatike ('22-'23)"
          description_short: "Úvodný kurz informatiky, ktorý umožňuje študentom vytvárať autentické artefakty."
          description_student: |-
            Objavy počítačovej vedy (CS Discoveries) sú úvodným kurzom počítačovej vedy, ktorý umožňuje študentom vytvárať autentické artefakty a zapájať sa do počítačovej vedy ako prostriedku na kreativitu, komunikáciu, riešenie problémov a zábavu.
            
            **Zaujíma vás vyučovanie CS Discoveries?** Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CS Discoveries. [Kliknite sem][0] a dozviete sa viac o profesionálnych vzdelávacích príležitostiach vo vašej oblasti alebo [kliknite sem][1] a dozviete sa viac o možnosti online vzdelávania vlastným tempom.
          description_teacher: |-
            Objavy počítačovej vedy (CS Discoveries) sú úvodným kurzom počítačovej vedy, ktorý umožňuje študentom vytvárať autentické artefakty a zapájať sa do počítačovej vedy ako prostriedku na kreativitu, komunikáciu, riešenie problémov a zábavu.
            
            Vedeli ste?
            
            Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CS Discoveries. [Kliknite sem][0] a dozviete sa viac o príležitostiach profesionálneho vzdelávania vo vašej oblasti alebo [kliknite sem][1] a dozviete sa viac o možnosti samostatného online vzdelávania.
            
            Tento kurz má flexibilnú implementáciu a môže sa vyučovať v rôznych konfiguráciách na základe potrieb každej triedy. Pozrite si [CSD Implementation Guide][2] pre viac informácií
            
