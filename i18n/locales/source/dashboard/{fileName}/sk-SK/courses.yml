        k5-maker-pilot-2024:
          title: K-5 Maker Samostatné profesionálne vzdelávanie
          description_short: "Profesionálny vzdelávací modul pre kurz CSF Maker s micro:bit."
          description_student: "Kurz micro:bit prekonáva priepasť medzi digitálnym a fyzickým svetom a umožňuje študentom prenášať svoje počítačové programy do reálnych aplikácií.\n\nV tomto module budete:\n\n#### Pripravte sa na vyučovanie základných konceptov programovania, ako sú udalosti, cykly, podmienky, premenné a funkcie.\nZískajte praktické skúsenosti v tom, ako môžu hardvér a softvér spolupracovať.\n#### Precvičte kľúčové koncepty zahrnuté v jednotke.\n#### Pripravte sa učiť akýkoľvek z kurzov CS Fundamentals Maker s micro:bit.\n\nNavrhovaný celkový čas: 150 minút\n\n#### **Extra krok:** Pretože momentálne testujeme túto jednotku, najprv sa musíte zaregistrovať do pilotného programu, aby ste videli učebné jednotky. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Kliknite sem, aby ste sa zaregistrovali do pilotného programu</a> </strong>"
          description_teacher: "Kurz micro:bit prekonáva priepasť medzi digitálnym a fyzickým svetom a umožňuje študentom prenášať svoje počítačové programy do reálnych aplikácií.\n\nV tomto module budete:\n\n#### Pripravte sa na vyučovanie základných konceptov programovania, ako sú udalosti, cykly, podmienky, premenné a funkcie.\nZískajte praktické skúsenosti v tom, ako môžu hardvér a softvér spolupracovať.\n#### Precvičte kľúčové koncepty zahrnuté v jednotke.\n#### Pripravte sa učiť akýkoľvek z kurzov CS Fundamentals Maker s micro:bit.\n\nNavrhovaný celkový čas: 150 minút\n\n#### **Extra krok:** Pretože momentálne testujeme túto jednotku, najprv sa musíte zaregistrovať do pilotného programu, aby ste videli učebné jednotky. <strong><a href=\"http://studio.code.org/experiments/set_single_user_experiment/csf-maker-pilot\" target=\"blank\" rel=\"noopener noreferrer\">Kliknite sem, aby ste sa zaregistrovali do pilotného programu</a> </strong>"
          version_title: ''
        foundations-of-cs-beta-2024:
          title: Základy počítačovej vedy BETA
          description_short: ''
          description_student: |-
            Vitajte na základoch informatiky! Tento vzrušujúci kurz je vašou bránou do mocného sveta informatiky. Či už vás zaujíma, ako aplikácie fungujú, alebo chcete vedieť viac o vplyve technológie na spoločnosť, tento kurz má niečo pre vás. Počas semestra sa naučíte základy programovania, ponoríte sa do toho, ako funguje internet, a dokonca vytvoríte vlastné projekty, ktoré by mohli riešiť problémy v reálnom svete.
            
            ⚠️ **Poznámka:** Toto je beta verzia osnovy pre základy informatiky, ktorá sa primárne skladá z obsahu našich existujúcich osnov pre objavovanie informatiky a princípy informatiky. Ako také, uvidíte štítky CSD a CSP na sprievodcoch aktivít, zdrojoch a prezentáciách. Toto nebude platiť v konečnej verzii učebného plánu!
          description_teacher: "Základy informatiky (FCS) je komplexný úvod do rozsiahlej oblasti informatiky. Navrhnutý pre študentov stredných škôl, tento kurz integruje základné koncepty s praktickými skúsenosťami, aby podporil hlboké porozumenie počítačom, ich schopnostiam a ich dopadom. Študijný plán je štruktúrovaný tak, aby bol v súlade s požiadavkami štátu a štandardmi CSTA, a poskytuje pevný základ v informatike, ktorý pripravuje študentov na ďalšie štúdium a budúce kariéry v technológii."
          version_title: "'24-'25"
        self-paced-pl-csd-2024:
          title: Učenie CS Objavov
          description_short: ''
          description_student: "## Vitajte\n\nVitajte na bezplatnom online kurze Code.org pre učiteľov, ktorý si môžete študovať vlastným tempom a začať učiť CS Discoveries! Po dokončení tohto online kurzu **budete pripravení začať učiť kurz Počítačové vedy Discoveries od Code.org** so svojimi študentmi.\n\nNájdite učenie, ktoré vám vyhovuje\n\n-   **Choď vlastným tempom:** Tento kurz s vlastným tempom je navrhnutý tak, aby ťa postavil do pozície vodiča a dal ti kontrolu nad tvojím vlastným učením. Navrhnuté časy sú uvedené pre každý modul a lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n-   **Vyberte si svoj obsah:** Obsah tohto profesionálneho vzdelávacieho kurzu je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a CS Discoveries. Avšak môžete **interagovať s obsahom v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Odporúčame všetkým učiteľom, aby **začali s krátkou úvodnou jednotkou** a dozvedeli sa viac o tomto profesionálnom vzdelávacom kurze predtým, ako začnú."
