        self-paced-pl-ai-101-2024:
          title: AI 101 Samostatné profesionálne vzdelávanie pre pedagógov
          description_short: ''
          description_student: "## Vitajte!\n\nVitajte na samoštudijnom online kurze Code.org pre pedagógov, ktorí sa chcú začať zaoberať umelou inteligenciou.\n\nToto je bezplatná, základná online vzdelávacia séria pre každého učiteľa alebo vzdelávateľa, ktorý má záujem o prelomový svet umelej inteligencie (AI) a jej transformačný potenciál vo vzdelávaní.\n\nV tejto päťdielnej sérii demystifikujeme AI, preskúmame zodpovednú implementáciu, zaoberáme sa predsudkami a predvedieme, ako môže učenie poháňané AI revolučne zmeniť výsledky študentov.\n\nPridajte sa k nám na tejto ceste objavovania a posilňovania a odomknite budúcnosť vyučovania s umelou inteligenciou a o nej.\n\nNájdite učenie, ktoré vám vyhovuje\n\n-   **Choď vlastným tempom:** Tento kurz s vlastným tempom je navrhnutý tak, aby ťa postavil do pozície vodiča a dal ti kontrolu nad tvojím vlastným učením. Navrhnuté časy sú uvedené pre každý modul a lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n-   **Vyberte si svoj obsah:** Obsah tohto profesionálneho vzdelávacieho kurzu je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v oblasti AI. Môžete sa však **zapájať do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám.**"
