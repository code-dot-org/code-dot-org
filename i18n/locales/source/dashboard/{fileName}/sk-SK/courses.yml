          description_short: ''
          description_student: "## Vitajte\n\nVitajte na bezplatnom online vzdelávaní Code.org, ktoré si môžete prispôsobiť vlastnému tempu, pre pedagógov, ktorí sa chcú začať učiť s Code.org! Po dokončení tejto profesionálnej vzdelávacej skúsenosti, **budete pripravení začať učiť jednotku Kódovania s AI od Code.org** so svojimi študentmi.\n\nNájdite učenie, ktoré vám vyhovuje\n\n#### **Choďte vlastným tempom:** Táto samostatná vzdelávacia skúsenosť je navrhnutá tak, aby vám poskytla kontrolu nad vaším vlastným učením. Navrhnuté časy sú uvedené pre každú lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n#### **Vyberte si svoj obsah:** Obsah je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a programovaní s AI. Môžete sa však **zapájať do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Ak ste už oboznámení s platformou Code.org, môžete sa rozhodnúť preskočiť Úvod do Code.org a prejsť priamo na Prípravu na vyučovanie programovania s AI."
