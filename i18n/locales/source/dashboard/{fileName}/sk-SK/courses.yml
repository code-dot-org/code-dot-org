          description_student: "V roku 2016 spustila College Board svoj najnovší kurz AP®, AP Zásady počítačovej vedy. Pre školský rok 2020-21 vykonali významné aktualizácie rámca kurzu. CSP zoznamuje študentov so základnými konceptmi informatiky a vyzýva ich, aby preskúmali, ako môže počítačová technika a technológia ovplyvniť svet. Program AP navrhol AP Princípy počítačovej vedy s cieľom vytvoriť lídrov v oblastiach počítačovej vedy a prilákať a zapojiť tých, ktorí sú tradične nedostatočne zastúpení, s nevyhnutnými počítačovými nástrojmi a multidisciplinárnymi príležitosťami."
