        csa-2024:
          title: "Informatika A ('24-'25)"
          description_short: Učte sa programovanie v Jave a zručnosti softvérového inžinierstva.
          description_student: "Informatika A (CSA) zoznamuje študentov so softvérovým inžinierstvom a objektovo orientovaným programovaním a dizajnom pomocou programovacieho jazyka Java. Tento učebný plán pokrýva široké spektrum tém, vrátane návrhu riešení problémov, využitia dátových štruktúr na organizovanie veľkých súborov údajov, vývoja a implementácie algoritmov na spracovanie údajov a objavovanie nových informácií, analýzy potenciálnych riešení a etických a sociálnych dôsledkov výpočtových systémov."
          description_teacher: |-
            Informatika A (CSA) zoznamuje študentov so softvérovým inžinierstvom a objektovo orientovaným programovaním a dizajnom pomocou programovacieho jazyka Java. Tento učebný plán pokrýva široké spektrum tém, vrátane návrhu riešení problémov, využitia dátových štruktúr na organizovanie veľkých súborov údajov, vývoja a implementácie algoritmov na spracovanie údajov a objavovanie nových informácií, analýzy potenciálnych riešení a etických a sociálnych dôsledkov výpočtových systémov.
            
            Vedeli ste?
            
            Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CSA. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Kliknite sem</a> a dozviete sa viac o príležitostiach profesionálneho vzdelávania vo vašej oblasti.
            
            Môžete nájsť _Syllabus_, _Course Vocab_ a ďalšie zdroje, ktoré vám pomôžu implementovať tento učebný plán v menu Zdroje pre učiteľov nižšie.
          version_title: "'24-'25"
        focus-on-coding-2024:
          title: "Zamerajte sa na kódovanie '24-'25 (Objavy v informatike)"
          description_short: "Kolekcia jednotiek objavovania informatiky, ktorá sa zameriava na zručnosti v oblasti kódovania a programovania."
          description_student: |-
            Zameranie na kódovanie je zbierka jednotiek kurzu Objavy v informatike (CS Discoveries), ktorá posilňuje študentov v budovaní ich kódovacích zručností v oblasti webového vývoja, hier a animácie a vytvárania aplikácií pre zariadenia. Študenti vytvárajú autentické artefakty a zapájajú sa do informatiky ako prostriedku na kreativitu, komunikáciu, riešenie problémov a zábavu.
            
            **Zaujíma vás vyučovanie CS Discoveries?** Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CS Discoveries. [Kliknite sem][0] a dozviete sa viac o profesionálnych vzdelávacích príležitostiach vo vašej oblasti alebo [kliknite sem][1] a dozviete sa viac o možnosti online vzdelávania vlastným tempom.
