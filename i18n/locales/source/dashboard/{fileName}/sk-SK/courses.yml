        data-science-2024:
          title: "[PILOT] Dátová veda"
          description_short: Preskúmajte svet dátovej vedy pomocou nástrojov na vizualizáciu dát na analýzu a interpretáciu javov v reálnom svete.
          description_student: "Tento učebný plán v oblasti dátovej vedy zoznamuje študentov so základnými princípmi a zručnosťami v oblasti dátovej vedy. Študenti sa naučia, ako klásť efektívne otázky o dátach, zbierať a čistiť súbory údajov a vytvárať presvedčivé vizualizácie pomocou nástrojov ako CODAP (Jednotka 1) a Python (Jednotka 2). Ako študenti postupujú, uplatňujú svoje programovacie a analytické zručnosti na reálnych dátových sadách, získavajú skúsenosti s nevyhnutnými technikami analýzy dát, ako sú skupinovanie, filtrovanie a štatistické výpočty. Kurikulum vyvrcholí projektmi, ktoré zdôrazňujú dôležitosť etických praktík s dátami, rozprávania príbehov pomocou dát a vytvárania akčných poznatkov z komplexných súborov dát."
          description_teacher: "Data Science buduje silný základ v analýze a vizualizácii údajov pre študentov, pričom využíva programovacie nástroje ako CODAP v jednotke 1 a Python v jednotke 2 na prehlbovanie ich analytických zručností. Prostredníctvom štruktúrovaných lekcií a projektov sa študenti naučia, ako používať nástroje dátovej vedy na transformáciu surových údajov na zmysluplné vizualizácie. Jednotky zdôrazňujú etické úvahy, vedú študentov diskusiami a aktivitami zameranými na ochranu údajov, zaujatosti a spoločenské dopady rozhodnutí založených na údajoch. Na konci každej jednotky budú študenti pripravení skúmať a riešiť problémy zo skutočného sveta pomocou komplexného prístupu založeného na údajoch, ktorý vyvrcholí projektom, ktorý predvedie ich schopnosť vytvárať presvedčivé príbehy z údajov."
          version_title: "'24-'25"
