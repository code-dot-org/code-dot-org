        self-paced-exploring-gen-ai-2024:
          title: Preskúmanie generatívneho AI samostatného profesionálneho vzdelávania
          description_short: "## Vitajte! \nTento profesionálny vzdelávací modul je navrhnutý tak, aby vám pomohol pripraviť sa na výučbu kurzu Exploring Generative AI od Code.org.\n\n##### Preskúmanie generatívnej AI je navrhnuté ako samostatný kurz pre študentov 8. až 12. ročníka, ktorý sa dá bezproblémovo integrovať do akéhokoľvek existujúceho učebného plánu, pričom učiteľom ponúka flexibilitu zaviesť ho podľa svojho rozvrhu a vzdelávacích potrieb. \n\nNájdite učenie, ktoré vám vyhovuje\n* **Choďte vlastným tempom:** Táto samostatná učebná skúsenosť je navrhnutá tak, aby vám poskytla kontrolu nad vaším vlastným učením. Navrhnuté časy sú uvedené pre každú lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n* **Vyberte si svoj obsah:** Obsah je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a jednotke Generative AI. Avšak môžete **interagovať s obsahom v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Ak ste už oboznámení s platformou Code.org, môžete sa rozhodnúť preskočiť Úvod do Code.org a prejsť priamo na jednotku Preskúmanie generatívnej AI. "
