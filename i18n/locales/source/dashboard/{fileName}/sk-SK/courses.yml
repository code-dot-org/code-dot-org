        self-paced-pl-k5-2024:
          title: Základy informatiky pre učiteľov K-5
          description_short: ''
          description_student: ''
          description_teacher: "## Vitajte\n\nVitajte na bezplatnom online vzdelávaní Code.org, ktoré je samostatne riadené a určené pre pedagógov, aby sa oboznámili so základmi informatiky! Po dokončení tejto profesionálnej vzdelávacej skúsenosti, **budete sa cítiť pohodlne s základnými konceptmi kódovania pre 1. až 5. ročník**.\n\nNájdite učenie, ktoré vám vyhovuje\n\n-   **Choď vlastným tempom:** Táto samostatná učebná skúsenosť je navrhnutá tak, aby ti dala kontrolu nad tvojím vlastným učením. Navrhnuté časy sú uvedené pre každú lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n-   **Vyberte si svoj obsah:** Obsah je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v učení informatiky a Code.org. Môžete sa však **zapájať do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Ak ste už oboznámení s platformou Code.org, môžete sa rozhodnúť preskočiť prehľad. "
          version_title: ''
        csp-2024:
          title: "Princípy informatiky '24-'25"
          description_short: Zoznámte sa so základnými konceptmi informatiky.
          description_student: "CSP zoznamuje študentov so základnými konceptmi informatiky a vyzýva ich, aby preskúmali, ako môže počítačová technika a technológia ovplyvniť svet. Program AP navrhol AP Princípy počítačovej vedy s cieľom vytvoriť lídrov v oblastiach počítačovej vedy a prilákať a zapojiť tých, ktorí sú tradične nedostatočne zastúpení, s nevyhnutnými počítačovými nástrojmi a multidisciplinárnymi príležitosťami."
          description_teacher: |-
            CSP zoznamuje študentov so základnými konceptmi informatiky a vyzýva ich, aby preskúmali, ako môže počítačová technika a technológia ovplyvniť svet. Program AP navrhol AP Princípy počítačovej vedy s cieľom vytvoriť lídrov v oblastiach počítačovej vedy a prilákať a zapojiť tých, ktorí sú tradične nedostatočne zastúpení, s nevyhnutnými počítačovými nástrojmi a multidisciplinárnymi príležitosťami.
            
            Vedeli ste?
            
            Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť zásady počítačových vied. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Kliknite sem</a>, aby ste sa dozvedeli viac o príležitostiach profesionálneho vzdelávania vo vašej oblasti, alebo <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">kliknite sem</a>, aby ste sa dozvedeli viac o možnosti online vzdelávania vlastným tempom.
            
            Môžete nájsť _Syllabus_, _Course Vocab_ a ďalšie zdroje, ktoré vám pomôžu implementovať tento učebný plán v ponuke Zdroje pre učiteľov nižšie.
          version_title: "'24-'25"
        self-paced-pl-microbit-2024:
          title: "Učenie vytvárania aplikácií s zariadeniami (micro:bit)"
          description_short: ''
          description_student: "## Vitajte\n\nVitajte na bezplatnom online vzdelávaní Code.org, ktoré si môžete prispôsobiť vlastnému tempu, pre pedagógov, ktorí chcú začať učiť s Code.org! Po dokončení tejto profesionálnej vzdelávacej skúsenosti, **budete pripravení začať učiť CSD jednotku 6 - Tvorba aplikácií s zariadeniami (micro:bit)** so svojimi študentmi.\n\nNájdite učenie, ktoré vám vyhovuje\n\n-   **Choď vlastným tempom:** Táto samostatná učebná skúsenosť je navrhnutá tak, aby ti dala kontrolu nad tvojím vlastným učením. Navrhnuté časy sú uvedené pre každú lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n-   **Vyberte si svoj obsah:** Obsah je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a v jednotke 6 - Tvorba aplikácií s zariadeniami (micro:bit). Avšak môžete **interagovať s obsahom v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Ak ste už oboznámení s platformou Code.org, môžete sa rozhodnúť preskočiť Úvod do Code.org a prejsť priamo na Prípravu na vyučovanie riešenia problémov a počítačového myslenia. "
