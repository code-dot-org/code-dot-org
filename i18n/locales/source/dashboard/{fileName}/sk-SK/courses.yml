        csp-2021:
          title: "Zásady informatiky ('21-'22)"
          description_short: Zoznámte sa so základnými konceptmi informatiky.
          description_student: "CSP zoznamuje študentov so základnými konceptmi informatiky a vyzýva ich, aby preskúmali, ako môže počítačová technika a technológia ovplyvniť svet. Program AP navrhol AP Princípy počítačovej vedy s cieľom vytvoriť lídrov v oblastiach počítačovej vedy a prilákať a zapojiť tých, ktorí sú tradične nedostatočne zastúpení, s nevyhnutnými počítačovými nástrojmi a multidisciplinárnymi príležitosťami."
          description_teacher: |-
            CSP zoznamuje študentov so základnými konceptmi informatiky a vyzýva ich, aby preskúmali, ako môže počítačová technika a technológia ovplyvniť svet. Program AP navrhol AP Princípy počítačovej vedy s cieľom vytvoriť lídrov v oblastiach počítačovej vedy a prilákať a zapojiť tých, ktorí sú tradične nedostatočne zastúpení, s nevyhnutnými počítačovými nástrojmi a multidisciplinárnymi príležitosťami.
            
            Vedeli ste?
            
            Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť zásady počítačových vied. <a href="https://code.org/educate/professional-learning/middle-high" target="blank" rel="noopener noreferrer">Kliknite sem</a>, aby ste sa dozvedeli viac o príležitostiach profesionálneho vzdelávania vo vašej oblasti, alebo <a href="https://code.org/educate/professional-development-online" target="blank" rel="noopener noreferrer">kliknite sem</a>, aby ste sa dozvedeli viac o možnosti online vzdelávania vlastným tempom.
            
            Môžete nájsť _Curriculum Guide_, _Course Vocab_ a ďalšie zdroje, ktoré vám pomôžu implementovať tento učebný plán v ponuke Učiteľské zdroje nižšie.
          version_title: "'21-'22"
        csd-2021:
          title: "Objavy v informatike ('21-'22)"
          description_short: "Úvodný kurz informatiky, ktorý umožňuje študentom vytvárať autentické artefakty."
          description_student: |-
            Objavy počítačovej vedy (CS Discoveries) sú úvodným kurzom počítačovej vedy, ktorý umožňuje študentom vytvárať autentické artefakty a zapájať sa do počítačovej vedy ako prostriedku na kreativitu, komunikáciu, riešenie problémov a zábavu.
            
            **Zaujíma vás vyučovanie CS Discoveries?** Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CS Discoveries. [Kliknite sem][0] a dozviete sa viac o profesionálnych vzdelávacích príležitostiach vo vašej oblasti alebo [kliknite sem][1] a dozviete sa viac o možnosti online vzdelávania vlastným tempom.
          description_teacher: |-
            Objavy počítačovej vedy (CS Discoveries) sú úvodným kurzom počítačovej vedy, ktorý umožňuje študentom vytvárať autentické artefakty a zapájať sa do počítačovej vedy ako prostriedku na kreativitu, komunikáciu, riešenie problémov a zábavu.
            
            Vedeli ste?
            
            Profesionálny rozvoj je k dispozícii, aby vám pomohol začať učiť CS Discoveries. [Kliknite sem][0] a dozviete sa viac o príležitostiach profesionálneho vzdelávania vo vašej oblasti alebo [kliknite sem][1] a dozviete sa viac o možnosti samostatného online vzdelávania.
            
            Tento kurz je modulárny a môže sa vyučovať v rôznych konfiguráciách na základe potrieb každej triedy. Pozrite si _CSD Implementation Guide_ v ponuke Zdroje pre učiteľov nižšie, aby ste sa dozvedeli o rôznych možnostiach.
            
            Môžete nájsť _Príručku k učebnému plánu_, _Príručku pre začiatočníkov_, _Príručku k hodnoteniu_ a mnoho ďalších zdrojov, ktoré vám pomôžu implementovať tento učebný plán v ponuke učiteľských zdrojov nižšie.
          version_title: "'21-'22"
