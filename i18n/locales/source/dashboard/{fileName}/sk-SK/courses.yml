        self-paced-pl-aiml-2023:
          title: 'Príprava na vyučovanie AI a strojového učenia '
          description_short: ''
          description_student: "## Vitajte\n\nVitajte na bezplatnom online vzdelávaní Code.org, ktoré si môžete prispôsobiť vlastnému tempu, pre pedagógov, ktorí chcú začať učiť s Code.org! Po dokončení tejto profesionálnej vzdelávacej skúsenosti, **budete pripravení začať učiť jednotku Tvorba AI a strojového učenia od Code.org** so svojimi študentmi.\n\nNájdite učenie, ktoré vám vyhovuje\n\n-   **Choď vlastným tempom:** Táto samostatná učebná skúsenosť je navrhnutá tak, aby ti dala kontrolu nad tvojím vlastným učením. Navrhnuté časy sú uvedené pre každú lekciu.  Odporúčame vám, aby ste **sa zapojili do obsahu vlastným tempom.**\n\n**Vyberte si svoj obsah:** Obsah je usporiadaný v navrhovanom postupe pre učiteľov, ktorí sú noví v Code.org a v jednotke Ai a strojového učenia. Môžete sa však **zapájať do obsahu v poradí, ktoré najlepšie vyhovuje vašim potrebám.** Ak ste už oboznámení s platformou Code.org, môžete sa rozhodnúť preskočiť Úvod do Code.org a prejsť priamo na Prípravu na AI a strojové učenie. "
