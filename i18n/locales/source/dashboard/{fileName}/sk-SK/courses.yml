          description_teacher: "Preskúmanie generatívnej AI je dvojjednotkový učebný plán, ktorý skúma, ako AI funguje a ako používať generatívnu AI. Študenti sa zúčastňujú praktických aktivít, ktoré odhaľujú čiernu skrinku generatívnej AI prostredníctvom aktivít zameraných na študentov a diskusií v triede, zakotvených vo video sérii, ktorá demystifikuje generatívnu AI pre široké publikum. S pevným základom sa študenti učia prispôsobovať jazykové modely pomocou novej AI Chat laboratória, ktoré poskytuje študentom nástroje na výber jazykových modelov, aplikáciu systémových výziev a kuráciu informačných zdrojov na prispôsobenie ich chatbotu. Študenti vytvárajú chatboty na riešenie rôznych problémov a skúmajú platnosť odpovedí a vhodné využitie chatbotov v spoločnosti."
          version_title: "'24-'25"
