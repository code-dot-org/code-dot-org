            '"Suckin’ at something is the first step to being sorta good at something."': Ser malo en algo es el primer paso para ser bueno en algo.
            '"Life happens wherever you are, whether you make it or not."': "La vida sucede donde quiera que estés, ya sea que la logres o no."
