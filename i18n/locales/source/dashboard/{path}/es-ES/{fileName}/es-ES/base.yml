  hoc_tutorial_email_subject: "Rock the Hour of Code con Code.org Tutoriales!"
  hoc_tutorial_email_content:
    dear_teacher: "Estimado %{nombre_profesor},"
    intro_step_by_step_guide: "¡Estamos tan emocionados de que estés celebrando un evento de la Hora del Código usando las actividades y tutoriales gratuitos de Code.org! Es un honor tener a educadores como tú introduciendo a los estudiantes en el apasionante mundo de la codificación. Aquí hay una guía paso a paso para garantizar un evento exitoso de la Hora del Código:"
    sign_up_step: "**Regístrate** (Opcional... pero increíble!): ¡Crea una cuenta gratuita en Code.org para acceder a un panel de control personal donde podrás gestionar la Hora de Código de tu aula! [Regístrate aquí](%{url})."
    create_classroom_section: "**Crear una Sección de Aula** (También opcional... pero súper útil!): Crear una sección en el aula te permite hacer un seguimiento del progreso de tus estudiantes, ver su trabajo e incluso dejarles comentarios. Y para todos nuestros novatos, ¡aquí hay una [guía práctica](%{guide_url}) para ayudarte!"
    pick_perfect_activity: "**Elige la Actividad Perfecta**: [Selecciona el mejor tutorial de Hora de Código](%{url}) para tu evento. Explore las opciones y asigne el tutorial elegido a su sección, para que sus estudiantes sepan exactamente por dónde empezar."
    plan_like_pro: "**Planear como un profesional**: Muchos de nuestros tutoriales vienen con un [plan de lección](%{lesson_plan_url}). ¡Es como una receta secreta para el éxito! Revisa tu plan de clases antes del gran evento."
    let_fun_begin: "**Let the Fun Begin!**: Guiado por el plan de lecciones, comienza tu viaje al mundo de la codificación. Recuerde: ¡No necesitas tener todas las respuestas! Su entusiasmo y la curiosidad compartida con sus estudiantes ayudarán a todos a aprender juntos."
    hip_hip_hooray: "**Hip, Hip, Hooray!**: Una vez que termine la hora, celebremos a esos jóvenes y brillantes programadores. Certificados, pegatinas o incluso un aplauso, todo cuenta. Encuentre nuestros [certificados imprimibles aquí](%{url})."
    more_adventures_await: "**Más aventuras por delante**: ¿Viste nuevos codificadores hambrientos de más? ¡Preséntalos a más planes de estudios de informática en Code.org!"
    explore_course: "Explore nuestro tesoro de cursos gratuitos"
    learn_about_ai: "Aprende sobre Inteligencia Artificial"
    thank_you: "GRACIAS por defender la educación en informática. ¡Nuestro equipo les desea a usted y a sus estudiantes una Hora de Código inolvidable!"
    founder: "Founder, Code.org"
    your_friends: "Tus amigos en Code.org"
