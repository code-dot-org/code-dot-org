    intro_desc: "Actualizamos nuestros Términos de Servicio y Política de Privacidad, como se muestra a continuación. Los cambios son efectivos a partir del 24 de agosto de 2016.  El mayor cambio: <i>ya no almacenaremos direcciones de correo electrónico para las cuentas de los estudiantes en Code Studio.</i> Esto es un gran problema para nosotros, y esperamos que establezca un nuevo estándar para la privacidad de los estudiantes en la tecnología educativa. Te hemos enviado un resumen de los otros cambios por correo electrónico."
