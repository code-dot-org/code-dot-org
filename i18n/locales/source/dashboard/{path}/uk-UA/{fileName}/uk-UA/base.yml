  hoc_tutorial_email_subject: "Запалюйте Годину коду з підручниками Code.org!"
  hoc_tutorial_email_content:
    dear_teacher: "Шановний %{ім'я_викладача},"
    intro_step_by_step_guide: "Ми дуже раді, що ви проводите Годину коду, використовуючи безкоштовні активності та навчальні матеріали Code.org! Для нас велика честь, що такі викладачі, як ви, знайомлять студентів із захопливим світом кодування. Ось покрокова інструкція для успішного проведення Години коду:"
    sign_up_step: "**Підписатись** (необов'язково... але круто!): Створіть безкоштовний обліковий запис на Code.org, щоб отримати доступ до персональної панелі, де ви зможете керувати Годиною коду у вашому класі! [Зареєструватися тут](%{url})."
    create_classroom_section: "**Створити розділ класу** (також необов'язково... але дуже корисно!): Створивши розділ класу, ви зможете відстежувати прогрес ваших учнів, переглядати їхні роботи і навіть залишати їм відгуки! [Налаштуйте свій розділ тут](%{section_setup_url}). А для всіх наших новачків, ось [зручний посібник] (%{guide_url}), який допоможе вам!"
    pick_perfect_activity: "**Виберіть ідеальну активність**: [Виберіть найкращий підручник Години коду](%{url}) для вашої події. Вивчіть варіанти та призначте обраний підручник до свого розділу, щоб ваші учні точно знали, з чого почати."
    plan_like_pro: "**\"Плануй як професіонал\": Багато з наших підручників мають [план уроку] (%{lesson_plan_url}). Це як секретний рецепт успіху! Перевірте свій план уроку перед великою подією."
    let_fun_begin: "**Нехай веселощі починаються!**: Керуючись планом уроку, розпочніть свою подорож у світ кодування. Пам'ятай: Вам не потрібно знати всі відповіді! Ваш ентузіазм і спільна з учнями цікавість допоможуть усім вчитися разом."
    hip_hip_hooray: "**Гіп, гіп, ура! Коли година підійде до кінця, давайте відсвяткуємо цих геніальних молодих програмістів. Сертифікати, наклейки чи навіть аплодисменти - все це має значення. Знайдіть наші [сертифікати для друку тут](%{url})."
    more_adventures_await: "**Попереду ще більше пригод: Чи помітили ви нових кодерів, які прагнуть більшого? Познайомте їх з іншими навчальними програмами з інформатики на Code.org!"
    explore_course: "Відкрийте для себе нашу скарбницю безкоштовних курсів"
    learn_about_ai: "Дізнайтеся більше про штучний інтелект"
    thank_you: "ДЯКУЄМО вам за підтримку освіти в галузі інформатики. Наша команда бажає вам та вашим учням незабутньої Години коду!"
