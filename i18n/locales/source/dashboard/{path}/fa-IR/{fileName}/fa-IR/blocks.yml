            '"Bounty hunting is a complicated profession."': شکار جایزه یک حرفه پیچیده است.
            '"I will initiate self-destruct."': من خود تخریبی را آغاز خواهم کرد.
            '"This is the way."': این راه است.
            '"People get built different. We don’t need to figure it out, we just need to respect it."': مردم متفاوت ساخته می شوند. ما نیازی به کشف آن نداریم، فقط باید به آن احترام بگذاریم.
            '"You don’t need a mirror to look good. You’re beautiful on the inside."': برای خوب به نظر رسیدن نیازی به آینه ندارید. تو از درون زیبا هستی
            '"Sometimes life is scary and dark. That is why we must find the light."': گاهی زندگی ترسناک و تاریک است. به همین دلیل است که ما باید نور را پیدا کنیم.
            '"Everything small is just a smaller version of something big."': هر چیز کوچک فقط یک نسخه کوچکتر از چیزی بزرگ است.
            '"Suckin’ at something is the first step to being sorta good at something."': مکیدن چیزی اولین قدم برای خوب بودن در چیزی است.
            '"Life happens wherever you are, whether you make it or not."': زندگی هر جا که باشی اتفاق می افتد، چه بسازی چه نسازی.
            '"You can’t knock me down!"': شما نمی توانید من را زمین گیر کنید!
            '"Roar!"': غرش!
            '"My first girlfriend turned into the moon."': اولین دوست دخترم به ماه تبدیل شد.
            '"True humility is the only antidote to shame."': تواضع واقعی تنها پادزهر شرم است.
            '"You are stronger and wiser and freer than you have ever been."': تو قوی تر و عاقل تر و آزادتر از همیشه هستی.
            '"You have to try every time. You can''t quit because you''re afraid you might fail."': شما باید هر بار تلاش کنید. شما نمی توانید دست از کار بکشید زیرا می ترسید شکست بخورید.
