      how_much_participated_s: 'در طول کارگاه خود چقدر شرکت کردید؟'
      how_often_talk_about_ideas_outside_s: 'وقتی در کارگاه‌های Code.org نیستید، چقدر درباره ایده‌های کارگاه‌ها صحبت می‌کنید؟'
      how_often_lost_track_of_time_s: 'چند بار آنقدر روی فعالیت های کارگاه Code.org متمرکز شدید که زمان را از دست دادید؟'
      how_excited_before_s: 'قبل از کارگاه، چقدر از رفتن به کارگاه Code.org خود هیجان زده بودید؟'
      overall_how_interested_s: 'به طور کلی، چقدر به کارگاه حضوری Code.org علاقه مند بودید؟'
