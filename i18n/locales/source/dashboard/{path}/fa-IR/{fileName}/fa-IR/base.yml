      things_you_would_change_s: 'دو چیزی که در مورد فعالیت هایی که در این کارگاه انجام دادید را تغییر می دهید چیست؟'
      anything_else_s: 'آیا چیز دیگری وجود دارد که بخواهید در مورد تجربه خود در این کارگاه به ما بگویید؟'
