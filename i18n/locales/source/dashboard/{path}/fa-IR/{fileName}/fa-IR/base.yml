      intro: "از اینکه برای آموزش برنامه درسی Code.org وقت گذاشتید متشکریم. ماموریت ما برای ارائه فرصت های آموزش علوم کامپیوتر به همه کودکان در تمام مدارس در سراسر جهان بدون شما امکان پذیر نخواهد بود."
      instructions: "لطفاً فرم زیر را پر کنید تا نشان دهید که 1) در یک کارگاه آموزشی که توسط یکی از شرکای بین المللی Code.org برگزار می شود شرکت کرده اید، و 2) موافقت می کنید که اطلاعات خود را با شریک بین المللی ما در کشور خود به اشتراک بگذارید تا آنها بتوانند در حمایت از شما کمک کنند. سفر به عنوان معلم علوم کامپیوتر"
