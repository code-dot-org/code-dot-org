  hoc_tutorial_email_subject: "با آموزش Code.org ساعت کد را تکان دهید!"
  hoc_tutorial_email_content:
    dear_teacher: "%{teacher_name} عزیز،"
    intro_step_by_step_guide: "ما بسیار هیجان زده هستیم که شما با استفاده از فعالیت ها و آموزش های رایگان Code.org یک رویداد Hour of Code برگزار می کنید! ما مفتخریم که مربیانی مانند شما دانش آموزان را با دنیای هیجان انگیز کدنویسی آشنا می کنند. در اینجا یک راهنمای گام به گام برای اطمینان از موفقیت آمیز رویداد Hour of Code آورده شده است:"
    sign_up_step: "**ثبت نام** (اختیاری... اما عالی!): یک حساب رایگان Code.org برای دسترسی به داشبورد شخصی ایجاد کنید تا بتوانید ساعت کد کلاس درس خود را مدیریت کنید! [اینجا ثبت نام کنید](%{url})."
    create_classroom_section: "**یک بخش کلاس درس ایجاد کنید** (همچنین اختیاری... اما فوق العاده مفید!): ایجاد یک بخش کلاس به شما امکان می دهد پیشرفت دانش آموزان خود را ردیابی کنید، کار آنها را مشاهده کنید و حتی بازخورد آنها را ارسال کنید! [بخش خود را در اینجا تنظیم کنید](%{section_setup_url}). و برای همه تازه‌کارهای ما، در اینجا یک [راهنمای مفید] (%{guide_url}) برای کمک به شما وجود دارد!"
    pick_perfect_activity: "**فعالیت کامل را انتخاب کنید**: [بهترین آموزش ساعت کد را انتخاب کنید](%{url}) برای رویداد خود. گزینه ها را بررسی کنید و آموزش انتخابی خود را به بخش خود اختصاص دهید تا دانش آموزان شما دقیقا بدانند از کجا شروع کنند."
    plan_like_pro: "**مثل یک حرفه ای برنامه ریزی کنید**: بسیاری از آموزش‌های ما با [طرح درس] (%{lesson_plan_url}) ارائه می‌شوند. این مانند یک دستور العمل مخفی برای موفقیت است! قبل از رویداد بزرگ، برنامه درسی خود را بررسی کنید."
    let_fun_begin: "**اجازه دهید سرگرمی شروع شود!**: با هدایت طرح درس، سفر خود را به دنیای کدنویسی آغاز کنید. به یاد داشته باشید: نیازی نیست همه پاسخ ها را داشته باشید! اشتیاق شما و کنجکاوی مشترک با دانش آموزانتان به همه کمک می کند تا با هم یاد بگیرند."
    hip_hip_hooray: "**هیپ، هیپ، هورا!**: وقتی ساعت به پایان رسید، بیایید از آن کدنویسان جوان باهوش تجلیل کنیم. گواهی ها، برچسب ها یا حتی یک دور تشویق - همه اینها مهم است. [گواهینامه های قابل چاپ] ما را در اینجا بیابید (%{url})."
    more_adventures_await: "**ماجراهای بیشتری در انتظار شماست**: آیا کدنویس جدیدی را که تشنه اطلاعات بیشتر هستند، مشاهده کردید؟ آنها را با برنامه های درسی علوم کامپیوتر بیشتری در Code.org معرفی کنید!"
    explore_course: "گنجینه دوره های رایگان ما را کاوش کنید"
    learn_about_ai: "با هوش مصنوعی آشنا شوید"
    thank_you: "از شما برای حمایت از آموزش علوم کامپیوتر سپاسگزاریم. تیم ما برای شما و دانش آموزانتان یک ساعت رمز فراموش نشدنی آرزو می کند!"
    founder: "موسس، Code.org"
    your_friends: "دوستان شما در Code.org"
