      know_where_to_go_for_help_s: 'من می دانم در صورت نیاز به کمک برای آموزش این مطالب کجا باید بروم.'
      suitable_for_my_experience_s: 'این پیشرفت حرفه ای برای سطح تجربه من با آموزش CS مناسب بود.'
      would_recommend_s: 'من این پیشرفت حرفه ای را به دیگران توصیه می کنم.'
