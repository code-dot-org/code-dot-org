  hoc_tutorial_email_subject: "Rozhýbte Hodinu kódu s Code.org návodmi!"
  hoc_tutorial_email_content:
    dear_teacher: "Vážený %{teacher_name},"
    intro_step_by_step_guide: "Sme nadšení, že organizujete podujatie Hodiny kódu pomocou bezplatných aktivít a návodov Code.org! Je nám cťou, že pedagógovia ako vy uvádzajú študentov do vzrušujúceho sveta programovania. Tu je podrobný návod, ako zabezpečiť úspešné podujatie Hodiny kódu:"
    sign_up_step: "**Zaregistrujte sa** (voliteľné... Ale úžasné!): Vytvorte si bezplatný Code.org účet pre prístup k osobnému panelu, kde môžete spravovať Hodinu kódu vo svojej triede! [Zaregistrujte sa tu](%{url})."
    create_classroom_section: "**Vytvorte sekciu triedy** (tiež voliteľné... ale super užitočné!): Vytvorenie sekcie v triede vám umožní sledovať pokrok vašich študentov, prezerať si ich prácu a dokonca im zanechávať spätnú väzbu! [Nastavte si sekciu tu](%{section_setup_url}). A pre všetkých našich nováčikov je tu [praktický sprievodca](%{guide_url}), ktorý vám pomôže!"
    pick_perfect_activity: "**Vyberte si ideálnu aktivitu**: [Vyberte najlepší návod na Hodinu kódu](%{url}) pre vašu udalosť. Preskúmajte možnosti a priraďte vybraný návod k svojej sekcii, aby vaši študenti presne vedeli, kde začať."
    plan_like_pro: "**Plánujte ako profesionál**: Mnohé z našich návodov prichádzajú s [plánom lekcie](%{lesson_plan_url}). Je to ako tajný recept na úspech! Pozrite si svoj plán lekcie pred veľkou udalosťou."
    let_fun_begin: "**Nech sa zábava začne!**: Na základe plánu lekcie sa vydajte na cestu do sveta programovania. Pamätať: Nemusíte mať všetky odpovede! Vaše nadšenie a zdieľaná zvedavosť so študentmi pomôžu všetkým učiť sa spoločne."
    hip_hip_hooray: "**Bok, bok, hurá!**: Akonáhle sa hodina skončí, oslávme tých skvelých mladých programátorov. Certifikáty, nálepky alebo dokonca potlesk – to všetko sa počíta. Nájdite naše [tlačiteľné certifikáty tu](%{url})."
    more_adventures_await: "**Ďalšie dobrodružstvá čakajú**: Všimli ste si nejakých nových programátorov, ktorí sú hladní po ďalších? Predstavte im ďalšie učebné osnovy informatiky na Code.org!"
    explore_course: "Preskúmajte našu pokladnicu bezplatných kurzov"
    learn_about_ai: "Zistite viac o umelej inteligencii"
    thank_you: "ĎAKUJEME, že podporujete vzdelávanie v oblasti informatiky. Náš tím praje vám a vašim študentom nezabudnuteľnú Hodinu kódu!"
    founder: "Founder, Code.org"
    your_friends: "Vaši priatelia v Code.org"
