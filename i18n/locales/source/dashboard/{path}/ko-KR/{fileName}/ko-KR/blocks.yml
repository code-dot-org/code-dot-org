        text: "[SPRITE][0]이 [SPEECH][1]을 말합니다."
        options:
          SPEECH:
            '"I have spoken."': 나는 말했다.
            '"Bounty hunting is a complicated profession."': 현상금 사냥은 복잡한 직업이다.
            '"I will initiate self-destruct."': 나는 자폭을 시작할 것이다.
            '"This is the way."': 이것이 바로 방법입니다.
            '"People get built different. We don’t need to figure it out, we just need to respect it."': 사람들은 다르게 만들어집니다. 우리는 그것을 알아낼 필요가 없습니다. 우리는 그저 그것을 존중하기만 하면 됩니다.
            '"You don’t need a mirror to look good. You’re beautiful on the inside."': 잘 보이려면 거울이 필요하지 않아요. 당신은 내면이 아름답습니다.
            '"Sometimes life is scary and dark. That is why we must find the light."': 가끔 인생은 무섭고 어둡습니다. 그래서 우리는 빛을 찾아야 합니다.
            '"Everything small is just a smaller version of something big."': 모든 작은 것은 큰 것의 작은 버전일 뿐이다.
            '"Suckin’ at something is the first step to being sorta good at something."': 뭔가를 못하는 건 뭔가를 잘하는 첫 걸음이에요.
            '"Life happens wherever you are, whether you make it or not."': "인생은 당신이 어디에 있든, 성공하든 실패하든, 계속됩니다."
            '"You can’t knock me down!"': 나를 쓰러뜨릴 수 없어!
            '"Roar!"': 노호!
            '"My first girlfriend turned into the moon."': 내 첫 여자친구는 달로 변했어요.
            '"True humility is the only antidote to shame."': 진정한 겸손만이 수치심을 극복할 수 있는 유일한 방법입니다.
            '"You are stronger and wiser and freer than you have ever been."': "당신은 그 어느 때보다 더 강하고, 더 현명하고, 더 자유로워졌습니다."
            '"You have to try every time. You can''t quit because you''re afraid you might fail."': 항상 노력해야 해요. 실패할까봐 포기할 수는 없습니다.
