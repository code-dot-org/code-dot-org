      thanks_markdown: "제출해 주셔서 감사합니다! Code.org의 커리큘럼과 도구에 대해 알아가는 데 도움이 되기를 기대합니다. support@code.org](%{지원_이메일_URL})로 이메일을 보내거나 [교사 포럼](%{교사_포럼_URL})에 게시하여 질문과 피드백을 계속 공유해 주세요!"
