  hoc_tutorial_email_subject: "Code.org 튜토리얼로 코드의 시간을 즐겨보세요!"
  hoc_tutorial_email_content:
    dear_teacher: "선생님께 %{교사_이름}님께,"
    intro_step_by_step_guide: "Code.org의 무료 활동과 튜토리얼을 활용한 아워 오브 코드 이벤트를 개최하게 되어 매우 기쁩니다! 여러분과 같은 교육자들이 학생들에게 코딩의 흥미로운 세계를 소개해 주시는 것을 영광으로 생각합니다. 성공적인 코드의 시간 이벤트를 위한 단계별 가이드는 다음과 같습니다:"
    sign_up_step: "**가입하기** (선택 사항이지만... 멋집니다!): 무료 Code.org 계정을 만들어 교실의 코드 시간을 관리할 수 있는 개인 대시보드에 액세스하세요! [여기에서 가입](%{url})."
    create_classroom_section: "**강의실 섹션 만들기**(이 또한 선택 사항이지만 매우 유용합니다!): 강의실 섹션을 생성하면 학생의 진행 상황을 추적하고, 과제를 확인하고, 피드백을 남길 수 있습니다! [여기에서 섹션 설정](%{section_setup_url}). 모든 초보자를 위해 [편리한 가이드](%{guide_url})가 도움이 될 것입니다!"
    pick_perfect_activity: "**완벽한 활동을 선택하세요**: [이벤트에 가장 적합한 코드 튜토리얼](%{url})을 선택하세요. 옵션을 살펴보고 선택한 튜토리얼을 섹션에 할당하면 학생들이 어디서부터 시작해야 할지 정확히 알 수 있습니다."
    plan_like_pro: "**프로처럼 계획하세요**: 많은 튜토리얼이 [레슨 계획](%{lesson_plan_url})과 함께 제공됩니다. 성공의 비법 같은 것입니다! 중요한 이벤트가 열리기 전에 수업 계획을 확인하세요."
    let_fun_begin: "**재미를 시작하세요! 수업 계획에 따라 코딩의 세계로 여행을 시작하세요. 기억하세요: 모든 답을 다 알 필요는 없습니다! 여러분의 열정과 학생들과의 호기심 공유는 모두가 함께 배우는 데 도움이 될 것입니다."
    hip_hip_hooray: "**만세, 만세, 만세! 시간이 끝나면 이 멋진 젊은 코더들을 축하해 주세요. 인증서, 스티커, 박수 등 모든 것이 중요합니다. 여기에서 [인쇄 가능한 인증서](%{url})를 찾아보세요."
    more_adventures_await: "**더 많은 모험이 기다리고 있습니다**: 더 많은 것을 갈망하는 신입 코더를 발견하셨나요? Code.org에서 더 많은 컴퓨터 과학 커리큘럼을 소개해 주세요!"
    explore_course: "무료 강좌의 보물창고 살펴보기"
    learn_about_ai: "인공 지능에 대해 알아보기"
    thank_you: "컴퓨터 과학 교육을 옹호해 주셔서 감사합니다. 저희 팀이 여러분과 학생들에게 잊지 못할 한 시간의 코드가 되기를 기원합니다!"
    founder: "Code.org 설립자"
    your_friends: "Code.org의 친구"
