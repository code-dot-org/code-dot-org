      how_often_given_feedback_s: '진행자가 학습에 도움이 되는 피드백을 얼마나 자주 제공했나요?'
      how_comfortable_asking_questions_s: '워크숍에서 배운 내용에 대해 진행자에게 질문하는 것이 얼마나 편했나요?'
      how_often_taught_new_things_s: "이 워크숍을 수강하기 전에는 몰랐던 내용을 진행자가 얼마나 자주 가르쳐 주었나요?"
      how_much_participated_s: '워크숍에 얼마나 참여했나요?'
      how_often_talk_about_ideas_outside_s: 'Code.org 워크숍에 참석하지 않을 때는 워크숍에서 얻은 아이디어에 대해 얼마나 자주 이야기하나요?'
      how_often_lost_track_of_time_s: 'Code.org 워크숍 활동에 너무 집중해서 시간 가는 줄 몰랐던 적이 얼마나 자주 있었나요?'
      how_excited_before_s: '워크숍에 참석하기 전에 Code.org 워크숍에 참석하는 것이 얼마나 기대되셨나요?'
      overall_how_interested_s: '전반적으로 Code.org 대면 워크숍에 얼마나 관심이 있었나요?'
      more_prepared_than_before_s: '워크숍에 오기 전보다 이 워크숍에서 다룬 내용을 가르칠 준비가 더 잘 된 것 같습니다.'
      know_where_to_go_for_help_s: '이 자료를 가르칠 준비를 하는 데 도움이 필요하면 어디로 가야 할지 알고 있습니다.'
      suitable_for_my_experience_s: '이 전문성 개발은 제 CS 교육 경험 수준에 적합했습니다.'
      would_recommend_s: '다른 사람들에게도 이 전문성 개발을 추천하고 싶습니다.'
      part_of_community_s: '교사 커뮤니티의 일원이 된 것 같은 기분이 듭니다.'
      things_facilitator_did_well_s: '진행자가 잘한 두 가지가 있다면 무엇인가요?'
      things_facilitator_could_improve_s: '진행자가 더 잘할 수 있는 두 가지가 있다면 무엇인가요?'
      things_you_liked_s: '이번 워크숍에서 가장 마음에 들었던 두 가지 활동은 무엇이었으며 그 이유는 무엇인가요?'
      things_you_would_change_s: '이번 워크숍에서 수행한 활동 중 두 가지를 바꾸고 싶은 것이 있다면 무엇인가요?'
