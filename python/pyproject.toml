[project]
name = 'code-dot-org'
version = '1.0'
# matplotlib/numpy (pulled in by pythonlab_setup) lag the newest CPython by a
# release, so cap below 3.14 until their wheels catch up.
requires-python = '>=3.12,<3.14'
dependencies = [
  # Register local python packages under python/ in 3 places: this list,
  # in [tool.uv.sources] and in [tool.uv.workspace].
  # These are the Python Lab packages; server-side python was retired.
  'neighborhood',
  'pythonlab_setup',
  'unittest_runner',
  ## Do not add dependencies here, add them to a pyproject.toml in a sub-dir ##
]

[dependency-groups]
dev = [
  'coverage >=7',
  'ipython >=8',
  'pytest >=8',
  'pytest-mock >=3',
  'ruff >=0.8',
]

[tool.uv.sources]
neighborhood = { workspace = true }
pythonlab_setup = { workspace = true }
unittest_runner = { workspace = true }

[tool.uv.workspace]
members = [
  'pythonlab/pythonlab_setup',
  'pythonlab/unittest_runner',
  'pythonlab/neighborhood',
]

[tool.ruff]
# we use ruff for linting
line-length = 100
