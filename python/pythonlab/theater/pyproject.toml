[project]
name = "theater"
version = "0.2.0"
requires-python = '>=3.12'
# pillow and numpy are provided by the Pyodide worker at runtime (loadPackages),
# so they are intentionally not declared as install dependencies here.
dependencies = []

[dependency-groups]
dev = [
  'pytest >=8',
  'pillow >=10',
  'numpy >=1.26',
]

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.hatch.build.targets.wheel]
# Bundle the instrument samples and fonts as package data so they can be read
# via importlib.resources inside Pyodide, where network fetch is unavailable.
include = [
  'theater/**/*.py',
  'theater/instruments/*.ulaw',
  'theater/fonts/*.ttf',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'
