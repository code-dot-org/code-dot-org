[project]
name = "theater"
version = "0.1.0"
requires-python = '>=3.12'
# pillow is provided by the Pyodide worker at runtime (loadPackages), so it is
# intentionally not declared as an install dependency here.
dependencies = []

[dependency-groups]
dev = [
  'pytest >=8',
  'pillow >=10',
]

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.hatch.build.targets.wheel]
# Bundle the fonts as package data so they can be read via importlib.resources
# inside Pyodide, where network fetch is unavailable.
include = [
  'theater/**/*.py',
  'theater/fonts/*.ttf',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'
