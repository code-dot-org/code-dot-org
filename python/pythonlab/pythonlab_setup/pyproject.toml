[project]
name = 'pythonlab_setup'
version = '0.5.0'
requires-python = '>=3.12'
dependencies = [
  'matplotlib >=3',
  'requests >=2',
  'neighborhood'
]

[dependency-groups]
dev = [
  'pytest >=8',
  # theater and kiosk are not runtime dependencies: their wheels are fetched
  # only for a program that imports them, and the resets look them up in
  # sys.modules rather than importing them. The tests need them installed to
  # check the resets actually work.
  'theater',
  'kiosk',
]

[tool.pytest.ini_options]
testpaths = ['tests']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'
