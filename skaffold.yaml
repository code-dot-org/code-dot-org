# Using skaffold (https://skaffold.dev/) allows us to start a kubernetes cluster
# for code.org development with one command: `skaffold dev`
#
# This is currently an experimental feature, see: k8s/experimental.yaml
#
# IF YOU MODIFY THIS FILE, also fix its sibling k8s/kustomize/skaffold.yaml in the same
# way until we decide between Helm and Kustomize.
#
# The config builds and deploys the backend stack: the ActiveJob worker and
# cluster-local services, with no dashboard frontend or frontend asset build.
# It uses the same root docker image family as the deployed clusters:
#
#   cdo-base -> cdo-build -> cdo-deps -> cdo-rails

apiVersion: skaffold/v4beta13
kind: Config
build:
  hooks:
    before:
      - command: ["./docker/rails/ensure-locales.sh"]
  local:
    useBuildkit: true
  artifacts:
  - image: cdo-rails
    sync:
      infer:
        - '**/*.rb'
        - '**/*.ru'
        - '**/*.yml'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.json'
    docker:
      dockerfile: docker/rails/Dockerfile
    requires:
      - image: cdo-deps
        alias: DEPS_IMAGE
  - image: cdo-deps
    docker:
      dockerfile: docker/deps/Dockerfile
    requires:
      - image: cdo-build
        alias: BUILD_IMAGE
      - image: cdo-base
        alias: BASE_IMAGE
  - image: cdo-build
    context: docker/build
    docker:
      dockerfile: Dockerfile
    requires:
      - image: cdo-base
        alias: BASE_IMAGE
  - image: cdo-base
    context: docker/base
    docker:
      dockerfile: Dockerfile

deploy:
  helm:
    hooks:
      before:
        # Jobs have immutable pod templates. Delete prior one-shot setup Jobs
        # before Helm applies a new image tag or command.
        - host:
            command:
              - kubectl
              - delete
              - job
              - cdo-dashboard-job-setup-db-minimal
              - cdo-minio-setup-s3-job
              - --ignore-not-found
    releases:
      - name: cdo
        chartPath: ./k8s/helm
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_cdo_rails}}"
          # Skaffold sync only works when the process is root:
          # https://github.com/GoogleContainerTools/skaffold/issues/2479
          # If we find a solution, we can drop these overrides.
          user.uid: "0"
          user.gid: "0"
        valuesFiles:
          # This list will be extended by skaffold profiles e.g.: k8s/helm/development.values.yaml
          - k8s/helm/values.yaml

profiles:
- name: development
  activation:
    - command: dev
    - command: debug
    - kubeContext: docker-desktop
  patches:
    # Rails takes long enough to boot that the startup probe can fail transiently.
    # Let Kubernetes enforce the probe threshold instead of failing on its first event.
    - op: add
      path: /deploy/tolerateFailuresUntilDeadline
      value: true
    - op: add
      path: /deploy/helm/releases/0/valuesFiles/-
      value: k8s/helm/development.values.yaml
    # In development mode we auto-generate passwords for cluster-local MySQL,
    # Redis, and MinIO. The Helm chart retains an existing MySQL password because
    # the MySQL volume also survives Skaffold cleanup. To rotate that password,
    # delete cdo-local-secrets.env, the cdo-local-secrets Secret, and the MySQL
    # persistent volume together.
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.mysql.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "MYSQL_ROOT_PASSWORD" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.redis.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "REDIS_PASSWORD" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.minio.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "MINIO_ROOT_PASSWORD" }}'
# Creates a fresh Dashboard DB from schema.rb, without curriculum seed data.
# Run: skaffold dev --trigger=manual -p setup-db-minimal
- name: setup-db-minimal
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/dashboardJob
        value:
          enabled: true
          name: setup-db-minimal
          args: ["cd dashboard && bin/setup-db-minimal"]
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/RAILS_ENV
        value: adhoc
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/extraEnv
        value:
          AWS_EC2_METADATA_DISABLED: "true"

# Create standard cdo-v3-* S3 buckets in minio.
# Run: skaffold dev --trigger=manual -p setup-db-minimal -p setup-s3
- name: setup-s3
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/services.minio.runSetupS3Job
        value: true

portForward:
- resourceType: Service
  resourceName: cdo-mysql
  port: mysql
  localPort: 13306
- resourceType: Service
  resourceName: cdo-redis
  port: redis
  localPort: 16379
- resourceType: Service
  resourceName: cdo-minio
  port: api
  localPort: 29000
- resourceType: Service
  resourceName: cdo-minio
  port: console
  localPort: 29001
