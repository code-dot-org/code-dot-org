# Using skaffold (https://skaffold.dev/) allows us to start a kubernetes cluster
# for code.org development with one command: `skaffold dev`
#
# This is currently an experimental feature, see: k8s/experimental.yaml
#
# IF YOU MODIFY THIS FILE, also fix its sibling k8s/kustomize/skaffold.yaml in the same
# way until we decide between Helm and Kustomize.
#
# Layering: the base config builds and deploys a BACKEND-ONLY stack (the
# ActiveJob worker, no dashboard frontend, no frontend asset build). Every
# additional layer is an explicit profile:
#
#   skaffold dev                  # backend only (the base config)
#   skaffold dev -p dashboard     # full app, frontend build included
#   skaffold build -p release     # full production-flavored image (CI)

apiVersion: skaffold/v4beta13
kind: Config
build:
  artifacts:
  # Backend-only runtime image: Rails without the frontend asset build.
  # The dashboard/release profiles below retarget this artifact to the full
  # `runtime` image and add the frontend artifact chain it requires.
  - image: code-dot-org
    sync:
      infer:
        # rerun watching
        # /app/src/lib, /app/src/shared/middleware, /app/src/dashboard/legacy, /app/src/pegasus for **/*.{rb,ru,yml} (ignoring **/migrations/*.rb,test/**/*.rb)\
        - '**/*.rb'
        - '**/*.ru'
        - '**/*.yml'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.json'
    custom:
      buildCommand: |
        IMPORT_IMAGE_TO_K8S_NODE=true k8s/bin/docker-buildx -f k8s/docker/code-dot-org.dockerfile \
          --target code-dot-org-activejob-only \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg BUNDLE_WITHOUT=development:test:production:adhoc:staging:levelbuilder:integration
      dependencies:
        dockerfile:
          path: k8s/docker/code-dot-org.dockerfile
    requires:
    - image: code-dot-org-core
      alias: CODE_DOT_ORG_CORE
  - image: code-dot-org-core
    custom:
      buildCommand: |
        k8s/bin/docker-buildx -f k8s/docker/code-dot-org-core.dockerfile \
          --target code-dot-org-core
      dependencies:
        dockerfile:
          path: k8s/docker/code-dot-org-core.dockerfile

deploy:
  helm:
    releases:
      - name: cdo
        chartPath: ./k8s/helm
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_code_dot_org}}"
          # skaffold sync only works when the user is root 😤:
          # https://github.com/GoogleContainerTools/skaffold/issues/2479
          # If we find a solution, we can drop this override:
          user.username: root
          user.uid: "0"
          user.gid: "0"
          user.home: /home/root
        valuesFiles:
          # This list will be extended by skaffold profiles e.g.: k8s/helm/development.values.yaml
          - k8s/helm/values.yaml

profiles:

# Layer the dashboard frontend on top of the backend-only base: build the
# full `runtime` image (with the frontend artifact chain) and enable the
# dashboard Deployment/Service/Ingress. Explicit opt-in:
# `skaffold dev -p dashboard`.
#
- name: dashboard
  patches:
    # Development-flavored full image; see the `release` profile for the
    # production-flavored equivalent.
    - op: replace
      path: /build/artifacts/0/custom/buildCommand
      value: |
        k8s/bin/docker-buildx -f k8s/docker/code-dot-org.dockerfile \
          --target runtime \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg CODE_DOT_ORG_DB_SEED="$CODE_DOT_ORG_DB_SEED" \
          --build-arg CODE_DOT_ORG_PEGASUS="$CODE_DOT_ORG_PEGASUS" \
          --build-arg CODE_DOT_ORG_STATIC="$CODE_DOT_ORG_STATIC" \
          --build-arg BUNDLE_WITHOUT=test:production:staging:levelbuilder
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-db-seed
        alias: CODE_DOT_ORG_DB_SEED
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-pegasus
        alias: CODE_DOT_ORG_PEGASUS
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-static
        alias: CODE_DOT_ORG_STATIC
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-pegasus
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-pegasus.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-pegasus.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-static
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-static.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-static.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-db-seed
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-db-seed.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-db-seed.dockerfile
    - op: add
      path: /deploy/helm/releases/0/valuesFiles/-
      value: k8s/helm/dashboard.values.yaml
    - op: add
      path: /portForward/-
      value:
        resourceType: Service
        resourceName: cdo-dashboard
        port: http
        localPort: 13000
    - op: add
      path: /portForward/-
      value:
        resourceType: Service
        resourceName: cdo-dashboard
        port: http-hmr
        localPort: 19000

# Production-flavored full image build, used by CI to publish the deployable
# image (see .github/workflows/k8s-skaffold-build.yml). Same layering as the
# dashboard profile minus the development bundle groups. Do NOT combine with
# the dashboard profile (both add the same artifacts).
- name: release
  patches:
    - op: replace
      path: /build/artifacts/0/custom/buildCommand
      value: |
        k8s/bin/docker-buildx -f k8s/docker/code-dot-org.dockerfile \
          --target runtime \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg CODE_DOT_ORG_DB_SEED="$CODE_DOT_ORG_DB_SEED" \
          --build-arg CODE_DOT_ORG_PEGASUS="$CODE_DOT_ORG_PEGASUS" \
          --build-arg CODE_DOT_ORG_STATIC="$CODE_DOT_ORG_STATIC"
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-db-seed
        alias: CODE_DOT_ORG_DB_SEED
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-pegasus
        alias: CODE_DOT_ORG_PEGASUS
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-static
        alias: CODE_DOT_ORG_STATIC
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-pegasus
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-pegasus.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-pegasus.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-static
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-static.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-static.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-db-seed
        custom:
          buildCommand: k8s/bin/docker-buildx -f k8s/docker/code-dot-org-db-seed.dockerfile
          dependencies:
            dockerfile:
              path: k8s/docker/code-dot-org-db-seed.dockerfile
    - op: add
      path: /deploy/helm/releases/0/valuesFiles/-
      value: k8s/helm/dashboard.values.yaml

- name: development
  activation:
    - command: dev
    - command: debug
    - kubeContext: docker-desktop
  patches:
    # Rails takes long enough to boot that the startup probe can fail transiently.
    # Let Kubernetes enforce the probe threshold instead of failing on its first event.
    - op: add
      path: /deploy/tolerateFailuresUntilDeadline
      value: true
    - op: add
      path: /deploy/helm/releases/0/valuesFiles/-
      value: k8s/helm/development.values.yaml
    # In development mode we auto-generate passwords for the cluster-local MySQL/Redis/MinIO
    #
    # Please note that to change these passwords you BOTH have to delete/edit cdo-local-secrets.env
    # AND you have to delete the persistent volume associated with that service, because
    # changing the password in helm after first create typically does not modify the
    # password in the service's root volume.
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.mysql.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "MYSQL_ROOT_PASSWORD" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.redis.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "REDIS_PASSWORD" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/services.minio.password
      value: '{{ cmd "./k8s/bin/cdo-local-secrets" "MINIO_ROOT_PASSWORD" }}'
    # These have to be patches vs in values.yml because they inject local env vars:
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/localDev.mounts.hostPaths.home
      value: '{{ cmd "sh" "-c" "echo $HOME" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/localDev.mounts.hostPaths.skaffoldStorage
      value: '{{ cmd "sh" "-c" "echo $PWD/skaffoldStorage" }}'
    - op: add
      path: /deploy/helm/releases/0/setValueTemplates/localDev.mounts.AWS_PROFILE
      value: '{{ cmd "sh" "-c" "echo $AWS_PROFILE" }}'

# Mount local machine credential directories into the dashboard container so it can
# use your local AWS and gcloud credentials. To use: `skaffold dev -p local-dev`
- name: local-dev
  patches:
    - op: add
      path: /deploy/helm/releases/0/setValues
      value:
        localDev:
          mounts:
            mountDotAWS: true
            mountDotConfigGcloud: true

# Populates Dashboard DB (rake dashboard:setup_db)
# Needs the full image (seed data), so include the dashboard profile.
# Run: skaffold dev --trigger=manual -p dashboard -p setup-db -p setup-s3
- name: setup-db
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/dashboardJob
        value:
          enabled: true
          name: setup-db
          args: ["cd dashboard && bundle exec rake dashboard:setup_db && echo 'setup-db COMPLETE'"]

# Creates or migrates the Dashboard DB without seeding curriculum data.
# Run: skaffold dev --trigger=manual -p setup-db-minimal
- name: setup-db-minimal
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/dashboardJob
        value:
          enabled: true
          name: setup-db-minimal
          args: ["cd dashboard && RAILS_ENV=adhoc RACK_ENV=adhoc AWS_EC2_METADATA_DISABLED=true bundle exec rake db:setup_or_migrate && echo 'setup-db-minimal COMPLETE'"]

# Create standard cdo-v3-* S3 buckets in minio.
# Run: skaffold dev --trigger=manual -p dashboard -p setup-db -p setup-s3
- name: setup-s3
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/services.minio.runSetupS3Job
        value: true

portForward:
- resourceType: Service
  resourceName: cdo-mysql
  port: mysql
  localPort: 13306
- resourceType: Service
  resourceName: cdo-redis
  port: redis
  localPort: 16379
- resourceType: Service
  resourceName: cdo-minio
  port: api
  localPort: 29000
- resourceType: Service
  resourceName: cdo-minio
  port: console
  localPort: 29001
