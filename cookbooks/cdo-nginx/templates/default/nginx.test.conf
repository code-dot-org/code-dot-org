# Local test config — NOT for production.
# Renders nginx.conf.erb with variables substituted and SSL removed.
# Run with: docker run --rm -p 8080:80 -v $(pwd)/nginx.test.conf:/etc/nginx/nginx.conf nginx
# Assumes your Rails app is running on host port 9000 (or change RAILS_PORT below).

events {
  worker_connections 1024;
}

http {
  proxy_redirect off;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Start "t=${msec}";
  proxy_buffer_size 8k;
  client_max_body_size 4G;
  keepalive_timeout 30;

  # studio.code.org: serve LTI and JWKs routes directly, redirect everything else to codeai.org
  server {
    listen 80;
    server_name studio.code.org;

    location /lti/ {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $http_host;
    }

    location /oauth/jwks {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $http_host;
    }

    location / {
      return 301 http://codeai.org:8080$request_uri;
    }
  }

  # codeai.org: primary domain, all traffic to Rails
  server {
    listen 80 default_server deferred;
    server_name codeai.org _;

    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $http_host;
    }
  }
}
