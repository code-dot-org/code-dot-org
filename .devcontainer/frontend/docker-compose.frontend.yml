# Frontend with Rails APIs (Vite dev server + live Rails backend).
# For integrated frontend development: package dev → Studio integration → API verification.
# No apps webpack build needed — Rails APIs return JSON, not HTML with /blockly/ assets.

services:
  db:
    image: ${CDO_DEV_DB_IMAGE:-cdo-dev-db:latest}
    tmpfs:
      - /mysql-wal:size=256m
    healthcheck:
      test: ["CMD", "mysqladmin", "--socket=/opt/mysql-data/mysqld.sock", "-uroot", "-ppassword", "ping", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

  app:
    image: ${CDO_DEV_BASE_IMAGE:-cdo-dev-base:latest}
    stdin_open: true
    init: true
    tty: true
    working_dir: /code-dot-org/frontend
    volumes:
      - cdo-repo:/code-dot-org
      - turbo-cache:/code-dot-org/frontend/.turbo/cache
    tmpfs:
      - /code-dot-org/dashboard/tmp:size=512m,uid=1000,gid=1000
      - /code-dot-org/dashboard/log:size=256m,uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "localhost-studio.code.org:127.0.0.1"
    environment:
      - RAILS_ENV=development
      - AWS_EC2_METADATA_DISABLED=true
    ports:
      - "${CDO_FRONTEND_PORT:-3036}:3036"
      - "${CDO_RAILS_PORT:-3000}:3000"
      - "${CDO_STORYBOOK_PORT:-6006}:6006"

volumes:
  cdo-repo:
    name: ${CDO_REPO_VOLUME:-cdo-repo}
  turbo-cache:
    name: cdo-turbo-cache
