# Services for the cdo-dev sandbox. One configuration, not a set of personas:
# the dev image carries every toolchain, so the same container serves Rails,
# apps/ and frontend/ work.
#
# The repo lives in a Docker volume as a real clone, populated by
# scripts/init-repo-volume.sh, not bind-mounted from the host. Everything —
# edits, git, tests, dev servers — happens inside the container, so the
# environment is the same on every machine rather than half host, half image.
#
# Gems are in the image at /usr/local/bundle, not in a volume, so there is no
# bundle to populate on first start.

services:
  app:
    image: ${CDO_DEV_IMAGE:-ghcr.io/code-dot-org/cdo-dev:latest}
    init: true
    stdin_open: true
    tty: true
    working_dir: /code-dot-org
    # The devcontainer CLI replaces ENTRYPOINT with its own keep-alive, so this
    # only applies to a plain `docker compose up`.
    command: sleep infinity
    volumes:
      - cdo-repo:/code-dot-org
      - turbo-cache:/code-dot-org/frontend/.turbo/cache
    # High-churn paths that should not grow the container's writable layer.
    tmpfs:
      - /code-dot-org/dashboard/tmp:size=512m,uid=1000,gid=1000
      - /code-dot-org/dashboard/log:size=256m,uid=1000,gid=1000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Rails builds absolute URLs against this hostname in development.
    extra_hosts:
      - "localhost-studio.code.org:127.0.0.1"
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      # Cheapest webpack settings by default; apps/README.md documents the
      # memory-versus-fidelity tradeoffs if you need to override them.
      - APPS_DEVTOOL=eval
      - SKIP_TYPECHECK=1
      - NODE_OPTIONS=--max-old-space-size=8192
    ports:
      - "${CDO_RAILS_PORT:-3000}:3000"
      - "${CDO_APPS_PORT:-9000}:9000"
      - "${CDO_FRONTEND_PORT:-3036}:3036"
    deploy:
      resources:
        limits:
          memory: ${CDO_MEMORY_LIMIT:-12g}

  # Pre-seeded MySQL. Seeding from scratch takes ~20 minutes; this image ships
  # a baked datadir so a fresh sandbox is usable in seconds. Build it with
  # scripts/bake-db.sh, which seeds via the cdo-migrate image — see the README.
  #
  # Ephemeral, deliberately: no volume. The baked datadir sits at a plain
  # path in the image and writes go to the container's copy-on-write layer,
  # so `up --force-recreate` is the reset — it returns to the pristine baked
  # state — and a rebuilt image takes effect the same way. Writes die with
  # the container, so durable state belongs in a seed, not in this database.
  # --datadir is how the official image takes server flags; see Dockerfile.db.
  db:
    image: ${CDO_DEV_DB_IMAGE:-cdo-dev-db:latest}
    command: --datadir=/opt/mysql-data
    # Socket form: mysqld's socket is not datadir-relative, so it stays at
    # the default /var/run/mysqld/mysqld.sock and needs no -h.
    healthcheck:
      test: ["CMD", "mysqladmin", "-uroot", "-ppassword", "ping", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

volumes:
  cdo-repo:
    name: ${CDO_REPO_VOLUME:-cdo-repo}
  turbo-cache:
    name: cdo-turbo-cache
