# The devcontainer: cdo-dev with the state it cannot hold itself.
#
# Rails, the apps webpack dev server and the frontend Vite server all run in
# the app container, by hand, in a terminal — this file starts nothing for
# you. It gives them a database, a cache, and the checkout.

services:
  db:
    image: ${CDO_DEV_DB_IMAGE:-ghcr.io/code-dot-org/cdo-devdb:latest}
    healthcheck:
      test: ["CMD", "mysqladmin", "-uroot", "-ppassword", "ping", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      # For a GUI client. Not 3306: that is usually a native MySQL already.
      - "${CDO_DB_PORT:-13306}:3306"

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # S3, emulated. Not a nicety: rendering a level page reaches S3 to ask
  # whether the lesson has a PDF, and with no credentials and no endpoint that
  # is a 500, not a missing PDF.
  #
  # Its API port is 9000, the same number the apps dev server uses. It is
  # deliberately not published — Rails reaches it as http://minio:9000 over
  # the compose network, where nothing else is listening.
  minio:
    image: ${CDO_DEV_MINIO_IMAGE:-minio/minio:latest}
    command: server /data --quiet
    environment:
      - MINIO_ROOT_USER=local-development
      - MINIO_ROOT_PASSWORD=allstudents
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs to completion before the app starts. Two jobs, both "make the empty
  # thing usable":
  #
  #   - Create the buckets Rails expects to exist. Only reads lazily create
  #     anything (lib/cdo/local_development.rb), so without this the first save
  #     of a project or an animation fails with NoSuchBucket. The list is
  #     docker/developers/install-s3.sh's.
  #   - Give the cache volume to uid 1000. Docker creates the mount point for
  #     a named volume as root when the path is absent from the image, and
  #     yarn runs as cdo.
  init:
    image: ${CDO_DEV_MINIO_IMAGE:-minio/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - yarn-cache:/yarn-cache
    entrypoint:
      - sh
      - -c
      - |
        chown 1000:1000 /yarn-cache
        mc alias set cdo http://minio:9000 local-development allstudents
        for b in cdo-ai cdo-animation-library cdo-restricted cdo-sound-library \
                 cdo-v3-animations cdo-v3-assets cdo-v3-files cdo-v3-libraries \
                 cdo-v3-sources videos.code.org; do
          mc mb --ignore-existing "cdo/$$b"
        done

  app:
    image: ${CDO_DEV_IMAGE:-ghcr.io/code-dot-org/cdo-dev:latest}
    volumes:
      # The checkout, at the one path the image is built around: WORKDIR,
      # git's safe.directory, and the venv's editable installs all say
      # /code-dot-org. In a codespace, and under "Clone Repository in
      # Container Volume", the host side of this is a clone made for the
      # container and nothing else touches it. Point it at a checkout you also
      # build natively and you own the consequences — see the README.
      - ..:/code-dot-org:cached

      # The container's config. A fresh clone has no locals.yml at all, and a
      # checkout that was also set up natively has one written for a native
      # install, naming a database this container cannot reach. Mounting
      # settles both cases the same way and copies nothing. Point CDO_LOCALS
      # at your own file to change any of it; editing the sample in place
      # would dirty the working tree.
      - type: bind
        source: ${CDO_LOCALS:-./locals.yml.sample}
        target: /code-dot-org/locals.yml
        read_only: true

      # yarn's global state: the download cache and the install index. It is
      # the only cache outside the checkout — apps/ sets enableGlobalCache
      # false and turbo's lives under frontend/, so both of those persist with
      # the workspace — and without a volume the frontend workspaces refetch
      # 1.25 GiB every time the container is recreated. The mount is the whole
      # of ~/.yarn rather than its cache/ subdirectory because yarn writes
      # index/ alongside cache/, and a volume mounted at the leaf leaves the
      # parent owned by root.
      - type: volume
        source: yarn-cache
        target: /home/cdo/.yarn
    working_dir: /code-dot-org
    stdin_open: true
    tty: true
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    extra_hosts:
      # The hostname every dev URL uses. Rails, the webpack proxy and the
      # Playwright suite all address the app as localhost-studio.code.org.
      - "localhost-studio.code.org:127.0.0.1"
    environment:
      - RAILS_ENV=development
      # What the entrypoint's pending-migration probe connects as. It reads
      # schema_migrations directly rather than booting Rails, so it needs the
      # credentials spelled out; rake still takes them from locals.yml.
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      # Fetch the prebuilt apps package on first start, so level pages render
      # without a local webpack build. See the README to develop in apps/.
      - DEVCONTAINER_BOOTSTRAP_APPS=true
      # The apps dev server is the memory hog here: eval source maps and no
      # in-process type checking are what keep it inside a laptop. Both are
      # documented in apps/README.md; your editor and CI still type-check.
      - APPS_DEVTOOL=eval
      - SKIP_TYPECHECK=1
      - NODE_OPTIONS=--max-old-space-size=8192
    ports:
      - "${CDO_RAILS_PORT:-3000}:3000"
      - "${CDO_APPS_PORT:-9000}:9000"
      - "${CDO_FRONTEND_PORT:-3036}:3036"
      # The two Storybooks. No override variables: they are occasional, and
      # a collision here is a `docker compose` flag away rather than a
      # standing configuration problem.
      - "9001:9001"
      - "6006:6006"

volumes:
  # No `name:`. Compose then prefixes it with the project — cdo-fresh_yarn-cache
  # rather than a machine-global cdo-yarn-cache that any other project's
  # `down -v` would delete. Two clones stop sharing a download cache, which is
  # the price of each clone owning its own.
  yarn-cache:
