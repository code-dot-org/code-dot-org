# Base compose for sandbox services. Persona-specific compose files extend this.
# Usage: docker compose -f docker-compose.yml -f docker-compose.<persona>.yml up

services:
  db:
    image: ${CDO_DEV_DB_IMAGE:-cdo-dev-db:latest}
    tmpfs:
      - /mysql-wal:size=256m,uid=999,gid=999
    healthcheck:
      test: ["CMD", "mysqladmin", "--socket=/opt/mysql-data/mysqld.sock", "-uroot", "-ppassword", "ping", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10
