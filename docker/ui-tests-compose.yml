# Docker Compose file for running ui tests.
#
# To run, set the following env variables (values obtainable from Circle):
# PROPERTIES_ENCRYPTION_KEY
# CLOUDFRONT_KEY_PAIR_ID
# CLOUDFRONT_PRIVATE_KEY
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# SAUCE_USERNAME
# SAUCE_ACCESS_KEY
#
# Also set the FIXUID and FIXGID env variables with these commands (or put them in your .bash_profile / .bashrc):
# export FIXUID=$(id -u)
# export FIXGID=$(id -g)
#
# then run:
# docker-compose -f ui-tests-compose.yml up
#
# To clean up:
# docker-compose -f ui-tests-compose.yml down

services:
  site:
    image: codedotorg/cdo-ci:1.18
    user: ${FIXUID:-1000}:${FIXGID:-1000}
    volumes:
      - ../:/home/ci/code-dot-org:delegated
      - rbenv:/home/ci/.rbenv
      - mysqldata:/var/lib/mysql
      - yarncache:/home/ci/.cache
      - gcloud_config:/home/ci/.config/gcloud
    environment:
      CI: 1
      CI_JOB: 'ui_tests'
      RAILS_ENV: 'test'
      RACK_ENV: 'test'
      DISABLE_SPRING: 1
      FIXUID: ${FIXUID:-}
    env_file:
      - env.list
    shm_size: '2gb' # necessary to avoid "invalid session id"/"session deleted because of page crash" errors in Selenium
    command: /bin/sh -c "docker/ci/scripts/ui_tests.sh"

  ui-tests-redis:
    image: redis

volumes:
  mysqldata:
  rbenv:
  yarncache:
  gcloud_config:
