include:
  - path: ./docker-compose.networks.yml

services:
  silo-base: &silo-base
    hostname: silo
    image: pgsty/silo:${SILO_VERSION:-latest}
    volumes:
      - silo1_storage:/data1
      - silo2_storage:/data2
      - silo3_storage:/data3
      - silo4_storage:/data4
    command: server --address ":9002" --console-address ":3001" /data1 /data2 /data3 /data4

  silo:
    <<: *silo-base
    environment: &silo-env
      MINIO_SERVER_URL: "http://localhost:9002"
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: allstudents
      MINIO_STORAGE_CLASS_STANDARD: "EC:2"
    ports:
      - "9002:9002"
      - "3001:3001"

  silo-contained:
    <<: *silo-base
    environment: &silo-contained-env
      MINIO_SERVER_URL: "http://silo:9002"
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: allstudents
      MINIO_STORAGE_CLASS_STANDARD: "EC:2"
    expose:
      - "9002"
      - "3001"
    networks:
      cdo_network:
      cdo_network_test:

  silo-install-base: &silo-install-base
    image: amazon/aws-cli
    entrypoint: ''
    working_dir: /app/src/docker/developers
    environment:
      - AWS_ACCESS_KEY_ID=local-development
      - AWS_SECRET_ACCESS_KEY=allstudents
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_S3_ENDPOINT_URL=http://localhost:9002
      - WITHIN_DOCKER=1
    volumes:
      - ../..:/app/src
    command: /bin/bash ./install-s3.sh

  silo-install:
    <<: *silo-install-base
    depends_on:
      - silo
    network_mode: host

  silo-contained-install:
    <<: *silo-install-base
    environment:
      - AWS_ACCESS_KEY_ID=local-development
      - AWS_SECRET_ACCESS_KEY=allstudents
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_S3_ENDPOINT_URL=http://silo:9002
      - WITHIN_DOCKER=1
    networks:
      cdo_network:
      cdo_network_test:

  mc:
    image: pgsty/mc
    depends_on:
      silo:
        condition: service_started
    entrypoint: ''
    networks:
      cdo_network:

  s3-services:
    image: alpine
    depends_on:
      silo:
        condition: service_started
    command: >
      /bin/sh -c "
        echo 'S3 Emulation Services Started (SILO)' &&
        echo &&
        echo 'To see and interact with the buckets:' &&
        echo 'http://localhost:3001' &&
        echo &&
        echo 'Username: local-development' &&
        echo 'Password: allstudents' &&
        echo &&
        echo 'To shut down the S3 service, use:' &&
        echo 'docker compose stop silo'
        echo &&
        echo 'You need to add the following to locals.yml to have your server use these services:' &&
        echo &&
        echo 'aws_s3_endpoint: http://localhost:9002' &&
        echo 'aws_s3_access_key_id: local-development' &&
        echo 'aws_s3_secret_access_key: allstudents' &&
        echo 'aws_s3_emulated: true'
      "

volumes:
  silo1_storage:
  silo2_storage:
  silo3_storage:
  silo4_storage:
