<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tutor Prompt Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Fixed-height tool area (header + panels) */
    #toolArea {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ── Header ── */
    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3a50;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #93c5fd;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .control-group label {
      color: #94a3b8;
      font-size: 12px;
      white-space: nowrap;
    }
    select {
      background: #0f1117;
      color: #e2e8f0;
      border: 1px solid #2d3a50;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #3b82f6; }

    .header-actions {
      display: flex;
      gap: 8px;
    }
    button {
      background: #1e3a5f;
      color: #93c5fd;
      border: 1px solid #2d5a9e;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #2d5a9e; }
    button.danger { background: #3b1a1a; color: #fca5a5; border-color: #7f1d1d; }
    button.danger:hover { background: #7f1d1d; }

    /* ── Main layout ── */
    main {
      display: grid;
      grid-template-columns: 480px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .left-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2d3a50;
      overflow: hidden;
    }

    /* Templates section */
    .templates-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid #2d3a50;
      min-height: 0;
      flex: 1;
    }
    .section-header {
      padding: 8px 12px 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      flex-shrink: 0;
    }
    .template-tabs {
      display: flex;
      border-bottom: 1px solid #2d3a50;
      flex-shrink: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      color: #64748b;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: #94a3b8; background: transparent; }
    .tab-btn.active { color: #93c5fd; border-bottom-color: #3b82f6; }

    .template-editor {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }
    .template-hint {
      font-size: 11px;
      color: #475569;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .template-hint code {
      background: #1e293b;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: #7dd3fc;
    }
    textarea {
      flex: 1;
      width: 100%;
      background: #0d1117;
      color: #e2e8f0;
      border: 1px solid #2d3a50;
      border-radius: 4px;
      padding: 8px;
      font-family: "SF Mono", "Fira Code", "Courier New", monospace;
      font-size: 11.5px;
      line-height: 1.5;
      resize: none;
      min-height: 0;
    }
    textarea:focus { outline: none; border-color: #3b82f6; }

    /* Studio data section */
    .studio-section {
      flex-shrink: 0;
      border-top: 1px solid #2d3a50;
      overflow-y: auto;
      max-height: 340px;
    }
    .studio-key-badge {
      font-family: "SF Mono", monospace;
      font-size: 10px;
      background: #1e293b;
      color: #7dd3fc;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
    }
    .studio-draft-badge {
      font-family: "SF Mono", monospace;
      font-size: 10px;
      background: #2d1f00;
      color: #fbbf24;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
    }
    .studio-fields {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px 12px;
    }
    .field-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: #94a3b8;
    }
    .field-label textarea {
      height: 70px;
      flex: none;
    }
    .field-label textarea.code-area { height: 110px; font-size: 11px; }
    .checkboxes {
      display: flex;
      gap: 16px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
    }
    input[type="checkbox"] { cursor: pointer; accent-color: #3b82f6; }

    .no-data-msg {
      padding: 12px;
      color: #475569;
      font-size: 12px;
      font-style: italic;
    }

    /* ── Right panel (output) ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .output-header {
      padding: 8px 12px 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      border-bottom: 1px solid #2d3a50;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .char-count {
      color: #475569;
      font-size: 10px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }
    #output-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    /* Section dividers in output */
    .output-section {
      margin-bottom: 0;
    }
    .output-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #334155;
      margin-bottom: 4px;
      padding: 2px 0;
      border-bottom: 1px solid #1e293b;
    }
    .output-section-text {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      line-height: 1.65;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
    }
    .separator {
      border: none;
      border-top: 1px dashed #1e293b;
      margin: 12px 0;
    }

    /* ── Expected output section ── */
    .eval-section {
      flex-shrink: 0;
      border-top: 1px solid #2d3a50;
      overflow-y: auto;
      max-height: 200px;
    }
    .video-checkboxes {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 12px 10px;
    }
    .video-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: #94a3b8;
      cursor: pointer;
    }
    .video-checkbox-label input { cursor: pointer; accent-color: #3b82f6; }

    /* ── Toast notification ── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e3a5f;
      color: #93c5fd;
      border: 1px solid #2d5a9e;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    /* Experiment runner */
    #experimentPanel {
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 16px 24px;
    }
    #experimentPanel h2 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #runProgress {
      margin: 10px 0;
      font-size: 12px;
      color: #94a3b8;
    }
    #progressBar {
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      margin: 6px 0;
      overflow: hidden;
    }
    #progressFill {
      height: 100%;
      background: #3b82f6;
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
    }
    #runStatus { font-size: 12px; color: #64748b; min-height: 16px; }

    /* Results table */
    #resultsPanel { margin-top: 16px; }
    #aggregateStats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 6px;
      padding: 10px 16px;
      min-width: 100px;
    }
    .stat-card .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
    .stat-card .stat-value { font-size: 22px; font-weight: 700; color: #93c5fd; }
    .stat-card .stat-value.good { color: #4ade80; }
    .stat-card .stat-value.bad  { color: #f87171; }
    #resultsTable { width: 100%; border-collapse: collapse; font-size: 11px; }
    #resultsTable th {
      text-align: left;
      padding: 6px 8px;
      color: #64748b;
      border-bottom: 1px solid #1e293b;
      font-weight: 500;
    }
    #resultsTable td {
      padding: 5px 8px;
      border-bottom: 1px solid #0f172a;
      color: #cbd5e1;
      vertical-align: top;
    }
    #resultsTable tr:hover td { background: #1e293b; }
    .pass-yes { color: #4ade80; }
    .pass-no  { color: #f87171; }
    .url-match { background: rgba(148, 163, 184, 0.15); border-radius: 2px; }
    .run-select-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  </style>
</head>
<body>

<div id="toolArea">
<header>
  <h1>🤖 AI Tutor Prompt Tool</h1>
  <div class="controls">
    <div class="control-group">
      <label for="levelSelect">Level:</label>
      <select id="levelSelect"></select>
    </div>
    <div class="control-group">
      <label for="stateSelect">State:</label>
      <select id="stateSelect"></select>
    </div>
    <label class="checkbox-label" style="margin-left:4px;">
      <input type="checkbox" id="videoRequestedCheck"> Video Requested
    </label>
  </div>
  <div class="header-actions">
    <button id="copyBtn">Copy Output</button>
    <button id="resetTemplatesBtn" class="danger">Reset Templates</button>
    <button id="runExperimentBtn">▶ Run Experiment</button>
  </div>
</header>

<main>
  <!-- ── Left Panel ── -->
  <div class="left-panel">

    <!-- Templates -->
    <div class="templates-section">
      <div class="section-header">Templates</div>
      <div class="template-tabs">
        <button class="tab-btn active" data-tab="system">System</button>
        <button class="tab-btn" data-tab="persona">Persona</button>
        <button class="tab-btn" data-tab="videoPrompt">Video Prompt</button>
        <button class="tab-btn" data-tab="editorContext">Editor Context</button>
      </div>
      <div class="template-editor">
        <div class="template-hint" id="tpl-hint"></div>
        <textarea id="tpl-textarea" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Studio Data Editor -->
    <div class="studio-section">
      <div class="section-header">
        Studio Data
        <span class="studio-key-badge" id="studioKeyBadge"></span>
        <span id="studioDraftBadge"></span>
      </div>
      <div id="studioEditorArea">
        <div class="no-data-msg">Select a level and state to edit studio data.</div>
      </div>
    </div>

    <!-- Expected Output -->
    <div class="eval-section">
      <div class="section-header">Expected Output</div>
      <div id="evalEditorArea"></div>
    </div>

  </div>

  <!-- ── Right Panel ── -->
  <div class="right-panel">
    <div class="output-header">
      Live Output
      <span class="char-count" id="charCount"></span>
    </div>
    <div id="output-area">
      <div id="output-content"></div>
    </div>
  </div>
</main>
</div><!-- #toolArea -->

<div id="toast">Copied to clipboard!</div>

<div id="experimentPanel">
  <h2>Experiment Runner</h2>
  <div class="run-select-row">
    <select id="runSelect"><option value="">— select a past run —</option></select>
    <button id="loadRunBtn">Load</button>
    <button id="downloadRunBtn" style="display:none">⬇ Download JSONL</button>
  </div>
  <div id="runProgress" style="display:none">
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="runStatus"></div>
  </div>
  <div id="resultsPanel" style="display:none">
    <div id="aggregateStats"></div>
    <div style="overflow-x:auto">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>#</th><th>Level</th><th>State</th><th>Vid?</th>
            <th>Pass</th><th>Expected</th><th>Found</th>
            <th>Missing</th><th>Unexpected</th><th>Hallucinated</th><th>Possible Video</th><th>Error</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
