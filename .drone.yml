---
# Drone CI pipeline running at: https://drone.cdn-code.org/code-dot-org/code-dot-org/
#
# Docs here: https://docs.google.com/document/d/1Qls20xfNN6T_DErOMwVQOFJsxAEAdMWFHzBDIbxyUQQ/edit#heading=h.9bln2fv2lgqd
#
# NOTE: after making changes to this file, you'll need to sign them using
# `drone sign code-dot-org/code-dot-org --save`

kind: pipeline
type: docker
name: unit

clone:
  disable: true

services:
  - name: ci-tests-redis
    image: redis
    ports:
      - 6379
  - name: ci-tests-mysql
    image: mysql:8.0
    ports:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD: 'not-a-secret'

steps:
  - name: bin/drone/shell
    image: curlimages/curl
    commands:
      - set +x
      # If running on EC2, get hostname from ec2 metadata
      - "IMDS_TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\")"
      - "hostname=$(curl -s -H \"X-aws-ec2-metadata-token: $IMDS_TOKEN\" http://169.254.169.254/latest/meta-data/public-hostname)"
      - |
        cat <<EOF

        Running on hostname: $hostname

        To "ssh" into this drone instance, wait until the 'unit-tests' step starts and run:
        bin/drone/shell $hostname

        You can also open a VSCode tunnel into drone to edit live:
        bin/drone/vscode $hostname
        EOF

  # Clone the PR branch without the production curriculum trees and build from
  # scratch. (Prototype: the cached staging build is not used here yet.)
  - name: checkout
    image: bitnamilegacy/git
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - git lfs install --skip-repo
      # Construct authenticated GitHub URL.
      # DRONE_REPO_OWNER = organization name (e.g., "code-dot-org")
      # DRONE_REPO_NAME = repository name (e.g., "code-dot-org")
      - AUTHENTICATED_GITHUB_URL="https://$GITHUB_TOKEN@github.com/$DRONE_REPO_OWNER/$DRONE_REPO_NAME.git"
      # Clone commits and trees only. File contents are fetched as the checkout
      # materializes them, so the trees the sparse checkout leaves out are
      # never transferred.
      - git clone --filter=blob:none --no-checkout --branch $DRONE_SOURCE_BRANCH $AUTHENTICATED_GITHUB_URL .
      # Materialize only bin/ and sparse-patterns/ first: the sparse checkout
      # script and its patterns.
      - git sparse-checkout set bin sparse-patterns
      - git checkout $DRONE_SOURCE_BRANCH
      - git reset --hard $DRONE_COMMIT
      - ./bin/sparse-checkout no-production-curriculum
      # Fetch the target branch (which is staging for pull requests.) We need this for determining which tests to run based on changed files.
      - git remote set-branches --add origin $DRONE_TARGET_BRANCH
      - git fetch --depth 100 origin $DRONE_TARGET_BRANCH
      # Merge so we're up-to-date with the target before running tests.
      - git config user.name "Drone"
      - git config user.email "drone-fake-user@code.org"
      - git merge origin/$DRONE_TARGET_BRANCH
      # Fail fast on a .gitattributes/LFS mismatch in the paths the PR changed.
      - ./bin/drone/check-lfs-pointers origin/$DRONE_TARGET_BRANCH $DRONE_COMMIT
      - ./bin/sparse-checkout verify

  - name: unit-tests
    # see: docker/ci/Dockerfile
    image: codedotorg/cdo-ci:1.25
    pull: always
    environment:
      CI_JOB: 'unit_tests'
    commands:
      # Cached data gets restored by the root user, so we need to reassign
      - sudo chown -R ci:ci .
      # Depended on by CI: https://github.com/code-dot-org/code-dot-org/blob/048e4ddffd52e62fd6a13566ea6ccd38a6701d89/lib/cdo/ci.rb/#L16
      - export GIT_COMMIT=$DRONE_COMMIT
      - export CI_BASE_BRANCH=$DRONE_TARGET_BRANCH
      - export CI_HEAD_BRANCH=$DRONE_SOURCE_BRANCH
      - EXIT_CODE=0
      - /entrypoint.sh docker/ci/scripts/unit_tests.sh || EXIT_CODE=$?
      # A blob count above the checkout step's means something read an
      # omitted tree; see bin/sparse-checkout.
      - ./bin/sparse-checkout verify
      - while pgrep bash >/dev/null; do echo "found bash process; keeping container alive"; sleep 20; done
      - exit $EXIT_CODE

trigger:
  branch:
    exclude:
      - "production"
      - "levelbuilder"
  event:
    - pull_request

---
kind: pipeline
type: docker
name: ui

clone:
  disable: true

services:
  - name: ci-tests-redis
    image: redis
    network_mode: host

steps:
  - name: bin/drone/shell
    image: curlimages/curl
    commands:
      - set +x
      # If running on EC2, get hostname from ec2 metadata
      - "IMDS_TOKEN=$(curl -s -X PUT http://169.254.169.254/latest/api/token -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\")"
      - "hostname=$(curl -s -H \"X-aws-ec2-metadata-token: $IMDS_TOKEN\" http://169.254.169.254/latest/meta-data/public-hostname)"
      - |
        cat <<EOF

        Running on hostname: $hostname

        To "ssh" into this drone instance, wait until the 'ui-tests' step starts and run:
        bin/drone/shell $hostname

        You can also open a VSCode tunnel into drone to edit live:
        bin/drone/vscode $hostname
        EOF

  # Implement mysql db as a detached step rather than a service, so that we can
  # wait to start it up until we've finished restoring the cache. (Prototype:
  # no cache is restored, so it starts empty and rake install creates the
  # databases.)
  - name: ci-tests-mysql
    image: mysql:8.0
    detach: true
    network_mode: host
    volumes:
      - name: mysql
        path: /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'not-a-secret'

  # Clone the PR branch without the production curriculum trees and build from
  # scratch. (Prototype: the cached staging build is not used here yet.)
  - name: checkout
    image: bitnamilegacy/git
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - git lfs install --skip-repo
      # Construct authenticated URL.
      # DRONE_REPO_OWNER = organization name (e.g., "code-dot-org")
      # DRONE_REPO_NAME = repository name (e.g., "code-dot-org")
      - AUTHENTICATED_GITHUB_URL="https://$GITHUB_TOKEN@github.com/$DRONE_REPO_OWNER/$DRONE_REPO_NAME.git"
      # Clone commits and trees only. File contents are fetched as the checkout
      # materializes them, so the trees the sparse checkout leaves out are
      # never transferred.
      - git clone --filter=blob:none --no-checkout --branch $DRONE_SOURCE_BRANCH $AUTHENTICATED_GITHUB_URL .
      # Materialize only bin/ and sparse-patterns/ first: the sparse checkout
      # script and its patterns.
      - git sparse-checkout set bin sparse-patterns
      - git checkout $DRONE_SOURCE_BRANCH
      - git reset --hard $DRONE_COMMIT
      - ./bin/sparse-checkout no-production-curriculum
      # Also fetch the target branch (usually staging for pull requests). We
      # need this for determining which tests to run based on changed files.
      - git remote set-branches --add origin $DRONE_TARGET_BRANCH
      - git fetch --depth 100 origin $DRONE_TARGET_BRANCH
      # Merge so we're up-to-date with the target before running tests.
      - git config user.name "Drone"
      - git config user.email "drone-fake-user@code.org"
      - git merge origin/$DRONE_TARGET_BRANCH
      - ./bin/sparse-checkout verify

  - name: ui-tests
    # see: docker/ci/Dockerfile
    image: codedotorg/cdo-ci:1.25
    pull: always
    # Share the worker's network namespace so puma on 0.0.0.0:3000 binds
    # on the worker's primary ENI, reachable from Device Farm's Chrome via
    # VPC peering.
    network_mode: host
    environment:
      CI_JOB: 'ui_tests'
      # Each Drone secret below must be explicitly passed to the corresponding
      # config value in test.yml.erb.
      SAUCE_USERNAME:
        from_secret: SAUCE_USERNAME
      SAUCE_ACCESS_KEY:
        from_secret: SAUCE_ACCESS_KEY
      VISUAL_PROVIDER: 'applitools'
      APPLITOOLS_API_KEY:
        from_secret: APPLITOOLS_API_KEY
    shm_size: '2gb' # necessary to avoid "invalid session id"/"session deleted because of page crash" errors in Selenium
    commands:
      # Cached data gets restored by the root user, so we need to reassign
      - sudo chown -R ci:ci .
      # With network_mode: host on this step and on both services, the
      # docker service-DNS names do not resolve. Point them at
      # 127.0.0.1 where the daemons now bind on the host.
      - echo "127.0.0.1 ci-tests-redis" | sudo tee -a /etc/hosts
      - echo "127.0.0.1 ci-tests-mysql" | sudo tee -a /etc/hosts
      # Depended on by CI: https://github.com/code-dot-org/code-dot-org/blob/048e4ddffd52e62fd6a13566ea6ccd38a6701d89/lib/cdo/ci.rb/#L16
      - export GIT_COMMIT=$DRONE_COMMIT
      - export CI_BASE_BRANCH=$DRONE_TARGET_BRANCH
      - export CI_HEAD_BRANCH=$DRONE_SOURCE_BRANCH
      - export CI_BUILD_NUMBER=$DRONE_BUILD_NUMBER # used by UI tests to set their S3 log path
      - export APPLITOOLS_BATCH_ID=$DRONE_COMMIT
      - export APPLITOOLS_BATCH_NAME="Drone PR Playwright Eyes Tests"
      - export APPLITOOLS_BRANCH=$DRONE_SOURCE_BRANCH
      - EXIT_CODE=0
      - /entrypoint.sh docker/ci/scripts/ui_tests.sh || EXIT_CODE=$?
      # A blob count above the checkout step's means something read an
      # omitted tree; see bin/sparse-checkout.
      - ./bin/sparse-checkout verify
      - while pgrep bash >/dev/null; do echo "found bash process; keeping container alive"; sleep 20; done
      - exit $EXIT_CODE

volumes:
  - name: mysql
    temp: {}

trigger:
  branch:
    exclude:
      - "production"
      - "levelbuilder"
  event:
    - pull_request

---
# On every push to staging, run a build which will prepare the environment to
# run CI tests and cache all of the relevant results. We then use that cache on
# subsequent feature branch CI tests as the initial state for the environment.
#
# Specifically, we cache:
# - The entire project directory, including the repository and all relevant
#   build artifacts, to reduce the time needed for the initial git clone and
#   the first build. This should include all installed third-party libraries
#   (ie, gems and node modules), a built apps package, and compiled assets.
# - A copy of the MySQL databases, to reduce seed time.
kind: pipeline
type: docker
name: cache-staging-build

clone:
  disable: true

services:
  - name: ci-tests-mysql
    image: mysql:8.0
    ports:
      - 3306
    volumes:
      - name: mysql
        path: /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'not-a-secret'

steps:
  - name: clone
    image: bitnamilegacy/git
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - git lfs install
      # Construct authenticated GitHub URL
      # DRONE_REPO_OWNER = organization name (e.g., "code-dot-org")
      # DRONE_REPO_NAME = repository name (e.g., "code-dot-org")
      - AUTHENTICATED_GITHUB_URL="https://$GITHUB_TOKEN@github.com/$DRONE_REPO_OWNER/$DRONE_REPO_NAME.git"
      - git clone --branch $DRONE_BRANCH $AUTHENTICATED_GITHUB_URL .

  # Do all the work necessary to run UI tests so we can capture a complete
  # snapshot of the fully-built project and resulting database, but don't
  # actually run the tests.
  - name: prepare-cacheable-build
    image: codedotorg/cdo-ci:1.25
    pull: always
    environment:
      CI_JOB: 'prepare_cacheable_build'
    commands:
      - sudo chown -R ci:ci .
      - /entrypoint.sh docker/ci/scripts/prepare_cacheable_build.sh
      # Generate baseline file count for validation
      - touch .cached-staging-build-file-count
      - "find . -type f -not -path './.git/*' | wc -l > .cached-staging-build-file-count"
      - 'printf "Baseline file count: %s\n" "$(cat .cached-staging-build-file-count)"'

  - name: cache-staging-ci-build
    image: plugins/s3-cache
    volumes:
      - name: mysql
        path: /var/lib/mysql
    settings:
      filename: cache-staging-ci-build.tar.gz
      endpoint: s3://cdo-drone
      rebuild: true
      debug: true
      pull: true
      mount:
        - .
        - /var/lib/mysql

volumes:
  - name: mysql
    temp: {}

trigger:
  branch:
    - "staging"
    - "staging-next"
  event:
    - push

