<!doctype html>
<html lang="en">
    <head>
        <!-- Metadata -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Doodle Identifier</title>

        <!-- Styles -->
        <link rel="stylesheet" href="styles.css" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header><h1>Doodle Identifier</h1></header>
        <main>
            <!-- Categories -->
            <section
                class="column"
                id="categories"
                aria-label="Categories"
            ></section>

            <!-- Training -->
            <section class="column" aria-labelledby="training-heading">
                <div class="training-container">
                    <h2 class="sr-only" id="training-heading">Training</h2>
                    <button
                        class="button-hero"
                        id="train-button"
                        type="button"
                        aria-describedby="train-status"
                        aria-disabled="true"
                    >
                        TRAIN
                    </button>
                    <div
                        class="train-progress"
                        id="train-progress"
                        role="progressbar"
                        aria-label="Training progress"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        hidden
                    >
                        <div
                            class="train-progress-fill"
                            id="train-progress-fill"
                        ></div>
                    </div>
                    <p
                        class="train-status"
                        id="train-status"
                        role="status"
                        aria-live="polite"
                    >
                        Add doodles to each category to train.
                    </p>
                </div>
            </section>

            <!-- Prediction -->
            <section class="column" aria-labelledby="prediction-heading">
                <div class="prediction-container">
                    <h2 class="sr-only" id="prediction-heading">Prediction</h2>
                    <canvas
                        id="predict-canvas"
                        width="280"
                        height="280"
                        role="img"
                        aria-label="Drawing area to identify a doodle"
                    ></canvas>
                    <button
                        class="button-semantic button-secondary"
                        id="predict-clear"
                        type="button"
                    >
                        Clear
                    </button>
                    <p id="prediction" aria-live="polite" aria-atomic="true">
                        Train a model to start identifying doodles.
                    </p>
                </div>
            </section>
        </main>

        <script src="classifier.js"></script>
        <script src="app.js"></script>
    </body>
</html>
