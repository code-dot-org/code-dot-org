<header class="topbar">
  <h1>Build the Machine</h1>
  <div class="actions">
    <button type="button" class="btn-run" id="power">
      <svg class="btn-icon" aria-hidden="true" focusable="false"><use href="#art-power"/></svg>
      <span id="power-label">Power on</span>
    </button>
    <button type="button" class="btn-reset" id="reset">Reset</button>
  </div>
</header>

<p class="status" id="status" role="status">Pick a part.</p>

<main class="layout">

  <section class="bin-wrap" aria-labelledby="bin-label">
    <h2 class="rail-title" id="bin-label">Parts</h2>
    <ul class="bin" id="bin"></ul>
  </section>

  <section class="stage-wrap" aria-labelledby="stage-label">
    <h2 class="rail-title visually-hidden" id="stage-label">Motherboard</h2>
    <div class="stage" id="stage">
      <svg class="board" viewBox="0 0 1000 780" aria-hidden="true" focusable="false">
        <use href="#art-board"/>
        <use class="seat" id="seat-use-cpu" href="#seat-cpu"/>
        <use class="seat" id="seat-use-ram-1" href="#seat-ram"/>
        <g class="seat" id="seat-use-ram-2" transform="translate(90 0)"><use href="#seat-ram"/></g>
        <use class="seat" id="seat-use-gpu" href="#seat-gpu"/>
        <use class="seat" id="seat-use-ssd" href="#seat-ssd"/>
        <use class="seat" id="seat-use-hdd" href="#seat-hdd"/>
      </svg>
      <div class="sockets" id="sockets"></div>
      <div class="hotspots" id="hotspots"></div>
      <button type="button" class="board-tag" id="board-tag">Motherboard</button>
    </div>
    <div class="sortboard" id="sortboard" hidden></div>
  </section>

  <section class="notes-wrap" aria-labelledby="notes-label">
    <h2 class="rail-title" id="notes-label">Notes</h2>
    <div class="notes" id="notes">
      <div class="note-body" id="note-body" aria-live="polite"></div>
    </div>
  </section>

</main>

</body>
</html>
