<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Playing Flip</title>
        <link rel="stylesheet" href="styles.css" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header>
            <h1><i>Flip</i></h1>
        </header>
        <main>
            <section class="flip-container" aria-label="Flip Container">
                <div class="results-container">
                    <span id="points-label">Points</span>
                    <p>
                        <output
                            id="flip-result"
                            aria-labelledby="points-label"
                            aria-live="polite"
                            >0</output
                        >
                    </p>
                </div>
                <div class="coin-container" aria-hidden="true"></div>
                <button
                    id="flip-button"
                    type="button"
                    class="button-semantic button-primary"
                >
                    Flip
                </button>
                <div class="flips-remaining-container">
                    <span id="flips-remaining-label">Flips Remaining</span>
                    <p>
                        <output
                            id="flip-remaining"
                            aria-labelledby="flips-remaining-label"
                            aria-live="polite"
                            >20</output
                        >
                    </p>
                </div>
            </section>
            <section
                class="distribution-container"
                aria-label="Distribution Container"
            >
                <div class="distribution-chart" aria-hidden="true"></div>
                <div class="distribution-text">
                    <div class="distribution-category-container">
                        <span id="heads-category-label" class="category-label"
                            >Heads</span
                        >
                        <span
                            id="heads-frequency"
                            aria-labelledby="heads-category-label"
                            >0</span
                        >
                    </div>
                    <div class="distribution-category-container">
                        <span id="tails-category-label" class="category-label"
                            >Tails</span
                        >
                        <span
                            id="tails-frequency"
                            aria-labelledby="tails-category-label"
                            >0</span
                        >
                    </div>
                </div>
            </section>
        </main>
    </body>
    <script type="module" src="app.js"></script>
</html>
