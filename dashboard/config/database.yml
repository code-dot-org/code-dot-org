<%
require 'dynamic_config/dcdo'

# Legacy database connection configuration settings. The Chef recipe that conditionally installs ProxySQL modifies
# these settings at build time to set the host name and port in these URIs to the localhost and port where ProxySQL
# is installed and listening for client database connections.
writer = URI.parse(CDO.dashboard_db_writer) if CDO.dashboard_db_writer
reader = URI.parse(CDO.dashboard_db_reader) if CDO.dashboard_db_reader

# Which proxy, if any, the read replica pool connects through: 'proxysql', 'rdsproxy', or 'none'.
proxysql_installed = !CDO.db_proxy_admin.nil?
database_proxy = DCDO.get('database_proxy', proxysql_installed ? 'proxysql' : 'none')
database_proxy = 'none' if database_proxy == 'proxysql' && !proxysql_installed

# Client database connection configuration settings for the primary (writer instance), replica (read replica
# instances), and reporting (reporting instances).
db_connection_settings = {
  primary: {
    database: writer.path.sub(%r{^/}, "") || "dashboard_#{Rails.env}",
    host: writer.host || 'localhost',
    password: writer.password || '',
    port: writer.port || 3306,
    username: writer.user || 'root',
  },
  primary_replica: {
    database: CDO.dashboard_db_name,
    host: CDO.db_endpoint_proxy_reader,
    password: CDO.db_credential_reader['password'],
    port: CDO.db_endpoint_proxy_reader_port,
    username: CDO.db_credential_reader['username'],
  },
  primary_reporting: {
    database: CDO.dashboard_db_name,
    host: CDO.db_endpoint_proxy_reporting,
    password: CDO.db_credential_reader['password'],
    port: CDO.db_endpoint_proxy_reporting_port,
    username: CDO.db_credential_reader['username'],
  },
}.tap do |hash|
  case database_proxy
  when 'proxysql'
    # The Chef recipe that conditionally installs ProxySQL modifies the hostname and port in `CDO.dashboard_db_reader`
    # to point to the localhost/port where ProxySQL is listening for client database connections.
    hash[:primary_replica] = {
      database: reader.path.sub(%r{^/}, ""),
      host: reader.host,
      password: reader.password,
      port: reader.port || 3306,
      username: reader.user,
    }
  when 'none'
    # Use the writer endpoint with the read-only `reader` SQL user for read-split SELECT statements.
    hash[:primary_replica] = hash[:primary_replica].merge(
      host: CDO.db_endpoint_writer,
      port: CDO.db_endpoint_writer_port
    )
  end
end
%>

mysql_defaults: &mysql_defaults
  adapter: mysql2
  prepared_statements: false
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  default_group: 'cdo'
  database_timezone: :utc

  # ActiveRecord connection-pool settings:
  # See: https://api.rubyonrails.org/classes/ActiveRecord/ConnectionAdapters/ConnectionPool.html
  # maximum number of connections the pool may manage (default 5).
  pool: 5

  # number of seconds to wait for a connection to become available before giving up and raising a timeout error (default 5 seconds).
  checkout_timeout: 3

  # `mysql_options` client options forwarded through the mysql2 adapter:
  # See: https://dev.mysql.com/doc/c-api/8.0/en/mysql-options.html

  # `MYSQL_OPT_CONNECT_TIMEOUT`: The connect timeout in seconds.
  connect_timeout: 2

<% if DCDO.get('enable_mysql_client_reconnect', true) %>
  # `MYSQL_OPT_RECONNECT` is deprecated https://dev.mysql.com/doc/c-api/8.0/en/c-api-auto-reconnect.html
  reconnect: true
<% end %>

  # `MYSQL_OPT_READ_TIMEOUT`: The timeout in seconds for each attempt to read from the server.
  # There are retries if necessary, so the total effective timeout value is three times the option value.
  # You can set the value so that a lost connection can be detected earlier than the TCP/IP Close_Wait_Timeout value of 10 minutes.
  #
  # NOTE: mysql2 reuses this variable as a query timeout without retry, so set it to the maximum query execution time.
  #
  # Set the MySQL client timeout to 2 minutes for SQL statements that are not executing within a web application server
  # such as queries executing in an ActiveJob worker, a cron job, or irb (dashboard-console). This is particularly
  # important for database migrations (DDL) or database seeding SQL statements that can take longer than 30 seconds
  # to complete and are executed by the aws/ci_build cron job.
  read_timeout: <%= CDO.running_web_application? ? 30 : 120 %>

  # `MYSQL_OPT_WRITE_TIMEOUT`: The timeout in seconds for each attempt to write to the server.
  # There is a retry if necessary, so the total effective timeout value is two times the option value.
  write_timeout: 5

environment_defaults: &environment_defaults
  primary:
    <<: *mysql_defaults
    database: <%= db_connection_settings[:primary][:database] %>
    host: <%= db_connection_settings[:primary][:host] %>
    password: <%= db_connection_settings[:primary][:password] %>
    port: <%= db_connection_settings[:primary][:port] %>
    username: <%= db_connection_settings[:primary][:username] %>
  # Always provision a read replica and a reporting database pool, even in environments that do not have an Aurora
  # cluster (with reader database instances) and that do not have RDS Proxy reader/reporting endpoints. In local
  # development environments and continuous integration builds CDO.db_endpoint_proxy_reader and
  # CDO.db_endpoint_proxy_reporting are set to the same servername as the writer database (typically 'localhost').
  primary_replica:
    replica: true
    <<: *mysql_defaults
    database: <%= db_connection_settings[:primary_replica][:database] %>
    host: <%= db_connection_settings[:primary_replica][:host] %>
    password: <%= db_connection_settings[:primary_replica][:password] %>
    port: <%= db_connection_settings[:primary_replica][:port] %>
    username: <%= db_connection_settings[:primary_replica][:username] %>
  primary_reporting:
    replica: true
    <<: *mysql_defaults
    <% unless CDO.running_web_application? %>
    # Set the MySQL client timeout to 10 minutes for reporting queries that are not executing within a web application server
    # such as queries executing in an ActiveJob worker, a cron job, or irb (dashboard-console).
    read_timeout: 600
    <% end %>
    database: <%= db_connection_settings[:primary_reporting][:database] %>
    host: <%= db_connection_settings[:primary_reporting][:host] %>
    password: <%= db_connection_settings[:primary_reporting][:password] %>
    port: <%= db_connection_settings[:primary_reporting][:port] %>
    username: <%= db_connection_settings[:primary_reporting][:username] %>

development:
  <<: *environment_defaults

staging: &staging
  <<: *environment_defaults

adhoc:
  <<: *environment_defaults

# levelbuilder environment extends the staging environment
levelbuilder:
  <<: *staging

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *environment_defaults
  # Override the default values for `database` and `pool` fields to accommodate
  # CI needs. To do that, we have to redefine the whole `primary` block
  primary:
    <<: *mysql_defaults
    database: dashboard_test<%= ENV['TEST_ENV_NUMBER'] %>
    host: <%= db_connection_settings[:primary][:host] %>
    password: <%= db_connection_settings[:primary][:password] %>
    pool: <%= ENV['CI'] ? 20 : 5 %>
    port: <%= db_connection_settings[:primary][:port] %>
    username: <%= db_connection_settings[:primary][:username] %>

production:
  <<: *environment_defaults
