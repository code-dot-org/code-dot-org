apiVersion: skaffold/v4beta11
kind: Config
build:
  artifacts:
  - image: mimic
    custom:
      buildCommand: k8s/bin/docker-buildx.sh -f k8s/mimic/docker/mimic.dockerfile --build-arg MIMIC_BASE="$MIMIC_BASE"
      dependencies:
        dockerfile:
          path: k8s/mimic/docker/mimic.dockerfile
    requires:
    - image: mimic-base
      alias: MIMIC_BASE
  - image: mimic-base
    custom:
      buildCommand: echo $PWD && k8s/bin/docker-buildx.sh -f k8s/mimic/docker/mimic-base.dockerfile
      dependencies:
        dockerfile:
          path: k8s/mimic/docker/mimic-base.dockerfile
deploy:
  helm:
    releases:
      - name: mimic
        chartPath: ./k8s/mimic/helm
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_mimic}}"
        valuesFiles:
          - k8s/mimic/helm/mimic.values.yaml

profiles:
- name: run-job
  patches:
      - op: add
        path: /deploy/helm/releases/0/setValueTemplates/job
        value:
          enabled: true
          name: sleep
          args: ["sleep 600"]
