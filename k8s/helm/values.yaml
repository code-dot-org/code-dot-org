# Default configuration, overridden by:
# - development.values.yml
# - production.values.yml
# argocd-detect-probe: code-dot-org run 10 at 2026-03-22T10:32:51Z

image: code-dot-org:latest
imagePullPolicy: IfNotPresent
command: ["bin/dashboard-server"]
args:

# Override to set RAILS_ENV
RAILS_ENV:
dnsName: studio-development
dashboard_workers: 0

# The chart defaults to a backend-only deployment (ActiveJob worker, no
# dashboard frontend). Stack dashboard.values.yaml (the Skaffold `dashboard`
# profile does this) to add the dashboard Deployment/Service/Ingress.
dashboard:
  enabled: false

locals.yml:
  # For example:
  # levelbuilder_mode: true
  # build_apps: false
  # ...etc...

extraEnv: {}

# Require the k8s secret `cdo-external-secrets` to exist before bootup
# Aka: "Require AWS Secrets Manager access to boot" mode
require_external_secrets: false

healthChecks:
  enabled: false

resources:
  cpu:
  memory:
  ephemeralStorage: 30Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  replicasWhenAutoscaleDisabled: 1

dashboardJob:
  enabled: false
  name: sh
  command: ["sh", "-c"]
  args: []
  restartPolicy: Never
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600 # cleanup job an hour after it completes

# ActiveJob (delayed_job) worker, enabled by default: the first piece of the
# app migrating to Kubernetes. RAILS_ENV, extraEnv, and resources here are
# pinned per-component (they do NOT inherit the chart-wide values) so the
# worker renders identically in every environment until k8s-gitops
# configures it per envType. Keep in sync with the static manifest in
# k8s/kustomize/components/backend/active-job-worker-deployment.yaml.
activeJobWorker:
  enabled: true
  replicas: 1
  command: ["sh", "-c"]
  args:
    - cd dashboard && bundle exec bin/delayed_job run
  RAILS_ENV: adhoc
  # Worker tuning; the blank secret overrides the adhoc boot needs live in
  # the shared locals ConfigMap (templates/locals.yml.yaml) so the
  # setup-db-minimal job inherits them too.
  extraEnv:
    AWS_EC2_METADATA_DISABLED: "true"
    CDO_ACTIVE_JOB_BACKEND_N_WORKERS_TO_START: "1"
    CDO_ACTIVE_JOB_BACKEND_ROLLING_RESTART_IN_N_BATCHES: "1"
    # Without this the preload aborts boot on an empty database.
    SKIP_SCRIPT_PRELOAD: "1"
  resources:
    cpu: 1
    # Measured on a kind cluster: the daemon plateaus at 3.2Gi. At 2Gi it is
    # OOMKilled about six seconds into boot, in a loop.
    memory: 4Gi
    ephemeralStorage: 30Gi

services:
  redis:
    enabled: false
    # skaffold development profile will auto-generate, see cdo-local-secrets:
    password:
  mysql:
    enabled: false
    # skaffold development profile will auto-generate, see cdo-local-secrets:
    password:
  minio:
    enabled: false
    user: minioadmin
    # skaffold development profile will auto-generate, see cdo-local-secrets:
    password:
    runSetupS3Job: false # seed the minio buckets, runs a one-time job

# These should match the docker image's USERNAME, UID and GID args
#
# NOTE: these currently have no effect because they are overridden to root
# in skaffold.yaml due to a bug in skaffold sync
user:
  username: code-dot-org
  uid: 1000
  gid: 1000
  home: /home/code-dot-org
  allowSudo: false

# Use the AWS creds from your local machine inside the dashboard container
# Tip: activate with the skaffold local-dev profile: `skaffold dev -p local-dev`
localDev:
  mounts:
    mountDotAWS: false
    mountDotConfigGcloud: false

    # These are set in the skaffold development profile so we can
    # use dynamic values appropriate to your particular system
    AWS_PROFILE: # for mountDotAWS: match AWS_PROFILE on your local system
    hostPaths:
      home: # ~ on  your local dev box, set automatically by skaffold
      skaffoldStorage: # code-dot-org/skaffoldStorage on your local dev box, set automatically by skaffold

scheduling:
  nodeSelector: {}
  tolerations: []
