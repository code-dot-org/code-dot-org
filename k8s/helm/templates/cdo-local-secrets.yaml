# K8S Secrets injected into the CDO.* namespace, for secrets running in the pod
# as opposed to secrets from AWS Secrets Manager.
#
# See: k8s/docs/kubernetes-secrets.md for an overview
#
# For AWS Secrets Manager secrets, see: cdo-external-secrets.tf

apiVersion: v1
kind: Secret
metadata:
  name: cdo-local-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "cdo.labels" (merge (dict "component" "cdo-local-secrets") .) | nindent 4 }}
type: Opaque
stringData:

{{- if .Values.services.mysql.enabled }}
  {{- $mysqlRootPassword := required "services.mysql.password must be set when services.mysql.enabled=true. Skaffold development injects this from cdo-local-secrets.env." .Values.services.mysql.password }}
  {{- $mysqlHost := include "cdo.mysqlServiceName" . }}
  {{- $mysqlUsername := "root" }}

  _mysql_root_password: {{ $mysqlRootPassword | quote }} # local service password
  db_writer: {{ printf "mysql://%s:%s@%s/" $mysqlUsername $mysqlRootPassword $mysqlHost | quote }}
  db_reader: {{ printf "mysql://%s:%s@%s/" $mysqlUsername $mysqlRootPassword $mysqlHost | quote }}
  reporting_db_writer: {{ printf "mysql://%s:%s@%s/" $mysqlUsername $mysqlRootPassword $mysqlHost | quote }}
  reporting_db_reader: {{ printf "mysql://%s:%s@%s/" $mysqlUsername $mysqlRootPassword $mysqlHost | quote }}
  db_credential_admin: {{ printf "{\"username\":\"%s\",\"password\":\"%s\"}" $mysqlUsername $mysqlRootPassword | quote }}
  db_credential_writer: {{ printf "{\"username\":\"%s\",\"password\":\"%s\"}" $mysqlUsername $mysqlRootPassword | quote }}
  db_credential_reader: {{ printf "{\"username\":\"%s\",\"password\":\"%s\"}" $mysqlUsername $mysqlRootPassword | quote }}
{{- end }}


{{- if .Values.services.redis.enabled }}
  {{- $redisPassword := required "services.redis.password must be set when services.redis.enabled=true. Skaffold development injects this from cdo-local-secrets.env." .Values.services.redis.password }}
  {{- $redisHost := include "cdo.redisServiceName" . }}

  _redis_password: {{ $redisPassword | quote }} # local service password
  redis_url: {{ printf "redis://:%s@%s:6379/0" $redisPassword $redisHost | quote }}
  netsim_redis_groups: |
    - master: {{ printf "redis://:%s@%s:6379" $redisPassword $redisHost | quote }}

{{- end }}


{{- if .Values.services.minio.enabled }}
  {{- $minioRootPassword := required "services.minio.password must be set when services.minio.enabled=true. Skaffold development injects this from cdo-local-secrets.env." .Values.services.minio.password }}
  {{- $minioRootUser := default "minioadmin" .Values.services.minio.user }}

  _minio_root_password: {{ $minioRootPassword | quote }} # local service password
  _minio_root_user: {{ $minioRootUser | quote }} # local service username
  aws_s3_access_key_id: {{ $minioRootUser | quote }}
  aws_s3_secret_access_key: {{ $minioRootPassword | quote }}

{{- end }}
