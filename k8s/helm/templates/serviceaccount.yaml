{{- if .Values.serviceAccount.create }}
# Identity for every pod this chart runs (see serviceAccount in values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{ include "cdo.labels" (merge (dict "component" "app") .) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
