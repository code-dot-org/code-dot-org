{{- $worker := .Values.activeJobWorker -}}
{{- $priorityFlags := dict "both" "" "high" " --max-priority 9" "low" " --min-priority 10" -}}
{{- if not (kindIs "string" $worker.priorityMode) -}}
{{- fail "activeJobWorker.priorityMode must be one of: both, high, low" -}}
{{- end -}}
{{- if not (hasKey $priorityFlags $worker.priorityMode) -}}
{{- fail "activeJobWorker.priorityMode must be one of: both, high, low" -}}
{{- end -}}
{{- if and (ne $worker.priorityMode "both") (or (not (deepEqual $worker.command (list "sh" "-c"))) (not (empty $worker.args))) -}}
{{- fail "custom activeJobWorker.command or args require priorityMode: both; remove the overrides to use priority filtering" -}}
{{- end -}}
{{- $args := $worker.args | default (list (printf "cd dashboard && exec bundle exec bin/delayed_job%s run" (get $priorityFlags $worker.priorityMode))) -}}
{{- if $worker.enabled -}}
# See _dashboard.yaml for shared Deployment details.
#
# The worker pins RAILS_ENV, extraEnv, resources, and local-dev mounts from
# activeJobWorker values so its rendering does not vary with per-environment
# values. This keeps it identical to the static manifest in
# k8s/kustomize/components/backend/active-job-worker-deployment.yaml until
# k8s-gitops configures the worker per environment.
{{- include "dashboard"
  (merge (dict
    "apiVersion" "apps/v1"
    "kind" "Deployment"
    "name" (include "cdo.fullname" (merge (dict "component" "active-job-worker") .))
    "shortName" "active-job-worker"
    "labels" (include "cdo.labels" (merge (dict "component" "active-job-worker") .))
    "selectorLabels" (include "cdo.selectorLabels" (merge (dict "component" "active-job-worker") .))
    "replicas" .Values.activeJobWorker.replicas
    "command" .Values.activeJobWorker.command
    "args" $args
    "RAILS_ENV" .Values.activeJobWorker.RAILS_ENV
    "extraEnv" .Values.activeJobWorker.extraEnv
    "resources" .Values.activeJobWorker.resources
    "localDevMountsEnabled" false
    "healthChecksEnabled" false
    "portsEnabled" false
  ) .)
}}
{{- end }}
