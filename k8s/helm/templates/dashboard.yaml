apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdo.fullname" (merge (dict "component" "dashboard") .) }}
  labels:
    {{ include "cdo.labels" (merge (dict "component" "dashboard") .) | nindent 4 }}
spec:
  selector:
    {{ include "cdo.selectorLabels" (merge (dict "component" "dashboard") .) | nindent 4 }}
  ports:
    - protocol: TCP
      port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdo.fullname" (merge (dict "component" "dashboard") .) }}
  labels:
    {{ include "cdo.labels" (merge (dict "component" "dashboard") .) | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.autoscaling.replicasWhenAutoscaleDisabled }}
  {{- end }}
  selector:
    matchLabels:
      {{ include "cdo.selectorLabels" (merge (dict "component" "dashboard") .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "cdo.labels" (merge (dict "component" "dashboard") .) | nindent 8 }}
    spec:
      containers:
      - name: dashboard
        image: "{{.Values.image}}"
        command: {{ .Values.command | toJson }}
        # command: ["zsh"]
        env:
          - name: RAILS_ENV
            value: {{ .Values.RAILS_ENV }}
          - name: RACK_ENV
            value: {{ .Values.RAILS_ENV }}
          {{- if .Values.development.mounts.mountDotAWS }}
          - name: AWS_PROFILE
            value: {{ .Values.development.mounts.AWS_PROFILE }}
          {{- end }}
        ports:
        - name: http
          containerPort: 3000
        tty: true # dashboard stdout logging assumes a tty
        # startupProbe:
        #   # Fail pod if it hasn't started within 5 minutes
        #   failureThreshold: 300
        #   periodSeconds: 1
        #   timeoutSeconds: 5
        #   httpGet:
        #     path: /health_check
        #     port: http
        # readinessProbe:
        #   # After pod is started, ping /health_check every 10s, if it fails 2 in a row
        #   # stop sending the pod traffic until it passes 2x health checks in a row.
        #   successThreshold: 2
        #   failureThreshold: 2
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        #   httpGet:
        #     path: /health_check
        #     port: http
        # livenessProbe:
        #   # If the pod is down for 2 minutes, consider it irrecoverable and restart it.
        #   failureThreshold: 4
        #   periodSeconds: 30
        #   timeoutSeconds: 5
        #   httpGet:
        #     path: /health_check
        #     port: http
        volumeMounts:
        {{- if .Values.development.mounts.mountDotAWS }}
        # These allow us to re-use our aws / aws-google login from our local machine.
        - mountPath: {{ .Values.user.home }}/.aws
          name: dot-aws
        {{- end }}
        {{- if .Values.development.mounts.mountDotConfigGcloud }}
        - mountPath: {{ .Values.user.home }}/.config/gcloud
          name: dot-config-gcloud
        {{- end }}
        - mountPath: /code-dot-org/locals.yml
          name: locals-yml
          subPath: locals.yml
        securityContext:
          allowPrivilegeEscalation: {{ if .Values.user.allowSudo }}true{{ else }}false{{ end }}
      volumes:
        - name: locals-yml
          configMap:
            name: {{ include "cdo.fullname" (merge (dict "component" "locals.yml") .) }}
        {{- if .Values.development.mounts.mountDotAWS }}
        - name: dot-aws
          persistentVolumeClaim:
            claimName: {{ include "cdo.fullname" (merge (dict "component" "dot-aws") .) }}
        {{- end }}
        {{- if .Values.development.mounts.mountDotConfigGcloud }}
        - name: dot-config-gcloud
          persistentVolumeClaim:
            claimName: {{ include "cdo.fullname" (merge (dict "component" "dot-config-gcloud") .) }}
        {{- end }}
            
      securityContext:
        runAsUser: {{ .Values.user.uid }}
        runAsGroup: {{ .Values.user.gid }}
        fsGroup: {{ .Values.user.gid }}

{{- if or (eq .Values.RAILS_ENV "") (not .Values.RAILS_ENV) }}
{{- fail (printf "Error: RAILS_ENV is not set by values.yaml (current value: '%s').\n\nHint: if you're trying to do local dev with skaffold, try the -p flag, e.g. `skaffold -p development` sets RAILS_ENV=development.\n" .Values.RAILS_ENV) }}
{{- end }}
