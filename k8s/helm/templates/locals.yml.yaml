apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdo.fullname" (merge (dict "component" "locals.yml") .) }}
  labels:
    {{ include "cdo.labels" (merge (dict "component" "locals.yml") .) | nindent 4 }}
data:
  locals.yml: |
    build_apps: true
    use_my_apps: true
    dashboard_workers: {{ .Values.dashboard_workers }}

    # These are secrets that cause exceptions booting our dashbaord app in development
    # We hope to get rid of needing these overrides soon, see:
    # - https://codedotorg.slack.com/archives/C03CK49G9/p1773224406769729
    cloudfront_key_pair_id:
    cloudfront_private_key:
    slack_bot_token:
    properties_encryption_key:
    openai_lesson_summaries_api_key:
    elevenlabs_api_key:
    openai_student_learning_api_key:
    langfuse_secret_key:
    langfuse_public_key:
    openai_measures_of_learning_api_key:

    # Local service non-secret configuration. Append-only so we do not mix these
    # values into the legacy locals.yml sections above.
    {{- if .Values.services.mysql.enabled }}
    db_cluster_id: {{ include "cdo.mysqlServiceName" . }}
    db_endpoint_writer: {{ include "cdo.mysqlServiceName" . }}
    db_endpoint_writer_port: 3306
    db_endpoint_proxy_writer: {{ include "cdo.mysqlServiceName" . }}
    db_endpoint_proxy_writer_port: 3306
    db_endpoint_proxy_reader: {{ include "cdo.mysqlServiceName" . }}
    db_endpoint_proxy_reader_port: 3306
    db_endpoint_proxy_reporting: {{ include "cdo.mysqlServiceName" . }}
    db_endpoint_proxy_reporting_port: 3306
    {{- end }}

    {{- if .Values.services.minio.enabled }}
    aws_s3_endpoint: http://{{ include "cdo.minioServiceName" . }}:9000
    aws_s3_emulated: true
    {{- end }}
