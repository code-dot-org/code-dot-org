apiVersion: v1
kind: Namespace
metadata:
  name: __TEST_NAMESPACE__
---
apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  scheme: internet-facing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-gateway
  template:
    metadata:
      labels:
        app: hello-gateway
    spec:
      containers:
        - name: hello
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  selector:
    app: hello-gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.k8s.aws/v1beta1
kind: TargetGroupConfiguration
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  targetReference:
    name: hello-gateway
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: hello-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-gateway
  namespace: __TEST_NAMESPACE__
spec:
  parentRefs:
    - name: hello-gateway
      sectionName: http
  hostnames:
    - __TEST_HOSTNAME__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello-gateway
          port: 80
