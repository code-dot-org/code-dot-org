{{- if .Values.single_namespace_environment_type }}
#==============================================================================
# Per-k8s-namespace ExternalSecret : cdo-external-secrets in kubernetes
#
# This syncs all secrets like {namespace}/cdo/* from AWS Secrets Manager into a
# single Kubernetes Secret named cdo-external-secrets.
#==============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cdo-external-secrets
  namespace: {{ .Values.environment_type }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager-store
    kind: SecretStore
  target:
    name: cdo-external-secrets
  dataFrom:
    - find:
        path: {{ printf "%s/cdo/" .Values.environment_type | quote }}
        name:
          regexp: {{ printf "^%s/cdo/.*$" .Values.environment_type | quote }}
      rewrite:
        - regexp:
            source: {{ printf "^%s/cdo/(.*)$" .Values.environment_type | quote }}
            target: "$1"
{{- else }}
#==============================================================================
# ClusterExternalSecret fanout for multi-namespace env types like adhoc-*
#
# ClusterExternalSecret selects namespaces by label, not by regex. To have all
# adhoc-* namespaces receive this ExternalSecret, label them with:
# code.org/environment-type = adhoc
#==============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cdo-external-secrets-{{ .Values.environment_type }}
spec:
  externalSecretName: cdo-external-secrets
  namespaceSelectors:
    - matchLabels:
        code.org/environment-type: {{ .Values.environment_type | quote }}
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: aws-secrets-manager-store-{{ .Values.environment_type }}
      kind: ClusterSecretStore
    target:
      name: cdo-external-secrets
    dataFrom:
      - find:
          path: {{ printf "%s/cdo/" .Values.environment_type | quote }}
          name:
            regexp: {{ printf "^%s/cdo/.*$" .Values.environment_type | quote }}
        rewrite:
          - regexp:
              source: {{ printf "^%s/cdo/(.*)$" .Values.environment_type | quote }}
              target: "$1"
{{- end }}
