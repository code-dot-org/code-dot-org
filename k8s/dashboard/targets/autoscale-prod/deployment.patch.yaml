apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-dashboard
spec:
  template:
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/code-dot-org/code-dot-org:replace-me
          env:
            - name: RAILS_ENV
              value: production
            - name: RACK_ENV
              value: production
          envFrom:
            - prefix: CDO_
              configMapRef:
                name: cdo-locals.yml
            - prefix: CDO_
              secretRef:
                name: cdo-external-secrets
                optional: false
            - prefix: CDO_
              secretRef:
                name: cdo-local-secrets
          resources:
            limits:
              cpu: 47.68
              memory: 185.92Gi
