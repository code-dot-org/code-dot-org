apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-dashboard
spec:
  template:
    spec:
      containers:
        - name: dashboard
          env:
            - name: RAILS_ENV
              value: test
            - name: RACK_ENV
              value: test
          resources:
            limits:
              cpu: 96.85
              memory: 377.65Gi
