# Using skaffold (https://skaffold.dev/) allows us to start a kubernetes cluster
# for code.org development with one command: `skaffold dev`
#
# This is currently an experimental feature, see: k8s/experimental.yaml
#
# IF YOU MODIFY THIS FILE, also fix its sibling ../../../skaffold.yaml in the same
# way until we decide between Helm and Kustomize.
#
# Layering: the base config builds and deploys a BACKEND-ONLY stack (the
# ActiveJob worker, no dashboard frontend, no frontend asset build) from
# overlays/skaffold-backend. Every additional layer is an explicit profile:
#
#   skaffold dev                  # backend only (the base config)
#   skaffold dev -p dashboard     # full app (overlays/skaffold)
#   skaffold build -p release     # full production-flavored image

apiVersion: skaffold/v4beta13
kind: Config
build:
  hooks:
    before:
      # Populate kustomize secretGenerator env files from the same
      # repo-root cdo-local-secrets.env file used by the Helm Skaffold config.
      - command: ["./bin/generate-cdo-local-secrets"]
  artifacts:
  # Backend-only runtime image: Rails without the frontend asset build.
  # The dashboard/release profiles below retarget this artifact to the full
  # `runtime` image and add the frontend artifact chain it requires.
  - image: code-dot-org
    context: ../..
    sync:
      infer:
        # rerun watching
        # /app/src/lib, /app/src/shared/middleware, /app/src/dashboard/legacy, /app/src/pegasus for **/*.{rb,ru,yml} (ignoring **/migrations/*.rb,test/**/*.rb)\
        - '**/*.rb'
        - '**/*.ru'
        - '**/*.yml'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.json'
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        IMPORT_IMAGE_TO_K8S_NODE=true "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org.dockerfile" \
          --target code-dot-org-activejob-only \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg BUNDLE_WITHOUT=development:test:production:adhoc:staging:levelbuilder:integration
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org.dockerfile
    requires:
    - image: code-dot-org-core
      alias: CODE_DOT_ORG_CORE
  - image: code-dot-org-core
    context: ../..
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-core.dockerfile" \
          --target code-dot-org-core
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org-core.dockerfile

manifests:
  kustomize:
    paths:
      - overlays/skaffold-backend

deploy:
  kubectl: {}
  # Rails takes long enough to boot that the startup probe can fail transiently.
  # Let Kubernetes enforce the probe threshold instead of failing on its first event.
  tolerateFailuresUntilDeadline: true

profiles:

# Layer the dashboard frontend on top of the backend-only base: build the
# full `runtime` image (with the frontend artifact chain) and deploy
# overlays/skaffold (backend + dashboard). Explicit opt-in:
# `skaffold dev -p dashboard`.
#
- name: dashboard
  patches:
    # Development-flavored full image; see the `release` profile for the
    # production-flavored equivalent.
    - op: replace
      path: /build/artifacts/0/custom/buildCommand
      value: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org.dockerfile" \
          --target runtime \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg CODE_DOT_ORG_DB_SEED="$CODE_DOT_ORG_DB_SEED" \
          --build-arg CODE_DOT_ORG_PEGASUS="$CODE_DOT_ORG_PEGASUS" \
          --build-arg CODE_DOT_ORG_STATIC="$CODE_DOT_ORG_STATIC" \
          --build-arg BUNDLE_WITHOUT=test:production:staging:levelbuilder
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-db-seed
        alias: CODE_DOT_ORG_DB_SEED
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-pegasus
        alias: CODE_DOT_ORG_PEGASUS
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-static
        alias: CODE_DOT_ORG_STATIC
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-pegasus
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-pegasus.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-pegasus.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-static
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-static.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-static.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-db-seed
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-db-seed.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-db-seed.dockerfile
    - op: replace
      path: /manifests/kustomize/paths/0
      value: overlays/skaffold
    - op: add
      path: /portForward/-
      value:
        resourceType: Service
        resourceName: cdo-dashboard
        port: http
        localPort: 13000
    - op: add
      path: /portForward/-
      value:
        resourceType: Service
        resourceName: cdo-dashboard
        port: http-hmr
        localPort: 19000

# Production-flavored full image build, matching the `release` profile in the
# sibling Helm skaffold.yaml. Do NOT combine with the dashboard profile (both
# add the same artifacts).
- name: release
  patches:
    - op: replace
      path: /build/artifacts/0/custom/buildCommand
      value: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org.dockerfile" \
          --target runtime \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg CODE_DOT_ORG_DB_SEED="$CODE_DOT_ORG_DB_SEED" \
          --build-arg CODE_DOT_ORG_PEGASUS="$CODE_DOT_ORG_PEGASUS" \
          --build-arg CODE_DOT_ORG_STATIC="$CODE_DOT_ORG_STATIC"
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-db-seed
        alias: CODE_DOT_ORG_DB_SEED
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-pegasus
        alias: CODE_DOT_ORG_PEGASUS
    - op: add
      path: /build/artifacts/0/requires/-
      value:
        image: code-dot-org-static
        alias: CODE_DOT_ORG_STATIC
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-pegasus
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-pegasus.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-pegasus.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-static
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-static.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-static.dockerfile
    - op: add
      path: /build/artifacts/-
      value:
        image: code-dot-org-db-seed
        context: ../..
        custom:
          buildCommand: |
            K8S_DIR="$BUILD_CONTEXT/k8s"
            if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
              K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
            fi
            "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-db-seed.dockerfile"
          dependencies:
            dockerfile:
              path: ../docker/code-dot-org-db-seed.dockerfile
    - op: replace
      path: /manifests/kustomize/paths/0
      value: overlays/skaffold

# Mount local machine credential directories into the dashboard container so it can
# use your local AWS and gcloud credentials. To use: `skaffold dev -p local-dev`
- name: local-dev
  patches:
    - op: add
      path: /manifests/kustomize/paths/-
      value: overlays/skaffold-local-dev

# Populates Dashboard DB (rake dashboard:setup_db)
# Needs the full image (seed data), so include the dashboard profile.
# Run: skaffold dev --trigger=manual -p dashboard -p setup-db -p setup-s3
- name: setup-db
  patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-db

# Creates or migrates the Dashboard DB without seeding curriculum data.
# Run: skaffold dev --trigger=manual -p setup-db-minimal
- name: setup-db-minimal
  patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-db-minimal

# Create standard cdo-v3-* S3 buckets in minio.
# Run: skaffold dev --trigger=manual -p dashboard -p setup-db -p setup-s3
- name: setup-s3
  patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-s3

portForward:
- resourceType: Service
  resourceName: cdo-mysql
  port: mysql
  localPort: 13306
- resourceType: Service
  resourceName: cdo-redis
  port: redis
  localPort: 16379
- resourceType: Service
  resourceName: cdo-minio
  port: api
  localPort: 29000
- resourceType: Service
  resourceName: cdo-minio
  port: console
  localPort: 29001

# Kustomize gaps:
# - The old Helm `local-dev` profile injected dynamic host paths and AWS_PROFILE via Skaffold templating.
#   I did not find a clean Kustomize-native equivalent without introducing generated local overlay files, so
#   `overlays/skaffold-local-dev` is intentionally not implemented yet.
