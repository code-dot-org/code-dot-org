# Using skaffold (https://skaffold.dev/) allows us to start a kubernetes cluster
# for code.org development with one command: `skaffold dev`
#
# This is currently an experimental feature, see: k8s/experimental.yaml
#
# IF YOU MODIFY THIS FILE, also fix its sibling ../../../skaffold.yaml in the same
# way until we decide between Helm and Kustomize.

apiVersion: skaffold/v4beta13
kind: Config
build:
  hooks:
    before:
      # Populate kustomize secretGenerator env files from the same
      # repo-root cdo-local-secrets.env file used by the Helm Skaffold config.
      - command: ["./bin/generate-cdo-local-secrets"]
  artifacts:
  - image: code-dot-org
    context: ../..
    sync:
      infer:
        # rerun watching
        # /app/src/lib, /app/src/shared/middleware, /app/src/dashboard/legacy, /app/src/pegasus for **/*.{rb,ru,yml} (ignoring **/migrations/*.rb,test/**/*.rb)\
        - '**/*.rb'
        - '**/*.ru'
        - '**/*.yml'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.json'
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org.dockerfile" \
          --build-arg CODE_DOT_ORG_CORE="$CODE_DOT_ORG_CORE" \
          --build-arg CODE_DOT_ORG_DB_SEED="$CODE_DOT_ORG_DB_SEED" \
          --build-arg CODE_DOT_ORG_PEGASUS="$CODE_DOT_ORG_PEGASUS" \
          --build-arg CODE_DOT_ORG_STATIC="$CODE_DOT_ORG_STATIC"
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org.dockerfile
    requires:
    - image: code-dot-org-core
      alias: CODE_DOT_ORG_CORE
    - image: code-dot-org-db-seed
      alias: CODE_DOT_ORG_DB_SEED
    - image: code-dot-org-pegasus
      alias: CODE_DOT_ORG_PEGASUS
    - image: code-dot-org-static
      alias: CODE_DOT_ORG_STATIC
  - image: code-dot-org-core
    context: ../..
    custom:
      # skaffold sync only works when the user is root 😤:
      # https://github.com/GoogleContainerTools/skaffold/issues/2479
      # If we find a solution, we can drop this override:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-core.dockerfile" \
          --build-arg USERNAME=root \
          --build-arg UID=0 \
          --build-arg GID=0
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org-core.dockerfile
  - image: code-dot-org-pegasus
    context: ../..
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-pegasus.dockerfile"
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org-pegasus.dockerfile
  - image: code-dot-org-static
    context: ../..
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-static.dockerfile"
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org-static.dockerfile
  - image: code-dot-org-db-seed
    context: ../..
    custom:
      buildCommand: |
        K8S_DIR="$BUILD_CONTEXT/k8s"
        if [ ! -x "$K8S_DIR/bin/docker-buildx" ]; then
          K8S_DIR="$(cd "$BUILD_CONTEXT/../.." && pwd)"
        fi
        "$K8S_DIR/bin/docker-buildx" -f "$K8S_DIR/docker/code-dot-org-db-seed.dockerfile"
      dependencies:
        dockerfile:
          path: ../docker/code-dot-org-db-seed.dockerfile

manifests:
  kustomize:
    paths:
      - overlays/skaffold

deploy:
  kubectl: {}

profiles:

# Mount local machine credential directories into the dashboard container so it can
# use your local AWS and gcloud credentials. To use: `skaffold dev -p local-dev`
- name: local-dev
  patches:
    - op: add
      path: /manifests/kustomize/paths/-
      value: overlays/skaffold-local-dev

# Populates Dashboard DB (rake dashboard:setup_db)
# Run: skaffold dev --trigger=manual -p setup-db -p setup-s3
- name: setup-db
  patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-db

# Create standard cdo-v3-* S3 buckets in minio.
# Run: skaffold dev --trigger=manual -p setup-db -p setup-s3
- name: setup-s3
  patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-s3

# Mimic allows us to run a light-weight stubbed version of our huge repo. Its great for
# fast iterative development of our k8s docker files and helm charts.
#
# To use:
# 1. First-time: cd k8s/kustomize && skaffold dev -p mimic --cache-artifacts=false
# 2. Run: cd k8s/kustomize && skaffold dev -p mimic
#
# For details, see: ../mimic/README.md
- name: mimic
  patches:
    # Create the k8s/mimic/cdo-no-symlinks dir to serve as the build context for the
    # mimic docker build. This is just a copy of k8s/mimic/code-dot-org, but symlinks
    # have been replaced by copies of the real files, because docker doesn't follow
    # symlinks outside its root build context.
    - op: add
      path: /build/hooks/before/-
      value:
        command: ["../mimic/bin/update-cdo-no-symlinks.sh"]
    # Artifact 0 (code-dot-org)
    - op: replace
      path: /build/artifacts/0/context
      value: ../mimic/cdo-no-symlinks
    - op: replace
      path: /build/artifacts/0/image
      value: mimic
    # Artifact 1 (code-dot-org-core)
    - op: replace
      path: /build/artifacts/1/context
      value: ../mimic/cdo-no-symlinks
    - op: replace
      path: /build/artifacts/1/image
      value: mimic-core
    # Artifact 2 (code-dot-org-pegasus)
    - op: replace
      path: /build/artifacts/2/context
      value: ../mimic/cdo-no-symlinks
    - op: replace
      path: /build/artifacts/2/image
      value: mimic-pegasus
    # Artifact 3 (code-dot-org-static)
    - op: replace
      path: /build/artifacts/3/context
      value: ../mimic/cdo-no-symlinks
    - op: replace
      path: /build/artifacts/3/image
      value: mimic-static
    # Artifact 4 (code-dot-org-db-seed)
    - op: replace
      path: /build/artifacts/4/context
      value: ../mimic/cdo-no-symlinks
    - op: replace
      path: /build/artifacts/4/image
      value: mimic-db-seed
    # Update required images in artifact 0
    - op: replace
      path: /build/artifacts/0/requires/0/image
      value: mimic-core
    - op: replace
      path: /build/artifacts/0/requires/1/image
      value: mimic-db-seed
    - op: replace
      path: /build/artifacts/0/requires/2/image
      value: mimic-pegasus
    - op: replace
      path: /build/artifacts/0/requires/3/image
      value: mimic-static
    # Update the deployment image name so Skaffold can rewrite it to mimic.
    - op: replace
      path: /manifests/kustomize/paths/0
      value: overlays/skaffold-mimic

portForward:
- resourceType: Service
  resourceName: cdo-dashboard
  port: http
  localPort: 13000
- resourceType: Service
  resourceName: cdo-dashboard
  port: http-hmr
  localPort: 19000
- resourceType: Service
  resourceName: cdo-mysql
  port: mysql
  localPort: 13306
- resourceType: Service
  resourceName: cdo-redis
  port: redis
  localPort: 16379
- resourceType: Service
  resourceName: cdo-minio
  port: api
  localPort: 29000
- resourceType: Service
  resourceName: cdo-minio
  port: console
  localPort: 29001

# Kustomize gaps:
# - The old Helm `local-dev` profile injected dynamic host paths and AWS_PROFILE via Skaffold templating.
#   I did not find a clean Kustomize-native equivalent without introducing generated local overlay files, so
#   `overlays/skaffold-local-dev` is intentionally not implemented yet.
# - `mimic` + `setup-db` / `setup-s3` would still use the non-mimic job image unless we add dedicated mimic job overlays.
