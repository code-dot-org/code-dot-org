# Using skaffold (https://skaffold.dev/) allows us to start a Kubernetes
# backend development cluster with one command: `skaffold dev`.
#
# IF YOU MODIFY THIS FILE, make the same change in ../../../skaffold.yaml until
# we decide between Helm and Kustomize.
#
# The build uses the same root docker image family as the deployed clusters:
#
#   cdo-base -> cdo-build -> cdo-deps -> cdo-rails

apiVersion: skaffold/v4beta13
kind: Config
build:
  local:
    useBuildkit: true
  hooks:
    before:
      - command: ["../../docker/rails/ensure-locales.sh"]
      # Populate kustomize secretGenerator env files from the same
      # repo-root cdo-local-secrets.env file used by the Helm config.
      - command: ["./bin/generate-cdo-local-secrets"]
  artifacts:
    - image: cdo-rails
      context: ../..
      sync:
        infer:
          - '**/*.rb'
          - '**/*.ru'
          - '**/*.yml'
          - '**/*.js'
          - '**/*.jsx'
          - '**/*.json'
      docker:
        dockerfile: docker/rails/Dockerfile
      requires:
        - image: cdo-deps
          alias: DEPS_IMAGE
    - image: cdo-deps
      context: ../..
      docker:
        dockerfile: docker/deps/Dockerfile
      requires:
        - image: cdo-build
          alias: BUILD_IMAGE
        - image: cdo-base
          alias: BASE_IMAGE
    - image: cdo-build
      context: ../../docker/build
      docker:
        dockerfile: Dockerfile
      requires:
        - image: cdo-base
          alias: BASE_IMAGE
    - image: cdo-base
      context: ../../docker/base
      docker:
        dockerfile: Dockerfile

manifests:
  kustomize:
    paths:
      - overlays/skaffold-backend

deploy:
  kubectl:
    hooks:
      before:
        # Jobs have immutable pod templates. Delete prior one-shot setup Jobs
        # before kubectl applies a new image tag or command.
        - host:
            command:
              - kubectl
              - delete
              - job
              - cdo-dashboard-job-setup-db-minimal
              - cdo-minio-setup-s3-job
              - --ignore-not-found
  # Rails takes long enough to boot that the startup probe can fail transiently.
  # Let Kubernetes enforce the probe threshold instead of failing on its first event.
  tolerateFailuresUntilDeadline: true

profiles:
  # Creates a fresh Dashboard DB from schema.rb, without curriculum seed data.
  # Run: skaffold dev --trigger=manual -p setup-db-minimal
  - name: setup-db-minimal
    patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-db-minimal

  # Creates the standard cdo-v3-* S3 buckets in MinIO.
  # Run: skaffold dev --trigger=manual -p setup-db-minimal -p setup-s3
  - name: setup-s3
    patches:
      - op: add
        path: /manifests/kustomize/paths/-
        value: overlays/setup-s3

portForward:
  - resourceType: Service
    resourceName: cdo-mysql
    port: mysql
    localPort: 13306
  - resourceType: Service
    resourceName: cdo-redis
    port: redis
    localPort: 16379
  - resourceType: Service
    resourceName: cdo-minio
    port: api
    localPort: 29000
  - resourceType: Service
    resourceName: cdo-minio
    port: console
    localPort: 29001
