apiVersion: batch/v1
kind: Job
metadata:
  name: cdo-dashboard-job-setup-db-minimal
  labels:
    app.kubernetes.io/component: dashboard-job-setup-db-minimal
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dashboard-job-setup-db-minimal
    spec:
      containers:
        - name: setup-db-minimal
          image: cdo-rails:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            # bundle exec: the ruby-slim base image ships an older default
            # rake than the Gemfile pins, so bare `rake` fails to activate.
            - cd dashboard && bin/setup-db-minimal
          tty: true
          env:
            - name: RAILS_ENV
              value: adhoc
            - name: RACK_ENV
              value: adhoc
            - name: PERMIT_UNKNOWN_PROPERTIES_IN_CDO
              value: "1"
          envFrom:
            - prefix: CDO_
              configMapRef:
                name: cdo-locals.yml
            - prefix: CDO_
              secretRef:
                name: cdo-external-secrets
                optional: true
            - prefix: CDO_
              secretRef:
                name: cdo-local-secrets
          securityContext:
            allowPrivilegeEscalation: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Never
      enableServiceLinks: false
