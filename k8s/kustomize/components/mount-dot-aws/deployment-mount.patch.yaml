apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-dashboard
spec:
  template:
    spec:
      containers:
        - name: dashboard
          env:
            - name: AWS_PROFILE
              value: default
          volumeMounts:
            - mountPath: /home/cdo/.aws
              name: dot-aws
      volumes:
        - name: dot-aws
          persistentVolumeClaim:
            claimName: cdo-dot-aws
