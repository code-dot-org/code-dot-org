apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=active-job-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cdo-active-job-worker
      spec:
        template:
          spec:
            containers:
              - name: active-job-worker
                args:
                  - cd dashboard && exec bundle exec bin/delayed_job --max-priority 9 run
