# ActiveJob (delayed_job) worker. First piece of the app to move to
# Kubernetes; server envTypes in k8s-gitops will configure it per
# environment. Until they do, everything environment-specific is pinned
# here (and mirrored in the Helm chart's activeJobWorker values) so the
# manifest renders identically for every environment:
#
# - RAILS_ENV is pinned to adhoc; env overlays may override.
# - The CDO_* env entries pin worker tuning; the blank secret overrides the
#   adhoc boot needs live in the shared locals ConfigMap (locals.yml.yaml)
#   so the setup-db-minimal job inherits them too.
#
# Local-dev relaxations (allowPrivilegeEscalation, optional external
# secrets) live in ../../overlays/backend, mirroring how
# ../../overlays/development relaxes the dashboard deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-active-job-worker
  labels:
    app.kubernetes.io/component: active-job-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: active-job-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: active-job-worker
    spec:
      containers:
        - name: active-job-worker
          image: code-dot-org:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - cd dashboard && bundle exec bin/delayed_job run
          tty: true
          env:
            - name: RAILS_ENV
              value: adhoc
            - name: RACK_ENV
              value: adhoc
            - name: PERMIT_UNKNOWN_PROPERTIES_IN_CDO
              value: "1"
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: CDO_ACTIVE_JOB_BACKEND_N_WORKERS_TO_START
              value: "1"
            - name: CDO_ACTIVE_JOB_BACKEND_ROLLING_RESTART_IN_N_BATCHES
              value: "1"
            # Without this the preload aborts boot on an empty database.
            - name: SKIP_SCRIPT_PRELOAD
              value: "1"
          envFrom:
            - prefix: CDO_
              configMapRef:
                name: cdo-locals.yml
            - prefix: CDO_
              secretRef:
                name: cdo-external-secrets
                optional: false
            - prefix: CDO_
              secretRef:
                name: cdo-local-secrets
          # Measured on a kind cluster: the daemon plateaus at 3.2Gi. At 2Gi it
          # is OOMKilled about six seconds into boot, in a loop.
          resources:
            requests:
              cpu: 1
              memory: 4Gi
              ephemeral-storage: 30Gi
            limits:
              cpu: 1
              memory: 4Gi
              ephemeral-storage: 30Gi
          securityContext:
            allowPrivilegeEscalation: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      enableServiceLinks: false
