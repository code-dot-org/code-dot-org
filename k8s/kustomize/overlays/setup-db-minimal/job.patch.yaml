apiVersion: batch/v1
kind: Job
metadata:
  name: cdo-dashboard-job-setup-db
spec:
  template:
    spec:
      containers:
        - name: setup-db
          args:
            - cd dashboard && bundle exec rake db:setup_or_migrate && echo 'setup-db-minimal COMPLETE'
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
