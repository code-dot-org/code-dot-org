apiVersion: batch/v1
kind: Job
metadata:
  name: cdo-dashboard-job-setup-db-minimal
spec:
  template:
    spec:
      containers:
        - name: setup-db-minimal
          args:
            - cd dashboard && bin/setup-db-minimal
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
