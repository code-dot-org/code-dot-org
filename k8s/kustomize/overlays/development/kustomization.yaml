# Full-app local development: the backend overlay plus the dashboard layer,
# with dev-mode relaxations for the dashboard deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../backend
components:
  - ../../components/dashboard
patches:
  - path: deployment.patch.yaml
  - path: ingress.patch.yaml
  - target:
      kind: Deployment
      name: cdo-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/optional
        value: true
labels:
  - pairs:
      app.kubernetes.io/name: cdo
      app.kubernetes.io/instance: cdo
    includeSelectors: true
    includeTemplates: true
