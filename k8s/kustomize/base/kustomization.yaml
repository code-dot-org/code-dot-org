# The full application: backend layer plus the dashboard frontend.
#
# This is the rendering consumed by server environment overlays (production,
# staging, test, levelbuilder) and by the k8s-gitops envType components, so
# changes here change what those environments see. Backend-only local
# deployments skip this and compose ../components/backend directly; see
# ../overlays/backend.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../components/backend
  - ../components/dashboard
