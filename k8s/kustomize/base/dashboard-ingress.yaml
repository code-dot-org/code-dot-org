apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdo-dashboard
  labels:
    app.kubernetes.io/component: dashboard
    code.ai/dns-name: studio-development
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cdo-dashboard
                port:
                  name: http
