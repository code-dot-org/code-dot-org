apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "org.codeai"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.codeai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Amazon Kids+ requires 64-bit ARM for its Android 16 tablets. The app
        // ships no native code of its own; this filters bundled libraries.
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Matches the Java level capacitor.build.gradle sets.
    kotlinOptions {
        jvmTarget = '21'
    }
    buildTypes {
        release {
            // R8 drops the library code the app never calls, about three
            // quarters of the APK. Capacitor ships the keep rules for the
            // classes it reaches by reflection, and the default file keeps
            // its @JavascriptInterface methods.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Names the build output codeai-<version>-<build type>.apk, e.g.
// codeai-1.0.0-debug.apk. Follows android {}, which sets the version.
base {
    archivesName = "codeai-${android.defaultConfig.versionName}"
}

// Amazon Kids+ asks for the submitted APK to be named
// "<App name> - Amazon Kids+ Edition.apk".
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == 'release') {
        variant.outputs.configureEach {
            outputFileName = 'CodeAI - Amazon Kids+ Edition.apk'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Runs SitePolicy and PageInjector, which use android.net and android.webkit, on the JVM.
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "com.squareup.okhttp3:mockwebserver:5.5.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

