# node-modules linker required: apps/ uses portal: to link into frontend/packages/*
# directly. Yarn PnP would break portal resolution from apps/'s Yarn classic context.
nodeLinker: node-modules

# Catalog — single source of truth for shared dependency versions.
#
# When to add an entry:
#   - dep appears in 2+ package.json files, OR
#   - version drift would cause duplicate runtime instances (React, MUI, Emotion).
#
# Use catalog: in dependencies and devDependencies.
# Do NOT use catalog: in peerDependencies — those are published API contracts
# and must remain explicit semver ranges in the distributed package.json.
#
# Singletons (one consumer) stay as explicit versions in their own package.json;
# promote here only when a second consumer appears.
#
# Named catalogs (catalog:<name>) are supported but reserved for version-variant
# scenarios (e.g. a React 18/19 migration path). Use the default catalog: for now.

catalog:

  ##############################################################################
  # Build toolchain
  ##############################################################################
  '@vitejs/plugin-react': '^5.1.2'
  'typescript': '^5.8.2'
  'vite': '^7.2.4'
  'vite-plugin-dts': '^4.5.4'
  'vite-plugin-externalize-deps': '^0.10.0'

  ##############################################################################
  # Linting
  ##############################################################################
  '@eslint/js': '^9.39.1'
  'eslint': '^9.39.1'
  'eslint-plugin-react-hooks': '^7.0.1'
  'eslint-plugin-react-refresh': '^0.4.24'
  'globals': '^16.5.0'
  # Exact pin (no ^): prettier output changes across minor versions; all packages
  # must produce identical output or CI diffs diverge.
  'prettier': '3.4.2'
  'stylelint': '^16.14.1'
  'typescript-eslint': '^8.49.0'

  ##############################################################################
  # MUI + Emotion
  # MUI and Emotion must version-match; mismatches cause subtle runtime failures.
  # component-library declares these as peerDependencies so that
  # vite-plugin-externalize-deps externalizes them at build time; catalog:
  # prevents duplicate copies at install time.
  ##############################################################################
  '@emotion/react': '^11.14.0'
  '@emotion/styled': '^11.14.1'
  '@mui/material': '^7.3.2'

  ##############################################################################
  # Node types
  # Major must match the Node.js version in /.nvmrc; bump when Node upgrades.
  ##############################################################################
  '@types/node': '^20.19.0'

  ##############################################################################
  # React
  # Pinned to 18.x: apps/ portals require React 18 compat; both workspaces must
  # share one instance to avoid hooks violations across the portal boundary.
  # @types/react major must stay aligned with the react major.
  ##############################################################################
  '@types/react': '^18.3.12'
  '@types/react-dom': '^18.3.1'
  'react': '^18.3.1'
  'react-dom': '^18.3.1'

  ##############################################################################
  # Testing
  ##############################################################################
  '@testing-library/dom': '^10.4.0'
  '@testing-library/jest-dom': '^6.6.3'
  '@testing-library/react': '^16.0.1'
  'jsdom': '^26.0.0'
  'playwright': '^1.59.1'
  'vitest': '^4.0.17'

  ##############################################################################
  # Utilities
  ##############################################################################
  '@sentry/browser': '^10.51.0'
  'classnames': '^2.5.1'
  'ky': '^1.14.3'
  'lint-staged': '^15.4.3'
  'release-it': '^18.1.2'
  'rimraf': '^6.0.1'
