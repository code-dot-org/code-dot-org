<!doctype html>
<html lang="en" style="margin: 0; padding: 0; width: 100%; height: 100%">
  <head>
    <meta charset="UTF-8" />
    <title>World preview sandbox</title>
    <style>
      /* The pane clips anything past its edges — this is what makes the game
         box's 1px box-shadow border (set by the lab's COLORS message) show only
         on the letterboxed sides: a side flush with the pane edge has its shadow
         clipped away. */
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101020;
      }
      /* The largest box of the WORLD's shape that fits the pane.

         It used to be the largest SQUARE, because the native resolution was a
         square constant and CSS cannot import one — so the page carried its own
         copy, kept in step by hand. A world states its own view now
         (`World.setViewSize`), so the copy is gone and the driver sets
         `--aspect` instead (`PhaserBinding.syncViewSize`); one is the shape a
         world that says nothing has, and is what the box is until it is told
         otherwise.

         Sized in viewport units rather than `aspect-ratio`, because the box has
         to fit BOTH ways: whichever of the pane's dimensions runs out first is
         the one that decides, and `min` says exactly that. The body is the
         whole of this iframe, so 100vw and 100vh are the pane. */
      #game {
        --aspect: 1;
        width: min(100vw, calc(100vh * var(--aspect)));
        height: min(100vh, calc(100vw / var(--aspect)));
      }
      /* Cap the canvas to its box so the pre-FIT boot frame can't overflow. */
      #game canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      /* The game is focusable (PhaserBinding sets tabindex + targets its keyboard
         here), so it only responds to keys while focused. Ring it whenever it is
         focused — by click or tab — in the editor's teal (component-library
         focus-styles), so "ring shown" reads as "key presses go to the game, not
         the editor." Offset inward: the body clips anything past its edges, so an
         outward ring would be cut. */
      #game:focus {
        outline: 2px solid #0093a4;
        outline-offset: -2px;
      }
    </style>
  </head>
  <body>
    <!--
      The preview surface (specs/SANDBOX.md) — the VISIBLE game canvas host. It
      imports the compiled module the transport service worker serves and runs
      it. `entry.ts` reads the role from this page's filename.
    -->
    <div id="game"></div>
    <script type="module" src="/src/runtime/sandbox/entry.ts"></script>
  </body>
</html>
