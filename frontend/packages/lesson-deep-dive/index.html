<!doctype html>
<!-- data-brand selects a whole palette in
     component-library-styles/brandOverrides.css, so the shell has to declare
     the brand Studio would; Cdo::Brand.current_brand_code picks it there. -->
<html data-brand="codeai-next" dir="ltr" lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="minimal-ui" />
    <title>Tutor+ Lesson Deep Dive</title>
    <!-- csrf_meta_tags, as the Rails layout emits them. AuthenticityTokenStore
         reads this tag and otherwise falls back to GET /get_token, so without
         it every write the feature makes fails before it is sent. -->
    <meta name="csrf-param" content="authenticity_token" />
    <meta name="csrf-token" content="dev-shell-csrf-token" />
  </head>
  <body>
    <div id="lesson-deep-dive-container"></div>
    <script type="module" src="/src/dev/main.tsx"></script>
  </body>
</html>
