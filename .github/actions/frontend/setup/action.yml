name: "Install & Setup Frontend Directory"
description: "Setup for the frontend directory"

inputs:
  INSTALL_DEPENDENCIES:
    description: "Whether to install dependencies. Defaults to true"
    default: "true"
    required: false
  INSTALL_BROWSERS:
    description: "Whether to install puppeteer browsers for eyes tests. Defaults to true"
    default: "true"
    required: false

runs:
  using: composite
  steps:
    - name: Enable Corepack before setting up Node
      shell: bash
      run: corepack enable

    - name: Cache turborepo
      uses: rharkor/caching-for-turbo@a1c4079258ae08389be75b57d4d7a70f23c1c66d # v1.8

    - uses: actions/setup-node@v4
      if: inputs.INSTALL_DEPENDENCIES == 'true'
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"
        cache-dependency-path: 'frontend/pnpm-lock.yaml'

    - name: Install dependencies
      if: inputs.INSTALL_DEPENDENCIES == 'true'
      shell: bash
      run: pnpm install
      working-directory: ./frontend

    - name: Install chrome for eyes and UI testing
      if: inputs.INSTALL_BROWSERS == 'true'
      shell: bash
      run: pnpm install && pnpm exec puppeteer browsers install chrome
      working-directory: ./frontend/apps/design-system-storybook
