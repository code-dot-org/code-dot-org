# Use this workflow to do any validation of k8s related files, this could
# be linting, simple tests, etc. This runs in parallel with the skaffold
# build, but before we commit to k8s-gitops our changes, so anything
# that's faster than that won't hold up the overall flow.

name: k8s-validate

on:
  workflow_call:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            k8s

      - name: Verify release capsule build context
        run: |
          mkdir -p /tmp/release-capsule
          cat > /tmp/release-capsule/provenance.json <<'EOF'
          {"buildType":"github-actions","workflow":"k8s"}
          EOF
          cat > /tmp/release-capsule/sbom.json <<'EOF'
          {"bomFormat":"CycloneDX","specVersion":"1.5","components":[]}
          EOF

          RELEASE_GIT_COMMIT=0123456789abcdef0123456789abcdef01234567 \
          RELEASE_IMAGE_REPO=ghcr.io/code-dot-org/code-dot-org \
          RELEASE_IMAGE_TAG=git-0123456789abcdef0123456789abcdef01234567 \
          RELEASE_IMAGE_DIGEST=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
          RELEASE_PROVENANCE_FILE=/tmp/release-capsule/provenance.json \
          RELEASE_SBOM_FILE=/tmp/release-capsule/sbom.json \
          k8s/release-capsule/bin/build-context

          test -f release-capsule-build/git-0123456789abcdef0123456789abcdef01234567/release.yaml
          test -f release-capsule-build/git-0123456789abcdef0123456789abcdef01234567/package/helm/Chart.yaml
          test -f release-capsule-build/git-0123456789abcdef0123456789abcdef01234567/metadata/provenance.json
          test -f release-capsule-build/git-0123456789abcdef0123456789abcdef01234567/metadata/sbom.json

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Setup Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.8.1
          ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          curl -fsSLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_${ARCH}.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Verify kustomize/helm parity
        run: k8s/kustomize/bin/verify-helm-parity
