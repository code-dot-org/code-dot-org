# Use this workflow to do any validation of k8s related files, this could
# be linting, simple tests, etc. This runs in parallel with the skaffold
# build, but before we commit to k8s-gitops our changes, so anything
# that's faster than that won't hold up the overall flow.

name: k8s-validate

on:
  workflow_call:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: |
            .github/workflows
            k8s

      - name: Checkout k8s-gitops metadata
        uses: actions/checkout@v6.0.2
        with:
          repository: code-dot-org/k8s-gitops
          path: k8s-gitops

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Setup Kustomize
        run: |
          KUSTOMIZE_VERSION=v5.8.1
          ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/')
          curl -fsSLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_${ARCH}.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

      - name: Verify kustomize/helm parity
        run: k8s/kustomize/bin/verify-helm-parity

      - name: Validate rendered-branch contract
        shell: ruby {0}
        run: | # ruby
          require 'psych'

          appset = Psych.load_file('k8s-gitops/apps/codeai/applicationset.yaml')
          generator_paths = appset.dig('spec', 'generators', 0, 'git', 'files').map {|entry| entry.fetch('path')}
          expected_paths = %w[
            apps/codeai/deployments/staging/deployment.yaml
            apps/codeai/deployments/test/deployment.yaml
            apps/codeai/deployments/levelbuilder/deployment.yaml
            apps/codeai/deployments/production/deployment.yaml
          ]
          raise "unexpected generator paths: #{generator_paths.inspect}" unless generator_paths == expected_paths

          source = appset.dig('spec', 'template', 'spec', 'source')
          raise 'applicationset source repo changed' unless source['repoURL'] == 'https://github.com/code-dot-org/k8s-gitops.git'
          raise 'applicationset targetRevision changed' unless source['targetRevision'] == 'stage/{{path.basename}}'
          raise 'applicationset path changed' unless source['path'] == 'apps/codeai/deployments/{{path.basename}}/deploy'

          warehouse = Psych.load_file('k8s-gitops/apps/kargo-project-codeai/warehouse.yaml')
          subscription = warehouse.dig('spec', 'subscriptions', 0, 'git')
          raise 'warehouse must subscribe via git' unless subscription
          raise 'warehouse includePaths changed' unless subscription['includePaths'] == ['warehouses/codeai/builds']

          %w[staging test levelbuilder production].each do |deployment|
            metadata_path = "k8s-gitops/apps/codeai/deployments/#{deployment}/deployment.yaml"
            deploy_dir = "k8s-gitops/apps/codeai/deployments/#{deployment}/deploy"
            raise "missing #{metadata_path}" unless File.exist?(metadata_path)
            raise "missing #{deploy_dir}" unless Dir.exist?(deploy_dir)
          end

          %w[staging test levelbuilder review-infra-changes production].each do |stage|
            stage_yaml = Psych.load_file("k8s-gitops/apps/kargo-project-codeai/stages/#{stage}.yaml")
            warehouse_name = stage_yaml.dig('spec', 'requestedFreight', 0, 'origin', 'name')
            raise "#{stage} stage points at #{warehouse_name.inspect}" unless warehouse_name == 'codeai-builds'
          end

      - name: Smoke render managed deployments
        shell: bash -euo pipefail {0}
        run: |
          mkdir -p /tmp/codeai-render

          for deployment in staging test levelbuilder production; do
            env_type="$(ruby -rpsych -e 'puts Psych.load_file(ARGV[0]).fetch("envType")' "k8s-gitops/apps/codeai/deployments/${deployment}/deployment.yaml")"

            helm template "${deployment}" k8s/helm \
              -f "k8s-gitops/apps/codeai/envTypes/${env_type}.values.yaml" \
              -f "k8s-gitops/apps/codeai/deployments/${deployment}/values.yaml" \
              --set-string "image=ghcr.io/code-dot-org/code-dot-org:git-smoke" \
              > "/tmp/codeai-render/${deployment}.yaml"

            test -s "/tmp/codeai-render/${deployment}.yaml"
          done
