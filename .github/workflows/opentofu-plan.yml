name: OpenTofu-Plan

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"

permissions:
  id-token: write # Required for OIDC
  contents: read
  pull-requests: write # To post plan output as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Make sure to keep these in sync with the apply job workspaces matrix
        workspace:
          - k8s/tofu/codeai-k8s/eks-cluster
          - k8s/tofu/codeai-k8s/eks-cluster-addons
          - k8s/tofu/codeai-k8s-dex
          - temp/plan-tofu
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    environment: open-tofu-plan
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_CODE_DOT_ORG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: true # Enables steps.*.outputs.stdout capture

      - name: OpenTofu fmt
        id: fmt
        run: tofu fmt -check
        continue-on-error: true

      - name: OpenTofu Init
        id: init
        run: tofu init

      - name: OpenTofu Plan
        id: plan
        run: tofu plan -no-color
        continue-on-error: true # Don't fail the step, let the comment show the error

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const output = `#### OpenTofu Plan for \`${{ matrix.workspace }}\`

            | Step | Status |
            |------|--------|
            | Format and Style | \`${{ steps.fmt.outcome }}\` |
            | Initialization | \`${{ steps.init.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            [View full plan output in the workflow run](${runUrl})`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
