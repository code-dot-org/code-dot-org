name: Oceans Lab — Publish to GitHub Packages

on:
  push:
    tags:
      - '@code-dot-org/oceans-lab@*'

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build
        run: yarn turbo run build --filter=@code-dot-org/oceans-lab
        working-directory: ./frontend

      # Inject GitHub Packages auth scoped to npm.pkg.github.com.
      # `npmScopes` was removed from .yarnrc.yml to avoid redirecting all
      # @code-dot-org/* installs (some resolve from npm.org, not GitHub Packages).
      - name: Configure GitHub Packages auth
        run: |
          yarn config set npmRegistries --json \
            '{"https://npm.pkg.github.com":{"npmAlwaysAuth":true,"npmAuthToken":"${{ secrets.GITHUB_TOKEN }}"}}'
        working-directory: ./frontend

      - name: Publish
        run: yarn workspace @code-dot-org/oceans-lab npm publish
        working-directory: ./frontend
