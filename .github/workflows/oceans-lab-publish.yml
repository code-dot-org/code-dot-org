name: Oceans Lab — Publish to GitHub Packages

on:
  push:
    tags:
      - '@code-dot-org/oceans-lab@*'

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      # Required for both yarn install (reads @code-dot-org/* from GitHub Packages)
      # and yarn npm publish. GITHUB_TOKEN has read:packages + write:packages in
      # this org without any additional setup.
      YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build
        run: yarn turbo run build --filter=@code-dot-org/oceans-lab
        working-directory: ./frontend

      - name: Publish
        run: yarn workspace @code-dot-org/oceans-lab npm publish
        working-directory: ./frontend
