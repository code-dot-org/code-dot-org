# This is an experiment with triggering a GitHub worfklow AFTER Drone CI completes.
name: on-droneci-complete

on:
  workflow_dispatch:
    inputs:
      github_sha:
        description: "equivalent to github.sha in an ordinary workflow"
        required: true
      drone_build_status:
        required: true
        type: choice
        options:
          - success
          - failure

permissions:
  statuses: write

jobs:
  # We use applitools eyes from: drone, marketing-app-ci.yml and component-library-ci.yml.
  # We need to close the batch after all of these are completed. We assume Drone will be
  # the last to finish, but we check and throw an error if any of the others are still pending.
  complete-applitools-eyes-batch:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "Triggered by Drone, on commit: ${{ inputs.github_sha }} on branch ${{ github.ref }}"
          echo "This job should succeed"
          true

      - name: Assert other eyes-using workflows are already complete
        uses: actions/github-script@v7
        with:
          script: |
            async function assertWorkflowNotPending(workflow_id) {
              const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
                workflow_id,
                head_sha: context.sha,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              if (workflow_runs.length === 0) {
                console.log(`Workflow ${workflow_id} was not triggered by this commit, ignoring`);
              } else if (workflow_runs[0].status !== 'completed') {
                core.setFailed(`Error: ${workflow_id} is still pending, but we're closing the applitools batch now that drone is complete. This may cause problems for ${workflow_id}.`);
                process.exit(1);
              }
            }

            await assertWorkflowNotPending('marketing-app-ci.yml');
            await assertWorkflowNotPending('component-library-ci.yml');

      # Close the eyes batch after all distributed eyes tests have completed
      - name: Mark Applitools Eyes batch as complete
        if: always()
        shell: bash
        env:
          APPLITOOLS_BATCH_ID: ${{ inputs.github_sha }}
        run: |
          curl -X POST "https://eyesapi.applitools.com/api/externals/github/servers/github.com/commit/${{ env.APPLITOOLS_BATCH_ID }}/${{ github.run_id }}/complete?apiKey=${{secrets.APPLITOOLS_API_KEY}}"


      # OPTIONAL: running this step lets you see in the PR if the complete-applitools-eyes-batch job succeeded or failed
      # This will always be visible inside the GitHub actions view, but surfacing it as a PR status might not be worth
      # the developer UI clutter. Judgement call, not sure which is right.
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              context: 'Mark Applitools Eyes batch as complete',
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.github_sha }}',
              state: '${{ job.status == 'success' && 'success' || 'failure' }}'
            })

