# Builds cdo-deps, smoke-tests it on docker and podman on amd64 and arm64,
# and publishes it from staging as a multi-platform manifest (per-arch native
# builds, stitched — the cdo-base pattern). This also gates docker/build,
# since every job here builds cdo-build anyway: it is unpublished, so there
# is nothing to pull. See docker/deps/README.md and docker/build/README.md.

name: cdo-deps-image

on:
  pull_request:
    paths:
      - 'docker/deps/**'
      - 'docker/build/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/engines/*/*.gemspec'
      - 'dashboard/engines/*/lib/*/version.rb'
      - '.github/workflows/cdo-deps-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/deps/**'
      - 'docker/build/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/engines/*/*.gemspec'
      - 'dashboard/engines/*/lib/*/version.rb'
      - '.github/workflows/cdo-deps-image.yml'
  # Chained off cdo-base rather than scheduled, so the dependency layer
  # rebuilds on the base that just shipped and a failed base rebuilds nothing.
  workflow_run:
    workflows: [cdo-base-image]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishes are not governed here; build-push has its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-deps

jobs:
  # Resolve the base once and give the same digest to every build. Resolved
  # per build instead, the builder and the final stage can land on different
  # bases, and the extensions then ship on a base they were not compiled
  # against.
  #
  # This is also where the workflow_run chain is filtered. That event fires for
  # failed runs and for other branches, and skipping this job skips the rest.
  resolve-base:
    name: resolve cdo-base digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.base.outputs.digest }}
    steps:
      # GHCR packages are private until someone flips them; authenticate
      # every pull rather than depending on that manual step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Takes the latest version and converts to a digest for supply chain
      # digest pinning.
      - name: Resolve cdo-base:latest to a digest
        id: base
        run: |
          set -euxo pipefail
          digest="$(docker buildx imagetools inspect \
            ghcr.io/code-dot-org/cdo-base:latest \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    needs: resolve-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/code-dot-org/cdo-base@${{ needs.resolve-base.outputs.digest }}
    steps:
      # Sparse checkout cone mode also brings the repo root, where the
      # lockfiles live.
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker/build
            docker/deps
            dashboard/engines
            python

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-build with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-build:ci docker/build/

      # A broken builder otherwise surfaces as a bundle install failure.
      - name: Smoke test cdo-build
        run: ./docker/build/smoke-test.sh cdo-build:ci ${{ matrix.engine }}

      - name: Build cdo-deps with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/deps/Dockerfile \
            --build-arg BUILD_IMAGE=cdo-build:ci \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-deps:smoke .

      - name: Smoke test
        run: ./docker/deps/smoke-test.sh cdo-deps:smoke ${{ matrix.engine }}

  # cdo-build exists only in this job's local image store, which is why nothing
  # sets up a container builder: it would try to pull the tag from a registry.
  #
  # One job per architecture, natively — no qemu: a cross-built bundle
  # compiles its extensions at emulated speed and tests nothing real. Each
  # pushes an arch-suffixed tag; stitch merges them into the consumer-facing ones.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: [resolve-base, smoke-test]
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    # Inert until its deployment-branch policy is set; see docker/deps/README.md.
    environment: ghcr-publish
    # Per-arch group: the two arch legs of one run must not share a group,
    # or they would cancel each other. Safe to cancel — nothing resolves
    # `latest` programmatically.
    concurrency:
      group: cdo-deps-publish-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/code-dot-org/cdo-base@${{ needs.resolve-base.outputs.digest }}
    steps:
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            dashboard/engines
            python

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-build
        run: |
          docker build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-build:ci docker/build/

      # The one definition of the content key, shared with every consumer.
      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      - name: Build cdo-deps
        run: |
          docker build \
            -f docker/deps/Dockerfile \
            --build-arg BUILD_IMAGE=cdo-build:ci \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-deps:publish \
            .

      # The matrix tested images built on other runners. These test the one
      # actually being published.
      - name: Smoke test cdo-build
        run: ./docker/build/smoke-test.sh cdo-build:ci docker

      - name: Smoke test cdo-deps
        run: ./docker/deps/smoke-test.sh cdo-deps:publish docker

      # Not build-push-action with push: true — that publishes in the step that
      # builds, before the smoke suites can fail the job.
      #
      # Keyed by commit and architecture, and nothing a consumer resolves:
      # the stitch job builds every consumer-facing tag from this immutable
      # pair, so a racing publish or a failed run's leftover tag cannot
      # leak into it.
      - name: Push cdo-deps (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-deps:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # Until this runs, only the arch-suffixed tags exist, so a half-published
  # state is visible as such instead of resolving to one arch under the
  # final name.
  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-deps-publish
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      # The key action hashes the dependency inputs, so the checkout must
      # contain them.
      - name: Checkout key inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            dashboard/engines
            python

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.key.outputs.key }},enable={{is_default_branch}}
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # Both source tags are commit-keyed, so no moving tag ever appears in
      # the input.
      - name: Stitch every tag from the sha-keyed per-arch pair
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

      - name: Inspect a published manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(echo "$TAGS" | head -1)"
