# Builds cdo-deps, smoke-tests it on docker and podman on amd64 and arm64,
# and publishes it from staging as a multi-platform manifest. Each
# architecture builds natively on its own runner; a merge job puts the two
# images under the final tags, the same pattern as cdo-base. This also gates
# docker/build, since every job here builds cdo-build anyway: it is
# unpublished, so there is nothing to pull.
# See docker/deps/README.md and docker/build/README.md.

name: cdo-deps-image

on:
  pull_request:
    paths:
      - 'docker/base/**'
      - 'docker/deps/**'
      - 'docker/build/**'
      - 'docker/scripts/install-node.sh'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/engines/*/*.gemspec'
      - 'dashboard/engines/*/lib/*/version.rb'
      - '.github/workflows/cdo-deps-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/deps/**'
      - 'docker/build/**'
      - 'docker/scripts/install-node.sh'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dashboard/engines/*/*.gemspec'
      - 'dashboard/engines/*/lib/*/version.rb'
      - '.github/workflows/cdo-deps-image.yml'
  # Chained off cdo-base rather than scheduled, so the dependency layer
  # rebuilds on the base that just shipped and a failed base rebuilds nothing.
  workflow_run:
    workflows: [cdo-base-image]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishes are not governed here; build-push has its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-deps

jobs:
  # Resolve the base once and give the same digest to every build. Resolved
  # per build instead, the builder and the final stage can land on different
  # bases, and the extensions then ship on a base they were not compiled
  # against.
  #
  # This is also where the workflow_run chain is filtered. That event fires for
  # failed runs and for other branches, and skipping this job skips the rest.
  resolve-base:
    name: resolve cdo-base digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.base.outputs.digest }}
    steps:
      # GHCR packages are private until someone flips them; authenticate
      # every pull rather than depending on that manual step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Takes the latest version and converts to a digest for supply chain
      # digest pinning.
      - name: Resolve cdo-base:latest to a digest
        id: base
        run: |
          set -euxo pipefail
          digest="$(docker buildx imagetools inspect \
            ghcr.io/code-dot-org/cdo-base:latest \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # PRs only. Publish runs are gated by build-push itself, which runs the
  # same suites against the bytes it pushes; running this matrix there too
  # tested a separate build of the same input twice.
  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: resolve-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/code-dot-org/cdo-base@${{ needs.resolve-base.outputs.digest }}
    steps:
      # Sparse checkout cone mode also brings the repo root, where the
      # lockfiles live.
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker/base
            docker/build
            docker/deps
            docker/scripts
            dashboard/engines
            python

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Detect whether to use the published `cdo-base` image or to build
      # `cdo-base` from scratch. For most cases, we will use the published image
      # to leverage caching. In some cases, such as Ruby upgrades, we will need
      # to build `cdo-base` from source because `cdo-base` in itself has changed.
      - name: Pick the base image to use
        id: base
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          # Detect whether the docker image needs to be rebuilt in CI
          if git diff --quiet FETCH_HEAD HEAD -- docker/base; then
            echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=cdo-base:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build cdo-base from the checkout with ${{ matrix.engine }}
        if: steps.base.outputs.image == 'cdo-base:ci'
        run: ${{ matrix.engine }} build -t cdo-base:ci docker/base/

      - name: Build cdo-build with ${{ matrix.engine }}
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/build/Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-build:ci .

      # A broken builder otherwise surfaces as a bundle install failure.
      - name: Smoke test cdo-build
        run: ./docker/build/smoke-test.sh cdo-build:ci ${{ matrix.engine }}

      - name: Build cdo-deps with ${{ matrix.engine }}
        env:
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/deps/Dockerfile \
            --build-arg BUILD_IMAGE=cdo-build:ci \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-deps:smoke .

      - name: Smoke test
        run: ./docker/deps/smoke-test.sh cdo-deps:smoke ${{ matrix.engine }}

  # cdo-build exists only in this job's local image store, which is why nothing
  # sets up a container builder: it would try to pull the tag from a registry.
  #
  # Each architecture builds on its own native runner. qemu is not an
  # option here: emulated bundle installs fail erratically (g++ segfaults
  # on libsass, dpkg errors, varying with the binfmt qemu build). Each leg
  # pushes one arch-suffixed tag for the merge job to combine.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: resolve-base
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    # Inert until its deployment-branch policy is set; see docker/deps/README.md.
    environment: ghcr-publish
    # Grouped per architecture so the two legs of one run cannot cancel
    # each other. Safe to cancel: nothing resolves `latest` programmatically.
    concurrency:
      group: cdo-deps-publish-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ghcr.io/code-dot-org/cdo-base@${{ needs.resolve-base.outputs.digest }}
    steps:
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            docker/scripts
            dashboard/engines
            python

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-build
        run: |
          docker build \
            -f docker/build/Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-build:ci .

      # The one definition of the content key, shared with every consumer.
      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      - name: Build cdo-deps
        run: |
          docker build \
            -f docker/deps/Dockerfile \
            --build-arg BUILD_IMAGE=cdo-build:ci \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t cdo-deps:publish \
            .

      # The quality gate for everything this job pushes.
      - name: Smoke test cdo-build
        run: ./docker/build/smoke-test.sh cdo-build:ci docker

      - name: Smoke test cdo-deps
        run: ./docker/deps/smoke-test.sh cdo-deps:publish docker

      # Not build-push-action with push: true — that publishes in the step that
      # builds, before the smoke suites can fail the job.
      #
      # The tag is keyed by commit and architecture, and no consumer
      # resolves it. The merge job builds every consumer-facing tag from
      # this immutable pair, so a racing publish or a tag left by a failed
      # run cannot leak in.
      - name: Push cdo-deps (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-deps:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # Until this runs, only the arch-suffixed tags exist, so an incomplete
  # publish is visible as such instead of serving one architecture under
  # the final name.
  # See: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  merge:
    name: merge per-arch images into one manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-deps-publish
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      # The key action hashes the dependency inputs, so the checkout must
      # contain them.
      - name: Checkout key inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            docker/scripts
            dashboard/engines
            python

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.key.outputs.key }},enable={{is_default_branch}}
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # The source tags are commit-keyed, so no moving tag can enter the
      # manifest.
      - name: Merge the per-arch pair under every tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

