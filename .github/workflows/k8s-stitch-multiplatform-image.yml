# In a previous step (see: ./k8s-skaffold-build.yml) we built the docker image for multiple
# architectures (e.g. amd64, arm64) in parallel on a GH runner for that specific architecture.
#
# The resulting build artifacts are multiple tagged single-architecture docker images, for example:
# - code-dot-org:git-0cc4cd87f40ae6-amd64
# - code-dot-org:git-0cc4cd87f40ae6-arm64
#
# This step uses `docker buildx imagetools` to stitch the single-architecture images into one final
# multi-platform docker image, for example:
# - code-dot-org:git-0cc4cd87f40ae6
#
# and then tags the same manifest with a branch-name alias, e.g.:
# - code-dot-org:staging

name: k8s-stitch-multiplatform-image

on:
  workflow_call:
    outputs:
      codeai_docker_image_ref:
        description: "Fully qualified docker image reference for the final multi-platform image"
        value: ${{ jobs.stitch-multi-platform.outputs.codeai_docker_image_ref }}
      codeai_docker_tag:
        description: "Docker tag for the final multi-platform image"
        value: ${{ jobs.stitch-multi-platform.outputs.codeai_docker_tag }}
    inputs:
      branch_tag_alias:
        description: "Branch-name tag alias for the final multi-platform image"
        required: true
        type: string
      docker_tags_json:
        description: "JSON object like: { docker_tag_amd64: $TAG_FOR_AMD64, ...etc... }"
        required: true
        type: string
      docker_tag:
        description: "Docker tag for the final multi-platform image e.g. code-dot-org:my-branch"
        required: true
        type: string

jobs:
  stitch-multi-platform:
    name: stitch multi-platform image
    outputs:
      codeai_docker_image_ref: ${{ steps.export-image.outputs.codeai_docker_image_ref }}
      codeai_docker_tag: ${{ steps.export-image.outputs.codeai_docker_tag }}

    # while we're experimental, we /never/ want to block a normal PR:
    continue-on-error: true

    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/code-dot-org
      BRANCH_TAG_ALIAS: ${{ inputs.branch_tag_alias }}
      MULTI_PLATFORM_IMAGE: ghcr.io/${{ github.repository_owner }}/code-dot-org:${{ inputs.docker_tag }}
    defaults:
      run:
        shell: bash -ex {0}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Parse docker_tags_json into a single shell variable listing each single-arch image:
      # SINGLE_ARCH_IMAGES="code-dot-org:my-branch-amd64 code-dot-org:my-branch-arm64"
      - name: Parse DOCKER_TAGS JSON into $SINGLE_ARCH_IMAGES
        id: parse_tags
        run: |
          # Use the passed JSON string directly
          DOCKER_TAGS_JSON='${{ inputs.docker_tags_json }}'
          SINGLE_ARCH_IMAGES=$(jq -r --arg prefix "$IMAGE_NAME" 'to_entries | map(select(.key | test("^docker_tag_")) | "\($prefix):\(.value)") | join(" ")' <<< "$DOCKER_TAGS_JSON")
          echo "SINGLE_ARCH_IMAGES=$SINGLE_ARCH_IMAGES" >> "$GITHUB_ENV"
          echo "NORMALIZED_BRANCH_TAG_ALIAS=${BRANCH_TAG_ALIAS//[^a-zA-Z0-9_.-]/-}" >> "$GITHUB_ENV"

      - name: Require both arch images
        run: |
          jq -e '.docker_tag_amd64 and .docker_tag_arm64' <<< '${{ inputs.docker_tags_json }}' >/dev/null

      - name: Stitch platform images into a multi-platform image
        run: |
          # Use imagetools to stitch all platform-specific images into one multi-platform image
          # $MULTI_PLATFORM_IMAGE is the canonical final multi-platform image name, e.g. code-dot-org:git-0cc4cd87f40ae6
          docker buildx imagetools create -t $MULTI_PLATFORM_IMAGE $SINGLE_ARCH_IMAGES

      - name: Tag the stitched image with the branch alias
        run: |
          docker buildx imagetools create -t "$IMAGE_NAME:$NORMALIZED_BRANCH_TAG_ALIAS" $MULTI_PLATFORM_IMAGE

      - name: Export stitched image ref
        id: export-image
        run: |
          echo "codeai_docker_image_ref=$MULTI_PLATFORM_IMAGE" >> "$GITHUB_OUTPUT"
          echo "codeai_docker_tag=${{ inputs.docker_tag }}" >> "$GITHUB_OUTPUT"
