name: Fire Tablet CI

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./frontend

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            frontend
            .github
      - name: Setup frontend (Node 20)
        uses: ./.github/actions/frontend/setup
      - name: Check Studio launchpad
        run: yarn release:dryrun --filter @code-dot-org/fire-tablet

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            frontend
      - name: Setup Node 22 for native tooling
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build internal debug APK
        run: yarn workspace @code-dot-org/fire-tablet android:build:debug
      - name: Test activity navigation policy
        working-directory: ./frontend/apps/fire-tablet/android
        run: ./gradlew testDebugUnitTest
      - name: Upload internal debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fire-tablet-debug-${{ github.sha }}
          path: frontend/apps/fire-tablet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
