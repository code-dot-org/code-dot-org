# Builds cdo-rails, smoke-tests it on docker and podman on amd64 and arm64,
# boots Rails from it against MySQL and Redis on both architectures, and
# publishes it as an OCI image index annotated with the commit it was built
# from. Each architecture builds natively on its own runner; a merge job puts
# the two images under the final tags, the same pattern as cdo-base. Not
# triggered by source PRs — the slice is validated at publish time. See
# docker/rails/README.md.
#
# Publishing is where this workflow stops. The tag contract it publishes under
# is in docker/rails/README.md.

name: cdo-rails-image

on:
  pull_request:
    paths:
      - 'docker/rails/**'
      - '.github/actions/cdo-deps-key/**'
      - '.github/workflows/cdo-rails-image.yml'
  push:
    branches: [staging]
  # Chained off cdo-deps rather than scheduled, so the source layer
  # rebuilds on the dependency layer that just shipped, a failed deps publish
  # rebuilds nothing, and the weekly cadence is inherited from cdo-base's
  # cron through the chain rather than restated as a timer here.
  workflow_run:
    workflows: [cdo-deps-image]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishes are not governed here; build-push has its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-rails

jobs:
  # Resolve cdo-deps once, by the bundle- content key this checkout implies,
  # and give the same digest to every build. A checkout whose dependency
  # inputs have no published layer must not land on stale bytes.
  #
  # A push can arrive before that layer exists. cdo-deps-image is building it.
  # It will chain this workflow again. A push miss therefore ends the run
  # quietly. Any other event has no such second chance and fails.
  #
  # This is also where the workflow_run chain is filtered: that event fires
  # for failed runs and for other branches, and skipping this job skips the
  # rest.
  resolve-deps:
    name: resolve cdo-deps digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.deps.outputs.digest }}
    steps:
      # The key hashes the dependency inputs, so they must be in the checkout.
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            docker/scripts

      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      # GHCR packages are private until someone flips them; authenticate
      # every pull rather than depending on that manual step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the keyed dependency layer to a digest
        id: deps
        env:
          REF: ghcr.io/code-dot-org/cdo-deps:${{ steps.key.outputs.key }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if digest="$(docker buildx imagetools inspect "$REF" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = push ]; then
            echo "::notice::No dependency layer yet for this checkout ($REF)." \
                 "cdo-deps-image is building it and will re-run this workflow." >&2
            exit 0
          fi
          echo "::error::No published dependency layer for this checkout's dependency inputs ($REF)." \
               "A lockfile change publishes its dependency layer on the staging push." >&2
          exit 1

  # PRs only. Publish runs are gated by build-push itself, which runs the
  # same suites against the bytes it pushes; running this matrix there too
  # tested a separate build of the same input twice.
  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      # The full tree: this image bakes the source slice.
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: ./docker/rails/ensure-locales.sh

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:smoke .

      - name: Smoke test
        run: ./docker/rails/smoke-test.sh cdo-rails:smoke ${{ matrix.engine }}

  # Boot the artifact and drive it: verify.sh stands up MySQL and Redis and
  # proves schema load, a model write, a worker pass, and a signed-in API
  # read over HTTP — the check the Drone image cannot express, since it
  # tests the deployed bytes rather than a CI-only environment.
  # PRs only, like smoke-test: build-push runs verify.sh on the publish
  # bytes.
  rails-boot:
    name: rails boots from the image (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: ./docker/rails/ensure-locales.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails
        run: |
          docker build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:boot .

      - name: Verify the image end to end
        run: ./docker/rails/verify.sh cdo-rails:boot docker

  # Each architecture builds on its own native runner: the job runs the
  # smoke and verify suites against the bytes it pushes, and those execute
  # the image. Each leg pushes one arch-suffixed tag for the merge job to
  # combine.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request' && needs.resolve-deps.outputs.digest != ''
    needs: resolve-deps
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    # Inert until its deployment-branch policy is set; see docker/deps/README.md.
    environment: ghcr-publish
    # Grouped per architecture so the two legs of one run cannot cancel
    # each other. Safe to cancel: nothing resolves `latest` programmatically.
    # Grouped per ref so one branch cannot cancel another.
    concurrency:
      group: cdo-rails-publish-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: ./docker/rails/ensure-locales.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails
        run: |
          docker build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:publish .

      # The quality gate for everything this job pushes.
      - name: Smoke test
        run: ./docker/rails/smoke-test.sh cdo-rails:publish docker

      - name: Verify the publish artifact end to end
        run: ./docker/rails/verify.sh cdo-rails:publish docker

      # Not build-push-action with push: true — that publishes in the step
      # that builds, before the smoke suite can fail the job.
      #
      # The tag is keyed by commit and architecture, and no consumer
      # resolves it. The merge job builds every consumer-facing tag from
      # this immutable pair, so a racing publish or a tag left by a failed
      # run cannot leak in.
      - name: Push cdo-rails (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-rails:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # Until this runs, only the arch-suffixed tags exist, so an incomplete
  # publish is visible as such instead of serving one architecture under
  # the final name.
  # See: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  #
  # regctl builds the index: an OCI image index over the two per-arch
  # manifests, annotated with org.opencontainers.image.revision, the commit
  # the image was built from. The per-arch manifests, the bytes the suites
  # ran against, enter the index unchanged.
  merge:
    name: merge per-arch images into one index
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-rails-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install regctl
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.7

      # regctl keeps its own credential store, separate from docker's.
      - name: Login regctl to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | regctl registry login ghcr.io -u "$REGISTRY_USER" --pass-stdin

      # No checkout: this tag contract has no content key, so
      # metadata-action needs only the event context.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # Build the index once, under the commit-keyed tag (git-<sha> on the
      # default branch, dev-<sha> elsewhere), and validate it before `latest`
      # points at it. The inputs are this run's per-arch tags, so the index
      # is built from the manifests the suites ran against.
      - name: Build the annotated index under the commit tag
        id: index
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          primary="$(grep -E ":(git|dev)-${SHA}$" <<<"$TAGS" | head -n1)"
          test -n "$primary"
          regctl index create "$primary" \
            --ref "$IMAGE:git-$SHA-amd64" \
            --ref "$IMAGE:git-$SHA-arm64" \
            --annotation "org.opencontainers.image.revision=$SHA"
          echo "primary=$primary" >> "$GITHUB_OUTPUT"

      # The properties Kargo and the production promotion gate depend on.
      # Fail here and `latest` never moves.
      - name: Validate the index
        env:
          PRIMARY: ${{ steps.index.outputs.primary }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$(regctl manifest get "$PRIMARY" --format raw-body)"
          jq . <<<"$body"
          media="$(jq -r '.mediaType // empty' <<<"$body")"
          revision="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<<"$body")"
          platforms="$(jq -r '[.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' <<<"$body")"
          test "$media" = application/vnd.oci.image.index.v1+json \
            || { echo "::error::index media type is '$media', not an OCI image index" >&2; exit 1; }
          test "$revision" = "$SHA" \
            || { echo "::error::revision annotation is '$revision', expected $SHA" >&2; exit 1; }
          test "$platforms" = linux/amd64,linux/arm64 \
            || { echo "::error::index platforms are '$platforms', expected linux/amd64,linux/arm64" >&2; exit 1; }
          # The children must be the manifests the suites ran against.
          for arch in amd64 arm64; do
            want="$(regctl manifest head "$IMAGE:git-$SHA-$arch")"
            have="$(jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest' <<<"$body")"
            test "$have" = "$want" \
              || { echo "::error::$arch child is $have, expected $want" >&2; exit 1; }
          done

      # Same-repository copies carry the index bytes over unchanged, so every
      # tag resolves to the same digest and the same annotation.
      - name: Copy the validated index to the remaining tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PRIMARY: ${{ steps.index.outputs.primary }}
        run: |
          set -euxo pipefail
          for ref in $TAGS; do
            [ "$ref" = "$PRIMARY" ] && continue
            regctl image copy "$PRIMARY" "$ref"
          done
