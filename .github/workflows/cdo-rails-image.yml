# Builds cdo-rails, smoke-tests it on docker and podman on amd64 and arm64,
# boots Rails from it against MySQL and Redis on both architectures, and
# publishes it from staging as a multi-platform manifest (per-arch native
# builds, stitched — the cdo-base pattern). Not triggered by source PRs —
# the slice is validated at publish time. See docker/rails/README.md.

name: cdo-rails-image

on:
  pull_request:
    paths:
      - 'docker/rails/**'
      - '.github/actions/cdo-deps-key/**'
      - '.github/workflows/cdo-rails-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/rails/**'
      - '.github/actions/cdo-deps-key/**'
      - '.github/workflows/cdo-rails-image.yml'
  # Chained off cdo-deps rather than scheduled, so the source layer
  # rebuilds on the dependency layer that just shipped, a failed deps publish
  # rebuilds nothing, and the weekly cadence is inherited from cdo-base's
  # cron through the chain rather than restated as a timer here.
  workflow_run:
    workflows: [cdo-deps-image]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishes are not governed here; build-push has its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-rails

jobs:
  # Resolve cdo-deps once, by the bundle- content key this checkout implies,
  # and give the same digest to every build. A checkout whose dependency
  # inputs have no published layer fails here, loudly, instead of landing on
  # stale bytes.
  #
  # This is also where the workflow_run chain is filtered: that event fires
  # for failed runs and for other branches, and skipping this job skips the
  # rest.
  resolve-deps:
    name: resolve cdo-deps digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.deps.outputs.digest }}
    steps:
      # The key hashes the dependency inputs, so they must be in the checkout.
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps

      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      # GHCR packages are private until someone flips them; authenticate
      # every pull rather than depending on that manual step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the keyed dependency layer to a digest
        id: deps
        env:
          REF: ghcr.io/code-dot-org/cdo-deps:${{ steps.key.outputs.key }}
        run: |
          set -euxo pipefail
          digest="$(docker buildx imagetools inspect "$REF" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')" || {
            echo "::error::No published dependency layer for this checkout's dependency inputs ($REF)." \
                 "A lockfile change publishes its dependency layer on the staging push." >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      # The full tree: this image bakes the source slice.
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: git lfs pull --include='dashboard/config/locales/**'

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:smoke .

      - name: Smoke test
        run: ./docker/rails/smoke-test.sh cdo-rails:smoke ${{ matrix.engine }}

  # Boot the artifact and drive it: verify.sh stands up MySQL and Redis and
  # proves schema load, a model write, a worker pass, and a signed-in API
  # read over HTTP — the check the Drone image cannot express, since it
  # tests the deployed bytes rather than a CI-only environment.
  rails-boot:
    name: rails boots from the image (${{ matrix.arch }})
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: git lfs pull --include='dashboard/config/locales/**'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails
        run: |
          docker build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:boot .

      - name: Verify the image end to end
        run: ./docker/rails/verify.sh cdo-rails:boot docker

  # One job per architecture, natively — no qemu. Each pushes the tag set
  # suffixed with its arch; stitch merges them into the consumer-facing tags.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: [resolve-deps, smoke-test, rails-boot]
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    # Inert until its deployment-branch policy is set; see docker/deps/README.md.
    environment: ghcr-publish
    # Per-arch group so two publishes cannot interleave on the same arch tag;
    # the two arch legs of one run must NOT share a group or they would cancel
    # each other. Safe to cancel: nothing resolves `latest` programmatically.
    concurrency:
      group: cdo-rails-publish-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dashboard/config/locales is git-LFS tracked and checkout does not fetch
      # LFS objects, so without this the image bakes pointer files and Rails
      # dies at boot on the first non-English locale. Pulled by pattern rather
      # than with checkout's lfs: true: locales are the only LFS-tracked path
      # inside the slice, and everything else LFS holds is excluded anyway.
      - name: Fetch the LFS objects the source slice needs
        run: git lfs pull --include='dashboard/config/locales/**'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-rails
        run: |
          docker build \
            -f docker/rails/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-rails:publish .

      # The matrix and rails-boot tested images built on other runners. These
      # test the bytes actually being published.
      - name: Smoke test
        run: ./docker/rails/smoke-test.sh cdo-rails:publish docker

      - name: Verify the publish artifact end to end
        run: ./docker/rails/verify.sh cdo-rails:publish docker

      # Not build-push-action with push: true — that publishes in the step
      # that builds, before the smoke suite can fail the job.
      #
      # One tag, keyed by commit and architecture, and nothing a consumer
      # resolves. Every consumer-facing name is created by the stitch job from
      # this immutable pair, so two publishes racing cannot produce a manifest
      # mixing their runs, and a suffixed tag left behind by a failed run
      # cannot be picked up by the next one.
      - name: Push cdo-rails (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-rails:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # The consumer-facing tags are multi-platform manifests over the per-arch
  # pushes. Until this job runs, only the -amd64/-arm64 suffixed tags exist,
  # so a half-published state is visible as such rather than resolving to a
  # single-arch image under the final name.
  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-rails-publish
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tag set the build-push legs computed. No checkout: the rails
      # tag contract has no content key, so metadata-action needs only the
      # event context.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # One call, every consumer-facing tag, both sources named by commit. The
      # per-arch pair is all that exists until now, so no moving tag appears
      # anywhere in the input.
      - name: Stitch every tag from the sha-keyed per-arch pair
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

      - name: Inspect a published manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(echo "$TAGS" | head -1)"
