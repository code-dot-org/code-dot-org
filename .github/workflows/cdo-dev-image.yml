# Builds the `cdo-dev` image, a development image that carries the toolchain
# and dependencies but no source code, no seeded database, and no built
# assets. The workflow smoke-tests it on docker and podman, on amd64 and
# arm64, and publishes it from staging as a multi-platform manifest. Each
# architecture builds natively on its own GitHub Actions runner. A merge job
# then puts the two images under the final GHCR tags. See docker/dev/README.md.

name: cdo-dev-image

on:
  pull_request:
    paths:
      - 'docker/dev/**'
      - 'docker/scripts/install-node.sh'
      - 'docker/smoke-harness.sh'
      - '.github/actions/cdo-deps-key/**'
      - '.github/workflows/cdo-dev-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/dev/**'
      - 'docker/scripts/install-node.sh'
      - 'docker/smoke-harness.sh'
      - '.github/actions/cdo-deps-key/**'
      - '.github/workflows/cdo-dev-image.yml'
  # Chained off cdo-deps rather than scheduled, so the dev image rebuilds on
  # the dependency layer that just shipped, a failed deps publish rebuilds
  # nothing, and the weekly cadence is inherited from cdo-base's cron.
  workflow_run:
    workflows: [cdo-deps-image]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

# Pull requests group by ref, so a new push cancels the old run. Every other
# run gets its own group: a workflow_run event runs on the default branch,
# and a shared group would let an unrelated dependency completion cancel a
# queued publish. Publishes are not governed here; build-push has its own
# group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-dev

jobs:
  # Resolve cdo-deps once, by the bundle- content key this checkout implies,
  # and give the same digest to every build.
  #
  # A push can arrive before that layer exists. cdo-deps-image is building it
  # and will chain this workflow again, so a push miss ends the run quietly.
  # Any other event has no such second chance and fails.
  #
  # This is also where the workflow_run chain is filtered: that event fires
  # for failed runs too, and skipping this job skips the rest.
  resolve-deps:
    name: resolve cdo-deps digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.deps.outputs.digest }}
    steps:
      # The key hashes the dependency inputs, so they must be in the checkout.
      - name: Checkout dependency inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker/build
            docker/deps
            docker/scripts

      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      # GHCR packages are private until someone flips them; authenticate
      # every pull rather than depending on that manual step.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the keyed dependency layer to a digest
        id: deps
        env:
          REF: ghcr.io/code-dot-org/cdo-deps:${{ steps.key.outputs.key }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if digest="$(docker buildx imagetools inspect "$REF" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = push ]; then
            echo "::notice::No dependency layer yet for this checkout ($REF)." \
                 "cdo-deps-image is building it and will re-run this workflow." >&2
            exit 0
          fi
          echo "::error::No published dependency layer for this checkout's dependency inputs ($REF)." \
               "A lockfile change publishes its dependency layer on the staging push." >&2
          exit 1

  # PRs only. Publish runs are gated by build-push itself, which runs the
  # same suite against the bytes it pushes.
  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      # The build context is the repo root, but the dockerignore admits only
      # files under docker/.
      - name: Checkout the image inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-dev with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            -f docker/dev/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-dev:smoke .

      - name: Smoke test
        run: ./docker/dev/smoke-test.sh cdo-dev:smoke ${{ matrix.engine }}

  # Each architecture builds on its own native runner: the job runs the
  # smoke suite against the bytes it pushes, and that executes the image.
  # Each leg pushes one arch-suffixed tag for the merge job to combine.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request' && needs.resolve-deps.outputs.digest != ''
    needs: resolve-deps
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    environment: ghcr-publish
    # Grouped per architecture so the two legs of one run cannot cancel
    # each other, and per ref so one branch cannot cancel another. Safe to
    # cancel: nothing resolves `latest` programmatically.
    concurrency:
      group: cdo-dev-publish-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout the image inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-dev
        run: |
          docker build \
            -f docker/dev/Dockerfile \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-dev:publish .

      # The quality gate for everything this job pushes.
      - name: Smoke test
        run: ./docker/dev/smoke-test.sh cdo-dev:publish docker

      # Not build-push-action with push: true — that publishes in the step
      # that builds, before the smoke suite can fail the job.
      #
      # The tag is keyed by commit and architecture, and no consumer
      # resolves it. The merge job builds every consumer-facing tag from
      # this immutable pair, so a racing publish or a tag left by a failed
      # run cannot leak in.
      - name: Push cdo-dev (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-dev:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # Until this runs, only the arch-suffixed tags exist, so an incomplete
  # publish is visible as such instead of serving one architecture under
  # the final name.
  # See: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  merge:
    name: merge per-arch images into one manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-dev-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No checkout: this tag contract has no content key, so
      # metadata-action needs only the event context.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # The source tags are commit-keyed, so no moving tag can enter the
      # manifest.
      - name: Merge the per-arch pair under every tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"
