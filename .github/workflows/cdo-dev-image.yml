# Builds cdo-dev, smoke-tests it on docker and podman on amd64 and arm64,
# and publishes it from staging as a multi-platform manifest (per-arch
# native builds, stitched — the cdo-base pattern). See docker/dev/README.md.
#
# Lockfile changes are deliberately not triggers here: a PR that moves a
# lockfile is gated by cdo-deps-image, and its dependency layer is only
# published on the staging push. This workflow instead chains off that
# publish, so the dev image rebuilds on the cdo-deps that just shipped —
# and, transitively, on the weekly cdo-base refresh.

name: cdo-dev-image

on:
  pull_request:
    paths:
      - 'docker/dev/**'
      - 'docker/smoke-harness.sh'
      - '.github/workflows/cdo-dev-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/dev/**'
      - 'docker/smoke-harness.sh'
      - '.github/workflows/cdo-dev-image.yml'
  workflow_run:
    workflows: [cdo-deps-image]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishes are not governed here; build-push has its own group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-dev

jobs:
  # Resolve the dependency layer once, by the checkout's content key, and give
  # the same digest to every build. A key that does not resolve means the
  # dependency layer for this checkout's lockfiles has not been published yet;
  # see docker/deps/README.md#the-content-key.
  #
  # This is also where the workflow_run chain is filtered. That event fires
  # for failed runs and for other branches, and skipping this job skips the
  # rest.
  resolve-deps:
    name: resolve cdo-deps digest
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.deps.outputs.digest }}
    steps:
      # Cone mode also brings the repo root, where the key's lockfile inputs
      # live.
      - name: Checkout key inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/cdo-deps-key
            docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The one definition of the content key, shared with every consumer.
      - name: Compute the dependency-layer content key
        id: key
        uses: ./.github/actions/cdo-deps-key

      - name: Resolve the keyed cdo-deps tag to a digest
        id: deps
        run: |
          set -euxo pipefail
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/code-dot-org/cdo-deps:${{ steps.key.outputs.key }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    needs: resolve-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout the image directory only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker

      # podman reads ~/.docker/config.json as a credential fallback, so one
      # docker login serves both engines.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-dev with ${{ matrix.engine }}
        run: |
          ${{ matrix.engine }} build \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-dev:smoke docker/dev/

      - name: Smoke test
        run: ./docker/dev/smoke-test.sh cdo-dev:smoke ${{ matrix.engine }}

  # One job per architecture, natively — no qemu. Each pushes the tag set
  # suffixed with its arch; stitch merges them into the consumer-facing tags.
  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: [resolve-deps, smoke-test]
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    # Inert until its deployment-branch policy is set; see docker/deps/README.md.
    environment: ghcr-publish
    # Per-arch group so two publishes cannot interleave on the same arch tag;
    # the two arch legs of one run must NOT share a group or they would cancel
    # each other. Safe to cancel: nothing resolves `latest` programmatically.
    concurrency:
      group: cdo-dev-publish-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    env:
      DEPS_IMAGE: ghcr.io/code-dot-org/cdo-deps@${{ needs.resolve-deps.outputs.digest }}
    steps:
      - name: Checkout the image directory only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag contract matches the family's: latest and git-<sha> from staging,
      # dev-<sha> from manual dispatch on other branches. No keyed tag — the
      # content key names the dependency layer, not its consumers.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      - name: Build cdo-dev
        run: |
          docker build \
            --build-arg DEPS_IMAGE="$DEPS_IMAGE" \
            -t cdo-dev:publish docker/dev/

      # The matrix tested images built on other runners. This tests the one
      # actually being published.
      - name: Smoke test
        run: ./docker/dev/smoke-test.sh cdo-dev:publish docker

      # Not build-push-action with push: true — that publishes in the step
      # that builds, before the smoke suite can fail the job.
      - name: Push cdo-dev (per-arch tags)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          for ref in $TAGS; do
            docker tag cdo-dev:publish "$ref-${{ matrix.arch }}"
            docker push "$ref-${{ matrix.arch }}"
          done

  # The consumer-facing tags are multi-platform manifests over the per-arch
  # pushes. Until this job runs, only the -amd64/-arm64 suffixed tags exist,
  # so a half-published state is visible as such rather than resolving to a
  # single-arch image under the final name.
  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    concurrency:
      group: cdo-dev-publish
      cancel-in-progress: true
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same tag set the build-push legs computed. No checkout: the dev
      # tag contract has no content key, so metadata-action needs only the
      # event context.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      - name: Stitch each tag from its per-arch pair
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          test -n "$TAGS"
          for ref in $TAGS; do
            docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"
          done

      - name: Inspect a published manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "$(echo "$TAGS" | head -1)"
