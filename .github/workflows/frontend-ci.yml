# Common workflow for execution of continuous integration for the `frontend` code base.
# This workflow handles setup and teardown for parallel workflow execution for the various apps and packages in `frontend`.
name: Frontend-CI

on:
  pull_request:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"
  push:
    branches:
      - staging
      - staging-next
    paths:
      - "frontend/**"
      - ".github/**"

env:
  APPLITOOLS_BATCH_ID: ${{ github.event.pull_request.head.sha || github.sha }}
  # Playwright container image tag. Version must match the catalog pin in
  # frontend/.yarnrc.yml; variant (noble/jammy) must match the runner's Ubuntu release.
  PLAYWRIGHT_IMAGE_TAG: 'v1.59.1-noble'

jobs:
  # Initializes common variables and environment prior to executing other jobs
  setup:
    runs-on: ubuntu-24.04
    outputs:
      component-library-changed: ${{ steps.changes.outputs.component-library }}
      studio-changed: ${{ steps.changes.outputs.studio }}
      oceans-changed: ${{ steps.changes.outputs.oceans }}
      markdown-changed: ${{ steps.changes.outputs.markdown }}
      e2e-tests-changed: ${{ steps.changes.outputs.e2e-tests }}
      playwright-image-tag: ${{ env.PLAYWRIGHT_IMAGE_TAG }}
    steps:
      # paths-filter needs a local git repo to diff push events (PRs use the API).
      - uses: actions/checkout@v4

      # Determine what changed to later skip workflows
      # Github Actions does not offer conditional runtime path filtering, thus use this action to calculate the
      # changes. Root level applications (such as marketing) are not skipped as its dependency tree always changes
      - name: Get Change Sets
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: changes
        with:
          filters: |
            component-library:
              - 'frontend/apps/design-system-storybook/**'
              - 'frontend/packages/component-library/**'
              - 'frontend/packages/component-library-styles/**'
              - 'frontend/packages/fonts/**'
              - 'frontend/*'
              - '.github/**'
            studio:
              - 'frontend/apps/studio/**'
              - 'frontend/*'
              - '.github/**'
            oceans:
              - 'frontend/packages/labs/oceans/**'
              - 'frontend/packages/core/**'
              - 'frontend/packages/lint-config/**'
              - 'frontend/packages/playwright-support/**'
              - 'frontend/*'
              - '.github/**'
            markdown:
              - 'frontend/packages/markdown/**'
              - 'frontend/packages/component-library/**'
              - 'frontend/packages/component-library-styles/**'
              - 'frontend/packages/core/**'
              - 'frontend/packages/fonts/**'
              - 'frontend/packages/lint-config/**'
              - 'frontend/packages/playwright-support/**'
              - 'frontend/*'
              - '.github/**'
            # Trigger on the suite's own test code and its CI config — NOT on the PR's
            # product code, since this suite runs against the deployed test-studio, where
            # the PR's changes are not yet visible. .yarnrc.yml catches Playwright version
            # bumps (catalog pin), which the test code paths alone would miss.
            e2e-tests:
              - 'frontend/packages/e2e-tests/**'
              - '.github/workflows/e2e-tests-ci.yml'
              - 'frontend/.yarnrc.yml'

  # Start the studio app CI workflow
  studio:
    if: ${{ needs.setup.outputs.studio-changed == 'true' }}
    needs: setup
    uses: ./.github/workflows/studio-ci.yml
    secrets: inherit

  # Start the component library CI workflow
  component-library:
    if: ${{ needs.setup.outputs.component-library-changed == 'true' }}
    needs: setup
    uses: ./.github/workflows/component-library-ci.yml
    with:
      playwright-image-tag: ${{ needs.setup.outputs.playwright-image-tag }}
    secrets: inherit

  # Start the oceans lab CI workflow
  oceans:
    if: ${{ needs.setup.outputs.oceans-changed == 'true' }}
    needs: setup
    uses: ./.github/workflows/oceans-ci.yml
    with:
      playwright-image-tag: ${{ needs.setup.outputs.playwright-image-tag }}
    secrets: inherit

  # Start the markdown package CI workflow
  markdown:
    if: ${{ needs.setup.outputs.markdown-changed == 'true' }}
    needs: setup
    uses: ./.github/workflows/markdown-ci.yml
    with:
      playwright-image-tag: ${{ needs.setup.outputs.playwright-image-tag }}
    secrets: inherit

  # Start the e2e-tests Playwright suite when test code or its CI config changes.
  e2e-tests:
    if: ${{ needs.setup.outputs.e2e-tests-changed == 'true' }}
    needs: setup
    uses: ./.github/workflows/e2e-tests-ci.yml
    with:
      playwright-image-tag: ${{ needs.setup.outputs.playwright-image-tag }}
    secrets: inherit

  # Common teardown actions that must occur after _all_ workflows have completed.
  # For example, closing the Applitools batch after its completion.
  teardown:
    needs: [setup, component-library, oceans, markdown]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Close the eyes batch after all distributed eyes tests have completed
      - name: Update Applitools batch status
        shell: bash
        run: |
          curl -X POST "https://eyesapi.applitools.com/api/externals/github/servers/github.com/commit/${{ env.APPLITOOLS_BATCH_ID }}/${{ github.run_id }}/complete?apiKey=${{secrets.APPLITOOLS_API_KEY}}"
