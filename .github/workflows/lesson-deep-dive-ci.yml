# Common workflow for execution of continuous integration for the lesson-deep-dive package.
# Two jobs: build (`release:dryrun` fans out to build, lint, test, and — via the
# shared `lint` task's dependsOn — prettier, stylelint, and typecheck) and e2e
# (Playwright against the package's own MSW-mode dev server, which its
# playwright.config starts).
#
# The e2e checkout also takes apps/src/jsonVideo: the page under test renders
# the <json-video> element straight out of apps/, through the dev shell's
# Vite alias. Nothing else from apps/ is needed, and apps' dependencies are
# never installed.
name: Lesson-Deep-Dive-CI

on:
  workflow_call:
    inputs:
      playwright-image-tag:
        required: true
        type: string
        description: 'mcr.microsoft.com/playwright image tag, e.g. v1.59.1-noble. Version must match the catalog pin in frontend/.yarnrc.yml; variant must match the runner Ubuntu release.'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            .github

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: Build, Lint, Typecheck, Test
        run: yarn turbo run release:dryrun --filter=@code-dot-org/lesson-deep-dive
        working-directory: ./frontend

  e2e:
    # Sequence after build so the turbo cache is warm.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:${{ inputs.playwright-image-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            .github
            apps/src/jsonVideo
            apps/static/tutorVideo

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      # The specs run against `yarn dev`, which resolves workspace dependencies
      # to their dist output, so those have to exist first.
      - name: Build
        run: yarn turbo run build --filter=@code-dot-org/lesson-deep-dive
        working-directory: ./frontend

      - name: E2E tests
        # test:ui:ci sets CI, which turns off reuseExistingServer so Playwright
        # starts its own MSW host. HOME=/root is Playwright's in-container fix.
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          HOME: /root
        run: yarn workspace @code-dot-org/lesson-deep-dive test:ui:ci
        working-directory: ./frontend

      - name: Upload Playwright Report
        # Upload on flakes too (passing-on-retry leaves the job green). The name
        # is package-scoped because artifact names must be unique per run, and
        # sibling package workflows upload in the same run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lesson-deep-dive
          path: |
            frontend/packages/lesson-deep-dive/playwright-report/
            frontend/packages/lesson-deep-dive/test-results/
          retention-days: 7
