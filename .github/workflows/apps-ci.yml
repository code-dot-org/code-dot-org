name: Apps-CI

on:
  workflow_call:

defaults:
  run:
    working-directory: ./apps

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps
            frontend
            .github
          # todo: LFS required on static/_config.scss
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "apps/yarn.lock"

      - name: Install apps dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps
            frontend
            shared/fonts
            .github
            dashboard/app/views
            pegasus/sites.v3/code.org
            pegasus/sites.v3/hourofcode.com
            i18n
          # todo: I don't believe LFS is needed for unit tests or linting
          # lfs: true

      - name: Debug
        shell: bash
        working-directory: ./
        run: echo "root" && ls -la && echo "apps" && ls -la apps && echo "frontend" && ls -la frontend && echo "dashboard" && ls -la dashboard/app/views

      - name: Debug scss
        shell: bash
        working-directory: ./apps
        run: cat static/_config.scss

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "apps/yarn.lock"

      - name: Install apps dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Unit Tests
        run: yarn test
