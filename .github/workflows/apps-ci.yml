name: Apps-CI

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps
            frontend
            shared/fonts
            .github
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "apps/yarn.lock"

      - name: Install apps dependencies
        shell: bash
        run: yarn install
        working-directory: ./apps

      - name: Lint
        run: yarn lint
        working-directory: ./apps

      - name: Unit Tests
        run: yarn test
        working-directory: ./apps
