name: k8s-record-legacy-gitflow

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
    secrets:
      K8S_GITOPS_REPO_WRITE_TOKEN:
        required: true

jobs:
  record-legacy-gitflow:
    name: record legacy gitflow merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-gitops
        uses: actions/checkout@v6.0.2
        with:
          repository: code-dot-org/k8s-gitops
          ref: main
          path: k8s-gitops
          token: ${{ secrets.K8S_GITOPS_REPO_WRITE_TOKEN }}

      - name: Update legacy gitflow metadata
        shell: ruby {0}
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
        run: | # ruby
          require 'fileutils'
          require 'time'
          require 'yaml'

          branch_name = ENV.fetch('BRANCH_NAME')
          source_commit_sha = ENV.fetch('SOURCE_COMMIT_SHA')
          tag = "git-#{source_commit_sha}"
          merged_at = Time.now.utc.iso8601

          unless %w[staging test levelbuilder production].include?(branch_name)
            puts "::notice::Skipping legacy gitflow record for non-gitflow branch #{branch_name.inspect}"
            exit 0
          end

          base_dir = File.join('k8s-gitops', 'warehouses', 'codeai', 'legacy-gitflow', branch_name)
          merged_dir = File.join(base_dir, 'merged')
          FileUtils.mkdir_p(merged_dir)

          payload = {
            'revision' => source_commit_sha,
            'tag' => tag,
            'mergedAt' => merged_at
          }

          File.write(File.join(base_dir, 'current.yaml'), payload.to_yaml(line_width: -1))
          File.write(File.join(merged_dir, "#{tag}.yaml"), payload.to_yaml(line_width: -1))

      - name: Commit and push metadata
        shell: bash -euxo pipefail {0}
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
        run: |
          cd k8s-gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warehouses/codeai/legacy-gitflow
          if git diff --cached --quiet; then
            echo "No legacy gitflow metadata changes to commit."
            exit 0
          fi
          git commit -m "Record legacy gitflow ${BRANCH_NAME} => git-${SOURCE_COMMIT_SHA}"
          git push origin HEAD:main
