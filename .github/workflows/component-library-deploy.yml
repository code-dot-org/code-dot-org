name: Component-Library-Deploy

on:
    workflow_dispatch:

    push:
      branches:
        - staging
        - staging-next
      paths:
        - 'frontend/packages/component-library/**'
        - 'frontend/packages/component-library-styles/**'
        - 'shared/**'

jobs:
    ci:
      uses: ./.github/workflows/component-library-ci.yml
      with:
        # Playwright image pin; keep in sync with frontend-ci.yml's
        # PLAYWRIGHT_IMAGE_TAG and the catalog pin in frontend/.yarnrc.yml.
        playwright-image-tag: 'v1.59.1-noble'
      secrets: inherit

    deploy:
      needs:
        - ci

      permissions:
        contents: read
        pages: write
        id-token: write

      environment:
        name: component-library-storybook

      runs-on: ubuntu-24.04

      steps:
        - name: Deploy to GitHub Pages
          uses: actions/deploy-pages@v4
          with:
            artifact_name: "component-library-storybook"
