name: k8s-update-argocd

on:
  workflow_call:
    inputs:
      branch_name:
        required: true
        type: string
      docker_tag:
        required: true
        type: string

jobs:
  argocd-writeback:
    name: argocd writeback test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Commit argocd writeback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p k8s/argocd
          printf 'branch=%s docker_tag=%s nonce=%s\n' \
            '${{ inputs.branch_name }}' \
            '${{ inputs.docker_tag }}' \
            "$(openssl rand -hex 16)" >> k8s/argocd/testfile
          git add k8s/argocd/testfile
          git commit -m "argocd writeback test [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
