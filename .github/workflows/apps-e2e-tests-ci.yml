# Playwright end-to-end suite for studio.code.org, run against the always-on
# test-studio.code.org deployment.
#
# Reusable workflow invoked by frontend-ci.yml as an UNGATED child (unlike the
# path-gated per-package jobs), so it runs on every frontend PR alongside the
# remaining Drone UI tests during the strangler-fig migration.
#
# Scope: this checks the DEPLOYED test-studio, not the PR's own code — it is a
# continuous health check of the migrated suite, not a per-PR regression gate.
# To gate a PR's code, deploy that PR to an adhoc and set TARGET_URL to it.
name: Apps-E2E-Tests-CI

on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Must match the `playwright` catalog version in frontend/.yarnrc.yml; the
      # image ships the matching browser build. Bump both together on upgrade.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - name: Install LFS
        run: apt-get update && apt-get install -y git-lfs

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend
            .github
          lfs: true

      - name: Setup Frontend
        uses: ./.github/actions/frontend/setup

      - name: E2E Tests
        # Step-level env so the browser path reaches the playwright subprocess
        # (job-level env is not reliably forwarded through yarn/turbo). The
        # container pre-installs browsers at /ms-playwright. CI=true is set by
        # GitHub Actions, which flips playwright.config to its CI reporter lane.
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # Explicit target: the deployed test env. Repoint at a PR adhoc to gate PR code.
          TARGET_URL: https://test-studio.code.org
        run: yarn workspace @code-dot-org/apps-e2e-tests test
        working-directory: ./frontend

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-tests-report
          path: |
            frontend/packages/apps-e2e-tests/playwright-report/
            frontend/packages/apps-e2e-tests/test-results/
          retention-days: 7
