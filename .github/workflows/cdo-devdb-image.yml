# This builds cdo-devdb, the pre-seeded MySQL sidecar the devcontainer
# starts against. It publishes cdo-devdb from staging. See
# .devcontainer/README.md.
#
# This is the only image in the set a Dockerfile alone cannot build. Its
# content is a seeded database. Seeding pulls mostly curriculum from
# dashboard/config, plus a further pass for the test database. CI pays
# that cost so a developer does not have to.
#
# This gets multi-arch from one pre-seed run. An InnoDB datadir is
# architecture-portable, and Dockerfile.db has no RUN steps, so this
# workflow needs no qemu. The smoke matrix runs the SQL natively on each
# architecture, the part that must be real, before stitch creates the
# tags a consumer resolves.

name: cdo-devdb-image

on:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/preseed-db.sh'
      - '.github/workflows/cdo-devdb-image.yml'
  push:
    branches: [staging]
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/preseed-db.sh'
      - '.devcontainer/locals.yml.sample'
      - 'dashboard/db/schema.rb'
      - '.github/workflows/cdo-devdb-image.yml'
  # Curriculum is not in the content key (see below), so time is what bounds
  # how stale a published image's seed data can get.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-devdb
  CDO_DEV_IMAGE: ghcr.io/code-dot-org/cdo-dev:latest

jobs:
  build:
    name: pre-seed the datadir and push per-arch images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # This needs a full checkout. The seed reads thousands of curriculum
      # files under dashboard/config, and db:setup_or_migrate reads
      # dashboard/db.
      - name: Checkout
        uses: actions/checkout@v4

      # This hands the checkout to uid 1000, the container's user, so the
      # seed can write dashboard/db/schema.rb, log, and tmp. .devcontainer
      # stays at the runner's uid. preseed-db.sh writes mysql-data.tar
      # there from the host at the end. Chowning it too would EACCES that
      # write, after seeding finishes.
      - name: Give the checkout to the container user, keeping this directory
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .devcontainer

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same script a developer runs locally.
      - name: Pre-seed the datadir
        run: .devcontainer/preseed-db.sh

      # This builds twice, once per architecture, both from the
      # pre-seed's tar. Nothing runs at build time. The Dockerfile is an
      # ADD and a CMD, so arm64 builds on this amd64 runner without
      # emulation.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push cdo-devdb (per-arch tags)
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/$arch" \
              --provenance false \
              -f .devcontainer/Dockerfile.db \
              -t "$IMAGE:git-${{ github.sha }}-$arch" \
              --push .devcontainer
          done

      # Nothing is pushed on a pull request, so this smokes it here
      # instead. It uses one architecture, loaded locally.
      - name: Build and smoke-test locally (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          docker buildx build --platform linux/amd64 --load \
            -f .devcontainer/Dockerfile.db -t cdo-devdb:smoke .devcontainer
          .devcontainer/devdb-smoke.sh cdo-devdb:smoke

  # This runs natively, against the image actually pushed. An arm64
  # mysqld runs on arm64 hardware, not qemu.
  smoke:
    name: smoke-test (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    steps:
      # The smoke script counts the checkout's migrations against the
      # database's, so it needs db/migrate and nothing else.
      - name: Checkout the migrations and the script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .devcontainer
            dashboard/db/migrate

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: .devcontainer/devdb-smoke.sh "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # This is built from the immutable per-arch pair once both are
  # smoke-tested. Until this runs, only the suffixed tags exist, so a
  # half-published state is visible as such.
  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      - name: Stitch every tag from the sha-keyed per-arch pair
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

      - name: Inspect a published manifest
        run: docker buildx imagetools inspect "$IMAGE:git-${{ github.sha }}"
