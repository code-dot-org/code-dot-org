# Builds cdo-devdb, the pre-seeded MySQL image the devcontainer starts
# against, and publishes it from staging. See .devcontainer/README.md.

name: cdo-devdb-image

on:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/preseed-db.sh'
      - '.devcontainer/devdb-smoke.sh'
      - 'docker/dev/compose.yaml'
      - 'docker/dev/dev.env'
      - 'config/development.yml.erb'
      - '.github/workflows/cdo-devdb-image.yml'
  push:
    branches: [staging]
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/preseed-db.sh'
      - '.devcontainer/devdb-smoke.sh'
      - 'docker/dev/compose.yaml'
      - 'docker/dev/dev.env'
      - 'config/development.yml.erb'
      - '.github/workflows/cdo-devdb-image.yml'
  # 08:00 UTC daily, after merge_lb_to_staging (07:35 UTC) lands levelbuilder content.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: pre-seed, smoke-test, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch LFS objects
        run: git lfs pull --include='dashboard/config/**,dashboard/test/fixtures/**'

      - name: Chown checkout to container user
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .devcontainer

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-seed datadir
        env:
          IMAGE: ghcr.io/code-dot-org/cdo-dev:latest
        run: .devcontainer/preseed-db.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and smoke-test
        run: |
          docker buildx build --load \
            -f .devcontainer/Dockerfile.db -t cdo-devdb:smoke .devcontainer
          .devcontainer/devdb-smoke.sh cdo-devdb:smoke

      - name: Compute tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cdo-devdb
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      # Dockerfile.db runs nothing and an InnoDB datadir is portable across
      # architectures, so arm64 builds here without emulation.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.db
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          push: true
