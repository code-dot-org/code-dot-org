# Builds cdo-devdb, the seeded MySQL sidecar the devcontainer starts against,
# and publishes it from staging. See .devcontainer/README.md.
#
# This is the one image in the set that cannot be built from a Dockerfile
# alone: its content is a *seeded database*, produced by running
# db:setup_or_migrate and seed:default against a real checkout — about 20
# minutes, most of it loading curriculum out of dashboard/config, plus a
# further minute and a quarter preparing and seeding the test database that
# `RAILS_ENV=test` runs against. Baking that in CI is the entire point. A
# codespace has no seeded MySQL and no tarball to make one from; it pulls
# this.
#
# Multi-arch from one bake. An InnoDB datadir is architecture-portable and
# Dockerfile.db has no RUN steps, so both images come from the same tar with
# nothing executed at build time — no qemu anywhere in this workflow. The
# smoke matrix then runs the SQL natively on each architecture, which is the
# part that has to be real, and only then does the stitch job create the tags
# a consumer resolves.

name: cdo-devdb-image

on:
  pull_request:
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/bake-db.sh'
      - '.github/workflows/cdo-devdb-image.yml'
  push:
    branches: [staging]
    paths:
      - '.devcontainer/Dockerfile.db'
      - '.devcontainer/bake-db.sh'
      - '.devcontainer/locals.yml.sample'
      - 'dashboard/db/schema.rb'
      - '.github/workflows/cdo-devdb-image.yml'
  # Curriculum is not in the content key (see below), so time is what bounds
  # how stale a published image's seed data can get.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-devdb
  CDO_DEV_IMAGE: ghcr.io/code-dot-org/cdo-dev:latest

jobs:
  build:
    name: bake the datadir and push per-arch images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # A full checkout: the seed reads thousands of curriculum files under
      # dashboard/config, and db:setup_or_migrate reads dashboard/db.
      - name: Checkout
        uses: actions/checkout@v4

      # The bake runs the dev image as its own uid 1000 with the checkout
      # bind-mounted, and the seeding writes into it: dashboard/db/schema.rb
      # from the schema dump, dashboard/log and dashboard/tmp, and
      # dashboard/app/models if the annotations move. Hand it the tree.
      #
      # Except this directory. The runner is uid 1001, and the last thing
      # bake-db.sh does is write mysql-data.tar in here, from the host, as the
      # runner — after twenty minutes of seeding. Handing .devcontainer to 1000
      # too makes that final tar EACCES, and `set -euo pipefail` turns it into
      # a job that fails at the end having done all the work. Nothing in the
      # bake writes here; locals.yml.sample goes in read-only.
      - name: Give the checkout to the container user, keeping this directory
        run: |
          sudo chown -R 1000:1000 .
          sudo chown -R "$(id -u):$(id -g)" .devcontainer

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ~20 minutes: schema load, seed:default, then a clean shutdown and a
      # tar of the datadir. The same script a developer runs locally.
      - name: Bake the datadir
        run: .devcontainer/bake-db.sh

      # Buildx, twice, once per architecture, both from the tar that bake
      # just made. Nothing runs during these builds — the Dockerfile is an ADD
      # and a CMD — so the arm64 image is produced on an amd64 runner without
      # emulation. The tags are immutable and named by commit; no consumer
      # resolves them, and the stitch job builds every consumer name from the
      # pair after the smoke matrix has run natively on both.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push cdo-devdb (per-arch tags)
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/$arch" \
              --provenance false \
              -f .devcontainer/Dockerfile.db \
              -t "$IMAGE:git-${{ github.sha }}-$arch" \
              --push .devcontainer
          done

      # On a pull request nothing is pushed, so smoke it here instead: one
      # architecture, loaded locally, which is what the runner can execute.
      - name: Build and smoke-test locally (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          docker buildx build --platform linux/amd64 --load \
            -f .devcontainer/Dockerfile.db -t cdo-devdb:smoke .devcontainer
          .devcontainer/devdb-smoke.sh cdo-devdb:smoke

  # Natively, on each architecture, against the image that was actually
  # pushed. This is what a multi-arch claim has to be worth: an arm64 mysqld
  # starting on arm64 hardware and answering the same questions.
  smoke:
    name: smoke-test (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: read
    steps:
      # The smoke script counts the checkout's migrations against the
      # database's, so it needs db/migrate and nothing else.
      - name: Checkout the migrations and the script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .devcontainer
            dashboard/db/migrate

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: .devcontainer/devdb-smoke.sh "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # The consumer-facing tags, created from the immutable per-arch pair once
  # both have been smoke-tested. Until this runs, only the suffixed tags
  # exist, so a half-published state is visible as such.
  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=git-,format=long,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=dev-,format=long,enable={{is_not_default_branch}}

      - name: Stitch every tag from the sha-keyed per-arch pair
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          # An empty list would make this step a green no-op.
          test -n "$TAGS"
          args=()
          for ref in $TAGS; do args+=(-t "$ref"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

      - name: Inspect a published manifest
        run: docker buildx imagetools inspect "$IMAGE:git-${{ github.sha }}"
