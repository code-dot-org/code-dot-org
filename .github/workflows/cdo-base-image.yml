# Build, smoke-test, and publish the cdo-base image (docker/base/).
#
# Smoke test: the same Dockerfile must build on docker AND podman
# (dual-engine policy, see docker/base/README.md) on amd64 and arm64;
# smoke-test.sh asserts the image's runtime contract. Runs on PRs touching
# docker/base/ and pushes nothing.
#
# Publish (staging pushes touching docker/base/, weekly cron, manual
# dispatch): each architecture builds natively, smoke-tests the exact bytes
# it pushes as git-<sha>-<arch>, and a merge job puts the pair under the
# final tags. The weekly cron picks up ruby-slim and apt security updates;
# it produces different bytes for the same git sha, hence the date tag.
# Publishes build without a registry cache on purpose: a cached apt layer
# would serve last week's packages and silently defeat the cron.

name: cdo-base-image

on:
  pull_request:
    paths:
      - 'docker/base/**'
      - '.github/workflows/cdo-base-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/base/**'
      - '.github/workflows/cdo-base-image.yml'
  schedule:
    - cron: '0 4 * * 0' # weekly freshness rebuild, Sunday 4am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-base

jobs:
  # PRs only. Publish runs are gated by build-push itself, which runs the
  # same suite against the bytes it pushes; running this matrix there too
  # tested a separate build of the same input twice.
  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout docker/base only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker/base

      - name: Build with ${{ matrix.engine }}
        run: ${{ matrix.engine }} build -t cdo-base:smoke docker/base/

      # The FROM tag tracks .ruby-version (which cone checkout brings as a
      # root file). The equivalent guard in docker/gems runs only on deps
      # changes, so a dependabot ruby bump here must not go green drifted.
      - name: Assert the interpreter matches .ruby-version
        run: |
          set -euxo pipefail
          test "$(cat .ruby-version)" = \
            "$(${{ matrix.engine }} run --rm cdo-base:smoke ruby -e 'print RUBY_VERSION')"

      - name: Smoke test
        run: ./docker/base/smoke-test.sh cdo-base:smoke ${{ matrix.engine }}

  build-push:
    name: build and push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout docker/base only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker/base

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cdo-base
        run: docker build -t cdo-base:publish docker/base/

      # The quality gate for the bytes this job pushes.
      - name: Smoke test
        run: ./docker/base/smoke-test.sh cdo-base:publish docker

      # The tag is keyed by commit and architecture, and no consumer
      # resolves it. The merge job builds every consumer-facing tag from
      # this immutable pair, so a racing publish or a tag left by a failed
      # run cannot leak in.
      - name: Push cdo-base (per-arch tag)
        run: |
          set -euxo pipefail
          docker tag cdo-base:publish "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:git-${{ github.sha }}-${{ matrix.arch }}"

  # Until this runs, only the arch-suffixed tags exist, so an incomplete
  # publish is visible as such instead of serving one architecture under
  # the final name.
  # See: https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  merge:
    name: merge per-arch images into one manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the per-arch pair under every tag
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:git-${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"
