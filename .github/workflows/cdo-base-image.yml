# Build, smoke-test, and publish the cdo-base image (docker/base/).
#
# Smoke test: the same Dockerfile must build on docker AND podman
# (dual-engine policy, see docker/base/README.md) on amd64 and arm64;
# smoke-test.sh asserts the image's runtime contract. Runs on PRs touching
# docker/base/ and pushes nothing.
#
# Publish (staging pushes touching docker/base/, weekly cron, manual
# dispatch): per-arch native builds pushed to GHCR, stitched into one
# multi-platform manifest. The weekly cron picks up ruby-slim and apt
# security updates; it produces different bytes for the same git sha,
# hence the date tag. Layers are published zstd-compressed with OCI
# media types (pull floor: docker >= 23 / containerd >= 1.5); the
# stitch job asserts this so a config regression fails the run.
#
# Cleanup: deletes untagged package versions (superseded buildcache
# manifests). Safe because every manifest a live tag references is itself
# tagged (git-<sha>-<arch>).

name: cdo-base-image

on:
  pull_request:
    paths:
      - 'docker/base/**'
      - '.github/workflows/cdo-base-image.yml'
  push:
    branches: [staging]
    paths:
      - 'docker/base/**'
      - '.github/workflows/cdo-base-image.yml'
  schedule:
    - cron: '0 4 * * 0' # weekly freshness rebuild, Sunday 4am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cdo-base

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.engine }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: docker, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: podman, arch: amd64, runs-on: ubuntu-24.04 }
          - { engine: docker, arch: arm64, runs-on: ubuntu-24.04-arm }
          - { engine: podman, arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout docker/base only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker/base

      - name: Build with ${{ matrix.engine }}
        run: ${{ matrix.engine }} build -t cdo-base:smoke docker/base/

      - name: Smoke test
        run: ./docker/base/smoke-test.sh cdo-base:smoke ${{ matrix.engine }}

  build-push:
    name: push (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: smoke-test
    strategy:
      matrix:
        include:
          - { arch: amd64, runs-on: ubuntu-24.04 }
          - { arch: arm64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout docker/base only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker/base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance disabled: attestation manifests would be untagged (the
      # cleanup job would delete them) and complicate the imagetools stitch.
      #
      # zstd layers: several times faster to decompress than gzip, which is
      # what per-job pulls on ephemeral CI runners spend their time on.
      # Pull floor: docker >= 23 / containerd >= 1.5 — older engines fail
      # the pull outright. force-compression converts the layers inherited
      # from ruby-slim too; without it, cache-restored layers pass through
      # in whatever compression they were stored with and the output mix
      # would depend on cache state.
      - name: Build and push per-arch image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/base
          provenance: false
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

  stitch:
    name: stitch multi-platform manifest
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag (latest, git sha, date)
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:git-${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            "$IMAGE:git-${{ github.sha }}-amd64" \
            "$IMAGE:git-${{ github.sha }}-arm64"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "$IMAGE:latest"

      # Guards the exporter config above: every layer must be zstd with
      # OCI media types. A silent fallback to gzip would still pull fine
      # on modern engines, so only an explicit check catches it.
      - name: Verify zstd layer media types
        run: |
          set -eu
          for arch in amd64 arm64; do
            manifest=$(docker buildx imagetools inspect --raw "$IMAGE:git-${{ github.sha }}-$arch")
            if ! grep -q 'application/vnd.oci.image.layer.v1.tar+zstd' <<<"$manifest"; then
              echo "::error::$arch manifest has no zstd layers"; exit 1
            fi
            if grep -q 'tar+gzip' <<<"$manifest"; then
              echo "::error::$arch manifest still contains gzip layers"; exit 1
            fi
          done

  cleanup:
    name: delete untagged package versions
    if: github.event_name != 'pull_request'
    needs: stitch
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Delete untagged cdo-base versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: cdo-base
          package-type: container
          delete-only-untagged-versions: 'true'
