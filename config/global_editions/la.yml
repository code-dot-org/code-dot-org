# Latin-America Global Region

# The general region for Latin-America.

locales: [es-LA]
locale_lock: true
countries: [LA]

# The top bar on the site consisting of dropdown menus and navigation links
header:
  # The topbar (which is collapsed into the hamburger in certain contexts)
  top:
    signed_out:
      - title: teach
        id: header-teach
        domain: code.org
        url: /la/teacher
      - title: about
        id: header-about
        domain: code.org
        url: /la/about
      - title: csf
        id: header-csf
        domain: code.org
        url: /la/csf
      - title: hour_of_code
        id: header-hoc
        domain: code.org
        url: /la/hourofcode
      - title: videos
        id: header-videos
        domain: code.org
        url: /la/videos

    student:
      - title: my_dashboard
        url: /la/home
        domain: studio.code.org
        id: header-student-home
      - title: course_catalog
        url: /la/catalog
        domain: studio.code.org
        id: header-student-courses

    teacher:
      - title: my_dashboard
        url: /la/home
        domain: studio.code.org
        id: header-student-home
      - title: course_catalog
        url: /la/catalog
        domain: studio.code.org
        id: header-teacher-courses
      - title: professional_learning
        url: /la/my-professional-learning
        domain: studio.code.org
        id: header-teacher-professional-learning

  # The three-bar "hamburger" menu
  hamburger:
    student:
      - title: learn
        domain: studio.code.org
        url: /la/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
            domain: code.org
            url: /privacy
          - title: legal_cookie_notice
            domain: code.org
            url: /cookies
          - title: legal_tos
            domain: code.org
            url: /tos

    teacher:
      - title: learn
        domain: studio.code.org
        url: /la/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
