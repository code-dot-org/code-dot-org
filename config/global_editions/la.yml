# Latin-America Global Region

# The general region for Latin-America.

locales: [es-LA]
locale_lock: true
countries: [MX, CR, SV, GT, HN, NI, PA, CU, DO, PR, AR, BO, CL, CO, EC, PY, PE, UY, VE]

# The top bar on the site consisting of dropdown menus and navigation links
header:
  # The topbar (which is collapsed into the hamburger in certain contexts)
  top:
    signed_out:
      - title: about
        id: header-about
        domain: code.org
        url: /es/global
      - title: hour_of_ai
        id: header-hoa
        url: https://csforall.org/es/hour-of-ai

    student:
      - title: my_dashboard
        url: /la/home
        domain: studio.code.org
        id: header-student-home
      - title: course_catalog
        url: /la/catalog
        domain: studio.code.org
        id: header-student-courses

    teacher:
      - title: my_dashboard
        url: /la/home
        domain: studio.code.org
        id: header-student-home
      - title: course_catalog
        url: /la/catalog
        domain: studio.code.org
        id: header-teacher-courses
      - title: professional_learning
        url: /la/my-professional-learning
        domain: studio.code.org
        id: header-teacher-professional-learning

  # The three-bar "hamburger" menu
  hamburger:
    student:
      - title: learn
        domain: studio.code.org
        url: /la/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
            domain: code.org
            url: /privacy
          - title: legal_cookie_notice
            domain: code.org
            url: /cookies
          - title: legal_tos
            domain: code.org
            url: /tos

    teacher:
      - title: learn
        domain: studio.code.org
        url: /la/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
            domain: code.org
            url: /privacy
          - title: legal_cookie_notice
            domain: code.org
            url: /cookies
          - title: legal_tos
            domain: code.org
            url: /tos

  # Help button (?)
  help:
    # The report_bug item is special in that it only appears when appropriate
    - title: report_bug
      url: https://support.code.org/hc/es-la/requests/new
      id: report-bug

# The navigation region found at the bottom of each page
footer:
  links:
    studio:
      - title: privacy
        url: /privacy
        domain: code.org
        style: "color: #ffa400;"
      - title: cookie_notice
        url: /cookies
        domain: code.org
      - title: translate
        url: /translate
        domain: code.org
      - title: help_support
        url: https://support.code.org
        target: _blank
        loc_prefix: landing.
        id: support
      - title: store
        url: https://store.code.org
      - title: tos_short
        url: /tos
        domain: code.org
    code_org:
      - title: privacy_policy
        url: /privacy
        domain: code.org
        style: "color: #ffa400;"
      - title: cookie_notice
        url: /cookies
        domain: code.org
      - title: about
        url: /about
        domain: code.org
      - title: partners
        url: /partners
        domain: code.org
      - title: blog
        url: https://medium.com/@codeorg
        target: _blank
      - title: donate
        url: /donate
        domain: code.org
      - title: store
        url: shop
        domain: code.org
      - title: support
        url: http://support.code.org/
        target: _blank
      - title: terms
        url: /tos
        domain: code.org
    hour_of_code:
      - title: contact
        url: http://support.code.org/hc/es-la/requests/new
        target: _blank
      - title: support
        url: http://support.code.org
        target: _blank
      - title: terms
        url: /tos
        domain: code.org
        target: _blank
      - title: privacy
        url: /privacy
        domain: code.org
        target: _blank
      - title: cookie
        domain: hourofcode.com
        url: /cookies
        target: _blank

# Route matching to influence properties of components
pages:
  # All pages
  - path: /
    components:
      CurriculumCatalog:
        # Do not allow switching away from showing ONLY translated courses
        forceTranslated: true
      CurriculumQuickAssign:
        # For section setup, truncate the 'quick access' course listing to
        # only items that are translated to Farsi
        courseFilters:
          language: es-LA
      AssignmentVersionSelector:
        # When viewing a course, only populate the version selector with
        # versions that are translated
        courseFilters:
          language: es-LA
