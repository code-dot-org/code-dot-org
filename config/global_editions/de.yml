# Germany Global Edition Region

# The structure of a global configuration is to start with the page context and
# then list the page name, then list components within that page.
#
# The component can then specify a value that overrides component properties
# with the ones given here, or, if the value is 'false', it removes the
# component from the page.

locales: [de-DE]
locale_lock: true
countries: [DE]

# The list of available project types
project_types: &project_types

# The top bar on the site consisting of dropdown menus and navigation links
header:
  # The topbar (which is collapsed into the hamburger in certain contexts)
  top:
    signed_out:
      - title: about
        id: header-about
        domain: code.org
        url: /de/global
      - title: hour_of_ai
        id: header-hoa
        url: https://csforall.org/de/hour-of-ai

    student:
      - title: my_dashboard
        url: /de/home
        domain: studio.code.org
        id: header-student-home
      - title: course_catalog
        url: /de/catalog
        domain: studio.code.org
        id: header-student-courses

    teacher:
      - title: my_dashboard
        url: /de/home
        domain: studio.code.org
        id: header-teacher-home
      - title: course_catalog
        url: /de/catalog
        domain: studio.code.org
        id: header-teacher-courses
      - title: professional_learning
        url: /de/my-professional-learning
        domain: studio.code.org
        id: header-teacher-professional-learning

  # The three-bar "hamburger" menu
  hamburger:
    student:
      - title: learn
        domain: studio.code.org
        url: /de/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
            url: https://code-org.translate.goog/de/privacy?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
          - title: legal_cookie_notice
            url: https://code-org.translate.goog/de/privacy/cookies?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
          - title: legal_tos
            url: https://code-org.translate.goog/de/terms-of-service?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp

    teacher:
      - title: learn
        domain: studio.code.org
        url: /de/catalog
        id: learn
      - title: legal
        type: expander
        id: legal_entries
        subentries:
          - title: legal_privacy
            url: https://code-org.translate.goog/de/privacy?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
          - title: legal_cookie_notice
            url: https://code-org.translate.goog/de/privacy/cookies?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
          - title: legal_tos
            url: https://code-org.translate.goog/de/terms-of-service?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp

  # Help button (?)
  help:
    # The report_bug item is special in that it only appears when appropriate
    - title: report_bug
      url: https://support.code.org/hc/en-us/requests/new
      id: report-bug

# The navigation region found at the bottom of each page
footer:
  links:
    studio:
      - title: privacy
        url: https://code-org.translate.goog/de/privacy?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
        style: "color: #ffa400;"
      - title: cookie_notice
        url: https://code-org.translate.goog/de/privacy/cookies?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp
      - title: tos_short
        url: https://code-org.translate.goog/de/terms-of-service?_x_tr_sl=auto&_x_tr_tl=de-DE&_x_tr_hl=en&_x_tr_pto=wapp

# Route matching to influence properties of components
pages:
  # All pages
  - path: /
    components:
      CurriculumCatalog:
        # Do not allow switching away from showing ONLY translated courses
        forceTranslated: true
      StartNewProject:
        # Show only available project options
        availableProjectTypes: *project_types
      CurriculumQuickAssign:
        # For section setup, truncate the 'quick access' course listing to
        # only items that are translated to the current locale
        courseFilters:
          language: de-DE
      AssignmentVersionSelector:
        # When viewing a course, only populate the version selector with
        # versions that are translated
        courseFilters:
          language: de-DE
      # Hide the right panel with "New Features", "Announcements", etc.
      TeacherPromotions: false
  # Teacher dashboard
  - path: /teacher_dashboard
    components:
      DownloadParentLetterButton: false
      ManageStudentsLoginInfo:
        providePrivacyLetter: false
  # Home dashboards
  - path: /home
    components:
      MarketingAnnouncementBanner: false
      TeacherResources: false
      IncubatorBanner: false
  # Account Settings
  - path: /users/edit
    components:
      # Do not allow LTI use
      LtiRosterSyncSettings: false
      # Do not provide parental links to information about how to create accounts when deleting sections / accounts
      PersonalLoginDialog:
        hideInstructions: true
      TeacherWarning:
        hideInstructions: true
  # Professional Learning
  - path: /my-professional-learning
    components:
      LandingPage:
        hideMyFacilitatorCenterTab: true
        hideInstructorCenterTab: false
        hideRPCenterTab: true
        hideWorkshopOrganizerCenterTab: true
        hideMyPLWorkshopEnrollmentCelebrationDialog: true
        hideMyPLBanner: true
        hideMyPLSelfPacedPL: false
        hideMyPLJoinSectionArea: true
        hideMyPLLandingPageWorkshopsTable: true
        hideMyPLStaticRecommendedPL: false
        hideMyPLStaticRecommendedPLMidHighBlock: true
        hideMyPLStaticRecommendedPLSelfPacedBlock: false
        myPLStaticRecommendedPLSelfPacedBlockButtonUrl: /de/global
