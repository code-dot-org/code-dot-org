# LocalizeJS page configuration.
#
# Maps a LocalizeJS project key to the URL path prefixes it serves. A request
# whose path begins with one of these prefixes (optionally behind a single
# leading locale/region segment, e.g. /fa/courses/...) is rendered in English
# -- the source language -- on the backend. The LocalizeJS widget then swaps in
# the visitor's language client-side.
#
# Adding a prefix here both activates LocalizeJS for that page and forces its
# server-side render to English. See Cdo::I18n.localize_project_key and the
# i18n/_localizejs partial.

